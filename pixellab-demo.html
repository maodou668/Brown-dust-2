<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>lecliss · PixelLab 小人 · 棕色尘埃2</title>
  <style>
    :root { --accent:#ff6b3d; --accent2:#ffb15c; }
    * { box-sizing:border-box; }
    html,body { margin:0; height:100%; background:radial-gradient(circle at 50% 16%, #3a2230, #140d12 62%); color:#f0e6e0;
      font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif; -webkit-user-select:none; user-select:none; overflow:hidden; }
    .wrap { height:100dvh; display:flex; flex-direction:column; }
    header { padding:8px 14px; font-weight:800; font-size:14px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,.07); flex:0 0 auto; }
    header small { color:#b09a90; font-weight:400; font-size:11px; }
    .stage { flex:1 1 auto; min-height:0; position:relative; }
    canvas { display:block; position:absolute; inset:0; }
    .controls { flex:0 0 auto; padding:9px 10px calc(9px + env(safe-area-inset-bottom)); border-top:1px solid rgba(255,255,255,.07); background:rgba(20,13,18,.55); }
    .row { display:flex; gap:7px; justify-content:center; flex-wrap:wrap; }
    .row + .row { margin-top:7px; }
    .label { font-size:11px; color:#b09a90; align-self:center; margin-right:2px; }
    button { background:#2c1f28; color:#f0e6e0; border:1px solid rgba(255,255,255,.12); border-radius:9px; padding:9px 14px; font-size:14px; font-weight:700; cursor:pointer; }
    button.sm { padding:7px 11px; font-size:12px; }
    button.on { background:linear-gradient(135deg,var(--accent),var(--accent2)); border-color:transparent; color:#1a1014; }
    button:active { transform:scale(.95); }
    .hint { text-align:center; color:#b09a90; font-size:11px; margin-top:7px; line-height:1.5; }
  </style>
</head>
<body>
  <div class="wrap">
    <header><span>🔥 lecliss · PixelLab 小人</span><small>v3 · 252px · 8方向 · 待机/走/攻击</small></header>
    <div class="stage"><canvas id="cv"></canvas></div>
    <div class="controls">
      <div class="row" id="actbar"></div>
      <div class="row" id="dirbar"></div>
      <div class="hint" id="hint">8 方向像素小人,模板动画(骨架驱动)。点动作切换;方向可手选或「自动转圈」。攻击播完自动回待机。</div>
    </div>
  </div>
  <script>window.ASSET_VER='74';</script>
  <script>
  (async function () {
    const V = window.ASSET_VER || '1';
    const BASE = 'art/05_pixellab/lecliss_demo';
    const man = await fetch(BASE + '/manifest.json?v=' + V).then(r => r.json());
    const DIRS = man.dirs, bb = man.bbox;
    // 并行预加载所有帧（不阻塞首屏）：立刻建 Image 开始下载，渲染循环随到随画
    const imgs = {};   // imgs[anim][dir] = [Image,...]
    let total = 0, loaded = 0;
    for (const anim of Object.keys(man.anims)) {
      imgs[anim] = {};
      for (const d of DIRS) {
        const n = man.anims[anim].frames[d]; const arr = [];
        for (let i = 0; i < n; i++) {
          const im = new Image();
          im.onload = () => { loaded++; }; im.onerror = () => { loaded++; };
          im.src = `${BASE}/${anim}/${d}/${String(i).padStart(2,'0')}.png?v=${V}`;
          arr.push(im); total++;
        }
        imgs[anim][d] = arr;
      }
    }

    const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    function resize(){ const s=cv.parentElement; cv.width=s.clientWidth*dpr; cv.height=s.clientHeight*dpr; cv.style.width=s.clientWidth+'px'; cv.style.height=s.clientHeight+'px'; }
    resize(); window.addEventListener('resize', resize);

    let act='idle', dirIdx=0, autoRot=false, frame=0, t=0;
    const ACTS=[['idle','待机'],['walk','行走'],['attack','攻击']];
    const actbar=document.getElementById('actbar'); actbar.innerHTML='<span class="label">动作</span>';
    ACTS.forEach(([id,lab])=>{ const b=document.createElement('button'); b.textContent=lab; b.className=(id===act?'on':'');
      b.onclick=()=>{ act=id; frame=0; t=0; [...actbar.querySelectorAll('button')].forEach(c=>c.classList.remove('on')); b.classList.add('on'); }; actbar.appendChild(b); });

    const dirbar=document.getElementById('dirbar'); dirbar.innerHTML='<span class="label">朝向</span>';
    const dirLabels={south:'↓',  'south-east':'↘', east:'→','north-east':'↗', north:'↑','north-west':'↖', west:'←','south-west':'↙'};
    DIRS.forEach((d,i)=>{ const b=document.createElement('button'); b.className='sm'; b.textContent=dirLabels[d]||d; b.dataset.i=i;
      b.onclick=()=>{ autoRot=false; dirIdx=i; syncDir(); }; dirbar.appendChild(b); });
    const rotB=document.createElement('button'); rotB.className='sm'; rotB.textContent='⟳自动转圈';
    rotB.onclick=()=>{ autoRot=!autoRot; rotB.classList.toggle('on',autoRot); }; dirbar.appendChild(rotB);
    function syncDir(){ [...dirbar.querySelectorAll('button[data-i]')].forEach(b=>b.classList.toggle('on', +b.dataset.i===dirIdx && !autoRot)); }
    syncDir();

    let last=performance.now(), rotAcc=0;
    function loop(now){
      const dt=Math.min(0.05,(now-last)/1000); last=now;
      const dir=DIRS[dirIdx];
      const arr=(imgs[act][dir]&&imgs[act][dir].length)?imgs[act][dir]:imgs.idle.south;
      const fps=man.fps[act]||8;
      t+=dt;
      if(t>=1/fps){ t-=1/fps; frame++;
        if(frame>=arr.length){ if(act==='attack'){ act='idle'; frame=0; [...actbar.querySelectorAll('button')].forEach((c,i)=>c.classList.toggle('on',ACTS[i][0]==='idle')); } else frame=0; }
      }
      if(autoRot){ rotAcc+=dt; if(rotAcc>0.6){ rotAcc=0; dirIdx=(dirIdx+1)%DIRS.length; } }

      ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height); ctx.setTransform(dpr,0,0,dpr,0,0);
      const W=cv.width/dpr,H=cv.height/dpr;
      const im=arr[Math.min(frame,arr.length-1)];
      // 按内容包围盒裁剪 + 放大,脚底锚定
      const scale=Math.min((W*0.6)/bb.w, (H*0.8)/bb.h);
      const dw=bb.w*scale, dh=bb.h*scale;
      const fx=W/2, fy=H*0.82;
      // 地面光晕
      const grd=ctx.createRadialGradient(fx,fy,0,fx,fy,dw*0.7);
      grd.addColorStop(0,'rgba(255,120,60,.22)'); grd.addColorStop(1,'rgba(255,120,60,0)');
      ctx.fillStyle=grd; ctx.beginPath(); ctx.ellipse(fx,fy,dw*0.55,dh*0.10,0,0,7); ctx.fill();
      ctx.imageSmoothingEnabled=false;
      if(im&&im.width) ctx.drawImage(im, bb.x,bb.y,bb.w,bb.h, fx-dw/2, fy-dh, dw,dh);
      ctx.textAlign='center';
      if(loaded<total){ ctx.fillStyle='#ffb15c'; ctx.font='bold 14px sans-serif'; ctx.fillText('加载中… '+loaded+'/'+total, fx, H*0.5); }
      ctx.fillStyle='#b09a90'; ctx.font='12px sans-serif';
      ctx.fillText(dir+'  ·  '+act+'  ·  '+(frame+1)+'/'+arr.length, fx, H-8);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>

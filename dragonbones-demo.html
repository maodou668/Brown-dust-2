<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DragonBones 占位骨骼演示 · 棕色尘埃2</title>
  <style>
    :root { --accent:#b06bff; --accent2:#ff6b9d; --gold:#f0c674; }
    * { box-sizing:border-box; }
    html,body { margin:0; height:100%; background:radial-gradient(circle at 50% 0%, #2a2038, #1a1422 60%); color:#e8e2f0;
      font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif; -webkit-user-select:none; user-select:none; overflow:hidden; }
    .wrap { height:100dvh; display:flex; flex-direction:column; }
    header { padding:12px 16px; font-weight:800; font-size:15px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,.07); }
    header small { color:#9d92ad; font-weight:400; }
    .stage { flex:1; position:relative; display:grid; place-items:center; }
    canvas { display:block; }
    .floor { position:absolute; bottom:64px; left:50%; transform:translateX(-50%); width:220px; height:26px;
      background:radial-gradient(ellipse at center, rgba(0,0,0,.45), transparent 70%); border-radius:50%; }
    .bar { display:flex; gap:8px; padding:14px; justify-content:center; flex-wrap:wrap; }
    button { background:#261d33; color:#e8e2f0; border:1px solid rgba(255,255,255,.12); border-radius:10px;
      padding:10px 18px; font-size:14px; font-weight:700; cursor:pointer; }
    button.on { background:linear-gradient(135deg,var(--accent),var(--accent2)); border-color:transparent; color:#fff; }
    button:active { transform:scale(.96); }
    .hint { text-align:center; color:#9d92ad; font-size:12px; padding-bottom:10px; line-height:1.6; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <span>🦴 DragonBones 占位骨骼演示</span>
      <small>赛璐璐拼装人形 · 标准骨架 + idle/walk/attack</small>
    </header>
    <div class="stage">
      <div class="floor"></div>
      <canvas id="cv"></canvas>
    </div>
    <div class="bar" id="bar"></div>
    <div class="hint">这是程序化生成的「占位骨骼」，用于验证 DragonBones 管线。<br>真立绘到位后，按同一套骨架命名换皮即可，动画与运行时不变。</div>
  </div>

  <script src="js/dragonbones-lite.js?v=db1"></script>
  <script>
  (async function () {
    const DIR = 'art/02_dragonbones/';
    const NAME = 'char_template';
    const [ske, tex] = await Promise.all([
      fetch(DIR + NAME + '_ske.json').then(r => r.json()),
      fetch(DIR + NAME + '_tex.json').then(r => r.json()),
    ]);
    const atlas = new Image();
    atlas.src = DIR + NAME + '_tex.png';
    await new Promise(res => { atlas.onload = res; atlas.onerror = res; });

    const data = DBLite.parse(ske, tex);
    const player = new DBLite.Player(data, atlas);
    player.play('idle');

    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    function resize() {
      const stage = cv.parentElement;
      const w = stage.clientWidth, h = stage.clientHeight;
      cv.width = w * dpr; cv.height = h * dpr;
      cv.style.width = w + 'px'; cv.style.height = h + 'px';
    }
    resize(); window.addEventListener('resize', resize);

    // 控制按钮
    const anims = [['idle', '待机'], ['walk', '行走'], ['attack_normal', '普攻']];
    const bar = document.getElementById('bar');
    let cur = 'idle';
    anims.forEach(([id, label]) => {
      const b = document.createElement('button');
      b.textContent = label; b.className = id === cur ? 'on' : '';
      b.onclick = () => { cur = id; player.play(id); [...bar.children].forEach(c => c.classList.remove('on')); b.classList.add('on'); };
      bar.appendChild(b);
    });

    // 渲染循环：放大约 1.6 倍，root 置于地面
    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      player.update(dt);
      // 普攻播放完毕自动回 idle
      if (cur === 'attack_normal' && player.onceDone) {
        cur = 'idle'; player.play('idle');
        [...bar.children].forEach((c, i) => c.classList.toggle('on', anims[i][0] === 'idle'));
      }
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, cv.width, cv.height);
      const w = cv.width, h = cv.height;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const cssW = w / dpr, cssH = h / dpr;
      ctx.save();
      ctx.translate(cssW / 2, cssH - 70);
      const s = Math.min(1.8, cssH / 360);
      ctx.scale(s, s);
      player.draw(ctx);
      ctx.restore();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>

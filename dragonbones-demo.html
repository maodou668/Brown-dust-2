<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DragonBones 占位骨骼演示 · 棕色尘埃2</title>
  <style>
    :root { --accent:#b06bff; --accent2:#ff6b9d; --gold:#f0c674; }
    * { box-sizing:border-box; }
    html,body { margin:0; height:100%; background:radial-gradient(circle at 50% 0%, #2a2038, #1a1422 60%); color:#e8e2f0;
      font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif; -webkit-user-select:none; user-select:none; overflow:hidden; }
    .wrap { height:100dvh; display:flex; flex-direction:column; }
    header { padding:12px 16px; font-weight:800; font-size:15px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,.07); }
    header small { color:#9d92ad; font-weight:400; }
    .stage { flex:1; position:relative; display:grid; place-items:center; }
    canvas { display:block; }
    .floor { position:absolute; bottom:64px; left:50%; transform:translateX(-50%); width:220px; height:26px;
      background:radial-gradient(ellipse at center, rgba(0,0,0,.45), transparent 70%); border-radius:50%; }
    .bar { display:flex; gap:8px; padding:14px; justify-content:center; flex-wrap:wrap; }
    button { background:#261d33; color:#e8e2f0; border:1px solid rgba(255,255,255,.12); border-radius:10px;
      padding:10px 18px; font-size:14px; font-weight:700; cursor:pointer; }
    button.on { background:linear-gradient(135deg,var(--accent),var(--accent2)); border-color:transparent; color:#fff; }
    button:active { transform:scale(.96); }
    .hint { text-align:center; color:#9d92ad; font-size:12px; padding-bottom:10px; line-height:1.6; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <span>🦴 DragonBones 占位骨骼演示</span>
      <small>赛璐璐拼装人形 · 标准骨架 + idle/walk/attack</small>
    </header>
    <div class="stage">
      <div class="floor"></div>
      <canvas id="cv"></canvas>
    </div>
    <div class="bar" id="charbar"></div>
    <div class="bar" id="bar"></div>
    <div class="hint" id="hint"></div>
  </div>

  <script src="js/dragonbones-lite.js?v=db2"></script>
  <script>
  (async function () {
    const DIR = 'art/02_dragonbones/';
    // 角色配置：h=总高(px)，above=root 之上的高度(px)，用于自动缩放定位
    const CHARS = {
      lecliss: { label: 'Lecliss（Gemini 立绘切件）', h: 760, above: 540,
        note: '由 Gemini 立绘<b>自动切件</b>绑骨。idle 呼吸自然；挥臂/行走因自动切件在肩部有轻微接缝——干净绑定需手工分层 PSD。' },
      char_template: { label: '占位骨骼（程序生成）', h: 340, above: 180,
        note: '程序化生成的赛璐璐拼装木偶，用于验证管线。' },
    };
    let curChar = 'lecliss', player = null, conf = CHARS.lecliss;

    async function loadChar(name) {
      const [ske, tex] = await Promise.all([
        fetch(DIR + name + '_ske.json').then(r => r.json()),
        fetch(DIR + name + '_tex.json').then(r => r.json()),
      ]);
      const atlas = new Image(); atlas.src = DIR + name + '_tex.png';
      await new Promise(res => { atlas.onload = res; atlas.onerror = res; });
      player = new DBLite.Player(DBLite.parse(ske, tex), atlas);
      player.play('idle');
      conf = CHARS[name];
      document.getElementById('hint').innerHTML = conf.note;
    }
    await loadChar(curChar);

    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    function resize() {
      const stage = cv.parentElement;
      const w = stage.clientWidth, h = stage.clientHeight;
      cv.width = w * dpr; cv.height = h * dpr;
      cv.style.width = w + 'px'; cv.style.height = h + 'px';
    }
    resize(); window.addEventListener('resize', resize);

    // 角色切换
    const charbar = document.getElementById('charbar');
    Object.keys(CHARS).forEach(name => {
      const b = document.createElement('button');
      b.textContent = CHARS[name].label; b.className = name === curChar ? 'on' : '';
      b.onclick = async () => {
        curChar = name; await loadChar(name); cur = 'idle';
        [...charbar.children].forEach(c => c.classList.remove('on')); b.classList.add('on');
        [...bar.children].forEach((c, i) => c.classList.toggle('on', anims[i][0] === 'idle'));
      };
      charbar.appendChild(b);
    });
    // 动画按钮
    const anims = [['idle', '待机'], ['walk', '行走'], ['attack_normal', '普攻']];
    const bar = document.getElementById('bar');
    let cur = 'idle';
    anims.forEach(([id, label]) => {
      const b = document.createElement('button');
      b.textContent = label; b.className = id === cur ? 'on' : '';
      b.onclick = () => { cur = id; player.play(id); [...bar.children].forEach(c => c.classList.remove('on')); b.classList.add('on'); };
      bar.appendChild(b);
    });

    // 渲染循环：放大约 1.6 倍，root 置于地面
    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      player.update(dt);
      // 普攻播放完毕自动回 idle
      if (cur === 'attack_normal' && player.onceDone) {
        cur = 'idle'; player.play('idle');
        [...bar.children].forEach((c, i) => c.classList.toggle('on', anims[i][0] === 'idle'));
      }
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, cv.width, cv.height);
      const w = cv.width, h = cv.height;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const cssW = w / dpr, cssH = h / dpr;
      const s = (cssH * 0.86) / conf.h;            // 按角色总高自适应缩放
      const rootY = cssH * 0.06 + conf.above * s;  // root 之上留出头部
      ctx.save();
      ctx.translate(cssW / 2, rootY);
      ctx.scale(s, s);
      player.draw(ctx);
      ctx.restore();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>

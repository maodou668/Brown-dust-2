<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>lecliss · 骨骼动态立绘 · 棕色尘埃2</title>
  <style>
    :root { --accent:#ff6b3d; --accent2:#ffb15c; }
    * { box-sizing:border-box; }
    html,body { margin:0; height:100%; background:radial-gradient(circle at 50% 18%, #3a2230, #160e14 62%); color:#f0e6e0;
      font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif; -webkit-user-select:none; user-select:none; overflow:hidden; }
    .wrap { height:100dvh; display:flex; flex-direction:column; }
    header { padding:8px 14px; font-weight:800; font-size:14px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,.07); flex:0 0 auto; }
    header small { color:#b09a90; font-weight:400; font-size:11px; }
    .stage { flex:1 1 auto; min-height:0; position:relative; }
    canvas { display:block; position:absolute; inset:0; }
    .controls { flex:0 0 auto; padding:9px 10px calc(9px + env(safe-area-inset-bottom)); border-top:1px solid rgba(255,255,255,.07); background:rgba(22,14,20,.55); }
    .row { display:flex; gap:7px; justify-content:center; flex-wrap:wrap; }
    .row + .row { margin-top:7px; }
    .label { font-size:11px; color:#b09a90; align-self:center; margin-right:2px; }
    button { background:#2c1f28; color:#f0e6e0; border:1px solid rgba(255,255,255,.12); border-radius:9px; padding:9px 15px; font-size:14px; font-weight:700; cursor:pointer; }
    button.sm { padding:6px 11px; font-size:12px; }
    button.on { background:linear-gradient(135deg,var(--accent),var(--accent2)); border-color:transparent; color:#1a1014; }
    button:active { transform:scale(.95); }
    .hint { text-align:center; color:#b09a90; font-size:11px; margin-top:7px; line-height:1.5; }
  </style>
</head>
<body>
  <div class="wrap">
    <header><span>🔥 lecliss · 骨骼动态立绘</span><small>单张立绘 · 12部件 · 骨骼驱动 · 零序列帧</small></header>
    <div class="stage"><canvas id="cv"></canvas></div>
    <div class="controls">
      <div class="row" id="bar"></div>
      <div class="row" id="optbar"></div>
      <div class="hint" id="hint">这一张立绘切成12个部件、绑骨骼，呼吸/摇摆/头发都是代码驱动。和BD2大厅立绘同思路:一次绑定,永久一致。</div>
    </div>
  </div>
  <script>window.ASSET_VER='72';</script>
  <script src="js/rig.js?v=72"></script>
  <script>
  (async function () {
    const V = window.ASSET_VER || '1';
    const data = await fetch('art/04_rig/lecliss_rig.json?v=' + V).then(r => r.json());
    const atlas = await new Promise(res => { const im = new Image(); im.onload = () => res(im); im.src = 'art/04_rig/' + data.image + '?v=' + V; });
    const rig = new Rig(data, atlas);

    const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    function resize(){ const s=cv.parentElement; cv.width=s.clientWidth*dpr; cv.height=s.clientHeight*dpr; cv.style.width=s.clientWidth+'px'; cv.style.height=s.clientHeight+'px'; }
    resize(); window.addEventListener('resize', resize);

    // ---- 待机：连续正弦驱动（保持在"干净幅度"内）----
    function idlePose(t){
      const b = Math.sin(t*1.7), b2 = Math.sin(t*1.7 - 0.7), sway = Math.sin(t*0.85), drift = Math.sin(t*0.6);
      return {
        root:  { tx: sway*3, ty: -b*1.4 },
        spine: { rot: sway*1.1, ty: -b*2.0, sy: 1 + Math.max(0,b)*0.014 },
        chest: { rot: sway*0.7, sy: 1 + Math.max(0,b)*0.022 },
        neck:  { rot: -sway*0.5 },
        head:  { rot: sway*1.4 + drift*1.1, ty: -b*0.8 },
        hair:  { rot: sway*2.3 + b2*1.1 },
        armL:  { rot: -sway*1.1 + b*0.9 },
        armR:  { rot: -sway*1.1 - b*0.9 },
      };
    }
    // 展示用静态姿势（看骨骼能动）—— 整条手臂一根骨，抬手干净不重影
    const POSES = {
      idle: null,
      tpose: { armL:{rot:55}, armR:{rot:-55} },
      wave:  null, // 动态:右手挥
      cheer: { armL:{rot:80}, armR:{rot:-80}, spine:{ty:-4} },
    };
    let mode = 'idle';
    const bar = document.getElementById('bar'); bar.innerHTML = '<span class="label">展示</span>';
    [['idle','待机呼吸'],['wave','挥手'],['tpose','张臂'],['cheer','欢呼']].forEach(([id,lab])=>{
      const btn=document.createElement('button'); btn.textContent=lab; btn.className=(id===mode?'on':'');
      btn.onclick=()=>{ mode=id; [...bar.querySelectorAll('button')].forEach(c=>c.classList.remove('on')); btn.classList.add('on'); };
      bar.appendChild(btn);
    });
    const optbar=document.getElementById('optbar');
    let showBones=false;
    const bb=document.createElement('button'); bb.className='sm'; bb.textContent='显示骨骼';
    bb.onclick=()=>{ showBones=!showBones; bb.classList.toggle('on',showBones); }; optbar.appendChild(bb);

    function wavePose(t){
      const p = idlePose(t);
      p.armR = { rot: -88 + Math.sin(t*7)*12 };     // 举右手左右摆动
      p.head = { rot: 4 };
      return p;
    }

    function drawBones(g, s, ox, oy){
      const w = rig.world();
      g.save(); g.setTransform(1,0,0,1,0,0);
      for(const bone of data.bones){
        const m=w[bone.name]; const x=ox+m.tx*s, y=oy+m.ty*s;
        g.fillStyle='#00e5ff'; g.beginPath(); g.arc(x,y,3,0,7); g.fill();
        if(bone.parent){ const pm=w[bone.parent]; g.strokeStyle='rgba(0,229,255,.5)'; g.beginPath(); g.moveTo(ox+pm.tx*s,oy+pm.ty*s); g.lineTo(x,y); g.stroke(); }
      }
      g.restore();
    }

    let t0=performance.now();
    function loop(now){
      const t=(now-t0)/1000;
      ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height); ctx.setTransform(dpr,0,0,dpr,0,0);
      const W=cv.width/dpr,H=cv.height/dpr;
      const s=Math.min(W/data.W, (H*0.96)/data.H);
      const ox=(W-data.W*s)/2, oy=(H-data.H*s)/2 + H*0.0;
      // 地面光晕
      const gx=ox+data.W*s/2, gy=oy+data.H*s*0.99;
      const grd=ctx.createRadialGradient(gx,gy,0,gx,gy,data.W*s*0.4);
      grd.addColorStop(0,'rgba(255,120,60,.22)'); grd.addColorStop(1,'rgba(255,120,60,0)');
      ctx.fillStyle=grd; ctx.fillRect(0,gy-30,W,60);

      let pose;
      if(mode==='idle') pose=idlePose(t);
      else if(mode==='wave') pose=wavePose(t);
      else { pose=Object.assign(idlePose(t*0.6), POSES[mode]); }
      rig.setPose(pose);
      ctx.save(); ctx.setTransform(dpr*s,0,0,dpr*s, dpr*ox, dpr*oy); rig.draw(ctx); ctx.restore();
      if(showBones) drawBones(ctx, dpr*s, dpr*ox, dpr*oy);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>lecliss · Q版小人序列帧 · 统一效果</title>
  <style>
    :root { --accent:#b06bff; --accent2:#ff6b9d; }
    * { box-sizing:border-box; }
    html,body { margin:0; height:100%; background:radial-gradient(circle at 50% 0%, #2a2038, #14101c 60%); color:#e8e2f0;
      font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif; -webkit-user-select:none; user-select:none; overflow:hidden; }
    .wrap { height:100dvh; display:flex; flex-direction:column; }
    header { padding:8px 14px; font-weight:800; font-size:14px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,.07); flex:0 0 auto; }
    header small { color:#9d92ad; font-weight:400; font-size:11px; }
    .stage { flex:1 1 auto; min-height:0; position:relative; }
    canvas { display:block; position:absolute; inset:0; }
    .controls { flex:0 0 auto; padding:9px 10px calc(9px + env(safe-area-inset-bottom)); border-top:1px solid rgba(255,255,255,.07); background:rgba(20,16,28,.55); }
    .row { display:flex; gap:7px; justify-content:center; flex-wrap:wrap; }
    .row + .row { margin-top:7px; }
    .label { font-size:11px; color:#9d92ad; align-self:center; margin-right:2px; }
    button { background:#261d33; color:#e8e2f0; border:1px solid rgba(255,255,255,.12); border-radius:9px; padding:9px 15px; font-size:14px; font-weight:700; cursor:pointer; }
    button.sm { padding:6px 11px; font-size:12px; }
    button.on { background:linear-gradient(135deg,var(--accent),var(--accent2)); border-color:transparent; color:#fff; }
    button:active { transform:scale(.95); }
    .hint { text-align:center; color:#9d92ad; font-size:11px; margin-top:7px; line-height:1.5; }
  </style>
</head>
<body>
  <div class="wrap">
    <header><span>🎬 lecliss · Q版序列帧</span><small>视频抽帧 · 统一尺寸 · 脚底锚定</small></header>
    <div class="stage"><canvas id="cv"></canvas></div>
    <div class="controls">
      <div class="row" id="animbar"></div>
      <div class="row" id="optbar"></div>
      <div class="hint" id="hint">六个动作来自同一 Q 版定妆，已按身高统一缩放、脚底对齐。点动作切换；「全部并排」可一眼看一致性。</div>
    </div>
  </div>
  <script>window.ASSET_VER='70';</script>
  <script src="js/sprite-anim.js?v=70"></script>
  <script>
  (async function () {
    const V = (window.ASSET_VER||'1');
    const CLIPS = [
      ['idle','待机',true],['walk_dr','走·右下',true],['walk_ur','走·右上',true],
      ['attack','攻击',false],['skill','技能',false],['hit','受击',false],
    ];
    // 载入每个 clip 的 sheet + meta
    const anims = {};
    for (const [k] of CLIPS) {
      const meta = await fetch(`art/03_sprite/lecliss_sd_${k}.json?v=${V}`).then(r=>r.json());
      const img = await new Promise(res=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>res(im); im.src=`art/03_sprite/${meta.sheet}?v=${V}`; });
      anims[k] = { img, meta, anim: new SpriteAnim(img, meta) };
    }

    const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    function resize(){ const s=cv.parentElement; cv.width=s.clientWidth*dpr; cv.height=s.clientHeight*dpr; cv.style.width=s.clientWidth+'px'; cv.style.height=s.clientHeight+'px'; }
    resize(); window.addEventListener('resize', resize);

    // 统一渲染：以 footX,footY 为脚底，bodyPx 为目标身高
    function drawClip(a, footX, footY, bodyPx) {
      const m = a.meta, n = m.norm || {scale:1,footY:1,cx:.5,target:300};
      const k = bodyPx * n.scale / n.target;          // 帧整体缩放
      const fr = a.anim.frame, cols = m.cols||m.frames;
      const sx = (fr%cols)*m.fw, sy = Math.floor(fr/cols)*m.fh;
      const dw = m.fw*k, dh = m.fh*k;
      const dx = footX - n.cx*m.fw*k;
      const dy = footY - n.footY*m.fh*k;
      ctx.drawImage(a.img, sx, sy, m.fw, m.fh, dx, dy, dw, dh);
    }
    function shadow(footX, footY, bodyPx){
      ctx.save(); ctx.translate(footX,footY); ctx.scale(1,.30);
      const rw = bodyPx*0.20; const g = ctx.createRadialGradient(0,0,0,0,0,rw);
      g.addColorStop(0,'rgba(0,0,0,.40)'); g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,rw,0,Math.PI*2); ctx.fill(); ctx.restore();
    }

    let cur='idle', mode='single';
    const animbar=document.getElementById('animbar'); animbar.innerHTML='<span class="label">动作</span>';
    CLIPS.forEach(([id,label])=>{ const b=document.createElement('button'); b.textContent=label; b.dataset.id=id; b.className=(id===cur?'on':'');
      b.onclick=()=>{ mode='single'; cur=id; anims[id].anim.reset(); syncBtns(); }; animbar.appendChild(b); });
    function syncBtns(){ [...animbar.querySelectorAll('button')].forEach(c=>c.classList.toggle('on', mode==='single'&&c.dataset.id===cur)); allBtn.classList.toggle('on', mode==='all'); }

    const optbar=document.getElementById('optbar');
    const allBtn=document.createElement('button'); allBtn.className='sm'; allBtn.textContent='全部并排';
    allBtn.onclick=()=>{ mode = mode==='all'?'single':'all'; Object.values(anims).forEach(a=>a.anim.reset()); syncBtns(); }; optbar.appendChild(allBtn);
    let big=false; const sizeBtn=document.createElement('button'); sizeBtn.className='sm'; sizeBtn.textContent='放大';
    sizeBtn.onclick=()=>{ big=!big; sizeBtn.classList.toggle('on',big); }; optbar.appendChild(sizeBtn);

    let last=performance.now();
    function loop(now){ const dt=Math.min(0.05,(now-last)/1000); last=now;
      ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height); ctx.setTransform(dpr,0,0,dpr,0,0);
      const W=cv.width/dpr, H=cv.height/dpr;
      if (mode==='single'){
        const a=anims[cur]; a.anim.update(dt);
        if (a.anim.done && !a.meta.loop && a.anim.t>a.meta.frames/a.meta.fps+0.5) a.anim.reset();
        const body=Math.min(big?H*0.78:H*0.62, big?560:360);
        const fx=W/2, fy=H*0.90;
        ctx.strokeStyle='rgba(255,255,255,.06)'; ctx.beginPath(); ctx.moveTo(0,fy); ctx.lineTo(W,fy); ctx.stroke();
        shadow(fx,fy,body); drawClip(a,fx,fy,body);
      } else {
        const body=Math.min(H*0.42, 230);
        const fy=H*0.80, n=CLIPS.length, gap=W/n;
        ctx.strokeStyle='rgba(255,255,255,.06)'; ctx.beginPath(); ctx.moveTo(0,fy); ctx.lineTo(W,fy); ctx.stroke();
        CLIPS.forEach(([id,label],i)=>{ const a=anims[id]; a.anim.update(dt);
          if (a.anim.done && !a.meta.loop && a.anim.t>a.meta.frames/a.meta.fps+0.6) a.anim.reset();
          const fx=gap*(i+0.5);
          shadow(fx,fy,body); drawClip(a,fx,fy,body);
          ctx.fillStyle='#cdbfe0'; ctx.font='bold 13px sans-serif'; ctx.textAlign='center'; ctx.fillText(label,fx,fy+24);
        });
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
    syncBtns();
  })();
  </script>
</body>
</html>

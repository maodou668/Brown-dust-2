<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>棕色尘埃 2 · Brown Dust 2</title>
  <style>
/* ============================================================
   棕色尘埃 2 风格 UI — 暗色奇幻风格
   ============================================================ */

:root {
  --bg: #14101a;
  --bg2: #1d1726;
  --panel: #261d33;
  --panel-2: #2f2440;
  --gold: #f0c674;
  --gem: #6cc6ff;
  --accent: #b06bff;
  --accent-2: #ff6b9d;
  --text: #ece6f5;
  --text-dim: #9d92ad;
  --danger: #ff5a6a;
  --hp: #4ad66d;
  --sp: #6cc6ff;
  --r5: #ff9b3d;
  --r4: #b06bff;
  --r3: #6c9fff;
  --shadow: 0 6px 24px rgba(0,0,0,.45);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body { height: 100%; }

body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
  background: radial-gradient(circle at 50% -10%, #2a2038 0%, var(--bg) 60%);
  color: var(--text);
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
}

#app {
  max-width: 480px;
  height: 100vh;       /* 兜底：不支持 dvh 的旧浏览器 */
  height: 100dvh;      /* 动态视口高度：扣除移动端 Chrome 的工具栏，保证底栏可见 */
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  position: relative;
  box-shadow: 0 0 60px rgba(0,0,0,.6);
}

/* ---------- 顶部栏 ---------- */
#topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px;
  background: linear-gradient(180deg, var(--bg2), transparent);
  border-bottom: 1px solid rgba(255,255,255,.05);
  z-index: 5;
}
.logo { display: flex; align-items: center; gap: 8px; }
.logo-mark {
  width: 32px; height: 32px; border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  display: grid; place-items: center;
  font-weight: 800; font-size: 14px; color: #fff;
  box-shadow: 0 2px 10px rgba(176,107,255,.5);
}
.logo-text { font-weight: 700; font-size: 17px; letter-spacing: .5px; }
.logo-text small { color: var(--accent); font-size: 13px; margin-left: 2px; }

.resources { display: flex; align-items: center; gap: 10px; }
.res {
  display: flex; align-items: center; gap: 4px;
  background: var(--panel); padding: 5px 10px; border-radius: 20px;
  font-size: 13px; font-weight: 600;
  border: 1px solid rgba(255,255,255,.06);
}
.res-icon { font-size: 14px; }
#res-gold { color: var(--gold); }
#res-gem { color: var(--gem); }
.ghost-btn {
  background: var(--panel); border: 1px solid rgba(255,255,255,.06);
  color: var(--text-dim); width: 30px; height: 30px; border-radius: 8px;
  font-size: 15px; cursor: pointer;
}
.ghost-btn:active { transform: scale(.92); }

/* ---------- 主区域 ---------- */
#screen {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 14px;
  -webkit-overflow-scrolling: touch;
}
#screen::-webkit-scrollbar { width: 0; }

/* ---------- 底部导航 ---------- */
#navbar {
  display: flex; background: var(--bg2);
  border-top: 1px solid rgba(255,255,255,.06);
}
.nav-btn {
  flex: 1; background: none; border: none; color: var(--text-dim);
  padding: 9px 0 11px; font-size: 11px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  transition: color .2s;
}
.nav-btn span { font-size: 20px; }
.nav-btn.active { color: var(--accent); }
.nav-btn.active span { filter: drop-shadow(0 0 6px var(--accent)); }
.nav-btn:active { transform: scale(.94); }

/* ---------- 通用组件 ---------- */
.section-title {
  font-size: 15px; font-weight: 700; margin: 4px 0 12px;
  display: flex; align-items: center; gap: 8px;
}
.section-title::before {
  content: ''; width: 4px; height: 16px; border-radius: 2px;
  background: linear-gradient(var(--accent), var(--accent-2));
}
.muted { color: var(--text-dim); font-size: 12px; }

.btn {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff; border: none; border-radius: 10px;
  padding: 11px 18px; font-size: 14px; font-weight: 700;
  cursor: pointer; box-shadow: 0 4px 14px rgba(176,107,255,.35);
  transition: transform .1s;
}
.btn:active { transform: scale(.96); }
.btn:disabled { opacity: .4; box-shadow: none; cursor: not-allowed; }
.btn.secondary {
  background: var(--panel-2); box-shadow: none;
  border: 1px solid rgba(255,255,255,.1);
}
.btn.gold { background: linear-gradient(135deg, #f0c674, #e0964a); box-shadow: 0 4px 14px rgba(240,198,116,.3); color:#241a08;}

/* ---------- 主页 ---------- */
.hero-banner {
  border-radius: 16px; padding: 22px 18px;
  background:
    linear-gradient(135deg, rgba(176,107,255,.25), rgba(255,107,157,.15)),
    var(--panel);
  border: 1px solid rgba(255,255,255,.08);
  margin-bottom: 16px; position: relative; overflow: hidden;
}
.hero-banner::after {
  content: '⚔️'; position: absolute; right: -10px; bottom: -16px;
  font-size: 92px; opacity: .12; transform: rotate(-12deg);
}
.hero-banner h1 { font-size: 21px; margin-bottom: 6px; }
.hero-banner p { color: var(--text-dim); font-size: 13px; line-height: 1.6; max-width: 80%; }

.quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.quick-card {
  background: var(--panel); border-radius: 14px; padding: 16px;
  border: 1px solid rgba(255,255,255,.06); cursor: pointer;
  transition: transform .12s, border-color .2s;
}
.quick-card:active { transform: scale(.97); }
.quick-card:hover { border-color: var(--accent); }
.quick-card .qc-icon { font-size: 30px; margin-bottom: 8px; }
.quick-card .qc-title { font-weight: 700; font-size: 15px; }
.quick-card .qc-sub { color: var(--text-dim); font-size: 11px; margin-top: 3px; }

.team-preview { margin-top: 16px; }
.team-slots { display: flex; gap: 8px; margin-top: 10px; }
.team-slot {
  flex: 1; aspect-ratio: 3/4; border-radius: 12px;
  background: var(--panel); border: 1px dashed rgba(255,255,255,.15);
  display: grid; place-items: center; overflow: hidden; position: relative;
}
.team-slot.filled { border-style: solid; }
.team-slot.add { cursor: pointer; }
.team-slot.add .plus { font-size: 26px; color: var(--text-dim); }

/* 专属装备红点提示 */
.red-dot {
  position: absolute; top: 3px; right: 3px;
  width: 9px; height: 9px; border-radius: 50%;
  background: #ff3b3b; border: 1px solid #fff;
  box-shadow: 0 0 5px rgba(255,59,59,.8); z-index: 3;
}

/* 队伍编辑：当前出战位 */
.te-current { display: flex; align-items: center; gap: 12px; padding: 10px;
  background: var(--panel); border-radius: 12px; border: 1px solid rgba(255,255,255,.08); }
.te-current.empty { justify-content: center; padding: 18px; font-size: 13px; }
.te-current-info { flex: 1; font-size: 13px; }
.te-current-info b { color: var(--accent); }
.btn.sm { padding: 6px 12px; font-size: 12px; margin-top: 8px; }

/* 招募页签切换 */
.gacha-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
.gacha-tab {
  flex: 1; padding: 10px; border-radius: 12px; font-weight: 700; font-size: 14px;
  background: var(--panel); border: 1px solid rgba(255,255,255,.1); color: var(--text-dim);
}
.gacha-tab.active {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff; border-color: transparent;
}

/* ---------- 角色卡 ---------- */
.char-portrait {
  width: 100%; height: 100%; position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  padding-bottom: 6px;
}
.char-portrait .avatar {
  position: absolute; inset: 0;
  display: grid; place-items: center; font-size: 34px;
}
.char-portrait .pname {
  position: relative; font-size: 10px; font-weight: 700;
  background: rgba(0,0,0,.5); padding: 1px 6px; border-radius: 6px;
}
.rarity-badge {
  position: absolute; top: 4px; left: 4px; font-size: 9px;
  padding: 1px 5px; border-radius: 5px; font-weight: 800; z-index: 2;
}
.r5 { background: linear-gradient(135deg,#ff9b3d,#ffd35a); color:#3a2400; }
.r4 { background: linear-gradient(135deg,#b06bff,#d89bff); color:#fff; }
.r3 { background: linear-gradient(135deg,#6c9fff,#9bc6ff); color:#fff; }
.border-r5 { border-color: var(--r5) !important; }
.border-r4 { border-color: var(--r4) !important; }
.border-r3 { border-color: var(--r3) !important; }

/* ---------- 佣兵列表 ---------- */
.roster-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
}
.roster-card {
  background: var(--panel); border-radius: 12px; overflow: hidden;
  border: 2px solid rgba(255,255,255,.06); cursor: pointer;
  position: relative; transition: transform .1s;
}
.roster-card:active { transform: scale(.96); }
.roster-card .rc-art {
  aspect-ratio: 1/1; display: grid; place-items: center; font-size: 38px;
  position: relative;
}
.roster-card .rc-info { padding: 6px 8px; }
.roster-card .rc-name { font-size: 12px; font-weight: 700; }
.roster-card .rc-lv { font-size: 10px; color: var(--text-dim); }
.roster-card .in-team-tag {
  position: absolute; top: 4px; right: 4px; z-index: 2;
  background: var(--accent); color: #fff; font-size: 9px;
  padding: 1px 5px; border-radius: 5px; font-weight: 700;
}
.cls-chip {
  position: absolute; bottom: 4px; right: 4px; font-size: 14px;
  background: rgba(0,0,0,.45); border-radius: 6px; padding: 1px 4px;
}

/* ---------- 关卡 ---------- */
.stage-card {
  background: var(--panel); border-radius: 14px; padding: 14px;
  border: 1px solid rgba(255,255,255,.06); margin-bottom: 12px;
  display: flex; align-items: center; gap: 12px;
}
.stage-card.locked { opacity: .5; }
.stage-card.boss { border-color: rgba(255,90,106,.4); background: linear-gradient(135deg, rgba(255,90,106,.12), var(--panel)); }
.stage-num {
  width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
  background: var(--panel-2); display: grid; place-items: center;
  font-size: 18px; font-weight: 800;
}
.stage-card.boss .stage-num { background: linear-gradient(135deg,#ff5a6a,#b02a3a); }
.stage-info { flex: 1; min-width: 0; }
.stage-info h3 { font-size: 14px; margin-bottom: 2px; }
.stage-info p { font-size: 11px; color: var(--text-dim); line-height: 1.4;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stage-meta { display: flex; gap: 8px; margin-top: 5px; font-size: 10px; }
.stage-meta span { color: var(--gold); }
.clear-mark { color: var(--hp); font-size: 16px; }

/* ---------- 抽卡 ---------- */
.gacha-banner {
  border-radius: 18px; padding: 26px 18px; text-align: center;
  background:
    radial-gradient(circle at 50% 30%, rgba(255,155,61,.3), transparent 60%),
    linear-gradient(160deg, #3a2454, #241730);
  border: 1px solid rgba(255,155,61,.3); margin-bottom: 18px; position: relative;
  overflow: hidden;
}
.gacha-banner h2 { font-size: 22px; margin-bottom: 6px;
  background: linear-gradient(90deg,#ffd35a,#ff9b3d); -webkit-background-clip: text; background-clip: text; color: transparent; }
.gacha-banner .sub { color: var(--text-dim); font-size: 12px; margin-bottom: 4px; }
.gacha-rates { font-size: 11px; color: var(--text-dim); margin: 14px 0; }
.gacha-rates b { color: var(--r5); }
.pity-bar { font-size: 11px; color: var(--text-dim); margin-top: 8px; }
.gacha-actions { display: flex; gap: 10px; justify-content: center; margin-top: 6px; }

/* ---------- 弹窗 ---------- */
#modal-root { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
.modal-overlay {
  position: absolute; inset: 0; background: rgba(0,0,0,.7);
  display: grid; place-items: center; pointer-events: auto;
  animation: fadeIn .2s;
}
@keyframes fadeIn { from { opacity: 0; } }
.modal {
  width: 88%; max-width: 400px; max-height: 84vh; overflow-y: auto;
  background: var(--bg2); border-radius: 18px; padding: 20px;
  border: 1px solid rgba(255,255,255,.1); box-shadow: var(--shadow);
  animation: popIn .25s cubic-bezier(.2,1.4,.5,1);
}
@keyframes popIn { from { transform: scale(.85); opacity: 0; } }
.modal h2 { font-size: 18px; margin-bottom: 6px; }
.modal .close-row { display: flex; justify-content: flex-end; margin-top: 16px; gap: 8px; }

/* 角色详情 */
.detail-head { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
.detail-art {
  width: 84px; height: 84px; border-radius: 14px; flex-shrink: 0;
  display: grid; place-items: center; font-size: 44px;
  border: 2px solid;
}
.detail-title h2 { font-size: 19px; }
.detail-title .subt { color: var(--accent-2); font-size: 12px; font-weight: 600; }
.detail-title .meta { color: var(--text-dim); font-size: 12px; margin-top: 4px; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0; }
.stat-item { background: var(--panel); border-radius: 8px; padding: 8px 10px; font-size: 12px;
  display: flex; justify-content: space-between; }
.stat-item .sv { font-weight: 700; }
.skill-item { background: var(--panel); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
.skill-item .sk-head { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; }
.skill-item .sk-sp { margin-left: auto; font-size: 10px; color: var(--sp); background: rgba(108,198,255,.15); padding: 1px 6px; border-radius: 5px; }
.skill-item .sk-desc { font-size: 11px; color: var(--text-dim); margin-top: 4px; line-height: 1.5; }

/* ---------- 战斗界面 ---------- */
#battle-screen {
  position: fixed; inset: 0; max-width: 480px; margin: 0 auto;
  background: linear-gradient(180deg, #1a1326 0%, #0e0a14 100%);
  z-index: 48; display: flex; flex-direction: column;
}
.battle-top {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 14px; font-size: 13px; font-weight: 700;
  background: rgba(0,0,0,.3);
}
.battle-field {
  flex: 1; display: flex; flex-direction: column; justify-content: space-between;
  padding: 10px; gap: 8px; overflow: hidden;
}
.enemy-zone, .ally-zone { display: flex; flex-direction: column; gap: 8px; }
.row-label { font-size: 10px; color: var(--text-dim); text-align: center; }
.unit-row { display: flex; gap: 8px; justify-content: center; min-height: 86px; }

.unit {
  width: 76px; border-radius: 10px; padding: 5px;
  background: var(--panel); border: 2px solid rgba(255,255,255,.08);
  position: relative; cursor: pointer; transition: transform .12s, box-shadow .2s;
}
.unit.dead { opacity: .3; filter: grayscale(1); pointer-events: none; }
.unit.active-turn { border-color: var(--gold); box-shadow: 0 0 16px rgba(240,198,116,.5); transform: translateY(-4px); }
.unit.targetable { border-color: var(--danger); box-shadow: 0 0 14px rgba(255,90,106,.5); cursor: crosshair; }
.unit.targetable.ally-target { border-color: var(--hp); box-shadow: 0 0 14px rgba(74,214,109,.5); }
.unit .u-art { height: 38px; display: grid; place-items: center; font-size: 26px; }
.unit .u-name { font-size: 9px; text-align: center; font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.unit .u-elem { position: absolute; top: 2px; right: 3px; font-size: 11px; }
.unit .u-boss { position: absolute; top: 2px; left: 3px; font-size: 9px; color: var(--danger); font-weight: 800; }
.bar { height: 5px; border-radius: 3px; background: rgba(0,0,0,.4); margin-top: 3px; overflow: hidden; }
.bar .fill { height: 100%; transition: width .3s; }
.bar .fill.hp { background: linear-gradient(90deg,#4ad66d,#7aff9b); }
.bar .fill.sp { background: linear-gradient(90deg,#6cc6ff,#9bdcff); }
.u-hp-text { font-size: 8px; color: var(--text-dim); text-align: center; margin-top: 1px; }
.shield-tag { position: absolute; bottom: 22px; left: 3px; font-size: 9px; color: #9bdcff; }

/* 战斗底部操作 */
.battle-ctrl {
  background: rgba(0,0,0,.4); padding: 10px 12px 14px;
  border-top: 1px solid rgba(255,255,255,.06);
  min-height: 120px;
}
.turn-hint { font-size: 12px; color: var(--text-dim); text-align: center; margin-bottom: 8px; min-height: 16px; }
.turn-hint b { color: var(--gold); }
.skill-bar { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.skill-btn {
  background: var(--panel-2); border: 1px solid rgba(255,255,255,.1);
  border-radius: 10px; padding: 8px 10px; min-width: 84px; cursor: pointer;
  text-align: center; transition: transform .1s;
}
.skill-btn:active { transform: scale(.95); }
.skill-btn.selected { border-color: var(--gold); background: rgba(240,198,116,.15); }
.skill-btn:disabled { opacity: .4; cursor: not-allowed; }
.skill-btn .sb-name { font-size: 12px; font-weight: 700; }
.skill-btn .sb-sp { font-size: 9px; color: var(--sp); margin-top: 2px; }
.skill-btn .sb-sp.ready { color: var(--gold); }

.battle-log {
  position: absolute; top: 48px; left: 10px; right: 10px;
  font-size: 11px; color: var(--text-dim); text-align: center;
  pointer-events: none; min-height: 16px; text-shadow: 0 1px 3px #000;
}

/* 伤害飘字 */
.float-text {
  position: absolute; font-weight: 800; font-size: 16px;
  pointer-events: none; z-index: 60; text-shadow: 0 2px 4px #000;
  animation: floatUp 1s ease-out forwards;
}
.float-text.dmg { color: #ff6b6b; }
.float-text.crit { color: #ffd35a; font-size: 21px; }
.float-text.heal { color: #7aff9b; }
@keyframes floatUp {
  0% { transform: translateY(0) scale(.6); opacity: 0; }
  20% { transform: translateY(-8px) scale(1.1); opacity: 1; }
  100% { transform: translateY(-46px) scale(1); opacity: 0; }
}

/* 抽卡结果动画 */
.pull-result { text-align: center; }
.pull-art {
  width: 120px; height: 120px; margin: 0 auto 14px; border-radius: 20px;
  display: grid; place-items: center; font-size: 64px; border: 3px solid;
  animation: revealCard .5s cubic-bezier(.2,1.4,.4,1);
}
@keyframes revealCard {
  from { transform: rotateY(90deg) scale(.5); opacity: 0; }
}
.pull-stars { font-size: 20px; margin: 6px 0; }
.pull-name { font-size: 20px; font-weight: 800; }
.pull-title { color: var(--accent-2); font-size: 13px; }
.pull-dup { color: var(--gold); font-size: 12px; margin-top: 6px; }

/* 结算 */
.result-modal { text-align: center; }
.result-title { font-size: 30px; font-weight: 900; margin-bottom: 8px; }
.result-title.win { color: var(--hp); text-shadow: 0 0 20px rgba(74,214,109,.5); }
.result-title.lose { color: var(--danger); }
.reward-row { display: flex; justify-content: center; gap: 16px; margin: 14px 0; }
.reward-row .rw { background: var(--panel); padding: 8px 14px; border-radius: 10px; font-weight: 700; }

.empty-hint {
  text-align: center; color: var(--text-dim); padding: 40px 20px; font-size: 13px;
}

.toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,.85); color: #fff; padding: 10px 18px;
  border-radius: 20px; font-size: 13px; z-index: 100;
  animation: toastIn .3s, toastOut .3s 1.7s forwards;
  pointer-events: none; max-width: 80%; text-align: center;
}
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } }
@keyframes toastOut { to { opacity: 0; } }

@media (max-width: 380px) {
  .unit { width: 66px; }
  .roster-grid { gap: 8px; }
}

/* ============================================================
   叙事演出 / 视觉小说界面（阶段一）
   ============================================================ */
#story-screen {
  position: fixed; inset: 0; max-width: 480px; margin: 0 auto;
  z-index: 70; overflow: hidden; background: #000;
  animation: fadeIn .3s;
}
.story-bg {
  position: absolute; inset: 0; transition: background .4s;
  background: #14101a;
}
/* 场景背景：分层渐变营造景深 */
.bg-void   { background: radial-gradient(circle at 50% 40%, #2a2038, #0a0810); }
.bg-forest { background:
  radial-gradient(circle at 70% 18%, rgba(255,240,180,.18), transparent 45%),
  linear-gradient(180deg, #2e4a32 0%, #1d3322 55%, #16241a 100%); }
.bg-forest_deep { background:
  radial-gradient(circle at 30% 15%, rgba(120,180,255,.10), transparent 45%),
  linear-gradient(180deg, #1a2e28 0%, #122019 60%, #0c1611 100%); }
.bg-cave { background:
  radial-gradient(circle at 50% 80%, rgba(255,120,60,.16), transparent 55%),
  linear-gradient(180deg, #2b2420 0%, #1c1714 60%, #100c0a 100%); }
.bg-ridge { background:
  radial-gradient(circle at 50% 25%, rgba(180,200,255,.16), transparent 50%),
  linear-gradient(180deg, #34405a 0%, #232c40 55%, #161b28 100%); }
.bg-castle { background:
  radial-gradient(circle at 50% 30%, rgba(255,60,90,.20), transparent 55%),
  linear-gradient(180deg, #3a1a2e 0%, #251020 60%, #140a12 100%); }
.bg-town { background:
  radial-gradient(circle at 60% 20%, rgba(255,210,140,.22), transparent 50%),
  linear-gradient(180deg, #4a3a2a 0%, #33271c 55%, #1e1610 100%); }
/* 场景地平线点缀 */
.story-bg::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 38%;
  background: linear-gradient(180deg, transparent, rgba(0,0,0,.55));
}

/* 立绘位 */
.story-portrait {
  position: absolute; bottom: 150px; width: 56%; max-width: 270px;
  height: 64%; display: flex; align-items: flex-end; justify-content: center;
  pointer-events: none; transition: filter .3s, opacity .3s;
}
.story-portrait.left  { left: -4%; }
.story-portrait.right { right: -4%; }
.story-portrait.empty { opacity: 0; }
.story-portrait.dim   { filter: brightness(.55) saturate(.7); }
.port-img { max-height: 100%; object-fit: contain; }

/* 风格化占位立绘：渐变人形剪影 + 大图标 */
.port-art { position: relative; width: 100%; height: 100%; display: flex; align-items: flex-end; justify-content: center; }
.port-silhouette {
  position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 70%; height: 92%;
  background:
    radial-gradient(circle at 50% 22%, var(--c), transparent 62%),
    linear-gradient(180deg, color-mix(in srgb, var(--c) 70%, #000), color-mix(in srgb, var(--c) 30%, #000));
  border-radius: 50% 50% 42% 42% / 30% 30% 70% 70%;
  box-shadow: 0 0 50px -8px var(--c);
  opacity: .92;
  clip-path: polygon(50% 0%, 72% 8%, 80% 26%, 74% 48%, 88% 70%, 80% 100%, 20% 100%, 12% 70%, 26% 48%, 20% 26%, 28% 8%);
}
.port-icon {
  position: absolute; top: 16%; left: 50%; transform: translateX(-50%);
  font-size: 58px; filter: drop-shadow(0 4px 10px rgba(0,0,0,.5));
}
.port-elem {
  position: absolute; top: 9%; left: 50%; transform: translateX(-50%) translateX(40px);
  font-size: 24px;
}

/* 跳过按钮 */
.story-skip {
  position: absolute; top: 14px; right: 14px; z-index: 3;
  background: rgba(0,0,0,.5); color: #fff; border: 1px solid rgba(255,255,255,.2);
  border-radius: 18px; padding: 7px 14px; font-size: 12px; cursor: pointer;
}
.story-skip:active { transform: scale(.94); }

/* 对话框 */
.story-dialogue {
  position: absolute; left: 12px; right: 12px; bottom: 16px; z-index: 2;
  background: linear-gradient(180deg, rgba(20,16,26,.92), rgba(12,9,16,.96));
  border: 1px solid rgba(176,107,255,.35); border-radius: 16px;
  padding: 16px 18px 18px; min-height: 116px;
  box-shadow: 0 8px 30px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05);
}
.story-dialogue.narration {
  text-align: center; background: rgba(8,6,12,.82);
  border-color: rgba(255,255,255,.12); display: flex; align-items: center; justify-content: center;
}
.story-name {
  font-size: 16px; font-weight: 800; margin-bottom: 8px;
  display: inline-block; padding: 2px 12px;
  background: rgba(0,0,0,.35); border-radius: 8px;
  border-left: 3px solid currentColor;
}
.story-text { font-size: 15px; line-height: 1.75; color: var(--text); min-height: 52px; }
.story-dialogue.narration .story-text { font-style: italic; color: #cfc6df; }
.story-next {
  position: absolute; right: 16px; bottom: 12px; color: var(--accent);
  font-size: 14px; animation: bobNext 1s infinite; transition: opacity .2s;
}
@keyframes bobNext { 0%,100% { transform: translateY(0); } 50% { transform: translateY(4px); } }

/* 战斗场景背景（让战斗也有「场景」） */
.battle-field { position: relative; }
.battle-field::before {
  content: ''; position: absolute; inset: 0; z-index: -1; opacity: .5;
  background: radial-gradient(circle at 50% 20%, rgba(176,107,255,.10), transparent 60%);
}

/* 剧情重看入口（角色档案/设置里复用） */
.story-replay-list { display: flex; flex-direction: column; gap: 8px; }
.story-replay-item {
  background: var(--panel); border: 1px solid rgba(255,255,255,.06);
  border-radius: 10px; padding: 12px 14px; display: flex; align-items: center;
  justify-content: space-between; cursor: pointer; font-size: 13px;
}
.story-replay-item.locked { opacity: .45; cursor: default; }
.story-replay-item:not(.locked):active { transform: scale(.98); }

/* 角色背景故事 / 台词 */
.char-lore {
  font-size: 13px; line-height: 1.8; color: #cfc6df;
  background: rgba(0,0,0,.2); border-left: 3px solid var(--accent);
  padding: 10px 12px; border-radius: 0 8px 8px 0; margin-bottom: 4px;
}
.quote-list { display: flex; flex-direction: column; gap: 6px; }
.quote-item {
  font-size: 13px; color: var(--accent-2); font-style: italic;
  background: var(--panel); padding: 8px 12px; border-radius: 8px;
}
/* 剧情回顾分组标题 */
.replay-group-title { font-size: 12px; color: var(--text-dim); margin: 12px 0 6px; font-weight: 700; }

/* ============================================================
   装备系统（阶段三）
   ============================================================ */
.gear-slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 4px; }
.gear-slot {
  position: relative; aspect-ratio: 1/1; border-radius: 10px;
  background: var(--panel); border: 2px solid rgba(255,255,255,.08);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; transition: transform .1s; padding: 2px;
}
.gear-slot:active { transform: scale(.95); }
.gear-slot.empty { border-style: dashed; }
.gear-slot .gs-icon { font-size: 24px; }
.gear-slot.empty .gs-icon { font-size: 22px; color: var(--text-dim); }
.gear-slot .gs-name { font-size: 9px; margin-top: 2px; text-align: center;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

/* 专属武器标识：与通用 UR 装备区分 */
.ex-tag {
  position: absolute; top: 3px; right: 3px; z-index: 3;
  font-size: 8px; font-weight: 800; padding: 1px 4px; border-radius: 4px;
  color: #241a08; background: linear-gradient(135deg, #ffd35a, #ff9b3d);
  box-shadow: 0 1px 3px rgba(255,155,61,.5);
}
.ex-tag.inline {
  position: static; display: inline-block; margin-left: 6px;
  vertical-align: middle; font-size: 9px;
}
.gear-slot.is-ex, .gear-pick-item.is-ex {
  border-color: #ff9b3d;
  box-shadow: 0 0 8px rgba(255,155,61,.35) inset;
}

.gear-pick-list { display: flex; flex-direction: column; gap: 8px; max-height: 52vh; overflow-y: auto; }
.gear-pick-item {
  display: flex; align-items: center; gap: 10px;
  background: var(--panel); border: 2px solid rgba(255,255,255,.08);
  border-radius: 10px; padding: 8px 12px; cursor: pointer;
}
.gear-pick-item:active { transform: scale(.98); }
.gear-pick-item.locked { opacity: .45; cursor: default; }
.gear-pick-item .gp-icon { font-size: 24px; }
.gear-pick-item .gp-info { flex: 1; min-width: 0; }
.gear-pick-item .gp-name { font-size: 13px; font-weight: 700; }
.gear-pick-item .gp-stats { font-size: 11px; }
.gear-pick-item .gp-tag {
  font-size: 10px; background: var(--accent); color: #fff;
  padding: 2px 8px; border-radius: 6px; font-weight: 700;
}

.forge-card {
  background: var(--panel); border: 1px solid rgba(255,255,255,.08);
  border-radius: 12px; padding: 14px; margin-bottom: 12px;
}
.forge-card .forge-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
.forge-card .muted { margin-bottom: 10px; }
.forge-card .btn { width: 100%; }

/* ============================================================
   战斗演出 & 场景氛围（视觉强化）
   ============================================================ */
.battle-field { overflow: hidden; }
.enemy-zone, .ally-zone { position: relative; z-index: 1; }

/* 氛围粒子层 */
.bfx-particles { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.bfx {
  position: absolute; border-radius: 50%; opacity: 0; pointer-events: none;
  animation-iteration-count: infinite; animation-timing-function: linear;
}
.bfx.leaf  { top: -30px; background: radial-gradient(circle at 35% 30%, #a7e07a, #4a8b3a);
  border-radius: 45% 55% 50% 60%; animation-name: bfxFall; }
.bfx.snow  { top: -30px; background: radial-gradient(circle at 35% 30%, #ffffff, #cfe6ff);
  box-shadow: 0 0 4px rgba(255,255,255,.6); animation-name: bfxFall; }
.bfx.ember { bottom: -30px; background: radial-gradient(circle at 40% 35%, #ffe08a, #ff6b3a);
  box-shadow: 0 0 7px #ff8a3a; animation-name: bfxRise; }
.bfx.mote  { bottom: -30px; background: radial-gradient(circle at 40% 35%, #e0c6ff, #8a5ad6);
  box-shadow: 0 0 6px rgba(176,107,255,.5); animation-name: bfxRise; }
@keyframes bfxFall {
  0% { transform: translateY(0) translateX(0) rotate(0); opacity: 0; }
  12% { opacity: .85; } 88% { opacity: .65; }
  100% { transform: translateY(620px) translateX(34px) rotate(220deg); opacity: 0; }
}
@keyframes bfxRise {
  0% { transform: translateY(0) translateX(0); opacity: 0; }
  15% { opacity: .9; } 85% { opacity: .55; }
  100% { transform: translateY(-620px) translateX(-26px); opacity: 0; }
}

/* 技能名横幅 */
.skill-banner {
  position: absolute; top: 44%; left: 50%; z-index: 3; pointer-events: none;
  transform: translate(-50%, -50%); opacity: 0;
  font-size: 24px; font-weight: 900; color: #fff; white-space: nowrap; letter-spacing: 3px;
  text-shadow: 0 2px 10px #000, 0 0 22px var(--accent);
}
.skill-banner.show { animation: skillBanner .95s ease-out; }
@keyframes skillBanner {
  0% { opacity: 0; transform: translate(-50%,-50%) scale(.5); }
  22% { opacity: 1; transform: translate(-50%,-50%) scale(1.15); }
  72% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%,-50%) scale(1); }
}

/* 命中闪光环 */
.impact-ring {
  position: absolute; top: 28%; left: 50%; width: 46px; height: 46px;
  margin: -23px 0 0 -23px; border: 3px solid #ff8a5a; border-radius: 50%;
  pointer-events: none; z-index: 4; animation: impactRing .45s ease-out forwards;
}
.impact-ring.heal { border-color: #7aff9b; }
@keyframes impactRing {
  from { transform: scale(.3); opacity: .9; }
  to { transform: scale(1.5); opacity: 0; }
}
.unit.lunging { z-index: 5; }

/* 剧情场景粒子层（复用 .bfx-particles / .bfx） */
#story-screen .bfx-particles { z-index: 1; }

/* 突破等级徽章 */
.plus-badge {
  display: inline-block; font-size: 11px; font-weight: 800;
  background: linear-gradient(135deg, #ff9b3d, #ff6b9d); color: #fff;
  padding: 1px 7px; border-radius: 6px; vertical-align: middle;
  box-shadow: 0 1px 6px rgba(255,107,157,.4);
}
.plus-badge.corner {
  position: absolute; top: 4px; right: 4px; z-index: 2;
  font-size: 9px; padding: 1px 5px;
}

/* 击退/撞击飘字 */
.knock-text {
  position: absolute; font-weight: 800; font-size: 13px; color: #ffd35a;
  pointer-events: none; z-index: 60; text-shadow: 0 2px 4px #000; white-space: nowrap;
  animation: knockFloat .8s ease-out forwards;
}
@keyframes knockFloat {
  0% { transform: translateX(0) scale(.6); opacity: 0; }
  25% { transform: translateX(10px) scale(1.1); opacity: 1; }
  100% { transform: translateX(28px) scale(1); opacity: 0; }
}

/* ============================================================
   俯视角探索地图
   ============================================================ */
#world-screen {
  position: fixed; inset: 0; max-width: 480px; margin: 0 auto; z-index: 45;
  background: #0e0a14; display: flex; flex-direction: column; overflow: hidden;
}
.world-top {
  display: flex; justify-content: space-between; align-items: center;
  padding: 9px 14px; font-size: 14px; font-weight: 700;
  background: rgba(0,0,0,.4); z-index: 2;
}
#world-canvas { flex: 1; width: 100%; display: block; touch-action: none; background: #1d3322; }
.world-hint {
  position: absolute; left: 0; right: 0; bottom: 132px; text-align: center;
  font-size: 13px; color: #ffe07a; text-shadow: 0 2px 6px #000; pointer-events: none;
  min-height: 18px; font-weight: 700;
}
.world-ctrl {
  display: flex; justify-content: space-between; align-items: flex-end;
  padding: 12px 22px 22px; background: linear-gradient(180deg, transparent, rgba(0,0,0,.5));
}
.dpad { position: relative; width: 132px; height: 132px; }
.dbtn {
  position: absolute; width: 44px; height: 44px; border-radius: 12px;
  background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2);
  color: #fff; font-size: 16px; cursor: pointer; user-select: none; touch-action: none;
  display: grid; place-items: center;
}
.dbtn:active { background: rgba(176,107,255,.5); }
.dbtn.up { top: 0; left: 44px; } .dbtn.down { bottom: 0; left: 44px; }
.dbtn.left { left: 0; top: 44px; } .dbtn.right { right: 0; top: 44px; }
.act-btn {
  width: 76px; height: 76px; border-radius: 50%; align-self: center;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff; font-size: 15px; font-weight: 800; border: none; cursor: pointer;
  box-shadow: 0 4px 16px rgba(176,107,255,.5);
}
.act-btn:active { transform: scale(.94); }
.act-btn:disabled { opacity: .35; box-shadow: none; }

/* 探索入口卡 */
.explore-card {
  display: flex; align-items: center; gap: 12px; cursor: pointer;
  background: linear-gradient(135deg, rgba(74,139,58,.25), var(--panel));
  border: 1px solid rgba(120,200,120,.3); border-radius: 14px;
  padding: 14px; margin-bottom: 14px; transition: transform .1s;
}
.explore-card:active { transform: scale(.98); }
.explore-art {
  width: 52px; height: 52px; border-radius: 12px; flex-shrink: 0;
  display: grid; place-items: center; font-size: 28px;
  background: radial-gradient(circle at 50% 35%, #3a7a44, #1d3322);
}
.explore-info { flex: 1; min-width: 0; }
.explore-info h3 { font-size: 14px; margin-bottom: 2px; }
.explore-info p { font-size: 11px; line-height: 1.4; }
.explore-go { color: var(--accent); font-size: 13px; font-weight: 700; }

/* 章节卡（引导式冒险） */
.chapter-card {
  display: flex; align-items: center; gap: 12px; cursor: pointer;
  background: var(--panel); border: 1px solid rgba(255,255,255,.07);
  border-radius: 14px; padding: 14px; margin-bottom: 12px; transition: transform .1s, border-color .2s;
}
.chapter-card:not(.locked):active { transform: scale(.98); }
.chapter-card:not(.locked):hover { border-color: var(--accent); }
.chapter-card.locked { opacity: .5; }
.chapter-card.done { border-color: rgba(74,214,109,.3); }
.chapter-art {
  width: 54px; height: 54px; border-radius: 13px; flex-shrink: 0;
  display: grid; place-items: center; font-size: 28px;
  background: radial-gradient(circle at 50% 35%, rgba(176,107,255,.3), var(--panel-2));
}
.chapter-info { flex: 1; min-width: 0; }
.chapter-info h3 { font-size: 14px; margin-bottom: 3px; }
.chapter-info p { font-size: 11px; color: var(--text-dim); line-height: 1.4;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chapter-prog { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.cp-bar { flex: 1; height: 5px; border-radius: 3px; background: rgba(0,0,0,.4); overflow: hidden; }
.cp-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .3s; }
.chapter-prog span { font-size: 10px; color: var(--text-dim); }
.chapter-go { color: var(--accent); font-size: 13px; font-weight: 700; white-space: nowrap; }

/* 探索：当前目标条 */
.world-obj {
  position: absolute; top: 44px; left: 0; right: 0; text-align: center; z-index: 2;
  font-size: 13px; color: #fff; pointer-events: none; min-height: 20px;
  text-shadow: 0 2px 6px #000;
}
.world-obj .obj-tag {
  background: var(--accent); color: #fff; font-size: 10px; font-weight: 800;
  padding: 1px 7px; border-radius: 6px; margin-right: 6px;
}
.world-obj.flash { animation: objFlash .8s ease-out; }
@keyframes objFlash { 0% { transform: scale(.7); opacity: 0; } 40% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }

/* 战斗场景 45° 斜视地面 */
.battle-floor {
  position: absolute; left: -20%; right: -20%; bottom: 4%; height: 62%;
  z-index: -1; pointer-events: none;
  background:
    linear-gradient(180deg, transparent, rgba(0,0,0,.35)),
    repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 2px, transparent 2px 46px),
    repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 2px, transparent 2px 40px);
  transform: perspective(420px) rotateX(58deg);
  transform-origin: center bottom;
  border-radius: 40% 40% 0 0 / 18% 18% 0 0;
  opacity: .5;
}

/* 服装切换 */
.costume-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
.costume-chip {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  background: var(--panel); border: 2px solid rgba(255,255,255,.08);
  border-radius: 10px; padding: 8px 10px; min-width: 62px; cursor: pointer;
  transition: transform .1s;
}
.costume-chip:active { transform: scale(.95); }
.costume-chip.active { border-color: var(--gold); background: rgba(240,198,116,.12); }
.costume-chip .cos-icon { font-size: 18px; }
.costume-chip .cos-name { font-size: 10px; font-weight: 700; }

/* 普攻按钮 / 冷却标签 */
.skill-btn.basic { border-color: rgba(255,255,255,.18); background: var(--panel); }
.sb-sp.cooldown { color: #ff8a6a; }

/* ============================================================
   福利：签到 / 任务 / 保底 / 商店
   ============================================================ */
.welfare-cur { display: flex; gap: 10px; margin-bottom: 14px; }
.wc-item { flex: 1; background: var(--panel); border: 1px solid rgba(255,255,255,.06);
  border-radius: 12px; padding: 10px 12px; font-size: 12px; text-align: center; }
.wc-item b { color: var(--gold); font-size: 15px; }

.checkin-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
.checkin-cell { background: var(--panel); border: 1px solid rgba(255,255,255,.06);
  border-radius: 10px; padding: 8px 4px; text-align: center; position: relative; }
.checkin-cell.today { border-color: var(--gold); box-shadow: 0 0 10px rgba(240,198,116,.3); }
.checkin-cell.claimed { opacity: .5; }
.ci-day { font-size: 10px; color: var(--text-dim); }
.ci-reward { font-size: 12px; font-weight: 700; margin-top: 3px; }
.ci-tick { position: absolute; top: 2px; right: 4px; color: var(--hp); font-size: 12px; }

.quest-item { display: flex; align-items: center; gap: 10px; background: var(--panel);
  border: 1px solid rgba(255,255,255,.06); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
.quest-info { flex: 1; min-width: 0; }
.quest-name { font-size: 12px; font-weight: 700; }
.quest-bar { height: 5px; border-radius: 3px; background: rgba(0,0,0,.4); margin-top: 5px; overflow: hidden; }
.quest-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
.quest-reward { font-size: 12px; color: var(--gold); font-weight: 700; }
.quest-claim { padding: 7px 12px; font-size: 12px; }

.pity-card { display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: linear-gradient(135deg, rgba(176,107,255,.18), var(--panel));
  border: 1px solid rgba(176,107,255,.25); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
.pity-name { font-weight: 700; font-size: 13px; margin-bottom: 2px; }
.pity-card .btn { padding: 9px 16px; font-size: 13px; flex-shrink: 0; }

.shop-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.shop-item { background: var(--panel); border: 2px solid rgba(255,255,255,.06); border-radius: 12px;
  padding: 10px 8px; text-align: center; position: relative; }
.shop-item.sold { opacity: .5; }
.shop-icon { font-size: 26px; margin: 4px 0; }
.shop-name { font-size: 11px; font-weight: 700; margin-bottom: 8px; }
.shop-buy { width: 100%; padding: 7px 0; font-size: 12px; }

/* 状态效果 / 狂暴 / 持续伤害飘字 */
.u-status { position: absolute; top: 2px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 1px; z-index: 3; }
.st-badge { font-size: 10px; filter: drop-shadow(0 1px 2px #000); }
.unit.enraged { box-shadow: 0 0 14px rgba(255,90,60,.6); border-color: #ff5a3c; }
.float-text.dot { color: #c08bff; font-size: 14px; }

/* 自动战斗按钮 */
.auto-btn {
  background: var(--panel); border: 1px solid rgba(255,255,255,.15); color: var(--text-dim);
  border-radius: 8px; padding: 4px 10px; font-size: 12px; font-weight: 700; cursor: pointer;
}
.auto-btn.on { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border-color: transparent; }
.auto-btn:active { transform: scale(.94); }

/* ============================================================
   战斗：斜俯视角立体舞台
   ============================================================ */
.battle-stage { position: absolute; inset: 0; z-index: 1; }

// ============================================================
//  游戏状态管理 / 存档 / 角色养成
// ============================================================

const SAVE_KEY = 'bd2_save_v1';

const Game = {
  state: null,

  /** 初始化：读取存档或创建新存档 */
  init() {
    const saved = localStorage.getItem(SAVE_KEY);
    if (saved) {
      try {
        this.state = JSON.parse(saved);
      } catch (e) {
        console.warn('存档损坏，重置', e);
        this.state = this.newGame();
      }
    } else {
      this.state = this.newGame();
    }
    // 存档版本迁移：补齐新增字段，保证老存档不报错
    if (!this.state.seenStory) this.state.seenStory = [];
    if (!this.state.inventory) this.state.inventory = [];
    if (!this.state._gearSeq) this.state._gearSeq = 1;
    if (!this.state.worldFlags) this.state.worldFlags = {};
    if (!this.state.chapterProgress) this.state.chapterProgress = {};
    if (this.state.spark == null) this.state.spark = 0;
    if (this.state.powder == null) this.state.powder = 0;
    if (this.state.firstTen == null) this.state.firstTen = false;
    if (!this.state.daily) this.state.daily = { lastClaim: null, streak: 0 };
    if (!this.state.quests) this.state.quests = { date: null, progress: { win: 0, pull: 0, levelup: 0 }, claimed: {} };
    if (!this.state.shop) this.state.shop = { date: null, slots: [], bought: {} };
    this.state.roster.forEach(o => {
      if (!o.equip) o.equip = { weapon: null, armor: null, accessory: null, ex: null };
      if (o.plus == null) o.plus = 0;
      // 服装：补齐 + 把老的 'base' 规范化为 'base_<charId>'
      if (!o.costumes || !o.costumes.length) o.costumes = ['base_' + o.charId];
      o.costumes = o.costumes.map(c => (c === 'base' ? 'base_' + o.charId : c));
      if (!o.activeCostume || o.activeCostume === 'base') o.activeCostume = 'base_' + o.charId;
    });
    // 升星迁移：把同名角色的重复实例合并为突破等级
    this._mergeDuplicates();
    // 初始化当日任务/商店
    this.ensureDaily();
    return this.state;
  },

  /** 合并 roster 中同 charId 的重复实例：保留最高等级，每个多余实例 +1 突破 */
  _mergeDuplicates() {
    const orig = this.state.roster;
    const cidByUid = {};
    orig.forEach(o => { cidByUid[o.uid] = o.charId; });
    const merged = {};
    orig.forEach(o => {
      const ex = merged[o.charId];
      if (!ex) {
        merged[o.charId] = o;
      } else {
        ex.level = Math.max(ex.level, o.level);
        ex.plus = Math.min(5, (ex.plus || 0) + 1);
      }
    });
    this.state.roster = Object.values(merged);
    // 重映射队伍 uid（被合并掉的实例 → 幸存实例）
    this.state.team = [...new Set((this.state.team || []).map(uid => {
      const cid = cidByUid[uid];
      const s = this.state.roster.find(o => o.charId === cid);
      return s ? s.uid : null;
    }).filter(Boolean))];
  },

  /** 新游戏的初始状态 */
  newGame() {
    return {
      gold: 1000,
      gem: 2000,
      // 已拥有角色：{ uid, charId, level, exp, star }
      roster: [
        this.makeOwned('teried', 1),
        this.makeOwned('mina', 1),
      ],
      // 出战队伍（uid 列表，最多 4 人）
      team: [],
      // 已通关关卡 id
      cleared: [],
      // 已观看的剧情 id
      seenStory: [],
      // 装备背包（gear 实例：{ iid, tpl }）
      inventory: [],
      // 探索地图的一次性标记（宝箱等）
      worldFlags: {},
      // 章节推进进度：{ chapterId: 已完成步数 }
      chapterProgress: {},
      // 抽卡保底计数（距上次 5★）
      pity: 0,
      firstTen: false, // 首次十连保底（必出 5★）是否已用
      // 保底货币
      spark: 0,    // 闪耀之星：每抽 +1，200 兑换自选服装
      powder: 0,   // 希望之粉：每抽 +10，商店兑换必出 5★
      // 运营系统
      daily: { lastClaim: null, streak: 0 },
      quests: { date: null, progress: { win: 0, pull: 0, levelup: 0 }, claimed: {} },
      shop: { date: null, slots: [], bought: {} },
      _uidSeq: 1,
      _gearSeq: 1,
    };
  },

  /** 生成一个已拥有角色实例 */
  makeOwned(charId, level = 1) {
    const uid = 'u' + (this.state ? this.state._uidSeq++ : Date.now() + Math.random());
    return {
      uid, charId, level, exp: 0,
      star: window.GameData.CHARACTERS[charId].rarity,
      plus: 0, // 突破等级 0~5
      costumes: ['base_' + charId],      // 拥有的服装 id 列表
      activeCostume: 'base_' + charId,   // 当前装扮（决定属性/外观）
      equip: { weapon: null, armor: null, accessory: null, ex: null },
    };
  },

  save() {
    localStorage.setItem(SAVE_KEY, JSON.stringify(this.state));
  },

  reset() {
    localStorage.removeItem(SAVE_KEY);
    this.state = this.newGame();
    // 默认把初始两名角色编入队伍
    this.state.team = this.state.roster.map(o => o.uid);
    this.save();
  },

  // ---------- 角色数值计算 ----------

  // ---------- 服装（BD2 模型：服装=收集单位，自带属性+招式）----------

  /** 规范化服装 id（兼容老存档 'base'） */
  normCostumeId(charId, id) {
    if (!id || id === 'base') return 'base_' + charId;
    return id;
  },

  /** 取某服装定义 */
  costumeDef(charId, costumeId) {
    const id = this.normCostumeId(charId, costumeId);
    return window.GameData.COSTUMES[id] || window.GameData.COSTUMES['base_' + charId];
  },

  /** 当前装扮定义（决定属性/外观） */
  activeCostumeDef(owned) {
    return this.costumeDef(owned.charId, owned.activeCostume);
  },
  activeElement(owned) { return this.activeCostumeDef(owned).element; },
  activeColor(owned) { return this.activeCostumeDef(owned).color; },

  /** 拥有的服装 id 列表（规范化、去重） */
  ownedCostumeIds(owned) {
    const out = [];
    (owned.costumes || []).forEach(cid => {
      const id = this.normCostumeId(owned.charId, cid);
      if (!out.includes(id)) out.push(id);
    });
    if (!out.length) out.push('base_' + owned.charId);
    return out;
  },

  /** 战斗技能池：普通攻击 + 各拥有服装的专属招式（去重） */
  battleSkills(owned) {
    const skills = ['basic_attack'];
    this.ownedCostumeIds(owned).forEach(cid => {
      const c = window.GameData.COSTUMES[cid];
      if (c && c.signature && !skills.includes(c.signature)) skills.push(c.signature);
    });
    return skills;
  },

  switchCostume(uid, costumeId) {
    const o = this.getOwned(uid);
    if (!o) return { ok: false };
    const id = this.normCostumeId(o.charId, costumeId);
    if (!this.ownedCostumeIds(o).includes(id)) return { ok: false, msg: '尚未拥有该服装' };
    o.activeCostume = id;
    this.save();
    return { ok: true };
  },

  /** 突破属性倍率：每级 +8% */
  plusMult(owned) {
    return 1 + (owned.plus || 0) * 0.08;
  },

  /** 根据「当前服装属性」+ 等级 + 突破 + 装备计算最终属性 */
  computeStats(owned) {
    const cos = this.activeCostumeDef(owned);
    const lv = owned.level - 1;
    const pm = this.plusMult(owned);
    const g = this.gearBonus(owned);
    return {
      maxHp: Math.round((cos.stats.hp + cos.grow.hp * lv) * pm) + g.hp,
      atk:   Math.round((cos.stats.atk + cos.grow.atk * lv) * pm) + g.atk,
      def:   Math.round((cos.stats.def + cos.grow.def * lv) * pm) + g.def,
      spd:   cos.stats.spd + g.spd,
      crit:  cos.stats.crit + g.crit,
    };
  },

  // ---------- 装备 ----------

  getGearTpl(tplId) {
    const G = window.GameData.GEAR;
    return (G.common[tplId] || G.ex[tplId]) || null;
  },

  getGearInst(iid) {
    return this.state.inventory.find(g => g.iid === iid) || null;
  },

  /** 汇总某角色已装备的属性加成 */
  gearBonus(owned) {
    const b = { hp: 0, atk: 0, def: 0, spd: 0, crit: 0 };
    if (!owned.equip) return b;
    ['weapon', 'armor', 'accessory', 'ex'].forEach(slot => {
      const iid = owned.equip[slot];
      if (!iid) return;
      const inst = this.getGearInst(iid);
      if (!inst) return;
      const tpl = this.getGearTpl(inst.tpl);
      if (!tpl) return;
      Object.keys(tpl.stats).forEach(k => { b[k] = (b[k] || 0) + tpl.stats[k]; });
    });
    return b;
  },

  /** 新增一件装备到背包，返回 iid */
  addGear(tplId) {
    const iid = 'g' + (this.state._gearSeq++);
    this.state.inventory.push({ iid, tpl: tplId });
    return iid;
  },

  /** 给角色装备某件 gear（同件只能被一名角色装备） */
  equipGear(uid, iid) {
    const o = this.getOwned(uid);
    const inst = this.getGearInst(iid);
    if (!o || !inst) return { ok: false, msg: '装备不存在' };
    const tpl = this.getGearTpl(inst.tpl);
    if (!tpl) return { ok: false, msg: '装备无效' };
    if (tpl.type === 'ex' && tpl.owner !== o.charId) {
      return { ok: false, msg: '专属武器无法装备给该角色' };
    }
    const slot = tpl.type; // weapon/armor/accessory/ex
    // 从其他角色身上卸下同一件
    this.state.roster.forEach(x => {
      if (!x.equip) return;
      ['weapon', 'armor', 'accessory', 'ex'].forEach(s => { if (x.equip[s] === iid) x.equip[s] = null; });
    });
    o.equip[slot] = iid;
    this.save();
    return { ok: true };
  },

  unequipGear(uid, slot) {
    const o = this.getOwned(uid);
    if (o && o.equip) { o.equip[slot] = null; this.save(); }
  },

  /** 装备评分（用于一键装备挑最优） */
  gearScore(tpl) {
    const s = tpl.stats || {};
    return (s.atk || 0) + (s.def || 0) * 1.2 + (s.hp || 0) / 8 + (s.crit || 0) * 800;
  },

  /** 该角色是否拥有「背包里未装备的」专属武器 */
  hasUnequippedEx(charId) {
    const exId = 'ex_' + charId;
    return this.state.inventory.some(g => g.tpl === exId && !this.gearEquippedBy(g.iid));
  },

  /** 某槽位背包中评分最高的未装备件，返回 iid */
  bestUnequippedGear(type, charId) {
    let best = null, bestScore = -1;
    this.state.inventory.forEach(g => {
      const tpl = this.getGearTpl(g.tpl);
      if (!tpl) return;
      if (type === 'ex') { if (tpl.type !== 'ex' || tpl.owner !== charId) return; }
      else if (tpl.type !== type) return;
      if (this.gearEquippedBy(g.iid)) return;
      const sc = this.gearScore(tpl);
      if (sc > bestScore) { bestScore = sc; best = g.iid; }
    });
    return best;
  },

  /** 一键装备：为空槽位填入最优件，并自动识别专属武器 */
  autoEquip(uid) {
    const o = this.getOwned(uid);
    if (!o) return { ok: false };
    let count = 0;
    ['weapon', 'armor', 'accessory', 'ex'].forEach(slot => {
      if (o.equip[slot]) return; // 已装备的不覆盖
      const iid = this.bestUnequippedGear(slot, o.charId);
      if (iid) { const r = this.equipGear(uid, iid); if (r.ok) count++; }
    });
    this.save();
    return { ok: true, count };
  },

  /** 找出该 iid 当前被哪名角色装备（返回 owned 或 null） */
  gearEquippedBy(iid) {
    return this.state.roster.find(o => o.equip &&
      ['weapon', 'armor', 'accessory', 'ex'].some(s => o.equip[s] === iid)) || null;
  },

  /** 锻造通用装备：花金币，随机部位+稀有度 */
  craftGear() {
    const C = window.GameData.GEAR.CRAFT;
    if (this.state.gold < C.goldCost) return { ok: false, msg: '金币不足' };
    this.state.gold -= C.goldCost;
    const type = C.types[Math.floor(Math.random() * C.types.length)];
    const r = Math.random();
    let rarity = 3;
    if (r < C.rarityWeight[5]) rarity = 5;
    else if (r < C.rarityWeight[5] + C.rarityWeight[4]) rarity = 4;
    const prefix = { weapon: 'wpn', armor: 'arm', accessory: 'acc' }[type];
    const suffix = { 3: 'r', 4: 'sr', 5: 'ur' }[rarity];
    const tplId = `${prefix}_${suffix}`;
    const iid = this.addGear(tplId);
    this.save();
    return { ok: true, tplId, iid };
  },

  /** 专属武器招募（只从抽奖产出，按稀有度概率） */
  gachaEx() {
    const G = window.GameData.GEAR.exGacha;
    if (this.state.gem < G.cost) return { ok: false, msg: '宝石不足' };
    this.state.gem -= G.cost;
    const r = Math.random();
    let rarity = 3;
    if (r < G.rates[5]) rarity = 5;
    else if (r < G.rates[5] + G.rates[4]) rarity = 4;
    const pool = window.GameData.GEAR.exPool[rarity];
    const tplId = pool[Math.floor(Math.random() * pool.length)];
    const result = { ok: true, tplId, rarity, dup: false };
    if (this.state.inventory.some(g => g.tpl === tplId)) {
      // 重复专属武器 → 返还宝石
      const refund = rarity === 5 ? 60 : rarity === 4 ? 30 : 15;
      this.state.gem += refund; result.dup = true; result.refund = refund;
    } else {
      this.addGear(tplId);
    }
    this.save();
    return result;
  },

  /** 升级所需经验 */
  expToNext(level) {
    return Math.round(50 + level * level * 12);
  },

  /** 给某角色加经验，自动升级。返回升了几级 */
  addExp(owned, amount) {
    let levelsGained = 0;
    owned.exp += amount;
    while (owned.level < 60 && owned.exp >= this.expToNext(owned.level)) {
      owned.exp -= this.expToNext(owned.level);
      owned.level++;
      levelsGained++;
    }
    return levelsGained;
  },

  /** 花金币升级一次 */
  levelUpWithGold(uid) {
    const owned = this.getOwned(uid);
    if (!owned || owned.level >= 60) return { ok: false, msg: '已达最大等级' };
    const cost = 50 + owned.level * 30;
    if (this.state.gold < cost) return { ok: false, msg: '金币不足' };
    this.state.gold -= cost;
    owned.level++;
    owned.exp = 0;
    this.incQuest('levelup', 1);
    this.save();
    return { ok: true, cost, level: owned.level };
  },

  levelUpCost(level) {
    return 50 + level * 30;
  },

  // ---------- 队伍管理 ----------

  getOwned(uid) {
    return this.state.roster.find(o => o.uid === uid);
  },

  inTeam(uid) {
    return this.state.team.includes(uid);
  },

  toggleTeam(uid) {
    const idx = this.state.team.indexOf(uid);
    if (idx >= 0) {
      this.state.team.splice(idx, 1);
    } else {
      if (this.state.team.length >= 5) return { ok: false, msg: "队伍已满（最多 5 人）" };
      this.state.team.push(uid);
    }
    this.save();
    return { ok: true };
  },

  // 将某角色放入指定出战位（用于主页队伍框按位置编辑 / 替换）
  setTeamSlot(slotIdx, uid) {
    if (this.state.team.includes(uid)) return { ok: false, msg: "该角色已在队伍中" };
    if (slotIdx < this.state.team.length) {
      this.state.team[slotIdx] = uid; // 替换该位置原有角色
    } else if (this.state.team.length < 5) {
      this.state.team.push(uid);      // 空位上阵
    } else {
      return { ok: false, msg: "队伍已满（最多 5 人）" };
    }
    this.save();
    return { ok: true };
  },

  // 清空指定出战位
  clearTeamSlot(slotIdx) {
    if (slotIdx < this.state.team.length) {
      this.state.team.splice(slotIdx, 1);
      this.save();
    }
    return { ok: true };
  },

  // ---------- 抽卡 ----------

  rollRarity() {
    const r = Math.random();
    // 软保底：90 抽必出 5★
    if (this.state.pity >= 89) return 5;
    const { rates } = window.GameData.GACHA;
    if (r < rates[5]) return 5;
    if (r < rates[5] + rates[4]) return 4;
    return 3;
  },

  /** 把一套服装发给玩家（处理新角色/新服装/重复突破） */
  grantCostume(costumeId) {
    const cdef = window.GameData.COSTUMES[costumeId];
    const charId = cdef.charId;
    const result = { ok: true, costumeId, charId, rarity: cdef.rarity, isNew: false, newCostume: false, plusUp: false, plus: 0, refund: 0 };
    let owned = this.state.roster.find(o => o.charId === charId);
    if (!owned) {
      owned = this.makeOwned(charId, 1);
      owned.costumes = [costumeId];
      owned.activeCostume = costumeId;
      this.state.roster.push(owned);
      result.isNew = true; result.newCostume = true;
    } else if (!this.ownedCostumeIds(owned).includes(costumeId)) {
      owned.costumes.push(costumeId);
      result.newCostume = true;
    } else {
      if ((owned.plus || 0) < 5) {
        owned.plus = (owned.plus || 0) + 1;
        result.plusUp = true; result.plus = owned.plus;
      } else {
        const refund = cdef.rarity === 5 ? 50 : (cdef.rarity === 4 ? 25 : 10);
        this.state.gem += refund; result.refund = refund; result.plus = 5;
      }
    }
    return result;
  },

  /** 抽一次「服装」（force 可强制稀有度，用于首抽十连保底） */
  gachaPull(force) {
    if (this.state.gem < window.GameData.GACHA.cost) {
      return { ok: false, msg: '宝石不足' };
    }
    this.state.gem -= window.GameData.GACHA.cost;
    const rarity = force || this.rollRarity();
    if (rarity === 5) this.state.pity = 0;
    else this.state.pity++;
    // 保底货币 + 任务
    this.state.spark += 1;
    this.state.powder += 10;
    this.incQuest('pull', 1);

    const pool = window.GameData.COSTUME_POOL[rarity];
    const costumeId = pool[Math.floor(Math.random() * pool.length)];
    const result = this.grantCostume(costumeId);
    result.rarity = rarity;
    this.save();
    return result;
  },

  // ---------- 运营系统：签到 / 任务 / 商店 / 保底兑换 ----------

  CHECKIN: [
    { gold: 300 }, { gem: 60 }, { powder: 60 }, { gold: 600 },
    { gem: 120 }, { gear: 'arm_sr' }, { gem: 240, powder: 120 },
  ],
  QUESTS: [
    { id: 'q_win', name: '进行 3 场战斗', key: 'win', target: 3, reward: { gem: 100 } },
    { id: 'q_pull', name: '进行 1 次招募', key: 'pull', target: 1, reward: { gold: 300 } },
    { id: 'q_lvl', name: '升级佣兵 2 次', key: 'levelup', target: 2, reward: { gem: 60 } },
  ],
  SPARK_COST: 200,
  POWDER_COST: 200,

  today() {
    const d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  },

  /** 跨日重置任务与商店 */
  ensureDaily() {
    const t = this.today();
    if (this.state.quests.date !== t) {
      this.state.quests = { date: t, progress: { win: 0, pull: 0, levelup: 0 }, claimed: {} };
    }
    if (this.state.shop.date !== t || !this.state.shop.slots || !this.state.shop.slots.length) {
      this.state.shop = { date: t, slots: this.rollShop(), bought: {} };
    }
  },

  incQuest(key, n) {
    this.ensureDaily();
    this.state.quests.progress[key] = (this.state.quests.progress[key] || 0) + n;
    this.save();
  },

  applyReward(r) {
    if (r.gold) this.state.gold += r.gold;
    if (r.gem) this.state.gem += r.gem;
    if (r.powder) this.state.powder += r.powder;
    if (r.spark) this.state.spark += r.spark;
    if (r.gear) this.addGear(r.gear);
  },

  canCheckIn() { return this.state.daily.lastClaim !== this.today(); },

  checkIn() {
    if (!this.canCheckIn()) return { ok: false, msg: '今日已签到' };
    const idx = (this.state.daily.streak || 0) % 7;
    const reward = this.CHECKIN[idx];
    this.applyReward(reward);
    this.state.daily.lastClaim = this.today();
    this.state.daily.streak = (this.state.daily.streak || 0) + 1;
    this.save();
    return { ok: true, reward, day: idx + 1 };
  },

  claimQuest(id) {
    this.ensureDaily();
    const q = this.QUESTS.find(x => x.id === id);
    if (!q) return { ok: false };
    if (this.state.quests.claimed[id]) return { ok: false, msg: '已领取' };
    if ((this.state.quests.progress[q.key] || 0) < q.target) return { ok: false, msg: '未完成' };
    this.applyReward(q.reward);
    this.state.quests.claimed[id] = true;
    this.save();
    return { ok: true, reward: q.reward };
  },

  /** 闪耀之星兑换自选服装 */
  sparkExchange(costumeId) {
    if ((this.state.spark || 0) < this.SPARK_COST) return { ok: false, msg: '闪耀之星不足' };
    if (!window.GameData.COSTUMES[costumeId]) return { ok: false, msg: '无效服装' };
    this.state.spark -= this.SPARK_COST;
    const result = this.grantCostume(costumeId);
    this.save();
    return { ok: true, result };
  },

  /** 希望之粉兑换必出 5★ 服装 */
  powderBox() {
    if ((this.state.powder || 0) < this.POWDER_COST) return { ok: false, msg: '希望之粉不足' };
    this.state.powder -= this.POWDER_COST;
    const pool = window.GameData.COSTUME_POOL[5];
    const id = pool[Math.floor(Math.random() * pool.length)];
    const result = this.grantCostume(id);
    this.save();
    return { ok: true, result };
  },

  rollShop() {
    const tpls = ['wpn_sr', 'arm_sr', 'acc_sr', 'wpn_ur', 'arm_ur', 'acc_ur'];
    const slots = [];
    for (let i = 0; i < 3; i++) {
      const t = tpls[Math.floor(Math.random() * tpls.length)];
      const tpl = this.getGearTpl(t);
      slots.push({ tpl: t, price: tpl.rarity === 5 ? 1500 : 600 });
    }
    return slots;
  },

  buyShopItem(idx) {
    this.ensureDaily();
    if (this.state.shop.bought[idx]) return { ok: false, msg: '已售出' };
    const slot = this.state.shop.slots[idx];
    if (!slot) return { ok: false };
    if (this.state.gold < slot.price) return { ok: false, msg: '金币不足' };
    this.state.gold -= slot.price;
    this.addGear(slot.tpl);
    this.state.shop.bought[idx] = true;
    this.save();
    return { ok: true, tpl: slot.tpl };
  },

  // ---------- 关卡结算 ----------

  /** 战斗胜利结算奖励 */
  rewardStage(stage, firstClear) {
    const r = stage.reward;
    this.state.gold += r.gold;
    this.state.gem += firstClear ? r.gem : Math.round(r.gem * 0.3);
    this.incQuest('win', 1);
    // 经验分配给出战队伍
    this.state.team.forEach(uid => {
      const o = this.getOwned(uid);
      if (o) this.addExp(o, r.exp);
    });
    if (firstClear && !this.state.cleared.includes(stage.id)) {
      this.state.cleared.push(stage.id);
    }
    // 装备掉落：40% 概率掉一件通用装备，越后期关卡稀有度越高
    let drop = null;
    if (Math.random() < 0.40) {
      const C = window.GameData.GEAR.CRAFT;
      const type = C.types[Math.floor(Math.random() * C.types.length)];
      // 关卡 id 越大，高稀有度概率越高
      const bonus = Math.min(0.30, stage.id * 0.04);
      const rr = Math.random();
      let rarity = 3;
      if (rr < C.rarityWeight[5] + bonus) rarity = 5;
      else if (rr < C.rarityWeight[5] + C.rarityWeight[4] + bonus) rarity = 4;
      const prefix = { weapon: 'wpn', armor: 'arm', accessory: 'acc' }[type];
      const suffix = { 3: 'r', 4: 'sr', 5: 'ur' }[rarity];
      drop = `${prefix}_${suffix}`;
      this.addGear(drop);
    }
    this.save();
    return { drop };
  },
};

window.Game = Game;


// ============================================================
//  回合制战斗引擎
//  - 基于速度的行动顺序
//  - 技能 SP 充能、元素克制、暴击、护盾、增益/减益
//  - 玩家手动操作 + 敌方 AI
// ============================================================

class Combatant {
  constructor(opts) {
    this.uid = opts.uid;            // 唯一标识
    this.name = opts.name;
    this.side = opts.side;          // 'ally' | 'enemy'
    this.charId = opts.charId;      // 引用图鉴 id（角色或敌人）
    this.cls = opts.cls;
    this.element = opts.element;
    this.color = opts.color;
    this.level = opts.level;
    this.pos = opts.pos;            // 'front' | 'back'
    this.isBoss = !!opts.isBoss;

    this.maxHp = opts.maxHp;
    this.hp = opts.maxHp;
    this.atk = opts.atk;
    this.def = opts.def;
    this.spd = opts.spd;
    this.crit = opts.crit;

    this.skills = opts.skills.slice(); // 技能 id 列表（含普攻）
    this.sp = 3;                       // 起始 SP（可开局放低费技能）
    this.maxSp = 6;
    this.cooldowns = {};               // skillId -> 剩余冷却回合

    this.shield = 0;                   // 当前护盾值
    this.buffs = [];                   // {stat:'atk'|'def', mult, turns}
    this.statuses = [];                // {type:'poison'|'burn'|'stun'|'silence', turns, dmg}
    this.enraged = false;              // BOSS 狂暴标记
    this.taunting = 0;                 // 嘲讽剩余回合
    this.alive = true;
  }

  // 含增益后的有效攻击
  effAtk() {
    let m = 1;
    this.buffs.forEach(b => { if (b.stat === 'atk') m += b.mult; });
    return Math.round(this.atk * m);
  }

  // 含增益/减益后的有效防御
  effDef() {
    let m = 1;
    this.buffs.forEach(b => {
      if (b.stat === 'def') m += b.mult;       // 正为加防
    });
    return Math.max(0, Math.round(this.def * m));
  }

  tickBuffs() {
    this.buffs.forEach(b => b.turns--);
    this.buffs = this.buffs.filter(b => b.turns > 0);
    if (this.taunting > 0) this.taunting--;
    // 冷却递减
    Object.keys(this.cooldowns).forEach(k => {
      if (this.cooldowns[k] > 0) this.cooldowns[k]--;
    });
  }
}

const Battle = {
  combatants: [],
  log: [],
  turnOrder: [],
  turnIdx: 0,
  round: 1,
  onEvent: null,   // UI 回调
  finished: false,
  result: null,    // 'win' | 'lose'

  /** 从存档队伍 + 关卡数据构建战斗 */
  setup(teamUids, stage) {
    this.combatants = [];
    this.log = [];
    this.round = 1;
    this.turnIdx = 0;
    this.finished = false;
    this.result = null;

    const D = window.GameData;

    // 我方
    teamUids.forEach((uid, i) => {
      const owned = Game.getOwned(uid);
      if (!owned) return;
      const def = D.CHARACTERS[owned.charId];
      const cos = Game.activeCostumeDef(owned); // 当前装扮：属性/元素/配色
      const st = Game.computeStats(owned);
      const pos = (def.cls === 'warrior' || def.cls === 'defender') ? 'front' : 'back';
      this.combatants.push(new Combatant({
        uid: 'A' + i, name: def.name, side: 'ally', charId: owned.charId,
        cls: def.cls, element: cos.element, color: cos.color, level: owned.level,
        pos, maxHp: st.maxHp, atk: st.atk, def: st.def, spd: st.spd, crit: st.crit,
        skills: Game.battleSkills(owned), // 普攻 + 各服装招式
      }));
    });

    // 敌方
    stage.enemies.forEach((e, i) => {
      const def = D.ENEMIES[e.id];
      const lv = e.level - 1;
      const grow = { hp: def.base.hp * 0.10, atk: def.base.atk * 0.08, def: def.base.def * 0.08 };
      this.combatants.push(new Combatant({
        uid: 'E' + i, name: def.name, side: 'enemy', charId: e.id,
        cls: 'enemy', element: def.element, color: def.color, level: e.level,
        pos: e.pos,
        maxHp: Math.round(def.base.hp + grow.hp * lv),
        atk: Math.round(def.base.atk + grow.atk * lv),
        def: Math.round(def.base.def + grow.def * lv),
        spd: def.base.spd, crit: def.base.crit,
        skills: def.skills, isBoss: def.isBoss,
      }));
    });

    this.buildTurnOrder();
    this.pushLog(`⚔️ 战斗开始！ ${stage.name}`);
  },

  buildTurnOrder() {
    // 按速度从高到低排序（同速随机）
    this.turnOrder = this.combatants
      .filter(c => c.alive)
      .sort((a, b) => (b.spd - a.spd) || (Math.random() - 0.5));
    this.turnIdx = 0;
  },

  allies() { return this.combatants.filter(c => c.side === 'ally'); },
  enemies() { return this.combatants.filter(c => c.side === 'enemy'); },
  aliveAllies() { return this.allies().filter(c => c.alive); },
  aliveEnemies() { return this.enemies().filter(c => c.alive); },

  current() {
    return this.turnOrder[this.turnIdx];
  },

  pushLog(msg) {
    this.log.push(msg);
    if (this.onEvent) this.onEvent({ type: 'log', msg });
  },

  // ---------- 战斗主流程 ----------

  /** 推进到下一个存活单位的回合；若一轮结束则进入新回合 */
  advance() {
    do {
      this.turnIdx++;
      if (this.turnIdx >= this.turnOrder.length) {
        // 新回合
        this.round++;
        this.tickRound();
        this.buildTurnOrder();
        this.pushLog(`—— 第 ${this.round} 回合 ——`);
      }
    } while (this.current() && !this.current().alive);
    return this.current();
  },

  /** 当前是否轮到我方操作 */
  isPlayerTurn() {
    const c = this.current();
    return c && c.alive && c.side === 'ally' && !this.finished;
  },

  /** 技能冷却回合数（未显式定义则按 SP 估算） */
  skillCD(sk) {
    if (sk.cd != null) return sk.cd;
    const sp = sk.sp || 0;
    return sp >= 4 ? 3 : sp >= 2 ? 2 : 1;
  },

  /** 技能当前是否可用（SP 足够、不在冷却、未被沉默）；普攻恒可用 */
  canUseSkill(combatant, skillId) {
    const sk = window.GameData.SKILLS[skillId];
    if (sk.basic) return true;
    if (this.isSilenced(combatant)) return false;
    if ((combatant.cooldowns[skillId] || 0) > 0) return false;
    return combatant.sp >= (sk.sp || 0);
  },

  // ---------- 状态效果 ----------
  hasStatus(c, type) { return c.statuses.some(s => s.type === type && s.turns > 0); },
  isStunned(c) { return this.hasStatus(c, 'stun'); },
  isSilenced(c) { return this.hasStatus(c, 'silence'); },
  consumeStun(c) {
    const s = c.statuses.find(x => x.type === 'stun' && x.turns > 0);
    if (s) { s.turns--; c.statuses = c.statuses.filter(x => x.turns > 0); }
  },

  /** 施加状态（同类刷新为较长持续） */
  applyStatus(target, inflict, attacker) {
    const st = { type: inflict.type, turns: inflict.turns };
    if (inflict.type === 'poison' || inflict.type === 'burn') {
      st.dmg = Math.max(1, Math.round(attacker.effAtk() * (inflict.power || 0.4)));
    }
    const ex = target.statuses.find(s => s.type === inflict.type);
    if (ex) { ex.turns = Math.max(ex.turns, st.turns); if (st.dmg) ex.dmg = st.dmg; }
    else target.statuses.push(st);
    const nm = { poison: '中毒', burn: '灼烧', stun: '眩晕', silence: '沉默' }[inflict.type] || inflict.type;
    this.pushLog(`☣ ${target.name} 陷入${nm}！`);
    if (this.onEvent) this.onEvent({ type: 'status', target, status: inflict.type });
  },

  /** 每回合：持续伤害结算 + 各类持续时间递减 */
  tickRound() {
    this.combatants.forEach(c => {
      if (!c.alive) return;
      // 持续伤害（中毒/灼烧）
      c.statuses.filter(s => (s.type === 'poison' || s.type === 'burn') && s.turns > 0).forEach(s => {
        if (!c.alive) return;
        let dmg = s.dmg || 1;
        if (c.shield > 0) { const a = Math.min(c.shield, dmg); c.shield -= a; dmg -= a; }
        c.hp -= dmg;
        const icon = s.type === 'poison' ? '☠' : '🔥';
        this.pushLog(`${icon} ${c.name} 受到 ${dmg} 点${s.type === 'poison' ? '中毒' : '灼烧'}伤害`);
        if (this.onEvent) this.onEvent({ type: 'damage', target: c, amount: dmg, crit: false, elem: false, dot: true });
        if (c.hp <= 0) { c.hp = 0; c.alive = false; this.pushLog(`💀 ${c.name} 被击倒！`); }
      });
      // 持续时间递减（眩晕在行动时单独消耗）
      c.buffs.forEach(b => b.turns--); c.buffs = c.buffs.filter(b => b.turns > 0);
      c.statuses.forEach(s => { if (s.type !== 'stun') s.turns--; });
      c.statuses = c.statuses.filter(s => s.turns > 0);
      if (c.taunting > 0) c.taunting--;
      Object.keys(c.cooldowns).forEach(k => { if (c.cooldowns[k] > 0) c.cooldowns[k]--; });
    });
  },

  /** 前排保护：有存活前排时只能选前排，否则可选后排 */
  frontline(units) {
    const front = units.filter(u => u.alive && u.pos === 'front');
    return front.length ? front : units.filter(u => u.alive);
  },

  /** 解析技能合法目标列表 */
  validTargets(combatant, skillId) {
    const sk = window.GameData.SKILLS[skillId];
    const enemySide = combatant.side === 'ally' ? this.aliveEnemies() : this.aliveAllies();
    const allySide = combatant.side === 'ally' ? this.aliveAllies() : this.aliveEnemies();
    switch (sk.target) {
      case 'enemySingle': return sk.pierce ? enemySide : this.frontline(enemySide);
      case 'enemyRow':    return enemySide; // 选一个代表，命中其整排
      case 'enemyAll':    return enemySide;
      case 'allySingle':  return allySide;
      case 'allyAll':     return allySide;
      case 'self':        return [combatant];
    }
    return [];
  },

  /** 嘲讽：若敌方有嘲讽单位，单体攻击只能选它 */
  applyTaunt(attacker, targets) {
    if (attacker.side !== 'enemy') {
      // 我方攻击敌人，敌人无嘲讽机制（简化）
      return targets;
    }
    return targets;
  },

  /** 实际收集技能命中的目标 */
  resolveHitTargets(combatant, skillId, picked) {
    const sk = window.GameData.SKILLS[skillId];
    switch (sk.target) {
      case 'enemySingle':
      case 'allySingle':
        return [picked];
      case 'self':
        return [combatant];
      case 'enemyAll':
        return combatant.side === 'ally' ? this.aliveEnemies() : this.aliveAllies();
      case 'allyAll':
        return combatant.side === 'ally' ? this.aliveAllies() : this.aliveEnemies();
      case 'enemyRow': {
        const side = combatant.side === 'ally' ? this.aliveEnemies() : this.aliveAllies();
        return side.filter(c => c.pos === picked.pos);
      }
    }
    return [];
  },

  /** 元素克制倍率 */
  elementMult(attacker, defender) {
    const E = window.GameData.ELEMENTS[attacker.element];
    if (E && E.strong === defender.element) return 1.3;
    return 1.0;
  },

  /** 计算并施加一次伤害 */
  dealDamage(attacker, defender, power) {
    const elem = this.elementMult(attacker, defender);
    const isCrit = Math.random() < attacker.crit;
    const critMult = isCrit ? 1.6 : 1.0;
    const raw = attacker.effAtk() * power * elem * critMult;
    // 防御减伤公式
    const reduced = raw * (100 / (100 + defender.effDef()));
    let dmg = Math.max(1, Math.round(reduced));

    // 护盾吸收
    if (defender.shield > 0) {
      const absorb = Math.min(defender.shield, dmg);
      defender.shield -= absorb;
      dmg -= absorb;
    }
    defender.hp -= dmg;

    let tag = '';
    if (elem > 1) tag += ' 🔥克制';
    if (isCrit) tag += ' ✨暴击';

    if (defender.hp <= 0) {
      defender.hp = 0;
      defender.alive = false;
      this.pushLog(`💀 ${defender.name} 被击倒！`);
    } else if (defender.isBoss && !defender.enraged && defender.hp <= defender.maxHp * 0.5) {
      // BOSS 狂暴：血量过半，攻击大幅提升
      defender.enraged = true;
      defender.buffs.push({ stat: 'atk', mult: 0.5, turns: 999 });
      this.pushLog(`🔥 ${defender.name} 进入【狂暴】，攻击大幅提升！`);
      if (this.onEvent) this.onEvent({ type: 'enrage', target: defender });
    }
    if (this.onEvent) this.onEvent({ type: 'damage', target: defender, attacker, amount: dmg, crit: isCrit, elem: elem > 1 });
    return { dmg, isCrit, elem: elem > 1, tag };
  },

  /** 执行一个技能 */
  executeSkill(combatant, skillId, picked) {
    const sk = window.GameData.SKILLS[skillId];
    // 扣 SP
    combatant.sp -= (sk.sp || 0);

    const targets = this.resolveHitTargets(combatant, skillId, picked);

    if (sk.effect === 'damage') {
      let summary = [];
      targets.forEach(t => {
        if (!t.alive) return;
        const r = this.dealDamage(combatant, t, sk.power);
        summary.push(`${t.name} -${r.dmg}${r.tag}`);
        // 击退位移
        if (sk.knockback && t.alive) this.applyKnockback(combatant, t, r.dmg);
      });
      this.pushLog(`${combatant.name} 使用「${sk.name}」：${summary.join('，')}`);
      // 附带减益（如水矛降防）
      if (sk.extra && sk.extra.type === 'debuffDef') {
        targets.forEach(t => {
          if (t.alive) t.buffs.push({ stat: 'def', mult: -sk.extra.power, turns: sk.extra.duration });
        });
      }
      // 附带状态（中毒/灼烧/眩晕/沉默）
      if (sk.inflict) {
        targets.forEach(t => { if (t.alive) this.applyStatus(t, sk.inflict, combatant); });
      }
    } else if (sk.effect === 'heal') {
      const amt = Math.round(combatant.effAtk() * sk.power);
      let summary = [];
      targets.forEach(t => {
        if (!t.alive) return;
        const before = t.hp;
        t.hp = Math.min(t.maxHp, t.hp + amt);
        summary.push(`${t.name} +${t.hp - before}`);
        if (this.onEvent) this.onEvent({ type: 'heal', target: t, attacker: combatant, amount: t.hp - before });
      });
      this.pushLog(`${combatant.name} 使用「${sk.name}」：${summary.join('，')}`);
    } else if (sk.effect === 'buffAtk' || sk.effect === 'buffDef') {
      const stat = sk.effect === 'buffAtk' ? 'atk' : 'def';
      targets.forEach(t => {
        if (t.alive) t.buffs.push({ stat, mult: sk.power, turns: sk.duration });
      });
      this.pushLog(`${combatant.name} 使用「${sk.name}」，提升${stat === 'atk' ? '攻击' : '防御'}！`);
    } else if (sk.effect === 'shield') {
      const amt = Math.round(combatant.effAtk() * sk.power);
      targets.forEach(t => { if (t.alive) t.shield += amt; });
      this.pushLog(`${combatant.name} 使用「${sk.name}」，为全队附加 ${amt} 点护盾！`);
      if (sk.extra && sk.extra.type === 'taunt') combatant.taunting = 2;
    }

    // SP 与冷却：普攻回复 SP；招式进入冷却
    if (sk.basic) {
      combatant.sp = Math.min(combatant.maxSp, combatant.sp + 3);
    } else {
      combatant.cooldowns[skillId] = this.skillCD(sk);
    }

    this.checkEnd();
  },

  /** 击退：前排→后排；已在后排则撞墙受额外伤害 */
  applyKnockback(attacker, target, baseDmg) {
    if (target.pos === 'front') {
      target.pos = 'back';
      this.pushLog(`↩ ${target.name} 被击退到后排！`);
      if (this.onEvent) this.onEvent({ type: 'knockback', target, kind: 'push' });
    } else {
      // 撞墙：额外碰撞伤害
      let dmg = Math.max(1, Math.round(baseDmg * 0.35));
      if (target.shield > 0) {
        const a = Math.min(target.shield, dmg);
        target.shield -= a; dmg -= a;
      }
      target.hp -= dmg;
      this.pushLog(`💥 ${target.name} 撞击受到 ${dmg} 额外伤害！`);
      if (this.onEvent) this.onEvent({ type: 'knockback', target, kind: 'collide' });
      if (dmg > 0 && this.onEvent) this.onEvent({ type: 'damage', target, attacker, amount: dmg, crit: false, elem: false });
      if (target.hp <= 0) {
        target.hp = 0; target.alive = false;
        this.pushLog(`💀 ${target.name} 被击倒！`);
      }
    }
  },

  checkEnd() {
    if (this.aliveEnemies().length === 0) {
      this.finished = true;
      this.result = 'win';
      this.pushLog('🎉 战斗胜利！');
      if (this.onEvent) this.onEvent({ type: 'end', result: 'win' });
    } else if (this.aliveAllies().length === 0) {
      this.finished = true;
      this.result = 'lose';
      this.pushLog('☠️ 全队覆灭……');
      if (this.onEvent) this.onEvent({ type: 'end', result: 'lose' });
    }
  },

  // ---------- 敌方 AI ----------

  enemyAct() {
    const c = this.current();
    if (!c || c.side !== 'enemy' || !c.alive) return;

    // 可用技能：SP 足够 且 不在冷却；否则用普通攻击
    const usable = c.skills
      .map(id => ({ id, sk: window.GameData.SKILLS[id] }))
      .filter(s => this.canUseSkill(c, s.id));
    usable.sort((a, b) => (b.sk.power * (1 + (b.sk.sp || 0))) - (a.sk.power * (1 + (a.sk.sp || 0))));
    const basic = { id: 'basic_attack', sk: window.GameData.SKILLS.basic_attack };
    const choice = usable[0] || basic;

    // 选目标：攻击类 → 优先打血量最低的我方；治疗 → 自己
    let picked;
    if (choice.sk.effect === 'damage') {
      // 嘲讽优先；否则受前排保护约束（穿透技能可越过前排）
      const taunters = this.aliveAllies().filter(a => a.taunting > 0);
      const pool = taunters.length
        ? taunters
        : (choice.sk.pierce ? this.aliveAllies() : this.frontline(this.aliveAllies()));
      picked = pool.reduce((lo, t) => (t.hp < lo.hp ? t : lo), pool[0]);
    } else {
      picked = c;
    }
    this.executeSkill(c, choice.id, picked);
  },
};

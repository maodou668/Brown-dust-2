@keyframes comboPulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.4); } }
.combo-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
.combo-btn { flex: 0 0 auto; padding: 7px 12px; font-size: 13px; font-weight: 800; border-radius: 9px;
  border: 1px solid rgba(255,255,255,.15); background: #2a2536; color: #9a90b0; cursor: not-allowed; }
.combo-btn.ready { background: linear-gradient(135deg, #ff6b3d, #ffb15c); color: #1a1014;
  border-color: transparent; cursor: pointer; box-shadow: 0 0 12px rgba(255,140,60,.55); }
.combo-btn:active.ready { transform: scale(.95); }

/* ---------- 深渊 ---------- */
.trial-card.abyss { background: linear-gradient(135deg, rgba(60,30,70,.55), rgba(30,16,38,.55)); border-color: rgba(176,107,255,.30); }
.trial-card.abyss:not(.locked):hover { border-color: rgba(176,107,255,.6); }
.trial-card.abyss .trial-floor { color: #c89bff; }
.abyss-mod { font-size: 10px; font-weight: 700; color: #ffb15c; background: rgba(255,107,61,.16);
  border: 1px solid rgba(255,140,60,.35); padding: 1px 6px; border-radius: 6px; }

/* ===================== PixelLab UI 皮肤 v1 ===================== */
/* 锚点风格: 暗炭紫石板 + 冷铁框 + 炉火橙宝石 + 暖金描边。九宫格 border-image。*/
/* 右侧活动卡: 保留各自渐变配色, 外加铁框宝石 (border-image 不带 fill, 渐变透出中心) */
.lr-banner {
  border: 13px solid transparent;
  border-image: url('art/05_pixellab/ui/panel.png') 38 stretch;
  border-radius: 10px;
  padding: 3px 8px;
  image-rendering: pixelated;
}
/* 底部功能按钮: 用按钮九宫格做底 (带 fill = 炭色面), 图标/文字浮于其上 */
.lobby-btn {
  border: 11px solid transparent;
  border-image: url('art/05_pixellab/ui/button.png') 30 fill stretch;
  background: none;
  border-radius: 0;
  backdrop-filter: none;
  image-rendering: pixelated;
}
.lobby-btn:hover { border-color: transparent; }
/* ============================================================= */

/* 通用弹窗面板框: 所有 openModal 弹窗共用九宫格大面板 (带 fill = 炭色面板背景) */
.modal {
  border: 15px solid transparent;
  border-image: url('art/05_pixellab/ui/panel.png') 38 fill stretch;
  background: none;
  border-radius: 0;
  padding: 10px 14px 14px;
}
/* ============================================================= */

/* 顶部资源胶囊 + 系统图标按钮: 复用按钮九宫格(带 fill=炭色面) */
.res {
  border: 7px solid transparent;
  border-image: url('art/05_pixellab/ui/button.png') 30 fill stretch;
  background: none; border-radius: 0; padding: 2px 9px;
}
.topbar-sys .ghost-btn {
  border: 7px solid transparent;
  border-image: url('art/05_pixellab/ui/button.png') 30 fill stretch;
  background: none; border-radius: 0;
  display: flex; align-items: center; justify-content: center; padding: 0;
}
.topbar-sys .dot-wrap { display: flex; align-items: center; justify-content: center; }
/* ============================================================= */

/* 玩家资料胶囊: 同款按钮九宫格 */
.profile-chip {
  border: 7px solid transparent;
  border-image: url('art/05_pixellab/ui/button.png') 30 fill stretch;
  background: none; border-radius: 0;
}
/* ============================================================= */

/* 战斗 HUD: 技能/连携/自动 按钮 + 控制台面板 */
.skill-btn, .combo-btn, .auto-btn {
  border: 9px solid transparent;
  border-image: url('art/05_pixellab/ui/button.png') 30 fill stretch;
  background: none; border-radius: 0;
}
.battle-ctrl {
  border: 14px solid transparent;
  border-image: url('art/05_pixellab/ui/panel.png') 38 fill stretch;
  background: none; border-top: none;
}
/* ============================================================= */

/* ===== 批1 · 按钮层次 (主金 / 次铁 / 三轻) ===== */
.lobby-cta, .lb-cta, .btn.gold {
  border: 13px solid transparent;
  border-image: url('art/05_pixellab/ui/btn_gold.png') 36 fill stretch;
  background: none !important; box-shadow: none; border-radius: 0;
}
.btn {
  border: 10px solid transparent;
  border-image: url('art/05_pixellab/ui/button.png') 30 fill stretch;
  background: none; box-shadow: none; border-radius: 0; color: #fff;
}
.back-btn {
  background: rgba(20,16,26,.72); border: 1px solid rgba(255,196,120,.3);
  border-radius: 4px; box-shadow: none;
}
/* ============================================================= */

/* ===== 批2 · 弹窗标题栏 ===== */
.modal h2 {
  margin: -10px -14px 14px; min-height: 30px; padding: 10px 44px;
  display: flex; align-items: center; justify-content: center;
  background: url('art/05_pixellab/ui/panel_header.png') no-repeat center;
  background-size: 100% 100%;
  text-align: center; font-size: 16px; font-weight: 800;
  color: #ffe6b8; text-shadow: 0 1px 2px rgba(0,0,0,.6);
}
/* ============================================================= */

/* ===== 批3 · 进度条 (PixelLab 真条槽 bar_frame + 发光填充) ===== */
/* 大槽: 连携/pity 用像素条框(九宫格, 保留宝石端帽), 去掉密集刻度 */
.combo-gauge, .gf-pity-bar, .pity-bar {
  height: 22px; border: 7px solid transparent; border-radius: 0;
  border-image: url('art/05_pixellab/ui/bar_frame.png') 10 36 stretch;
  background: #0c0912 !important; box-shadow: inset 0 1px 3px rgba(0,0,0,.9);
  position: relative; overflow: hidden;
}
.combo-gauge .combo-fill {
  border-radius: 0; height: 100%;
  background: linear-gradient(180deg,#e6bcff,#9a5bff 58%,#7233dd) !important;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 0 8px rgba(165,105,255,.75);
}
/* 单位小血条(6px): 像素描边深槽 + 光泽亮填充 (这种微型条用细描边比套厚框更清晰, 厚框缩到 6px 会糊) */
.bar {
  background:#0d0a13 !important; border:1px solid rgba(255,205,140,.45);
  box-shadow: inset 0 1px 2px rgba(0,0,0,.85); height:6px; border-radius:0;
  image-rendering: pixelated;
}
.bar .fill { box-shadow: inset 0 1px 0 rgba(255,255,255,.6), inset 0 -2px 3px rgba(0,0,0,.35); }
.bar .fill.hp { background: linear-gradient(180deg,#c2ffd4,#34d266 48%,#179a47) !important; }
.bar .fill.sp { background: linear-gradient(180deg,#d2efff,#52b2ee 48%,#2b7ec2) !important; }
/* ============================================================= */

/* ===== 像素图标 (替 emoji, 功能/资源) ===== */
.px-ico { width: 30px; height: 30px; image-rendering: pixelated; object-fit: contain; display: block;
  filter: drop-shadow(0 1px 1px rgba(0,0,0,.5)); }
.lb-icon, .ll-ico { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; }
/* 内联 emoji→图标 (全局替换): em 尺寸随容器字号缩放, 模拟 emoji 行为 (格大/行内小) */
.px-ico-in { width: 1.15em; height: 1.15em; image-rendering: pixelated; object-fit: contain;
  vertical-align: -0.18em; display: inline-block; }
/* 角色立绘加载失败 → 换成职业像素图标兜底 */
.char-img.cls-fallback { object-fit: contain; image-rendering: pixelated; padding: 12%; }
/* ============================================================= */

/* 资源胶囊小图标 */
.px-ico-sm { width: 19px; height: 19px; image-rendering: pixelated; object-fit: contain; vertical-align: middle; display: block;
  filter: drop-shadow(0 1px 1px rgba(0,0,0,.5)); }
.res-icon { display: inline-flex; align-items: center; }
.lr-ico .px-ico { width: 30px; height: 30px; }
/* 顶栏系统图标 (公告/邮件/设置/全屏/音效) */
.px-ico-sys { width: 16px; height: 16px; image-rendering: pixelated; object-fit: contain; vertical-align: middle; display: block;
  filter: drop-shadow(0 1px 1px rgba(0,0,0,.5)); }
/* ============================================================= */

/* 元素图标 (替元素 emoji) */
.px-ico-el { width: 16px; height: 16px; image-rendering: pixelated; object-fit: contain; vertical-align: middle; display: inline-block; }
.u-elem .px-ico-el { width: 18px; height: 18px; }
/* ============================================================= */

/* ===== 套装: 标签页 (像素 tab) + 物品格 (凹槽) ===== */
.gacha-tab, .bag-tab, .ac-tab {
  border: 9px solid transparent; border-radius: 0;
  border-image: url('art/05_pixellab/ui/tab_off.png') 26 fill stretch;
  background: none !important; color: var(--text-dim); box-shadow: none;
}
.gacha-tab.active, .bag-tab.on, .ac-tab.on {
  border-image: url('art/05_pixellab/ui/tab_on.png') 26 fill stretch;
  color: #fff; border-color: transparent;
}
.gear-slot, .disp-slot {
  background: radial-gradient(circle at 50% 32%, #221b2e, #0f0b16) !important;
  border: 1px solid rgba(255,200,130,.32) !important; border-radius: 6px;
  box-shadow: inset 0 2px 6px rgba(0,0,0,.75);
}
.gear-slot.empty { border-style: solid !important; }
/* ============================================================= */

/* ===== 套装: 稀有度发光框 (R蓝/SR紫/SSR金) —— 小内联件(选人/装备格)用轻量辉光 ===== */
.border-r3 { border-width:2px !important; border-color: var(--r3) !important; box-shadow: 0 0 8px rgba(108,159,255,.5), inset 0 0 7px rgba(108,159,255,.22); }
.border-r4 { border-width:2px !important; border-color: var(--r4) !important; box-shadow: 0 0 11px rgba(176,107,255,.62), inset 0 0 8px rgba(176,107,255,.28); }
.border-r5 { border-width:2px !important; border-color: var(--r5) !important; box-shadow: 0 0 15px rgba(255,200,80,.8), inset 0 0 10px rgba(255,180,60,.38); }

/* ===== 套装: 稀有度华丽边框 (PixelLab 像素雕花框 · 仅角色大卡) ===== */
/* 角色卡 r2-card / roster-card 套真·像素雕花框, 中空透出底纹; 小内联件不受影响 */
.r2-card.border-r3, .r2-card.border-r4, .r2-card.border-r5,
.roster-card.border-r3, .roster-card.border-r4, .roster-card.border-r5 {
  border-style: solid !important; border-width: 14px !important; border-color: transparent !important;
  border-image-slice: 50; border-image-repeat: stretch;
  border-radius: 0 !important; box-shadow: none !important;
  background-clip: padding-box; padding: 2px;
  image-rendering: pixelated;
}
/* 大立绘卡(hero)用更粗的框 */
.r2-splash.border-r3, .r2-splash.border-r4, .r2-splash.border-r5 {
  border-style: solid !important; border-width: 22px !important; border-color: transparent !important;
  border-image-slice: 50; border-image-repeat: stretch;
  border-radius: 0 !important; box-shadow: none !important;
  image-rendering: pixelated;
  /* 暗底压住角色色(避免立绘 contain 留白透红条); padding-box 防暗底漏到框外角 */
  background: #0a0711 padding-box !important;
}
.r2-card.border-r5, .roster-card.border-r5, .r2-splash.border-r5 { border-image-source: url('art/05_pixellab/ui/frame_ssr.png'); }
.r2-card.border-r4, .roster-card.border-r4, .r2-splash.border-r4 { border-image-source: url('art/05_pixellab/ui/frame_sr.png'); }
.r2-card.border-r3, .roster-card.border-r3, .r2-splash.border-r3 { border-image-source: url('art/05_pixellab/ui/frame_r.png'); }
/* 卡底: 稀有度色中心微辉 (平滑无条纹). background-clip 必须 padding-box —— */
/* 否则 background 简写会把 clip 复位成 border-box, 暗底从像素框圆角宝石的缝隙漏到框外角 */
.r2-card.border-r5, .roster-card.border-r5 {
  background: radial-gradient(circle at 50% 30%, rgba(255,184,74,.16), var(--panel)) padding-box !important; }
.r2-card.border-r4, .roster-card.border-r4 {
  background: radial-gradient(circle at 50% 30%, rgba(176,107,255,.16), var(--panel)) padding-box !important; }
.r2-card.border-r3, .roster-card.border-r3 {
  background: radial-gradient(circle at 50% 30%, rgba(108,159,255,.16), var(--panel)) padding-box !important; }
/* ============================================================= */

/* ===== 套装: 玩家头像圆框 ===== */
.pc-avatar {
  background: url('art/05_pixellab/ui/avatar_frame.png') no-repeat center / 100% 100% !important;
  width: 36px !important; height: 36px !important; border-radius: 0 !important;
  position: relative; overflow: visible; image-rendering: pixelated;
}
.pc-avatar img { position: absolute; inset: 19%; width: 62%; height: 62%; border-radius: 50%; object-fit: cover; image-rendering: auto; }
/* ============================================================= */

/* ===== 套装: 圆形确认钮 (金) ===== */
.act-btn {
  background: radial-gradient(circle at 50% 34%, #ffe9ac, #f1ad3e 55%, #c87a1e) !important;
  border: none !important; color: #3a2400 !important;
  box-shadow: 0 0 0 3px #241a30, 0 0 0 5px rgba(255,200,90,.45), 0 4px 14px rgba(240,160,60,.5) !important;
  text-shadow: 0 1px 0 rgba(255,255,255,.3);
}
.act-btn:active { transform: scale(.94); }
/* ============================================================= */

/* 像素半身像(小框立绘): cover + 顶部对齐, 保证脸不被裁 */
.char-img.char-portrait-px { object-fit: cover; object-position: top center; image-rendering: pixelated; }

/* 编队/阵形: 游戏内 south idle 呼吸精灵 (居中, 像素放大) */
.char-field-sprite { width: 100%; height: 100%; object-fit: contain; object-position: center center; image-rendering: pixelated; display: block; }
.ts-art, .r2-fs-art, .rc-art { display: flex; align-items: center; justify-content: center; }

/* 过场淡黑转场遮罩 (切界面: 淡黑→黑屏渲染并加载→淡入) */
#nav-fade { position: fixed; inset: 0; z-index: 9000; background: #0e0b14; opacity: 0; pointer-events: none; transition: opacity .16s ease; }
#nav-fade.on { opacity: 1; }

/* ============ 剧情演出引擎 v2（Director / SceneStage）============ */
/* 场景演出层 */
#scene-stage { position: fixed; inset: 0; z-index: 950; background: #000; overflow: hidden; }
#scene-stage .sc-world { position: absolute; inset: 0; transform-origin: center; transition: none; }
#scene-stage .story-bg { position: absolute; inset: 0; }
.sc-night { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 30%, rgba(10,14,34,.42) 0%, rgba(4,6,18,.78) 100%); pointer-events: none; }
#sc-actors { position: absolute; inset: 0; }
.sc-actor { position: absolute; width: 0; height: 0; }
.sc-actor img { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); height: 130px; image-rendering: pixelated; }
.sc-bubble { position: absolute; left: 0; top: -148px; transform: translateX(-50%); max-width: 240px; min-width: 60px;
  background: rgba(16,18,28,.92); border: 1px solid #3a3f52; border-radius: 10px; padding: 7px 12px;
  color: #e8e8f0; font-size: 13px; line-height: 1.55; white-space: pre-wrap; z-index: 5; }
.sc-bubble::after { content: ''; position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%);
  border: 6px solid transparent; border-top-color: #3a3f52; border-bottom: 0; }
.sc-bubble.whisper { color: #8f95ad; letter-spacing: 4px; border-color: #262a3a; background: rgba(8,9,16,.94); }
.sc-narr { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 8vw 22px; text-align: center;
  background: linear-gradient(transparent, rgba(0,0,0,.82) 40%); color: #cfd3e0; font-size: 14px; line-height: 1.7; z-index: 8; }
.sc-tap { position: absolute; inset: 0; z-index: 20; cursor: pointer; }

/* ADV 层扩展：CG / 低语 / 选择支 */
#story-cg { position: absolute; inset: 0; overflow: hidden; background: #000; z-index: 2; }
#story-cg img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; image-rendering: auto; }
#story-cg img.kenburns { animation: kenburns 14s ease-in-out infinite alternate; }
@keyframes kenburns { from { transform: scale(1) translate(0, 0); } to { transform: scale(1.12) translate(-2%, -2%); } }
.story-dialogue.whisper .story-text { color: #8f95ad; letter-spacing: 6px; }
#story-choice { position: absolute; left: 50%; bottom: 34%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 10px; z-index: 30; }
.story-choice-btn { min-width: 260px; padding: 12px 26px; font-size: 14px; color: #f0e9d8; cursor: pointer;
  background: linear-gradient(180deg, rgba(40,40,58,.96), rgba(24,24,36,.96)); border: 1px solid #56597a; border-radius: 10px; }
.story-choice-btn:hover { border-color: #c9a961; color: #ffe9b0; }

/* 战中插话 */
#battle-interject { position: absolute; left: 6%; right: 6%; bottom: 118px; z-index: 90; cursor: pointer;
  background: rgba(12,13,22,.94); border: 1px solid #4a4f6a; border-radius: 12px; padding: 12px 18px;
  display: flex; align-items: baseline; gap: 12px; animation: bi-in .25s ease-out; }
@keyframes bi-in { from { opacity: 0; transform: translateY(12px); } }
#battle-interject .bi-name { color: #ffd97a; font-weight: 700; font-size: 13px; white-space: nowrap; }
#battle-interject .bi-text { color: #e8e8f0; font-size: 14px; line-height: 1.6; }
#battle-interject .bi-next { color: #8f95ad; animation: blink 1s infinite; margin-left: auto; }

/* 漫画贴图小人 */
.comic-img-px { image-rendering: pixelated; width: 100%; }

/* 主界面主线按钮 */
.lb-cta-story .cta-go { font-size: 15px; }

/* 场景实景图 + 灯光晕 + 地面影 */
.sc-bgimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
.story-bg.bg-photo { background-size: cover !important; background-position: center; image-rendering: pixelated; }
.sc-glow { position: absolute; left: 0; top: -46px; width: 300px; height: 300px; transform: translate(-50%, -50%);
  background: radial-gradient(circle, rgba(255,196,110,.34) 0%, rgba(255,170,80,.14) 38%, transparent 68%);
  pointer-events: none; mix-blend-mode: screen; animation: lampflicker 2.6s ease-in-out infinite; }
@keyframes lampflicker { 0%,100% { opacity: 1; } 42% { opacity: .84; } 68% { opacity: .95; } 80% { opacity: .78; } }
.sc-shadow { position: absolute; left: 0; top: -3px; width: 46px; height: 12px; transform: translate(-50%, -50%);
  background: radial-gradient(ellipse, rgba(0,0,0,.42) 0%, transparent 70%); pointer-events: none; }

</style>

  <div id="app">

<script>
// ============================================================
//  音频系统（纯 Web Audio 实时合成，无需任何音频素材文件）
//  - BGM：按情境（主菜单 / 战斗 / BOSS / 剧情）程序化生成的循环配乐
//  - SFX：点击、攻击、暴击、治疗、击退、胜利、失败、抽卡等一次性音效
//  - 移动端自动播放策略：首次用户手势时再创建/恢复 AudioContext
//  注意：命名为 Sound，避免覆盖浏览器内置的 window.Audio
// ============================================================

const Sound = {
  ctx: null,
  master: null,
  musicGain: null,
  sfxGain: null,
  noiseBuf: null,
  muted: false,
  mood: null,
  _timer: null,
  _beat: 0,
  _pendingMood: 'home',

  MOODS: {
    home:   { bpm: 96,  chords: [[60,64,67],[57,60,64],[53,57,60],[55,59,62]], wave: 'triangle', bass: false, pad: 0.045, mel: 0.085 },
    battle: { bpm: 130, chords: [[57,60,64],[53,57,60],[60,64,67],[55,59,62]], wave: 'sawtooth', bass: true,  pad: 0.035, mel: 0.075 },
    boss:   { bpm: 82,  chords: [[50,53,57],[46,50,53],[43,46,50],[45,48,52]], wave: 'sawtooth', bass: true,  pad: 0.05,  mel: 0.07  },
    story:  { bpm: 68,  chords: [[60,64,67],[59,62,67],[57,60,64],[53,57,60]], wave: 'sine',     bass: false, pad: 0.05,  mel: 0.05  },
  },

  freq(m) { return 440 * Math.pow(2, (m - 69) / 12); },

  /** 在首次用户手势中创建 / 恢复音频上下文 */
  ensure() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      try { this.ctx = new AC(); } catch (e) { return false; }
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.9;
      this.master.connect(this.ctx.destination);
      this.musicGain = this.ctx.createGain(); this.musicGain.gain.value = 0.6; this.musicGain.connect(this.master);
      this.sfxGain = this.ctx.createGain(); this.sfxGain.gain.value = 1.0; this.sfxGain.connect(this.master);
      // 白噪声缓冲（攻击/受击用）
      const len = Math.floor(this.ctx.sampleRate * 0.3);
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return true;
  },

  setMuted(m) {
    this.muted = m;
    try { localStorage.setItem('bd2_muted', m ? '1' : '0'); } catch (e) {}
    if (this.master) this.master.gain.value = m ? 0 : 0.9;
    const btn = document.getElementById('btn-mute');
    if (btn) btn.textContent = m ? '🔇' : '🔊';
  },
  toggleMute() { this.ensure(); this.setMuted(!this.muted); if (!this.muted && !this.mood) this.bgm(this._pendingMood); },

  // ---------- 单个音符 ----------
  note(freq, t, dur, type, gain, target) {
    const ctx = this.ctx;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type || 'triangle';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(target || this.sfxGain);
    o.start(t); o.stop(t + dur + 0.04);
  },

  noiseBurst(t, dur, cutoff, gain) {
    const ctx = this.ctx;
    const src = ctx.createBufferSource(); src.buffer = this.noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
    const g = ctx.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(this.sfxGain);
    src.start(t); src.stop(t + dur + 0.02);
  },

  // ---------- 一次性音效 ----------
  sfx(name) {
    if (this.muted || !this.ensure()) return;
    const ctx = this.ctx, t = ctx.currentTime, F = this.freq.bind(this);
    switch (name) {
      case 'tap':
        this.note(880, t, 0.06, 'triangle', 0.05); break;
      case 'hit':
        this.noiseBurst(t, 0.12, 1800, 0.18); this.note(160, t, 0.12, 'sine', 0.12); break;
      case 'crit':
        this.noiseBurst(t, 0.16, 3000, 0.22);
        this.note(F(84), t, 0.1, 'square', 0.10); this.note(F(88), t + 0.05, 0.12, 'square', 0.10); break;
      case 'skill':
        this.note(300, t, 0.18, 'sawtooth', 0.07);
        this.note(600, t + 0.04, 0.16, 'sawtooth', 0.06); break;
      case 'heal':
        [60, 64, 67, 72].forEach((m, i) => this.note(F(m), t + i * 0.05, 0.25, 'sine', 0.09)); break;
      case 'knock':
        { const o = ctx.createOscillator(), g = ctx.createGain();
          o.type = 'sine'; o.frequency.setValueAtTime(620, t); o.frequency.exponentialRampToValueAtTime(180, t + 0.22);
          g.gain.setValueAtTime(0.14, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
          o.connect(g).connect(this.sfxGain); o.start(t); o.stop(t + 0.26); } break;
      case 'status':
        this.note(F(70), t, 0.14, 'square', 0.06); this.note(F(66), t + 0.06, 0.16, 'square', 0.06); break;
      case 'enrage':
        { const o = ctx.createOscillator(), g = ctx.createGain();
          o.type = 'sawtooth'; o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(70, t + 0.5);
          g.gain.setValueAtTime(0.16, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
          o.connect(g).connect(this.sfxGain); o.start(t); o.stop(t + 0.6); } break;
      case 'victory':
        [60, 64, 67, 72].forEach((m, i) => this.note(F(m), t + i * 0.12, 0.4, 'triangle', 0.14)); break;
      case 'defeat':
        [57, 53, 48].forEach((m, i) => this.note(F(m), t + i * 0.18, 0.5, 'sine', 0.12)); break;
      case 'levelup':
        [60, 67, 72].forEach((m, i) => this.note(F(m), t + i * 0.07, 0.3, 'triangle', 0.11)); break;
      case 'pull':
        [72, 76, 79].forEach((m, i) => this.note(F(m), t + i * 0.05, 0.2, 'triangle', 0.10)); break;
      case 'pull5':
        [60, 64, 67, 72, 76, 79, 84].forEach((m, i) => this.note(F(m), t + i * 0.06, 0.5, 'triangle', 0.13));
        this.noiseBurst(t, 0.3, 6000, 0.06); break;
      case 'open':
        this.note(F(67), t, 0.12, 'triangle', 0.08); this.note(F(72), t + 0.06, 0.18, 'triangle', 0.08); break;
    }
  },

  // ---------- 循环 BGM ----------
  bgm(mood) {
    if (mood === this.mood) return;
    this.mood = mood;
    this._pendingMood = mood;
    if (this.muted || !this.ensure()) return;
    this._startLoop();
  },

  stopBgm() { if (this._timer) { clearInterval(this._timer); this._timer = null; } this.mood = null; },

  _startLoop() {
    if (this._timer) clearInterval(this._timer);
    const cfg = this.MOODS[this.mood] || this.MOODS.home;
    const beatSec = 60 / cfg.bpm;
    this._beat = 0;
    const tick = () => {
      if (this.muted || !this.ctx) return;
      const t = this.ctx.currentTime + 0.04;
      const chord = cfg.chords[Math.floor(this._beat / 4) % cfg.chords.length];
      // 每 4 拍换一个和弦垫底
      if (this._beat % 4 === 0) {
        chord.forEach(m => this.note(this.freq(m), t, beatSec * 4 * 0.95, cfg.wave === 'sawtooth' ? 'triangle' : cfg.wave, cfg.pad, this.musicGain));
      }
      // 旋律（高八度琶音）
      const mel = chord[(this._beat * 2) % chord.length] + 12;
      this.note(this.freq(mel), t, beatSec * 0.85, cfg.wave, cfg.mel, this.musicGain);
      // 贝斯脉冲
      if (cfg.bass) this.note(this.freq(chord[0] - 12), t, beatSec * 0.5, 'sine', 0.06, this.musicGain);
      this._beat++;
    };
    tick();
    this._timer = setInterval(tick, beatSec * 1000);
  },
};

// 首次手势解锁音频 + 启动 BGM
(function () {
  try { Sound.muted = localStorage.getItem('bd2_muted') === '1'; } catch (e) {}
  const unlock = () => {
    if (!Sound.ensure()) return;
    if (!Sound.muted && !Sound.mood) Sound.bgm(Sound._pendingMood);
    document.removeEventListener('pointerdown', unlock);
    document.removeEventListener('click', unlock);
  };
  document.addEventListener('pointerdown', unlock);
  document.addEventListener('click', unlock);
  // 全局点击轻音（按钮 / 卡片）
  document.addEventListener('click', (e) => {
    if (e.target.closest('button, .btn, .nav-btn, .roster-card, .chapter-card, .trial-card, .gacha-tab, .comic-entry-card, .gear-slot, .gear-pick-item, .team-slot')) {
      Sound.sfx('tap');
    }
  });
  // 静音按钮
  document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('btn-mute');
    if (btn) {
      btn.textContent = Sound.muted ? '🔇' : '🔊';
      btn.onclick = (e) => { e.stopPropagation(); Sound.toggleMute(); };
    }
  });
})();

window.Sound = Sound;

// ============================================================
//  数值平衡模型（全局）—— 技能威力由「SP + 目标范围 + 附带效果」算出
//  目的：所有技能落在同一性价比曲线上；新技能只填规格，威力自动求解，不会数值崩盘。
//  已按现有技能校准（套用后基本不改变当前手感）。
//  浏览器：window.Balance     Node：module.exports
// ============================================================
(function (global) {
  'use strict';
  const Balance = {
    // —— 可调常数（改这里即全局微调）——
    BASE: 0.85,        // 普攻威力（基准）
    SP_VALUE: 0.60,    // 每点 SP 的价值
    TF: { enemySingle: 1.0, enemyRow: 1.75, enemyAll: 2.1, allySingle: 1.0, allyAll: 2.1, self: 1.0 },
    HEAL_F: 0.85, SHIELD_F: 0.90, BUFF_F: 1.10,
    // 附带效果价值（换算成「威力」单位）
    DOT_F: 0.55,       // 灼烧/中毒：每跳威力 × 回合 × 此系数
    STUN_V: 0.80,      // 眩晕：每回合
    SILENCE_V: 0.30,   // 沉默：每回合
    DEBUFF_F: 1.20,    // 破防：破防量 × 此系数
    KNOCKBACK_V: 0.20, // 击退（每个目标）
    PIERCE_V: 0.15,    // 穿透（一次性）
    TAUNT_V: 0.60,     // 嘲讽

    budget(sp) { return this.BASE + this.SP_VALUE * (sp || 0); },
    tf(t) { return this.TF[t] || 1; },
    // 随目标数放大的效果（每个目标都吃到）
    _modPerTarget(s) {
      let v = 0;
      if (s.inflict) {
        const i = s.inflict;
        if (i.type === 'burn' || i.type === 'poison') v += (i.power || 0.45) * (i.turns || 1) * this.DOT_F;
        else if (i.type === 'stun') v += this.STUN_V * (i.turns || 1);
        else if (i.type === 'silence') v += this.SILENCE_V * (i.turns || 1);
      }
      if (s.extra && s.extra.type === 'debuffDef') v += (s.extra.power || 0) * this.DEBUFF_F;
      if (s.knockback) v += this.KNOCKBACK_V;
      return v;
    },
    _modFlat(s) { return s.pierce ? this.PIERCE_V : 0; },
    // 技能的实际「价值」（威力单位）
    value(s) {
      const tf = this.tf(s.target);
      if (s.effect === 'heal') return s.power * tf * this.HEAL_F;
      if (s.effect === 'shield') return s.power * tf * this.SHIELD_F + ((s.extra && s.extra.type === 'taunt') ? this.TAUNT_V : 0);
      if (s.effect === 'buffAtk' || s.effect === 'buffDef') return s.power * (s.duration || 1) * tf * this.BUFF_F;
      return (s.power + this._modPerTarget(s)) * tf + this._modFlat(s);
    },
    // 给定规格（不含 power），反解出应有的 power，使其正好落在预算线上
    idealPower(spec) {
      const tf = this.tf(spec.target), b = this.budget(spec.sp);
      let p;
      if (spec.effect === 'heal') p = b / (tf * this.HEAL_F);
      else if (spec.effect === 'shield') p = (b - ((spec.extra && spec.extra.type === 'taunt') ? this.TAUNT_V : 0)) / (tf * this.SHIELD_F);
      else if (spec.effect === 'buffAtk' || spec.effect === 'buffDef') p = b / ((spec.duration || 1) * tf * this.BUFF_F);
      else p = (b - this._modFlat(spec)) / tf - this._modPerTarget(spec);
      return Math.max(0.3, Math.round(p * 100) / 100);
    },
    // 平衡分：1.0 = 正好在线上；偏离 ±0.18 以内视为达标
    score(s) { return this.value(s) / this.budget(s.sp || 0); },
    // 用 idealPower 填好 power 后返回完整技能对象
    make(spec) { return Object.assign({}, spec, { power: this.idealPower(spec) }); },
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = Balance;
  else global.Balance = Balance;
})(typeof window !== 'undefined' ? window : globalThis);


// ============================================================
//  数值预算模型（角色/服装/敌人/装备）—— 与 balance.js（技能）配套
//  目的：任何「带数值」的新内容都有可校验的预算上限，新增角色/服装/装备
//        不会偷偷数值膨胀压过老内容（power creep），未来不必推翻重来。
//
//  核心思想（双轴预算）：
//   · O 进攻值 = atk × (1 + 0.6×crit) × 速度轻加权     —— 单位输出能力
//   · S 生存值 = hp × (1 + def/100)  （等效血量 EHP）   —— 单位扛伤能力
//   单一标量无法跨职业比较（坦克 EHP 极高、奶妈价值在技能），所以用「双轴 +
//   按 稀有度×职业 归一」：每个单位的 O/O_ref + S/S_ref ≈ 2.0（各轴 1.0）。
//   服装可在两轴间「换形」（牺牲防御换攻击），但两轴之和被预算封顶 → 不会既肉又秒。
//
//  浏览器：window.Budget    Node：module.exports
// ============================================================
(function (global) {
  'use strict';

  // —— 5★ 各职业 Lv60 参考属性（设计锚点，由现役角色校准）——
  const CLASS_REF60 = {
    mage:     { hp: 5400, atk: 1110, def: 355, spd: 95,  crit: 0.20 },
    archer:   { hp: 5740, atk: 1250, def: 360, spd: 118, crit: 0.28 },
    warrior:  { hp: 7800, atk: 1180, def: 560, spd: 115, crit: 0.20 },
    defender: { hp: 10200, atk: 640, def: 880, spd: 69,  crit: 0.09 },
    healer:   { hp: 6700, atk: 840,  def: 425, spd: 101, crit: 0.10 },
  };
  // 稀有度缩放：进攻随稀有度拉开，生存较平缓（低星也得能站场）
  const O_MULT = { 3: 0.72, 4: 0.86, 5: 1.00 };
  const S_MULT = { 3: 0.90, 4: 0.95, 5: 1.00 };

  // 校验阈值
  const BUDGET_LO = 1.65, BUDGET_HI = 2.25;   // 双轴预算之和（≈2.0 为标准）
  const AXIS_CAP = 1.70;                       // 单轴上限（不许把全部预算堆一轴）
  const AXIS_FLOOR = 0.45;                      // 单轴下限（不许某轴趋零的畸形数值）

  const Budget = {
    CLASS_REF60, O_MULT, S_MULT, BUDGET_LO, BUDGET_HI, AXIS_CAP, AXIS_FLOOR,

    O(s) { return s.atk * (1 + 0.6 * (s.crit || 0)) * (0.85 + 0.15 * (s.spd || 100) / 100); },
    S(s) { return s.hp * (1 + (s.def || 0) / 100); },
    atLevel(base, grow, lv) {
      grow = grow || {};
      return { hp: base.hp + (grow.hp || 0) * (lv - 1), atk: base.atk + (grow.atk || 0) * (lv - 1),
               def: base.def + (grow.def || 0) * (lv - 1), spd: base.spd, crit: base.crit };
    },

    // 某 职业×稀有度 的参考 O/S
    refOS(cls, rarity) {
      const r = CLASS_REF60[cls]; if (!r) return null;
      return { O: this.O(r) * (O_MULT[rarity] || 1), S: this.S(r) * (S_MULT[rarity] || 1) };
    },

    // 评估一个 Lv60 属性块的预算占用
    evalStats60(stats60, cls, rarity) {
      const ref = this.refOS(cls, rarity);
      if (!ref) return { ok: false, reason: '未知职业 ' + cls };
      const o = this.O(stats60) / ref.O, s = this.S(stats60) / ref.S;
      const sum = o + s;
      const ok = sum >= BUDGET_LO && sum <= BUDGET_HI &&
                 o <= AXIS_CAP && s <= AXIS_CAP && o >= AXIS_FLOOR && s >= AXIS_FLOOR;
      return { ok, oRatio: o, sRatio: s, sum,
               reason: ok ? '' :
                 (sum > BUDGET_HI ? `总预算超标 ${sum.toFixed(2)}>${BUDGET_HI}（数值膨胀）` :
                  sum < BUDGET_LO ? `总预算不足 ${sum.toFixed(2)}<${BUDGET_LO}（过弱）` :
                  o > AXIS_CAP ? `进攻轴超标 O=${o.toFixed(2)}>${AXIS_CAP}` :
                  s > AXIS_CAP ? `生存轴超标 S=${s.toFixed(2)}>${AXIS_CAP}` :
                  o < AXIS_FLOOR ? `进攻轴过低 O=${o.toFixed(2)}` :
                  `生存轴过低 S=${s.toFixed(2)}`) };
    },

    // 评估服装（含初始服装）：基于其 Lv60 属性
    evalCostume(cos) {
      const s60 = this.atLevel(cos.stats, cos.grow, 60);
      return this.evalStats60(s60, cos.cls, cos.rarity);
    },

    // —— 作者助手：按 稀有度×职业 生成「正好在线」的 base/grow ——
    // 返回 { base:{hp,atk,def,spd,crit}, grow:{hp,atk,def} }，预算 sum≈2.0。
    // shape 可选：在保持总预算不变的前提下微调形态 {atk:1.1,def:0.9,...}（换形）。
    makeCharStats(rarity, cls, shape) {
      const r = CLASS_REF60[cls]; if (!r) throw new Error('未知职业 ' + cls);
      shape = shape || {};
      const om = O_MULT[rarity] || 1, sm = S_MULT[rarity] || 1;
      const t60 = {
        hp:  Math.round(r.hp  * sm * (shape.hp  || 1)),
        atk: Math.round(r.atk * om * (shape.atk || 1)),
        def: Math.round(r.def * sm * (shape.def || 1)),
        spd: r.spd, crit: r.crit,
      };
      const bf = 0.15; // 1 级占满级 15%，其余靠成长
      const mk = v => Math.round(v * bf);
      const gr = (v) => Math.round((v - mk(v)) / 59 * 100) / 100;
      return {
        base: { hp: mk(t60.hp), atk: mk(t60.atk), def: mk(t60.def), spd: t60.spd, crit: t60.crit },
        grow: { hp: gr(t60.hp), atk: gr(t60.atk), def: gr(t60.def) },
      };
    },

    // —— 装备预算：单件 power 值不得超过同稀有度上限 ——
    // 把各属性折算成统一「装备分」：atk=1，def=1.2，hp=1/8，crit=800，spd=2
    GEAR_CAP: { 3: 170, 4: 230, 5: 320 },   // 模板分上限（强化前；按现役 EX/通用最强件校准 +30% 余量）
    gearScore(stats) {
      const s = stats || {};
      return (s.atk || 0) + (s.def || 0) * 1.2 + (s.hp || 0) / 8 + (s.crit || 0) * 800 + (s.spd || 0) * 2;
    },
    evalGear(tpl) {
      const sc = this.gearScore(tpl.stats);
      const cap = this.GEAR_CAP[tpl.rarity] || 1e9;
      return { ok: sc <= cap, score: Math.round(sc), cap, reason: sc <= cap ? '' : `装备分 ${Math.round(sc)}>${cap}` };
    },

    // —— 敌人理智带：非 BOSS / BOSS 各有 O、S 上限，防止小怪带 BOSS 数值 ——
    ENEMY_CAP: { normal: { O: 340, S: 5200 }, boss: { O: 720, S: 14000 } },
    evalEnemy(e) {
      const cap = e.isBoss ? this.ENEMY_CAP.boss : this.ENEMY_CAP.normal;
      const o = this.O(e.base), s = this.S(e.base);
      const ok = o <= cap.O && s <= cap.S;
      return { ok, O: Math.round(o), S: Math.round(s), cap,
               reason: ok ? '' : (o > cap.O ? `进攻 O=${Math.round(o)}>${cap.O}` : `生存 S=${Math.round(s)}>${cap.S}`) };
    },
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = Budget;
  else global.Budget = Budget;
})(typeof window !== 'undefined' ? window : globalThis);

// ---------- 专属武器（每角色一件，稀有度跟随角色，按职业定制） ----------
// 5★ 满值；4★/3★ 按稀有度缩放，避免低星角色拿到与 5★ 等强的专属武器（数值越界）。
const EX_RARITY_MUL = { 5: 1.0, 4: 0.7, 3: 0.5 };
function exStatsByClass(cls, rarity) {
  const m = EX_RARITY_MUL[rarity] || 1.0;
  const sc = (s) => {
    const out = {};
    for (const k in s) out[k] = (k === 'crit') ? Math.round(s[k] * m * 1000) / 1000 : Math.round(s[k] * m);
    return out;
  };
  switch (cls) {
    case 'warrior':  return sc({ atk: 160, hp: 320, crit: 0.06 });
    case 'archer':   return sc({ atk: 175, crit: 0.14 });
    case 'mage':     return sc({ atk: 170, hp: 160 });
    case 'defender': return sc({ def: 95, hp: 950 });
    case 'healer':   return sc({ atk: 125, hp: 520 });
    default:         return sc({ atk: 100, hp: 200 });

const SAVE_KEY = 'bd2_save_v1';

const Game = {
  state: null,

  /** 初始化：读取存档或创建新存档 */
  init() {
    const saved = localStorage.getItem(SAVE_KEY);
    if (saved) {
      try {
        this.state = JSON.parse(saved);
      } catch (e) {
        console.warn('存档损坏，重置', e);
        this.state = this.newGame();
      }
    } else {
      this.state = this.newGame();
    }
    // 存档版本迁移：补齐新增字段，保证老存档不报错
    if (!this.state.seenStory) this.state.seenStory = [];
    if (!this.state.inventory) this.state.inventory = [];
    if (!this.state._gearSeq) this.state._gearSeq = 1;
    // 装备深化迁移：旧装备补强化等级与副词条
    this.state.inventory.forEach(g => {
      if (g.lvl == null) g.lvl = 0;
      if (!g.subs) { const tpl = this.getGearTpl(g.tpl); g.subs = tpl ? this.rollSubs(tpl.rarity) : []; }
    });
    if (!this.state.worldFlags) this.state.worldFlags = {};
    if (!this.state.chapterProgress) this.state.chapterProgress = {};
    if (this.state.spark == null) this.state.spark = 0;
    if (this.state.powder == null) this.state.powder = 0;
    if (this.state.firstTen == null) this.state.firstTen = false;
    if (this.state.trialMax == null) this.state.trialMax = 0;
    if (this.state.abyssMax == null) this.state.abyssMax = 0;
    if (!this.state.stats) this.state.stats = { pulls: 0, wins: 0 };
    if (!this.state.achClaimed) this.state.achClaimed = {};
    if (this.state.achExp == null) this.state.achExp = 0;
    if (!this.state.achLvClaimed) this.state.achLvClaimed = {};
    if (!this.state.title) this.state.title = 'commander';
    if (!this.state.titlesOwned) this.state.titlesOwned = [];
    if (!this.state.daily) this.state.daily = { lastClaim: null, streak: 0 };
    if (!this.state.quests) this.state.quests = { date: null, progress: { win: 0, pull: 0, levelup: 0 }, claimed: {} };
    if (!this.state.shop) this.state.shop = { date: null, slots: [], bought: {} };
    if (!this.state.shop2) this.state.shop2 = { bought: {} };
    if (!this.state.mayhem) this.state.mayhem = { best: 0 };
    if (!this.state.restaurant) this.state.restaurant = { staff: [null, null, null], ts: Date.now(), level: 1 };
    if (this.state.stamina == null) { this.state.stamina = 120; this.state.staminaTs = Date.now(); }
    if (!this.state.dispatch) this.state.dispatch = { slots: [null, null, null] };
    if (this.state.awakenStone == null) this.state.awakenStone = 0;
    if (!this.state.event) this.state.event = { date: null, runs: {}, coin: 0, stock: {} };
    if (this.state.goldSpent == null) this.state.goldSpent = 0;
    if (this.state.enhanceCount == null) this.state.enhanceCount = 0;
    if (!this.state.actClaimed) this.state.actClaimed = {};
    if (!this.state.actDraw) this.state.actDraw = { tickets: 3, drawn: 0 };
    if (!this.state.actBingo) this.state.actBingo = { revealed: [], clears: 0 };
    if (!this.state.actLogin) this.state.actLogin = {};
    this.state.roster.forEach(o => { if (o.aff == null) o.aff = 0; if (o.awaken == null) o.awaken = 0; });
    this.state.roster.forEach(o => {
      if (!o.equip) o.equip = { weapon: null, armor: null, accessory: null, ex: null };
      if (o.plus == null) o.plus = 0;
      // 服装：补齐 + 把老的 'base' 规范化为 'base_<charId>'
      if (!o.costumes || !o.costumes.length) o.costumes = ['base_' + o.charId];
      o.costumes = o.costumes.map(c => (c === 'base' ? 'base_' + o.charId : c));
      if (!o.activeCostume || o.activeCostume === 'base') o.activeCostume = 'base_' + o.charId;
      // 双服装机制演示：默认补齐该角色全部服装（之后改成卡池获取时移除这段）
      const CS = window.GameData.COSTUMES || {};
      Object.keys(CS).forEach(cid => {
        if (CS[cid].charId === o.charId && !o.costumes.includes(cid)) o.costumes.push(cid);
      });
    });
    // 升星迁移：把同名角色的重复实例合并为突破等级
    this._mergeDuplicates();
    // 修复历史存档的 uid 冲突，并据此重建出战队伍（修复「佣兵有角色但出战不显示」）
    this._repairIds();
    // 初始化当日任务/商店
    this.ensureDaily();
    this.ensureTasks();
    // 预览模式（game.html?demo）：把已完成美术的角色直接塞进佣兵 + 出战队伍，
    // 方便在游戏里直接看 idle / 施法 / 技能 VFX（仅本次进入生效，不主动落盘）。
    try {
      if (typeof location !== 'undefined' && /[?&]demo\b/.test(location.search)) {
        const want = ['seir', 'lecliss', 'justia'];
        want.forEach(cid => {
          if (window.GameData && window.GameData.CHARACTERS[cid] && !this.state.roster.some(o => o.charId === cid))
            this.state.roster.push(this.makeOwned(cid, 40));
        });
        this.state.team = want
          .map(cid => { const o = this.state.roster.find(x => x.charId === cid); return o ? o.uid : null; })
          .filter(Boolean);
      }
    } catch (e) {}
    return this.state;
  },

  /** 合并 roster 中同 charId 的重复实例：保留最高等级，每个多余实例 +1 突破 */
  _mergeDuplicates() {
    const orig = this.state.roster;
    const cidByUid = {};
    orig.forEach(o => { cidByUid[o.uid] = o.charId; });
    const merged = {};
    orig.forEach(o => {
      const ex = merged[o.charId];
      if (!ex) {
        merged[o.charId] = o;
      } else {
        ex.level = Math.max(ex.level, o.level);
        ex.plus = Math.min(5, (ex.plus || 0) + 1);
      }
    });
    this.state.roster = Object.values(merged);
    // 重映射队伍 uid（被合并掉的实例 → 幸存实例）
    this.state.team = [...new Set((this.state.team || []).map(uid => {
      const cid = cidByUid[uid];
      const s = this.state.roster.find(o => o.charId === cid);
      return s ? s.uid : null;
    }).filter(Boolean))];
  },

  /**
   * 修复 uid 冲突：历史存档中（尤其重置存档后）可能出现两个角色共用同一 uid，
   * 导致其中一个被当成「已出战」而在编队界面消失。这里：
   *  1) 先按 charId 记录队伍意图；2) 给所有重复/缺失 uid 的实例重新分配唯一 uid；
   *  3) 再按 charId 重建出战队伍（去重、限 5 人），保证 roster 与 team 始终一致。
   */
  _repairIds() {
    const roster = this.state.roster || [];
    // 1) 队伍意图：按当前 uid 解析出 charId（去重、保序）
    const teamCids = [];
    (this.state.team || []).forEach(uid => {
      const o = roster.find(x => x.uid === uid);
      if (o && !teamCids.includes(o.charId)) teamCids.push(o.charId);
    });
    // 2) 唯一化 uid
    const used = new Set();
    let seq = this.state._uidSeq || 1;
    const nextUid = () => { let u; do { u = 'u' + (seq++); } while (used.has(u) || roster.some(o => o.uid === u)); return u; };
    roster.forEach(o => {
      if (!o.uid || used.has(o.uid)) o.uid = nextUid();
      used.add(o.uid);
    });
    this.state._uidSeq = seq;
    // 3) 按 charId 重建队伍（roster 已按 charId 去重，charId→uid 唯一）
    this.state.team = teamCids
      .map(cid => { const o = roster.find(x => x.charId === cid); return o ? o.uid : null; })
      .filter(Boolean)
      .slice(0, 5);
  },

  /** 新游戏的初始状态 */
  newGame() {
    return {
      gold: 1000,
      gem: 2000,
      // 已拥有角色：{ uid, charId, level, exp, star }
      roster: [
        this.makeOwned('teried', 1),
        this.makeOwned('mina', 1),
      ],
      // 出战队伍（uid 列表，最多 4 人）
      team: [],
      // 已通关关卡 id
      cleared: [],
      // 已观看的剧情 id
      seenStory: [],
      // 装备背包（gear 实例：{ iid, tpl }）
      inventory: [],
      // 探索地图的一次性标记（宝箱等）
      worldFlags: {},
      // 章节推进进度：{ chapterId: 已完成步数 }
      chapterProgress: {},
      // 抽卡保底计数（距上次 5★）
      pity: 0,
      firstTen: false, // 首次十连保底（必出 5★）是否已用
      trialMax: 0,     // 试炼之塔已通关的最高层数（用于解锁下一层）
      abyssMax: 0,     // 深渊已通关的最高层数
      stats: { pulls: 0, wins: 0 }, // 终身统计（成就用）
      achClaimed: {},  // 已领取的成就 id
      achExp: 0,       // 成就经验值（→ 成就等级）
      achLvClaimed: {},// 已领取的成就等级奖励
      title: 'commander', // 当前装备称号
      titlesOwned: [], // 已获得称号
      // 保底货币
      spark: 0,    // 闪耀之星：每抽 +1，200 兑换自选服装
      powder: 0,   // 希望之粉：每抽 +10，商店兑换必出 5★
      // 运营系统
      daily: { lastClaim: null, streak: 0 },
      quests: { date: null, progress: { win: 0, pull: 0, levelup: 0 }, claimed: {} },
      shop: { date: null, slots: [], bought: {} },
      stamina: 120, staminaTs: Date.now(),     // 体力（资源副本消耗，随时间回复）
      awakenStone: 0,                          // 觉醒石（角色觉醒消耗）
      dispatch: { slots: [null, null, null] }, // 远征派遣槽（离线挂机）
      event: { date: null, runs: {}, coin: 0, stock: {} },  // 限时活动（活动本+活动商店）
      _uidSeq: 1,
      _gearSeq: 1,
    };
  },

  /** 生成全局唯一的 uid（扫描现有 roster，杜绝冲突） */
  freshUid() {
    const roster = (this.state && this.state.roster) || [];
    let seq = (this.state && this.state._uidSeq) || 1;
    let uid;
    do { uid = 'u' + (seq++); } while (roster.some(o => o.uid === uid));
    if (this.state) this.state._uidSeq = seq;
    return uid;
  },

  /** 生成一个已拥有角色实例 */
  makeOwned(charId, level = 1) {
    const uid = this.freshUid();
    const D = window.GameData;
    // 机制演示：默认拥有该角色全部服装（初始 + 额外）；之后改成卡池获取时收回
    const costumes = ['base_' + charId];
    Object.keys(D.COSTUMES || {}).forEach(cid => {
      if (D.COSTUMES[cid].charId === charId && !costumes.includes(cid)) costumes.push(cid);
    });
    return {
      uid, charId, level, exp: 0,
      star: D.CHARACTERS[charId].rarity,
      plus: 0, // 突破等级 0~5
      costumes,                          // 拥有的服装 id 列表
      activeCostume: 'base_' + charId,   // 当前装扮（决定属性/外观）
      equip: { weapon: null, armor: null, accessory: null, ex: null },
    };
  },


  save() {
    localStorage.setItem(SAVE_KEY, JSON.stringify(this.state));
  },

  reset() {
    localStorage.removeItem(SAVE_KEY);
    this.state = this.newGame();
    // 默认把初始两名角色编入队伍
    this.state.team = this.state.roster.map(o => o.uid);
    this.save();
  },

  /** 导出存档为可分享的字符串（清缓存/换设备的兜底） */
  exportSave() {
    try {
      const json = JSON.stringify(this.state);
      // 用 encodeURIComponent 兼容中文，再 base64
      return 'BD2' + btoa(unescape(encodeURIComponent(json)));
    } catch (e) { return null; }
  },

  /** 导入存档字符串；成功则替换当前存档并跑迁移 */
  importSave(code) {
    if (!code || typeof code !== 'string') return { ok: false, msg: '存档码为空' };
    code = code.trim();
    if (code.startsWith('BD2')) code = code.slice(3);
    let data;
    try {
      data = JSON.parse(decodeURIComponent(escape(atob(code))));
    } catch (e) { return { ok: false, msg: '存档码无效或已损坏' }; }
    if (!data || !Array.isArray(data.roster)) return { ok: false, msg: '不是有效的存档' };
    this.state = data;
    this.save();   // 先落盘，避免 init() 从 localStorage 读回旧档
    this.init();   // 跑迁移（补字段、修 uid、装备词条等）
    this.save();
    return { ok: true };
  },

  // ---------- 角色数值计算 ----------

  // ---------- 服装（BD2 模型：服装=收集单位，自带属性+招式）----------

  /** 规范化服装 id（兼容老存档 'base'） */
  normCostumeId(charId, id) {
    if (!id || id === 'base') return 'base_' + charId;
    return id;
  },

  /** 取某服装定义 */
  costumeDef(charId, costumeId) {
    const id = this.normCostumeId(charId, costumeId);
    return window.GameData.COSTUMES[id] || window.GameData.COSTUMES['base_' + charId];
  },

  /** 当前装扮定义（决定属性/外观） */
  activeCostumeDef(owned) {
    return this.costumeDef(owned.charId, owned.activeCostume);
  },
  activeElement(owned) { return this.activeCostumeDef(owned).element; },
  activeColor(owned) { return this.activeCostumeDef(owned).color; },

  /** 拥有的服装 id 列表（规范化、去重） */
  ownedCostumeIds(owned) {
    const out = [];
    (owned.costumes || []).forEach(cid => {
      const id = this.normCostumeId(owned.charId, cid);
      if (!out.includes(id)) out.push(id);
    });
    if (!out.length) out.push('base_' + owned.charId);
    return out;
  },

  /** 战斗技能池：普通攻击 + 各拥有服装的专属招式（去重） */
  battleSkills(owned) {
    // 出战服装制（BD2）：普攻 + **当前出战服装**的 2 个专属技能（换套即换整套 kit）。
    // 要用别套的技能须把那套设为出战服装 —— 出战服装同时决定外观/属性/元素/技能。
    const cos = this.activeCostumeDef(owned);
    const skills = ['basic_attack'];
    ((cos && cos.skills) || (cos && cos.signature && [cos.signature]) || []).forEach(s => { if (s && !skills.includes(s)) skills.push(s); });
    return skills;
  },

  /** 战斗「换装轮转」用：拥有的服装环，当前出战服装排第一（战斗中用完本套 2 技即轮转到下一套）。
   *  每项 = { id, skills:[2], element, color, signature, sigPlus }。只 1 套时不轮转。 */
  costumeRing(owned) {
    const D = window.GameData;
    const active = this.normCostumeId(owned.charId, owned.activeCostume);
    const ids = this.ownedCostumeIds(owned);
    const ordered = [active, ...ids.filter(i => i !== active)];
    return ordered.map(id => {
      const c = D.COSTUMES[id]; if (!c) return null;
      const skills = (c.skills && c.skills.length ? c.skills : (c.signature ? [c.signature] : [])).slice();
      return { id, skills, element: c.element, color: c.color, signature: c.signature, sigPlus: owned.plus || 0 };
    }).filter(Boolean);
  },

  /** 某技能属于该角色的哪套服装（用于战斗里放技时切换形象/元素） */
  costumeOfSkill(owned, skillId) {
    const D = window.GameData;
    const ids = this.ownedCostumeIds(owned);
    for (const cid of ids) {
      const c = D.COSTUMES[cid];
      if (c && (c.skills || [c.signature]).includes(skillId)) return cid;
    }
    return owned.activeCostume;
  },

  switchCostume(uid, costumeId) {
    const o = this.getOwned(uid);
    if (!o) return { ok: false };
    const id = this.normCostumeId(o.charId, costumeId);
    if (!this.ownedCostumeIds(o).includes(id)) return { ok: false, msg: '尚未拥有该服装' };
    o.activeCostume = id;
    this.save();
    return { ok: true };
  },

  /** 突破属性倍率：每级 +8% */
  plusMult(owned) {
    return 1 + (owned.plus || 0) * 0.08;
  },

  /** 好感等级（0~10，每 100 好感 1 级）+ 觉醒倍率 */
  affLevel(owned) { return Math.min(10, Math.floor((owned.aff || 0) / 100)); },
  affMult(owned) { return 1 + this.affLevel(owned) * 0.01; },     // 好感：+1%/级 攻击与生命
  awakenMult(owned) { return 1 + (owned.awaken || 0) * 0.06; },   // 觉醒：+6%/级 全属性

  /** 根据「当前服装属性」+ 等级 + 突破 + 觉醒 + 好感 + 装备 + 珍藏集计算最终属性 */
  computeStats(owned) {
    const cos = this.activeCostumeDef(owned);
    const lv = owned.level - 1;
    const pm = this.plusMult(owned);
    const am = this.affMult(owned), wm = this.awakenMult(owned);
    const cm = this.collectionMult();           // 珍藏集增益（全队全属性）
    const g = this.gearBonus(owned);
    return {
      maxHp: Math.round((cos.stats.hp + cos.grow.hp * lv) * pm * am * wm * cm) + g.hp,
      atk:   Math.round((cos.stats.atk + cos.grow.atk * lv) * pm * am * wm * cm) + g.atk,
      def:   Math.round((cos.stats.def + cos.grow.def * lv) * pm * wm * cm) + g.def,
      spd:   cos.stats.spd + g.spd,
      crit:  cos.stats.crit + g.crit,
    };
  },

  // ============================================================
  //  阵容羁绊（Team Synergy）——让「带哪 5 个」成为真实抉择
  //  · 元素共鸣：同元素 2/3/4/5 个 → 该元素单位攻击 +8/15/22/30%（堆元素=爆发流）
  //  · 均衡阵：同时有 坦克+治疗+输出 → 全队 +10%生命 +8%防御（生存流）
  //  · 彩虹阵：5 个元素各不相同 → 全队 +6% 攻防血（灵活全能，与元素共鸣互斥）
  //  返回纯数据，供战斗结算与 UI 展示共用。
  // ============================================================
  ELEM_RESONANCE: { 2: 0.08, 3: 0.15, 4: 0.22, 5: 0.30 },
  teamSynergy(teamUids) {
    const D = window.GameData;
    const members = (teamUids || []).map(uid => this.getOwned(uid)).filter(Boolean);
    const els = {}, classes = {};
    members.forEach(o => {
      const el = this.activeCostumeDef(o).element;
      els[el] = (els[el] || 0) + 1;
      const cls = (D.CHARACTERS[o.charId] || {}).cls;
      classes[cls] = (classes[cls] || 0) + 1;
    });
    const elemBonus = {}, list = [];
    for (const e in els) {
      if (els[e] >= 2) {
        const b = this.ELEM_RESONANCE[Math.min(5, els[e])];
        elemBonus[e] = b;
        list.push({ kind: 'element', el: e, n: els[e], desc: `${D.ELEMENTS[e].icon}${D.ELEMENTS[e].name}共鸣 ×${els[e]}：该元素攻击 +${Math.round(b * 100)}%` });
      }
    }
    const hasTank = (classes.defender || 0) >= 1;
    const hasHeal = (classes.healer || 0) >= 1;
    const hasDps = ((classes.warrior || 0) + (classes.archer || 0) + (classes.mage || 0)) >= 1;
    const balance = hasTank && hasHeal && hasDps && members.length >= 4;
    const rainbow = members.length >= 5 && Object.keys(els).length === 5;
    if (balance) list.push({ kind: 'balance', desc: '均衡阵（坦+奶+输出）：全队 +10% 生命、+8% 防御' });
    if (rainbow) list.push({ kind: 'rainbow', desc: '彩虹阵（五元素各异）：全队 +6% 攻防血' });
    return { elemBonus, balance, rainbow, list, els, classes, n: members.length };
  },

  /**
   * 队伍可触发的「元素反应」预览（战斗内：异色连击引爆爆发）。
   * 依据队伍现有的不同元素两两组合，列出命中的具名反应，教学玩家「混色轮转」打法。
   */
  teamReactions(teamUids) {
    const D = window.GameData;
    const R = D.REACTIONS || {}, E = D.ELEMENTS;
    const members = (teamUids || []).map(uid => this.getOwned(uid)).filter(Boolean);
    const elems = [...new Set(members.map(o => this.activeCostumeDef(o).element))];
    const out = [];
    for (let i = 0; i < elems.length; i++) {
      for (let j = i + 1; j < elems.length; j++) {
        const key = [elems[i], elems[j]].sort().join('+');
        const rx = R[key];
        if (rx) out.push({ key, icon: rx.icon, name: rx.name,
          desc: `${E[elems[i]].icon}+${E[elems[j]].icon} ${rx.icon}${rx.name}` });
      }
    }
    return out;
  },

  /** 一次性教学提示：某 id 的提示是否还没展示过（展示后落盘，永不重复） */
  onceTip(id) {
    if (!this.state._tips) this.state._tips = {};
    if (this.state._tips[id]) return false;
    this.state._tips[id] = true;
    this.save();
    return true;
  },

  // 好感（赠礼提升）
  GIFT_COST: 200, GIFT_AFF: 25, AFF_MAX: 1000,
  giveGift(uid) {
    const o = this.getOwned(uid); if (!o) return { ok: false };
    if ((o.aff || 0) >= this.AFF_MAX) return { ok: false, msg: '好感已满' };
    if (this.state.gold < this.GIFT_COST) return { ok: false, msg: '金币不足' };
    this.spendGold(this.GIFT_COST);
    o.aff = Math.min(this.AFF_MAX, (o.aff || 0) + this.GIFT_AFF);
    this.save();
    return { ok: true, aff: o.aff, lv: this.affLevel(o) };
  },
  // 觉醒（消耗觉醒石 + 金币，提升星级与全属性）
  awakenCost(lv) { return { stone: 2 + lv * 2, gold: 2000 + lv * 2000 }; },
  awakenChar(uid) {
    const o = this.getOwned(uid); if (!o) return { ok: false };
    const lv = o.awaken || 0;
    if (lv >= 5) return { ok: false, msg: '已达最高觉醒' };
    const c = this.awakenCost(lv);
    if ((this.state.awakenStone || 0) < c.stone) return { ok: false, msg: '觉醒石不足' };
    if (this.state.gold < c.gold) return { ok: false, msg: '金币不足' };
    this.state.awakenStone -= c.stone; this.spendGold(c.gold);
    o.awaken = lv + 1;
    this.save();
    return { ok: true, awaken: o.awaken };
  },

  // ============================================================
  //  珍藏集（Collection）——多门类收集进度 + 全队增益
  //  每个门类满收集 → +2% 全队全属性，合计最高 +14%
  // ============================================================
  COLLECT_BONUS_PER_CAT: 0.02,
  // 收集品 / 食谱 / 天赋 / 炼金 的具体藏品，解锁条件 req(s) 基于现有进度，% 随游玩真实变化
  COLLECTIBLES: [
    { id: 'rl_emblem', name: '佣兵团徽章', icon: I('emblem'),      req: s => s.roster.length >= 1 },
    { id: 'rl_map',    name: '艾尔玛地图', icon: I('map'),         req: s => s.cleared.length >= 1 },
    { id: 'rl_lamp',   name: '褐尘提灯',   icon: I('lantern'),     req: s => s.cleared.length >= 3 },
    { id: 'rl_horn',   name: '集结号角',   icon: I('horn'),        req: s => s.roster.length >= 6 },
    { id: 'rl_crown',  name: '魔王残冠',   icon: I('brokencrown'), req: s => (s.seenStory || []).includes('epilogue') },
    { id: 'rl_compass',name: '远征罗盘',   icon: I('expd'),        req: s => s.cleared.length >= 5 },
    { id: 'rl_medal',  name: '竞技场奖章', icon: I('arena'),       req: s => (s.arena && s.arena.points || 1000) >= 1100 },
    { id: 'rl_moon',   name: '永夜之钥',   icon: I('key'),         req: s => (s.seenStory || []).includes('epilogue2') },
  ],
  RECIPES: [
    { id: 'rc_bread',  name: '行军干粮',   icon: I('bread'),  req: s => s.cleared.length >= 1 },
    { id: 'rc_soup',   name: '篝火浓汤',   icon: I('stew'),   req: s => s.cleared.length >= 2 },
    { id: 'rc_skewer', name: '炭烤肉串',   icon: I('skewer'), req: s => s.cleared.length >= 4 },
    { id: 'rc_tea',    name: '醒神药茶',   icon: I('tea'),    req: s => (s.farmRuns || 0) >= 5 },
    { id: 'rc_cake',   name: '庆功蛋糕',   icon: I('cake'),   req: s => (s.seenStory || []).includes('epilogue') },
    { id: 'rc_wine',   name: '边境烈酒',   icon: I('wine'),   req: s => s.cleared.length >= 6 },
    { id: 'rc_honey',  name: '蜜渍野果',   icon: I('honey'),  req: s => s.roster.length >= 8 },
    { id: 'rc_feast',  name: '凯旋盛宴',   icon: I('bento'),  req: s => s.cleared.length >= 7 },
  ],
  // 天赋技能：每名角色一项，角色等级达 20 即点亮
  ALCHEMY: [
    { id: 'al_whet',  name: '砺刃之术',  icon: I('whet'),        req: (s, g) => g._gearSeen() >= 3 },
    { id: 'al_temper',name: '淬火之术',  icon: I('temper'),      req: (s, g) => g._gearSeen() >= 6 },
    { id: 'al_runic', name: '符文蚀刻',  icon: I('rune'),        req: (s, g) => g._gearSeen() >= 10 },
    { id: 'al_refine',name: '词条精炼',  icon: I('refine'),      req: s => s.inventory.some(x => (x.lvl || 0) >= 5) },
    { id: 'al_master',name: '强化大师',  icon: I('master'),      req: s => s.inventory.some(x => (x.lvl || 0) >= 10) },
    { id: 'al_ex',    name: '神兵铸造',  icon: I('divineforge'), req: (s, g) => s.inventory.some(x => { const t = g.getGearTpl(x.tpl); return t && t.type === 'ex'; }) },
  ],
  _gearSeen() {
    return new Set(this.state.inventory.map(g => g.tpl)).size;
  },
  /** 计算全部珍藏门类的收集进度（owned/total/pct + items） */
  collectionCats() {
    const s = this.state, G = window.GameData;
    const charIds = Object.keys(G.CHARACTERS);
    const ownedChars = new Set(s.roster.map(o => o.charId));
    // 角色
    const charItems = charIds.map(id => ({ name: G.CHARACTERS[id].name, icon: G.CLASSES[G.CHARACTERS[id].cls].icon, owned: ownedChars.has(id) }));
    // 服装（非基础装）
    const ownedCos = new Set(); s.roster.forEach(o => (o.costumes || []).forEach(c => { if (!c.startsWith('base_')) ownedCos.add(c); }));
    const cosIds = Object.keys(G.COSTUMES);
    const cosItems = cosIds.map(id => ({ name: G.COSTUMES[id].name, icon: I('costume'), owned: ownedCos.has(id) }));
    // 装备（图鉴：见过的模板）
    const seenGear = new Set(s.inventory.map(g => g.tpl));
    const gearAll = [...Object.keys(G.GEAR.common), ...Object.keys(G.GEAR.ex)];
    const gearItems = gearAll.map(id => { const t = this.getGearTpl(id); return { name: t ? t.name : id, icon: t ? (t.icon || '⚔️') : '⚔️', owned: seenGear.has(id) }; });
    // 天赋技能：角色等级 ≥20 点亮
    const talentItems = s.roster.length
      ? charIds.map(id => { const o = s.roster.find(x => x.charId === id); return { name: G.CHARACTERS[id].name + ' · 天赋', icon: '✨', owned: !!(o && o.level >= 20) }; })
      : charIds.map(id => ({ name: G.CHARACTERS[id].name + ' · 天赋', icon: '✨', owned: false }));
    // 谓词类门类
    const mapItems = arr => arr.map(it => ({ name: it.name, icon: it.icon, owned: !!it.req(s, this) }));
    const cats = [
      { id: 'char',    name: '角色',     icon: I('merc'), items: charItems },
      { id: 'costume', name: '服装',     icon: I('costume'), items: cosItems },
      { id: 'gear',    name: '装备',     icon: I('sword'), items: gearItems },
      { id: 'collect', name: '收集品',   icon: I('bag'), items: mapItems(this.COLLECTIBLES) },
      { id: 'recipe',  name: '食谱',     icon: I('bento'), items: mapItems(this.RECIPES) },
      { id: 'talent',  name: '天赋技能', icon: I('medal'), items: talentItems },
      { id: 'alchemy', name: '炼金术',   icon: I('refine'), items: mapItems(this.ALCHEMY) },
    ];
    cats.forEach(c => {
      c.total = c.items.length;
      c.owned = c.items.filter(i => i.owned).length;
      c.pct = c.total ? c.owned / c.total : 0;
    });
    return cats;
  },
  /** 珍藏集全队属性倍率：每门类完成度 × 2%，最高 +14% */
  collectionMult() {
    const cats = this.collectionCats();
    const sum = cats.reduce((n, c) => n + c.pct, 0);
    return 1 + sum * this.COLLECT_BONUS_PER_CAT;
  },
  /** 珍藏集增益概览（用于页面头部展示） */
  collectionBonus() {
    const cats = this.collectionCats();
    const sum = cats.reduce((n, c) => n + c.pct, 0);          // 0~7
    const totalOwned = cats.reduce((n, c) => n + c.owned, 0);
    const totalAll = cats.reduce((n, c) => n + c.total, 0);
    const bonus = sum * this.COLLECT_BONUS_PER_CAT;            // 0~0.14
    return {
      bonusPct: bonus * 100,                                  // 全属性增益百分比
      overallPct: totalAll ? totalOwned / totalAll * 100 : 0, // 总收集进度
      max: cats.every(c => c.pct >= 1),
    };
  },

  // ---------- 装备 ----------

  getGearTpl(tplId) {
    const G = window.GameData.GEAR;
    return (G.common[tplId] || G.ex[tplId]) || null;
  },

  getGearInst(iid) {
    return this.state.inventory.find(g => g.iid === iid) || null;
  },

  /** 汇总某角色已装备的属性加成 */
  // ---------- 装备深化：强化 / 副词条 / 套装 ----------
  GEAR_MAX_LVL: 15,
  enhanceMult(lvl) { return 1 + (lvl || 0) * 0.05; }, // 主属性每级 +5%（满 +15 = +75%）
  enhanceCost(inst) {
    const tpl = this.getGearTpl(inst.tpl);
    const r = tpl ? tpl.rarity : 3;
    return Math.round((80 + (inst.lvl || 0) * 70) * (r === 5 ? 2 : r === 4 ? 1.5 : 1));
  },
  SUB_POOL: ['atk', 'def', 'hp', 'crit', 'spd'],
  SUB_BASE: { atk: 8, def: 5, hp: 60, crit: 0.02, spd: 3 },
  /** 按稀有度掷副词条：R=1 / SR=2 / UR=3 条 */
  rollSubs(rarity) {
    const n = rarity === 5 ? 3 : rarity === 4 ? 2 : 1;
    const w = rarity === 5 ? 2.4 : rarity === 4 ? 1.6 : 1;
    const pool = this.SUB_POOL.slice();
    const subs = [];
    for (let i = 0; i < n && pool.length; i++) {
      const k = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
      let v = this.SUB_BASE[k] * w * (0.7 + Math.random() * 0.6);
      v = (k === 'crit') ? Math.round(v * 1000) / 1000 : Math.round(v);
      subs.push({ k, v });
    }
    return subs;
  },
  /** 套装：三件通用装备同稀有度时的额外加成 */
  setBonusOf(owned) {
    const b = { hp: 0, atk: 0, def: 0, spd: 0, crit: 0, name: '' };
    if (!owned.equip) return b;
    const rs = ['weapon', 'armor', 'accessory'].map(slot => {
      const iid = owned.equip[slot]; if (!iid) return null;
      const inst = this.getGearInst(iid); if (!inst) return null;
      const tpl = this.getGearTpl(inst.tpl); return tpl ? tpl.rarity : null;
    });
    if (rs.every(r => r === 5)) { b.crit += 0.08; b.atk += 40; b.spd += 6; b.name = '传说三件套'; }
    else if (rs.every(r => r === 4)) { b.crit += 0.04; b.atk += 20; b.name = '稀有三件套'; }
    else if (rs.every(r => r === 3)) { b.hp += 120; b.name = '坚甲三件套'; }
    return b;
  },
  enhanceGear(iid) {
    const inst = this.getGearInst(iid);
    if (!inst) return { ok: false };
    if ((inst.lvl || 0) >= this.GEAR_MAX_LVL) return { ok: false, msg: '已达最高强化' };
    const cost = this.enhanceCost(inst);
    if (this.state.gold < cost) return { ok: false, msg: '金币不足' };
    this.spendGold(cost);
    inst.lvl = (inst.lvl || 0) + 1;
    this.state.enhanceCount = (this.state.enhanceCount || 0) + 1;
    this.save();
    return { ok: true, lvl: inst.lvl, cost };
  },

  gearBonus(owned) {
    const b = { hp: 0, atk: 0, def: 0, spd: 0, crit: 0 };
    if (!owned.equip) return b;
    ['weapon', 'armor', 'accessory', 'ex'].forEach(slot => {
      const iid = owned.equip[slot];
      if (!iid) return;
      const inst = this.getGearInst(iid);
      if (!inst) return;
      const tpl = this.getGearTpl(inst.tpl);
      if (!tpl) return;
      const em = this.enhanceMult(inst.lvl);           // 强化：放大主属性
      Object.keys(tpl.stats).forEach(k => { b[k] = (b[k] || 0) + tpl.stats[k] * em; });
      (inst.subs || []).forEach(s => { b[s.k] = (b[s.k] || 0) + s.v; }); // 副词条
    });
    // 套装加成
    const sb = this.setBonusOf(owned);
    ['hp', 'atk', 'def', 'spd', 'crit'].forEach(k => { b[k] += sb[k]; });
    ['hp', 'atk', 'def', 'spd'].forEach(k => { b[k] = Math.round(b[k]); });
    return b;
  },

  /** 新增一件装备到背包，返回 iid */
  addGear(tplId) {
    const iid = 'g' + (this.state._gearSeq++);
    const tpl = this.getGearTpl(tplId);
    const subs = tpl ? this.rollSubs(tpl.rarity) : [];
    this.state.inventory.push({ iid, tpl: tplId, lvl: 0, subs });
    return iid;
  },

  /** 给角色装备某件 gear（同件只能被一名角色装备） */
  equipGear(uid, iid) {
    const o = this.getOwned(uid);
    const inst = this.getGearInst(iid);
    if (!o || !inst) return { ok: false, msg: '装备不存在' };
    const tpl = this.getGearTpl(inst.tpl);
    if (!tpl) return { ok: false, msg: '装备无效' };
    if (tpl.type === 'ex' && tpl.owner !== o.charId) {
      return { ok: false, msg: '专属武器无法装备给该角色' };
    }
    const slot = tpl.type; // weapon/armor/accessory/ex
    // 从其他角色身上卸下同一件
    this.state.roster.forEach(x => {
      if (!x.equip) return;
      ['weapon', 'armor', 'accessory', 'ex'].forEach(s => { if (x.equip[s] === iid) x.equip[s] = null; });
    });
    o.equip[slot] = iid;
    this.save();
    return { ok: true };
  },

  unequipGear(uid, slot) {
    const o = this.getOwned(uid);
    if (o && o.equip) { o.equip[slot] = null; this.save(); }
  },

  /** 装备评分（用于一键装备挑最优） */
  gearScore(tpl) {
    const s = tpl.stats || {};
    return (s.atk || 0) + (s.def || 0) * 1.2 + (s.hp || 0) / 8 + (s.crit || 0) * 800;
  },

  /** 该角色是否拥有「背包里未装备的」专属武器 */
  hasUnequippedEx(charId) {
    const exId = 'ex_' + charId;
    return this.state.inventory.some(g => g.tpl === exId && !this.gearEquippedBy(g.iid));
  },

  /** 一键分解：未装备的 R/SR 通用装备转为金币 */
  dismantleGear() {
    let gold = 0, n = 0;
    this.state.inventory = this.state.inventory.filter(g => {
      const tpl = this.getGearTpl(g.tpl);
      if (tpl && tpl.type !== 'ex' && tpl.rarity < 5 && !this.gearEquippedBy(g.iid)) {
        gold += (tpl.rarity === 4 ? 300 : 100) + (g.lvl || 0) * 50; n++; return false;
      }
      return true;
    });
    this.state.gold += gold; this.save();
    return { n, gold };
  },

  /** 某槽位背包中评分最高的未装备件，返回 iid */
  bestUnequippedGear(type, charId) {
    let best = null, bestScore = -1;
    this.state.inventory.forEach(g => {
      const tpl = this.getGearTpl(g.tpl);
      if (!tpl) return;
      if (type === 'ex') { if (tpl.type !== 'ex' || tpl.owner !== charId) return; }
      else if (tpl.type !== type) return;
      if (this.gearEquippedBy(g.iid)) return;
      const sc = this.gearScore(tpl);
      if (sc > bestScore) { bestScore = sc; best = g.iid; }
    });
    return best;
  },

  /** 一键装备：为空槽位填入最优件，并自动识别专属武器 */
  autoEquip(uid) {
    const o = this.getOwned(uid);
    if (!o) return { ok: false };
    let count = 0;
    ['weapon', 'armor', 'accessory', 'ex'].forEach(slot => {
      if (o.equip[slot]) return; // 已装备的不覆盖
      const iid = this.bestUnequippedGear(slot, o.charId);
      if (iid) { const r = this.equipGear(uid, iid); if (r.ok) count++; }
    });
    this.save();
    return { ok: true, count };
  },

  /** 找出该 iid 当前被哪名角色装备（返回 owned 或 null） */
  gearEquippedBy(iid) {
    return this.state.roster.find(o => o.equip &&
      ['weapon', 'armor', 'accessory', 'ex'].some(s => o.equip[s] === iid)) || null;
  },

  /** 锻造通用装备：花金币，随机部位+稀有度 */
  craftGear() {
    const C = window.GameData.GEAR.CRAFT;
    if (this.state.gold < C.goldCost) return { ok: false, msg: '金币不足' };
    this.spendGold(C.goldCost);
    const type = C.types[Math.floor(Math.random() * C.types.length)];
    const r = Math.random();
    let rarity = 3;
    if (r < C.rarityWeight[5]) rarity = 5;
    else if (r < C.rarityWeight[5] + C.rarityWeight[4]) rarity = 4;
    const prefix = { weapon: 'wpn', armor: 'arm', accessory: 'acc' }[type];
    const suffix = { 3: 'r', 4: 'sr', 5: 'ur' }[rarity];
    const tplId = `${prefix}_${suffix}`;
    const iid = this.addGear(tplId);
    this.save();
    return { ok: true, tplId, iid };
  },

  /** 专属武器招募（只从抽奖产出，按稀有度概率） */
  gachaEx() {
    const G = window.GameData.GEAR.exGacha;
    if (this.state.gem < G.cost) return { ok: false, msg: '宝石不足' };
    this.state.gem -= G.cost;
    this.state.stats.pulls++;
    const r = Math.random();
    let rarity = 3;
    if (r < G.rates[5]) rarity = 5;
    else if (r < G.rates[5] + G.rates[4]) rarity = 4;
    const pool = window.GameData.GEAR.exPool[rarity];
    const tplId = pool[Math.floor(Math.random() * pool.length)];
    const result = { ok: true, tplId, rarity, dup: false };
    if (this.state.inventory.some(g => g.tpl === tplId)) {
      // 重复专属武器 → 返还宝石
      const refund = rarity === 5 ? 60 : rarity === 4 ? 30 : 15;
      this.state.gem += refund; result.dup = true; result.refund = refund;
    } else {
      this.addGear(tplId);
    }
    this.save();
    return result;
  },

  /** 升级所需经验 */
  expToNext(level) {
    return Math.round(50 + level * level * 12);
  },

  /** 给某角色加经验，自动升级。返回升了几级 */
  addExp(owned, amount) {
    let levelsGained = 0;
    owned.exp += amount;
    while (owned.level < 60 && owned.exp >= this.expToNext(owned.level)) {
      owned.exp -= this.expToNext(owned.level);
      owned.level++;
      levelsGained++;
    }
    return levelsGained;
  },

  /** 花金币升级一次 */
  levelUpWithGold(uid) {
    const owned = this.getOwned(uid);
    if (!owned || owned.level >= 60) return { ok: false, msg: '已达最大等级' };
    const cost = 50 + owned.level * 30;
    if (this.state.gold < cost) return { ok: false, msg: '金币不足' };
    this.spendGold(cost);
    owned.level++;
    owned.exp = 0;
    this.incQuest('levelup', 1);
    this.save();
    return { ok: true, cost, level: owned.level };
  },

  levelUpCost(level) {
    return 50 + level * 30;
  },

  // ---------- 队伍管理 ----------

  getOwned(uid) {
    return this.state.roster.find(o => o.uid === uid);
  },

  inTeam(uid) {
    return this.state.team.includes(uid);
  },

  toggleTeam(uid) {
    const idx = this.state.team.indexOf(uid);
    if (idx >= 0) {
      this.state.team.splice(idx, 1);
    } else {
      if (this.state.team.length >= 5) return { ok: false, msg: "队伍已满（最多 5 人）" };
      this.state.team.push(uid);
    }
    this.save();
    return { ok: true };
  },

  // 将某角色放入指定出战位（用于主页队伍框按位置编辑 / 替换）
  setTeamSlot(slotIdx, uid) {
    if (this.state.team.includes(uid)) return { ok: false, msg: "该角色已在队伍中" };
    if (slotIdx < this.state.team.length) {
      this.state.team[slotIdx] = uid; // 替换该位置原有角色
    } else if (this.state.team.length < 5) {
      this.state.team.push(uid);      // 空位上阵
    } else {
      return { ok: false, msg: "队伍已满（最多 5 人）" };
    }
    this.save();
    return { ok: true };
  },

  // 上阵 / 移出（佣兵列表的快捷部署）
  toggleDeploy(uid) {
    const idx = this.state.team.indexOf(uid);
    if (idx >= 0) { this.state.team.splice(idx, 1); this.save(); return { ok: true, deployed: false }; }
    if (this.state.team.length >= 5) return { ok: false, msg: '阵形已满，点阵形槽位替换' };
    this.state.team.push(uid); this.save();
    return { ok: true, deployed: true };
  },

  // 清空指定出战位
  clearTeamSlot(slotIdx) {
    if (slotIdx < this.state.team.length) {
      this.state.team.splice(slotIdx, 1);
      this.save();
    }
    return { ok: true };
  },

  // ---------- 抽卡 ----------

  rollRarity() {
    const r = Math.random();
    // 软保底：90 抽必出 5★
    if (this.state.pity >= 89) return 5;
    const { rates } = window.GameData.GACHA;
    if (r < rates[5]) return 5;
    if (r < rates[5] + rates[4]) return 4;
    return 3;
  },

  /** 把一套服装发给玩家（处理新角色/新服装/重复突破） */
  grantCostume(costumeId) {
    const cdef = window.GameData.COSTUMES[costumeId];
    const charId = cdef.charId;
    const result = { ok: true, costumeId, charId, rarity: cdef.rarity, isNew: false, newCostume: false, plusUp: false, plus: 0, refund: 0 };
    let owned = this.state.roster.find(o => o.charId === charId);
    if (!owned) {
      owned = this.makeOwned(charId, 1);
      owned.costumes = [costumeId];
      owned.activeCostume = costumeId;
      this.state.roster.push(owned);
      result.isNew = true; result.newCostume = true;
    } else if (!this.ownedCostumeIds(owned).includes(costumeId)) {
      owned.costumes.push(costumeId);
      result.newCostume = true;
    } else {
      if ((owned.plus || 0) < 5) {
        owned.plus = (owned.plus || 0) + 1;
        result.plusUp = true; result.plus = owned.plus;
      } else {
        const refund = cdef.rarity === 5 ? 50 : (cdef.rarity === 4 ? 25 : 10);
        this.state.gem += refund; result.refund = refund; result.plus = 5;
      }
    }
    return result;
  },

  /** 抽一次「服装」（force 可强制稀有度，用于首抽十连保底） */
  gachaPull(force) {
    if (this.state.gem < window.GameData.GACHA.cost) {
      return { ok: false, msg: '宝石不足' };
    }
    this.state.gem -= window.GameData.GACHA.cost;
    const rarity = force || this.rollRarity();
    if (rarity === 5) this.state.pity = 0;
    else this.state.pity++;
    // 保底货币 + 任务
    this.state.spark += 1;
    this.state.powder += 10;
    this.state.stats.pulls++;
    this.incQuest('pull', 1);

    const pool = window.GameData.COSTUME_POOL[rarity];
    const costumeId = pool[Math.floor(Math.random() * pool.length)];
    const result = this.grantCostume(costumeId);
    result.rarity = rarity;
    this.save();
    return result;
  },

  CHECKIN: [

  QUESTS: [

  ],

  today() {
    const d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  },

  /** 跨日重置任务与商店 */
  ensureDaily() {
    const t = this.today();
    if (this.state.quests.date !== t) {
      this.state.quests = { date: t, progress: { win: 0, pull: 0, levelup: 0 }, claimed: {} };
    }
    if (this.state.shop.date !== t || !this.state.shop.slots || !this.state.shop.slots.length) {
      this.state.shop = { date: t, slots: this.rollShop(), bought: {} };
    }
  },

  incQuest(key, n) {
    this.ensureDaily();
    this.state.quests.progress[key] = (this.state.quests.progress[key] || 0) + n;
    this.bumpTask(key, n);   // 同步任务板（win/pull/levelup）
    this.save();
  },

  applyReward(r) {
    if (r.gold) this.state.gold += r.gold;
    if (r.gem) this.state.gem += r.gem;
    if (r.powder) this.state.powder += r.powder;
    if (r.spark) this.state.spark += r.spark;
    if (r.gear) this.addGear(r.gear);
    if (r.gearRarity) this.addRandomGear(r.gearRarity);
    if (r.stone) this.state.awakenStone = (this.state.awakenStone || 0) + r.stone;
    if (r.stam) this.state.stamina = (this.state.stamina || 0) + r.stam;
    if (r.ticket) this.state.actDraw.tickets = (this.state.actDraw.tickets || 0) + r.ticket;
    if (r.coin) this.state.event.coin = (this.state.event.coin || 0) + r.coin;
  },
  /** 扣金币并累计「消耗金币」（活动任务用） */
  spendGold(n) {
    this.state.gold -= n;
    this.state.goldSpent = (this.state.goldSpent || 0) + n;
  },

  canCheckIn() { return this.state.daily.lastClaim !== this.today(); },

  checkIn() {
    if (!this.canCheckIn()) return { ok: false, msg: '今日已签到' };
    const idx = (this.state.daily.streak || 0) % 7;
    const reward = this.CHECKIN[idx];
    this.applyReward(reward);
    this.state.daily.lastClaim = this.today();
    this.state.daily.streak = (this.state.daily.streak || 0) + 1;
    this.save();
    return { ok: true, reward, day: idx + 1 };
  },

  claimQuest(id) {
    this.ensureDaily();
    const q = this.QUESTS.find(x => x.id === id);
    if (!q) return { ok: false };
    if (this.state.quests.claimed[id]) return { ok: false, msg: '已领取' };
    if ((this.state.quests.progress[q.key] || 0) < q.target) return { ok: false, msg: '未完成' };
    this.applyReward(q.reward);
    this.state.quests.claimed[id] = true;
    this.save();
    return { ok: true, reward: q.reward };
  },

  weekId() {
    const d = new Date();
    const onejan = new Date(d.getFullYear(), 0, 1);
    const week = Math.ceil((((d - onejan) / 86400000) + onejan.getDay() + 1) / 7);
    return d.getFullYear() + 'W' + week;
  },
  freshTasks() {
    return { dDate: null, wWeek: null, d: {}, w: {}, dClaimed: {}, wClaimed: {}, dMile: {}, wMile: {}, login: false };
  },
  ensureTasks() {
    if (!this.state.tasks) this.state.tasks = this.freshTasks();
    const T = this.state.tasks, t = this.today(), w = this.weekId();
    if (T.dDate !== t) { T.dDate = t; T.d = {}; T.dClaimed = {}; T.dMile = {}; T.login = false; }
    if (T.wWeek !== w) { T.wWeek = w; T.w = {}; T.wClaimed = {}; T.wMile = {}; }
    if (!T.login) { T.login = true; T.d.login = 1; }
  },
  /** 累加任务计数（同时计入日 / 周） */
  bumpTask(key, n = 1) {
    this.ensureTasks();
    const T = this.state.tasks;
    T.d[key] = (T.d[key] || 0) + n;
    T.w[key] = (T.w[key] || 0) + n;
    this.save();
  },
  _taskDefs(tab) { return tab === 'weekly' ? this.TASKS_WEEKLY : this.TASKS_DAILY; },
  _taskProg(tab) { this.ensureTasks(); return tab === 'weekly' ? this.state.tasks.w : this.state.tasks.d; },
  _taskClaimed(tab) { this.ensureTasks(); return tab === 'weekly' ? this.state.tasks.wClaimed : this.state.tasks.dClaimed; },
  _taskMileState(tab) { this.ensureTasks(); return tab === 'weekly' ? this.state.tasks.wMile : this.state.tasks.dMile; },
  /** 某分页的任务清单（含进度 / 是否完成 / 是否已领） */
  taskList(tab) {
    const prog = this._taskProg(tab), claimed = this._taskClaimed(tab);
    return this._taskDefs(tab).map(d => {
      const cur = Math.min(d.target, prog[d.key] || 0);
      const done = cur >= d.target;
      return Object.assign({}, d, { cur, done, claimed: !!claimed[d.id] });
    });
  },
  /** 已完成任务数（用于区间奖励进度） */
  taskDoneCount(tab) { return this.taskList(tab).filter(t => t.done).length; },
  /** 区间奖励里程碑状态 */
  taskMiles(tab) {
    const done = this.taskDoneCount(tab), ms = this._taskMileState(tab);
    return (this.TASK_MILES[tab] || []).map((m, i) => ({ idx: i, at: m.at, reward: m.reward, reached: done >= m.at, claimed: !!ms[i] }));

  claimTask(tab, id) {
    const t = this.taskList(tab).find(x => x.id === id);
    if (!t) return { ok: false };
    if (t.claimed) return { ok: false, msg: '已领取' };
    if (!t.done) return { ok: false, msg: '未完成' };
    this.applyReward(t.reward);
    this._taskClaimed(tab)[id] = true;
    this.save();
    return { ok: true, reward: t.reward };

  claimTaskMile(tab, idx) {
    const m = this.taskMiles(tab)[idx];
    if (!m) return { ok: false };
    if (m.claimed) return { ok: false, msg: '已领取' };
    if (!m.reached) return { ok: false, msg: '进度不足' };
    this.applyReward(m.reward);
    this._taskMileState(tab)[idx] = true;
    this.save();
    return { ok: true, reward: m.reward };

  claimAllTasks(tab) {
    let n = 0;
    this.taskList(tab).forEach(t => { if (t.done && !t.claimed) { if (this.claimTask(tab, t.id).ok) n++; } });
    this.taskMiles(tab).forEach(m => { if (m.reached && !m.claimed) { if (this.claimTaskMile(tab, m.idx).ok) n++; } });
    return { ok: n > 0, n };

  /** 该分页可领取数量（任务 + 里程碑），用于红点 */
  taskClaimable(tab) {

      this.state.cleared.push(stage.id);

  // ============================================================
  //  体力（行动力）—— 随时间回复，资源副本消耗
  // ============================================================
  STAMINA_MAX: 120,
  STAMINA_PER_MS: 5 * 60 * 1000,   // 每 5 分钟回 1 点

  syncStamina() {
    const now = Date.now();
    if (this.state.stamina == null) { this.state.stamina = this.STAMINA_MAX; this.state.staminaTs = now; }
    if (this.state.stamina >= this.STAMINA_MAX) { this.state.staminaTs = now; return; }
    const gained = Math.floor((now - this.state.staminaTs) / this.STAMINA_PER_MS);
    if (gained > 0) {
      this.state.stamina = Math.min(this.STAMINA_MAX, this.state.stamina + gained);
      this.state.staminaTs = this.state.stamina >= this.STAMINA_MAX ? now : this.state.staminaTs + gained * this.STAMINA_PER_MS;
    }
  },
  staminaEtaMs() { // 距下一点回复的毫秒
    this.syncStamina();
    if (this.state.stamina >= this.STAMINA_MAX) return 0;
    return this.STAMINA_PER_MS - (Date.now() - this.state.staminaTs);
  },
  spendStamina(n) {
    this.syncStamina();
    if (this.state.stamina < n) return false;
    if (this.state.stamina >= this.STAMINA_MAX) this.state.staminaTs = Date.now();
    this.state.stamina -= n;
    return true;

  //  tier 0..1：越后期内容越容易出高稀有，但 UR 上限仅 ~15%，不会泛滥。
  //   tier 0   → R 78% / SR 20% / UR 2%
  //   tier 0.5 → R 61% / SR 30% / UR 8.5%
  //   tier 1   → R 45% / SR 40% / UR 15%
  // ============================================================
  GEAR_TYPES: ['weapon', 'armor', 'accessory'],
  rollGearRarity(tier) {
    tier = Math.max(0, Math.min(1, tier || 0));
    const ur = 0.02 + 0.13 * tier;
    const sr = 0.20 + 0.20 * tier;
    const rr = Math.random();
    if (rr < ur) return 5;
    if (rr < ur + sr) return 4;
    return 3;

  // 关卡掉落档位：按推荐等级归一（Lv1→0，Lv50→1），与关卡 id 无关

  addRandomGear(rarity) {

    const id = { weapon: 'wpn', armor: 'arm', accessory: 'acc' }[type] + '_' + { 3: 'r', 4: 'sr', 5: 'ur' }[rarity];
    this.addGear(id);

  rollGear(scale) {

    return this.addRandomGear(this.rollGearRarity(tier));

  FARM: [

  runFarm(id, times) {

    this.bumpTask('farm', times);
    const tot = { gold: 0, exp: 0, gears: [] };

      if (r.exp) { this.state.team.forEach(uid => { const o = this.getOwned(uid); if (o) this.addExp(o, r.exp); }); tot.exp += r.exp; }
      if (r.gearScale && Math.random() < 0.6) tot.gears.push(this.rollGear(r.gearScale));
    }
    this.incQuest('win', times);
    this.save();
    return { ok: true, tot, cost };

  //  远征派遣（dispatch）—— 离线挂机，按真实时间结算

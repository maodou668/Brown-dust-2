  // ============================================================
  //  图鉴（角色档案：已拥有 + 未解锁）
  // ============================================================
  // ============================================================
  //  珍藏集（Collection）—— 多门类收集进度 + 全队增益（对照 BD2 珍藏集）
  // ============================================================
  renderCollection() {
    const cats = Game.collectionCats();
    const b = Game.collectionBonus();
    // 左侧立绘：取战力最高的已拥有角色
    const C = window.GameData.CHARACTERS, CL = window.GameData.CLASSES;
    let lead = null;
    Game.state.roster.forEach(o => {
      const p = (C[o.charId].rarity * 1000) + o.level + (o.awaken || 0) * 50;
      if (!lead || p > lead._p) lead = Object.assign({ _p: p }, o);
    });
    const lc = lead && C[lead.charId];
    const lcos = lead && Game.activeCostumeDef(lead);
    const splash = lead
      ? `<div class="col-splash border-${this.rarityClass(lc.rarity)}" style="background:linear-gradient(180deg, ${lcos.color}66 0%, ${lcos.color}22 50%, var(--bg) 92%);">
          <div class="col-splash-avatar">${this.charAvatar(lead.charId)}</div>
          <div class="col-splash-info">
            <div class="col-splash-name">${lc.name}</div>
            <div class="col-splash-meta">${lc.title} · ${CL[lc.cls].icon}${CL[lc.cls].name}</div>
          </div>
        </div>`
      : `<div class="col-splash empty"><div class="muted">📖 珍藏室</div></div>`;

    const catCard = (c) => {
      const pct = Math.round(c.pct * 100);
      const done = c.pct >= 1;
      return `<button class="col-cat ${done ? 'done' : ''}" data-cat="${c.id}">
        <span class="col-cat-ico">${c.icon}</span>
        <span class="col-cat-name">${c.name}</span>
        <span class="col-cat-pct">${done ? '<b>MAX</b>' : pct + '%'}</span>
        <span class="col-cat-bar"><span style="width:${pct}%;"></span></span>
      </button>`;
    };

    this.screenEl.innerHTML = `
      <div class="collection">
        <div class="col-left">${splash}</div>
        <div class="col-right">
          <div class="col-head">
            <div class="col-head-title">🏛️ 珍藏集增益 <span class="col-q" title="收集藏品可永久提升全队属性">ⓘ</span></div>
            <div class="col-head-bonus">
              ${b.max ? '<span class="col-bn max">⚔ MAX</span>' : ''}
              <span class="col-bn">全属性 +${b.bonusPct.toFixed(1)}%</span>
              <span class="col-bn alt">总收集 ${b.overallPct.toFixed(1)}%</span>
            </div>
          </div>
          <div class="col-grid">${cats.map(catCard).join('')}</div>
        </div>
      </div>`;
    this.screenEl.querySelectorAll('[data-cat]').forEach(b =>
      b.onclick = () => this.showCollectionCat(b.dataset.cat));
  },

  /** 某门类的藏品清单弹窗 */
  showCollectionCat(catId) {
    const cats = Game.collectionCats();
    const cat = cats.find(c => c.id === catId);
    if (!cat) return;
    const cells = cat.items.map((it, i) => it.owned
      ? `<div class="col-item owned" ${catId === 'char' ? `data-ci="${i}"` : ''}>
          <span class="ci-ico">${it.icon}</span><span class="ci-name">${it.name}</span></div>`
      : `<div class="col-item locked"><span class="ci-ico">🔒</span><span class="ci-name muted">？？？</span></div>`
    ).join('');
    const m = this.openModal(`
      <div class="gd-head"><div class="gd-art border-r5"><span class="gd-ico">${cat.icon}</span></div>
        <div class="gd-title"><div class="gd-name">${cat.name}</div>
          <div class="gd-meta muted">已收集 ${cat.owned}/${cat.total} · ${Math.round(cat.pct * 100)}%</div></div></div>
      <div class="col-item-grid">${cells}</div>
      <div class="close-row"><button class="btn" id="cc-ok">关闭</button></div>`, { wide: true });
    m.querySelector('#cc-ok').onclick = () => this.closeModal(m);
    // 角色门类：点击已拥有角色查看详情
    if (catId === 'char') {
      const ownedChars = Game.state.roster;
      m.querySelectorAll('[data-ci]').forEach(el => {
        const idx = parseInt(el.dataset.ci, 10);
        const charIds = Object.keys(window.GameData.CHARACTERS);
        const cid = charIds[idx];
        const o = ownedChars.find(x => x.charId === cid);
        if (o) el.onclick = () => { this.closeModal(m); this.showCharDetail(o.uid); };
      });
    }
  },

  renderCodex() {
    const all = Object.keys(window.GameData.CHARACTERS);
    const ownedIds = new Set(Game.state.roster.map(o => o.charId));
    const cards = all.sort((a, b) => window.GameData.CHARACTERS[b].rarity - window.GameData.CHARACTERS[a].rarity).map(id => {
      const c = window.GameData.CHARACTERS[id];
      const owned = ownedIds.has(id);
      const el = window.GameData.ELEMENTS[c.element], cl = window.GameData.CLASSES[c.cls];
      if (!owned) return `<div class="codex-card locked"><div class="cx-art">❔</div><div class="cx-name muted">？？？</div><div class="cx-meta muted">${c.rarity}★</div></div>`;
      const o = Game.state.roster.find(x => x.charId === id);
      return `<div class="codex-card border-${this.rarityClass(c.rarity)}" data-uid="${o.uid}">
        <div class="cx-art" style="background:radial-gradient(circle at 50% 35%, ${c.color}44, transparent);">${this.charAvatar(id)}</div>
        <div class="cx-name">${c.name}</div>
        <div class="cx-meta">${el.icon}${cl.icon} ${c.rarity}★ Lv.${o.level}</div>
      </div>`;
    }).join('');
    this.screenEl.innerHTML = `
      <div class="section-title">图鉴 <span class="muted" style="font-weight:400;font-size:12px;">· 已收集 ${ownedIds.size}/${all.length}</span></div>
      <div class="codex-grid">${cards}</div>`;
    this.screenEl.querySelectorAll('[data-uid]').forEach(c => c.onclick = () => this.showCharDetail(c.dataset.uid));
  },

  // ============================================================
  //  商店（每日装备商店 + 保底兑换）
  // ============================================================
  // ============================================================
  //  商店中心（Hub）—— 左侧分类 + 商人立绘 + 商品网格（对照 BD2）
  // ============================================================
  renderShop() {
    Game.ensureDaily();
    const hub = Game.SHOP_HUB;
    this.shopSel = this.shopSel && hub.find(c => c.id === this.shopSel) ? this.shopSel : hub[0].id;
    const cat = Game.getShopCat(this.shopSel);
    const s = Game.state;

    const sideHtml = hub.map(c =>
      `<button class="sp-cat ${c.id === this.shopSel ? 'on' : ''}" data-shopcat="${c.id}">
        <span class="sp-cat-ico">${c.icon}</span><span class="sp-cat-name">${c.name}</span>
      </button>`).join('');

    // 顶部货币（该分类使用的货币 + 通用）
    const curBar = `<span class="sp-cur">${Game.CUR_ICON[cat.cur]} ${Game.curBalance(cat.cur)}</span>`;

    // 商品卡
    const card = (inner) => `<div class="sp-card">${inner}</div>`;
    let cardsHtml = '';
    // 金币商店：先放每日随机装备
    if (cat.daily) {
      cardsHtml += s.shop.slots.map((slot, i) => {
        const tpl = Game.getGearTpl(slot.tpl);
        const sold = s.shop.bought[i];
        return card(`<div class="sp-qty">×1</div>
          <div class="sp-ico border-${this.rarityClass(tpl.rarity)}">${tpl.icon}</div>
          <div class="sp-name">${tpl.name}</div>
          <div class="sp-lim muted">每日刷新</div>
          <button class="sp-price ${sold ? 'sold' : ''}" data-buygear="${i}" ${sold || s.gold < slot.price ? 'disabled' : ''}>
            ${sold ? '已售出' : `🪙 ${slot.price}`}</button>`);
      }).join('');
    }
    // 通用商品
    cardsHtml += cat.items.map(it => {
      const left = Game.shopLeft(it);
      const sold = it.limit && left <= 0;
      const can = !sold && Game.curBalance(it.cur) >= it.price;
      const limTxt = it.limit ? `${{ day: '每日', week: '每周', month: '每月' }[it.period] || ''}限购 ${Game.shopBoughtCount(it)}/${it.limit}` : '不限量';
      const give = this._rwLabel(it.give.gearScale ? { gear: 1 } : it.give) || '神秘奖励';
      return card(`<div class="sp-qty">×1</div>
        <div class="sp-ico">${it.icon}</div>
        <div class="sp-name">${it.name}</div>
        <div class="sp-give muted">${give}</div>
        <div class="sp-lim muted">${limTxt}</div>
        <button class="sp-price ${sold ? 'sold' : ''}" data-buyitem="${it.id}" ${can ? '' : 'disabled'}>
          ${sold ? '已售罄' : `${Game.CUR_ICON[it.cur]} ${it.price}`}</button>`);
    }).join('');

    this.screenEl.innerHTML = `
      <div class="shop-hub">
        <div class="sp-side">${sideHtml}</div>
        <div class="sp-main">
          <div class="sp-head"><span class="sp-title">${cat.icon} ${cat.name}</span>${curBar}</div>
          <div class="sp-stage">
            <div class="sp-merchant">
              <div class="sp-merchant-art">${cat.merchant}</div>
              <div class="sp-bubble">${cat.npc}</div>
            </div>
            <div class="sp-grid">${cardsHtml}</div>
          </div>
        </div>
      </div>`;

    this.screenEl.querySelectorAll('[data-shopcat]').forEach(b => b.onclick = () => { this.shopSel = b.dataset.shopcat; this.renderShop(); });
    this.screenEl.querySelectorAll('[data-buygear]').forEach(b => b.onclick = () => {
      const r = Game.buyShopItem(parseInt(b.dataset.buygear, 10));
      if (!r.ok) { this.toast(r.msg); return; }
      if (window.Sound) Sound.sfx('levelup');
      this.toast(`购买成功：${Game.getGearTpl(r.tpl).name}`); this.updateResources(); this.renderShop();
    });
    this.screenEl.querySelectorAll('[data-buyitem]').forEach(b => b.onclick = () => {
      const r = Game.buyShop2(this.shopSel, b.dataset.buyitem);
      if (!r.ok) { this.toast(r.msg); return; }
      if (window.Sound) Sound.sfx('levelup');
      this.toast('购买成功 · ' + (this._rwLabel(r.give.gearScale ? { gear: 1 } : r.give) || '已入库')); this.updateResources(); this.renderShop();
    });
  },

      <div class="set-row"><span>音效 / 音乐</span><button class="btn secondary sm" id="set-mute">${(window.Sound && Sound.muted) ? '🔇 已静音' : '🔊 开启'}</button></div>
      <div class="set-row"><span>默认战斗倍速</span><button class="btn secondary sm" id="set-speed">${speed}x</button></div>
      <div class="set-row"><span>存档管理</span><button class="btn secondary sm" id="set-save">导出 / 导入</button></div>
      <div class="set-row"><span>重置存档</span><button class="btn sm" id="set-reset" style="background:linear-gradient(135deg,#ff5a6a,#b02a3a);">重置</button></div>

  /** 存档管理：导出 / 导入 */
  showSaveManager() {
    const code = Game.exportSave() || '';
    const m = this.openModal(`
      <h2>💾 存档管理</h2>
      <p class="muted" style="margin:6px 0 10px;">本游戏存档在本机浏览器。<b style="color:var(--danger);">清缓存/换设备会丢档</b>，请用下面的存档码备份。</p>
      <div class="section-title" style="font-size:14px;">导出（备份）</div>
      <textarea id="save-out" readonly class="save-box">${code}</textarea>
      <button class="btn" id="save-copy" style="width:100%;margin:8px 0 16px;">复制存档码</button>
      <div class="section-title" style="font-size:14px;">导入（恢复）</div>
      <p class="muted" style="font-size:11px;margin:4px 0;">粘贴存档码后导入将<b style="color:var(--danger);">覆盖当前进度</b>。</p>
      <textarea id="save-in" class="save-box" placeholder="在此粘贴存档码…"></textarea>
      <div class="close-row">
        <button class="btn secondary" id="save-close">关闭</button>
        <button class="btn gold" id="save-import">导入覆盖</button>
      </div>
    `);
    m.querySelector('#save-copy').onclick = () => {
      const ta = m.querySelector('#save-out');
      ta.select();
      try { navigator.clipboard.writeText(ta.value); } catch (e) { document.execCommand && document.execCommand('copy'); }
      this.toast('已复制存档码');
    };
    m.querySelector('#save-close').onclick = () => this.closeModal(m);
    m.querySelector('#save-import').onclick = () => {
      const code = m.querySelector('#save-in').value;
      if (!code.trim()) { this.toast('请先粘贴存档码'); return; }
      if (!confirm('导入将覆盖当前进度，确定？')) return;
      const r = Game.importSave(code);
      if (!r.ok) { this.toast(r.msg || '导入失败'); return; }
      this.closeModal(m);
      this.toast('存档已导入');
      this.updateResources();
      Main.switchScreen('home');
    };
  },

  /** 成就殿堂 */
  // ============================================================
  //  成就板（成就 / 成就等级 / 称号）—— 对照 BD2 成就面板
  // ============================================================
  renderAchievements() {
    this.achTab = this.achTab || 'ach';
    const tab = this.achTab;
    const sideTab = (id, name, claimable) =>
      `<button class="ac-tab ${tab === id ? 'on' : ''}" data-atab="${id}">${name}${claimable ? '<span class="tk-dot"></span>' : ''}</button>`;

    let head = '', body = '', foot = '';
    if (tab === 'ach') {
      const list = Game.ACHIEVEMENTS.slice().sort((a, b) => {
        const rank = x => Game.state.achClaimed[x.id] ? 2 : (Game.achValue(x) >= x.target ? 0 : 1);
        return rank(a) - rank(b);
      });
      head = `🏆 成就 <span class="muted" style="font-size:13px;font-weight:400;">${Game.achDoneCount()}/${Game.ACHIEVEMENTS.length}</span>`;
      body = list.map(a => {
        const cur = Game.achValue(a), done = cur >= a.target, claimed = !!Game.state.achClaimed[a.id];
        const pct = Math.min(100, cur / a.target * 100);
        const state = claimed ? 'claimed' : (done ? 'ready' : 'todo');
        const btn = claimed ? '<span class="ac-circle claimed">✓</span>'
          : (done ? `<button class="ac-circle ready" data-claim="${a.id}">🤲</button>`
            : `<span class="ac-circle lock"><span class="ac-ring" style="--p:${pct}"></span>🤲</span>`);
        return `<div class="ac-row ${state}">
          <div class="ac-banner ach">${a.icon}</div>
          <div class="ac-mid">
            <div class="ac-name">${a.name} <span class="ac-prog">${Math.min(cur, a.target)} / ${a.target}</span></div>
            <div class="ac-desc">${a.desc}</div>
            <div class="ac-exp">🏆 成就经验值 ${Game.achExpOf(a)}</div>
          </div>
          ${btn}
        </div>`;
      }).join('');
      foot = `<button class="btn ${Game.achClaimable() ? 'gold' : 'secondary'}" id="ac-all" ${Game.achClaimable() ? '' : 'disabled'}>全部获得</button>`;
    } else if (tab === 'level') {
      const top = Game.achLevel(), prog = Game.achLevelProg();
      head = `🏆 成就等级 <b style="color:var(--gold);">${top}</b>`;
      const hi = top + 5, lo = Math.max(1, top - 6);
      const rows = [];
      for (let lv = hi; lv >= lo; lv--) {
        const r = Game.achLevelReward(lv);
        const reached = lv <= top, claimed = !!(Game.state.achLvClaimed && Game.state.achLvClaimed[lv]);
        const isCur = lv === top + 1;
        const state = claimed ? 'claimed' : (reached ? 'ready' : 'lock');
        const btn = claimed ? '<span class="ac-circle claimed">✓</span>'
          : (reached ? `<button class="ac-circle ready" data-lvl="${lv}">🤲</button>` : '<span class="ac-circle lock">🔒</span>');
        rows.push(`<div class="ac-lv ${state} ${isCur ? 'cur' : ''}">
          <div class="ac-lv-node">${isCur ? `<span class="ac-lv-mark">${prog}</span>` : ''}<span class="ac-lv-name">Lv.${lv}</span></div>
          <div class="ac-lv-rw">${this._rwLabel(r)}</div>
          ${btn}
        </div>`);
      }
      body = `<div class="ac-lv-hint muted">提升成就等级可获得额外奖励。成就等级通过获取成就经验值提升（每 ${Game.ACH_LV_NEED} 点升 1 级）。</div>` + rows.join('');
      foot = `<button class="btn ${Game.achLevelClaimable() ? 'gold' : 'secondary'}" id="ac-all" ${Game.achLevelClaimable() ? '' : 'disabled'}>全部获得</button>`;
    } else {
      const owned = Game.TITLES.filter(t => Game.titleOwned(t.id)).length;
      head = `🏆 称号 <span class="muted" style="font-size:13px;font-weight:400;">${owned}/${Game.TITLES.length}</span>`;
      body = Game.TITLES.map(t => {
        const unlocked = Game.titleUnlocked(t), has = Game.titleOwned(t.id), equipped = Game.currentTitle().id === t.id;
        let btn;
        if (equipped) btn = '<span class="ac-circle equipped">装备中</span>';
        else if (has) btn = `<button class="ac-circle equip" data-equip="${t.id}">装备</button>`;
        else if (unlocked) btn = `<button class="ac-circle ready" data-title="${t.id}">🤲</button>`;
        else btn = '<span class="ac-circle lock">🔒</span>';
        return `<div class="ac-row ${equipped ? 'ready' : (has ? '' : (unlocked ? 'ready' : 'todo'))}">
          <div class="ac-banner title">★</div>
          <div class="ac-mid">
            <div class="ac-name">${t.name}</div>
            <div class="ac-desc">${t.desc}</div>
            <div class="ac-title-chip ${has ? '' : 'locked'}">「${t.name}」</div>
          </div>
          ${btn}
        </div>`;
      }).join('');
      foot = `<button class="btn ${Game.titlesClaimable() ? 'gold' : 'secondary'}" id="ac-all" ${Game.titlesClaimable() ? '' : 'disabled'}>全部获得</button>`;
    }

    this.screenEl.innerHTML = `
      <div class="ach-board">
        <div class="ac-side">
          <div class="ac-side-title">🏆 成就</div>
          ${sideTab('ach', '成就', Game.achClaimable())}
          ${sideTab('level', '成就等级', Game.achLevelClaimable())}
          ${sideTab('title', '称号', Game.titlesClaimable())}
        </div>
        <div class="ac-main">
          <div class="ac-head">${head}</div>
          <div class="ac-list">${body}</div>
          <div class="ac-foot">${foot}</div>
        </div>
      </div>`;

    this.screenEl.querySelectorAll('[data-atab]').forEach(b => b.onclick = () => { this.achTab = b.dataset.atab; this.renderAchievements(); });
    this.screenEl.querySelectorAll('[data-claim]').forEach(b => b.onclick = () => {
      const r = Game.claimAch(b.dataset.claim);
      if (!r.ok) { this.toast(r.msg || '不可领取'); return; }
      if (window.Sound) Sound.sfx('levelup');
      this.toast(`成就达成！${this._rwLabel(r.reward)} · 🏆经验+${r.exp}`); this.updateResources(); this.renderAchievements();
    });
    this.screenEl.querySelectorAll('[data-lvl]').forEach(b => b.onclick = () => {
      const r = Game.claimAchLevel(parseInt(b.dataset.lvl, 10));
      if (!r.ok) { this.toast(r.msg || '不可领取'); return; }
      this.toast(`等级奖励：${this._rwLabel(r.reward)}`); this.updateResources(); this.renderAchievements();
    });
    this.screenEl.querySelectorAll('[data-title]').forEach(b => b.onclick = () => {
      const id = b.dataset.title; const r = Game.claimTitle(id);
      if (!r.ok) { this.toast(r.msg || '不可领取'); return; }
      Game.equipTitle(id); this.toast(`获得称号「${Game.TITLES.find(t => t.id === id).name}」并装备`); this.updateResources(); this.renderAchievements();
    });
    this.screenEl.querySelectorAll('[data-equip]').forEach(b => b.onclick = () => {
      Game.equipTitle(b.dataset.equip); this.toast('已装备称号'); this.updateResources(); this.renderAchievements();
    });
    const all = this.screenEl.querySelector('#ac-all');
    if (all) all.onclick = () => {
      let r;
      if (tab === 'ach') r = Game.claimAllAch();
      else if (tab === 'level') r = Game.claimAllAchLevels();
      else { let n = 0; Game.TITLES.forEach(t => { if (Game.titleUnlocked(t) && !Game.titleOwned(t.id)) { if (Game.claimTitle(t.id).ok) n++; } }); r = { ok: n > 0, n }; }
      if (!r.ok) { this.toast('没有可领取的奖励'); return; }
      this.toast(`一键领取 ${r.n} 项`); this.updateResources(); this.renderAchievements();
    };
  },

  showAchievements() {
    const render = (m) => {
      const list = Game.ACHIEVEMENTS.slice().sort((a, b) => {
        // 可领取的排最前，其次未达成，最后已领取
        const rank = x => Game.state.achClaimed[x.id] ? 2 : (Game.achValue(x) >= x.target ? 0 : 1);
        return rank(a) - rank(b);
      });
      const rows = list.map(a => {
        const cur = Game.achValue(a);
        const done = cur >= a.target;
        const claimed = !!Game.state.achClaimed[a.id];
        const pct = Math.min(100, cur / a.target * 100);
        const rw = a.reward.gem ? `💎${a.reward.gem}` : a.reward.gold ? `🪙${a.reward.gold}` : a.reward.powder ? `🌸${a.reward.powder}` : '';
        const btn = claimed
          ? '<button class="btn secondary sm" disabled>已领</button>'
          : `<button class="btn ${done ? 'gold' : 'secondary'} sm ach-claim" data-ach="${a.id}" ${done ? '' : 'disabled'}>领取</button>`;
        return `<div class="ach-item ${claimed ? 'claimed' : done ? 'done' : ''}">
          <div class="ach-icon">${a.icon}</div>
          <div class="ach-mid">
            <div class="ach-name">${a.name} <span class="muted" style="font-weight:400;">${a.desc}</span></div>
            <div class="ach-bar"><div class="ach-fill" style="width:${pct}%"></div></div>
            <div class="ach-prog muted">${Math.min(cur, a.target)} / ${a.target}</div>
          </div>
          <div class="ach-right"><div class="ach-rw">${rw}</div>${btn}</div>
        </div>`;
      }).join('');
      m.querySelector('.ach-list').innerHTML = rows;
      m.querySelectorAll('.ach-claim').forEach(b => b.onclick = () => {
        const r = Game.claimAch(b.dataset.ach);
        if (!r.ok) { this.toast(r.msg || '不可领取'); return; }
        if (window.Sound) Sound.sfx('levelup');
        const rw = r.reward.gem ? `💎${r.reward.gem}` : r.reward.gold ? `🪙${r.reward.gold}` : '奖励';
        this.toast(`成就达成！获得 ${rw}`);
        this.updateResources();
        render(m);
      });
    };
    const claimable = Game.achClaimable();
    const m = this.openModal(`
      <h2>🏆 成就殿堂</h2>
      <p class="muted" style="margin:6px 0 12px;">达成里程碑领取宝石奖励。${claimable ? `当前有 <b style="color:var(--gold);">${claimable}</b> 个可领取。` : ''}</p>
      <div class="ach-list"></div>
      <div class="close-row"><button class="btn secondary" id="ach-close">关闭</button></div>
    `);
    render(m);
    m.querySelector('#ach-close').onclick = () => { this.closeModal(m); this.renderWelfare(); };
  },

  showSparkPicker() {
    const pool = window.GameData.COSTUME_POOL;
    const section = (rar) => `
      <div class="replay-group-title">${rar}★ 服装</div>
      <div class="roster-grid">${pool[rar].map(cid => {
        const cd = window.GameData.COSTUMES[cid];
        return `<div class="roster-card border-${this.rarityClass(cd.rarity)}" data-pick="${cid}">
          <div class="rc-art" style="background:radial-gradient(circle at 50% 35%, ${cd.color}55, transparent);">
            <span class="rarity-badge ${this.rarityClass(cd.rarity)}">${cd.rarity}★</span>
            ${this.charAvatar(cd.charId, cid)}
          </div>
          <div class="rc-info"><div class="rc-name" style="font-size:10px;">${cd.charName}·${cd.costumeName}</div></div>
        </div>`;
      }).join('')}</div>`;
    const m = this.openModal(`
      <h2>自选服装 ✨${Game.SPARK_COST}</h2>
      <p class="muted" style="margin:6px 0 12px;">选择一套服装兑换（消耗 ${Game.SPARK_COST} 闪耀之星）。</p>
      ${section(5)}${section(4)}${section(3)}
      <div class="close-row"><button class="btn secondary" id="sp-close">取消</button></div>
    `);
    m.querySelector('#sp-close').onclick = () => this.closeModal(m);
    m.querySelectorAll('[data-pick]').forEach(el => el.onclick = () => {
      const r = Game.sparkExchange(el.dataset.pick);
      if (!r.ok) { this.toast(r.msg); return; }
      this.closeModal(m);
      this.updateResources();
      this.showPullResults([{ ...r.result }]);
    });
  },
};

// ============================================================
//  叙事演出引擎（视觉小说式对话系统）+ 剧情脚本
//  阶段一：BD2「剧情」精髓的代码实现
//  - 全屏场景背景、左右立绘位、名牌、旁白、逐字演出、点按推进、跳过
//  - 立绘走「图片优先，风格化占位兜底」的可替换美术管线
// ============================================================

const Story = {
  root: null,
  beats: [],
  idx: 0,
  onDone: null,
  typing: false,
  typer: null,
  curBg: 'void',
  portraits: { left: null, right: null },

  /** 该剧情是否已看过 */
  seen(id) {
    return Game.state.seenStory && Game.state.seenStory.includes(id);
  },

  markSeen(id) {
    Game.state.seenStory = Game.state.seenStory || [];
    if (!Game.state.seenStory.includes(id)) {
      Game.state.seenStory.push(id);
      Game.save();
    }
  },

  /** 播放一段剧情；播完调用 onDone */
  play(id, onDone) {
    const beats = STORY[id];
    if (!beats || !beats.length) { if (onDone) onDone(); return; }
    this.playBeats(beats, () => { this.markSeen(id); if (onDone) onDone(); });
  },

  /** 播放任意 beat 数组（Director 的 adv 层入口，不写 seen 记录） */
  playBeats(beats, onDone) {
    this.beats = beats;
    this.idx = 0;
    this.choosing = false;
    this.onDone = onDone || null;
    if (window.Sound) Sound.bgm('story');
    this.curBg = 'void';
    this.portraits = { left: null, right: null };
    this.build();
    this.render();
  },

  build() {
    const old = document.getElementById('story-screen');
    if (old) old.remove();
    this.root = UI.el(`
      <div id="story-screen">
        <div class="story-bg" id="story-bg"></div>
        <div class="bfx-particles" id="story-fx"></div>
        <div class="story-portrait left"  id="port-left"></div>
        <div class="story-portrait right" id="port-right"></div>
        <button class="story-skip" id="story-skip">跳过 ▶▶</button>
        <div class="story-dialogue" id="story-box">
          <div class="story-name" id="story-name"></div>
          <div class="story-text" id="story-text"></div>
          <div class="story-next" id="story-next">▼</div>
        </div>
      </div>`);
    document.body.appendChild(this.root);

    // 点按推进（点对话区或背景）
    this.root.addEventListener('click', (e) => {
      if (e.target.closest('#story-skip')) return;
      this.advance();
    });
    this.root.querySelector('#story-skip').onclick = (e) => {
      e.stopPropagation();
      this.finish();
    };
  },

  /** 场景氛围粒子（与战斗复用同一套样式） */
  spawnParticles(scene) {
    const box = this.root && this.root.querySelector('#story-fx');
    if (!box) return;
    const type = ({ forest: 'leaf', forest_deep: 'leaf', cave: 'ember', castle: 'ember', town: 'ember', ridge: 'snow' })[scene] || 'mote';
    let html = '';
    for (let i = 0; i < 14; i++) {
      const left = Math.random() * 100;
      const dur = 7 + Math.random() * 7;
      const delay = -Math.random() * dur;
      const size = 6 + Math.random() * 8;
      html += `<span class="bfx ${type}" style="left:${left}%;width:${size}px;height:${size}px;animation-duration:${dur}s;animation-delay:${delay}s;"></span>`;
    }
    box.innerHTML = html;
  },

  /** 立绘 HTML：图片优先，风格化占位兜底 */
  portraitHTML(token) {
    if (!token) return '';
    // 剧情 NPC 立绘：'N:文件名' → art/06_story/portraits/<文件名>.png（差分=另一个文件名，如 xxx_odd）
    if (token.startsWith('N:')) {
      const V = window.ASSET_VER || '';
      return `<img class="port-img" src="art/06_story/portraits/${token.slice(2)}.png?v=${V}" alt="">`;
    }
    let def, icon, color, name;
    if (token.startsWith('E:')) {
      def = window.GameData.ENEMIES[token.slice(2)];
      icon = '👹'; color = def.color; name = def.name;
    } else {
      def = window.GameData.CHARACTERS[token];
      icon = window.GameData.CLASSES[def.cls].icon;
      color = def.color; name = def.name;
    }
    // 预留真实立绘：若数据含 art 字段则用图片
    if (def && def.art) {
      return `<img class="port-img" src="${def.art}" alt="${name}">`;
    }
    // 风格化占位立绘：渐变人形 + 大图标
    const elem = def.element ? window.GameData.ELEMENTS[def.element].icon : '';
    return `
      <div class="port-art" style="--c:${color};">
        <div class="port-silhouette"></div>
        <div class="port-icon">${icon}</div>
        <div class="port-elem">${elem}</div>
      </div>`;
  },

  render() {
    const beat = this.beats[this.idx];
    if (!beat) { this.finish(); return; }
    // 条件 beat（轻度选择支的分支台词）：不满足则跳过
    if ((beat.if && !(window.Director && Director.flag(beat.if))) ||
        (beat.ifNot && window.Director && Director.flag(beat.ifNot))) {
      this.idx++; this.render(); return;
    }

    // 背景（bgImg=实景图优先于 CSS 风格背景；沿用到下一次显式改背景为止）
    const bgKey = (beat.bg || '') + '|' + (beat.bgImg || '');
    if ((beat.bg || beat.bgImg) && bgKey !== this.curBg) {
      this.curBg = bgKey;
      const bg = this.root.querySelector('#story-bg');
      bg.className = 'story-bg bg-' + (beat.bg || 'void');
      if (beat.bgImg) {
        bg.style.backgroundImage = `url('${beat.bgImg}?v=${window.ASSET_VER || ''}')`;
        bg.classList.add('bg-photo');
      } else { bg.style.backgroundImage = ''; bg.classList.remove('bg-photo'); }
      bg.animate([{ opacity: 0.3 }, { opacity: 1 }], { duration: 400 });
      this.spawnParticles(beat.bg || 'void');
    } else if (this.idx === 0) {
      this.spawnParticles((this.curBg || '').split('|')[0] || 'void');
    }

    // 立绘进出场
    if (beat.clear) this.portraits = { left: null, right: null };
    if (beat.who) {
      const side = beat.side || 'left';
      this.portraits[side] = beat.who;
    }
    ['left', 'right'].forEach(side => {
      const el = this.root.querySelector('#port-' + side);
      const tok = this.portraits[side];
      el.innerHTML = this.portraitHTML(tok);
      el.classList.toggle('empty', !tok);
      // 说话人高亮，非说话人压暗
      const speaking = beat.who === tok || (!beat.who && false);
      el.classList.toggle('dim', !!tok && beat.who && beat.who !== tok);
      if (tok && !el.dataset.shown) {
        el.animate([{ transform: `translateY(20px) scale(.96)`, opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 350 });
        el.dataset.shown = '1';
      }
      if (!tok) delete el.dataset.shown;
    });

    // 名牌 + 旁白样式
    const box = this.root.querySelector('#story-box');
    const nameEl = this.root.querySelector('#story-name');
    if (beat.speaker) {
      box.classList.remove('narration');
      nameEl.style.display = 'block';
      nameEl.textContent = beat.speaker;
      // 名牌颜色随角色
      let col = '#b06bff';
      if (beat.who) {
        if (beat.who.startsWith('E:')) col = (window.GameData.ENEMIES[beat.who.slice(2)] || {}).color || col;
        else if (beat.who.startsWith('N:')) col = '#9aa0ae';
        else col = (window.GameData.CHARACTERS[beat.who] || {}).color || col;
      }
      nameEl.style.color = col;
    } else {
      box.classList.add('narration');
      nameEl.style.display = 'none';
    }

    // CG 层（全屏图 + Ken Burns 缓动；beat.cg = 图片路径，下一个无 cg 的 beat 自动收起）
    let cgEl = this.root.querySelector('#story-cg');
    if (beat.cg) {
      if (!cgEl) {
        cgEl = UI.el('<div id="story-cg"><img decoding="async"></div>');
        this.root.insertBefore(cgEl, this.root.querySelector('#story-box'));
      }
      const im = cgEl.querySelector('img');
      const src = beat.cg + '?v=' + (window.ASSET_VER || '');
      if (im.getAttribute('src') !== src) { im.src = src; im.className = 'kenburns'; }
    } else if (cgEl) cgEl.remove();

    // 低语（圣经 W2）：无名牌、文本固定 …………、逐字 1/3 速
    if (beat.whisper) {
      box.classList.add('narration', 'whisper');
      nameEl.style.display = 'none';
      if (window.Sound && Sound.sfx) { try { Sound.sfx('whisper'); } catch (e) {} }
      this.typeText('…………', 96);
      return;
    }
    box.classList.remove('whisper');

    this.typeText(beat.text || '');

    // 选择支（轻度）：beat.choice = [{t:'文案', flag:'flag名'}]
    const oldCh = this.root.querySelector('#story-choice');
    if (oldCh) oldCh.remove();
    if (beat.choice) {
      this.choosing = true;
      const ch = UI.el(`<div id="story-choice">${beat.choice.map((c, i) =>
        `<button class="story-choice-btn" data-ci="${i}">${c.t}</button>`).join('')}</div>`);
      this.root.appendChild(ch);
      ch.querySelectorAll('button').forEach(b => b.onclick = (ev) => {
        ev.stopPropagation();
        const opt = beat.choice[parseInt(b.dataset.ci, 10)];
        if (opt.flag && window.Director) Director.setFlag(opt.flag);
        ch.remove();
        this.choosing = false;
        this.advance();
      });
    }
  },

  /** 逐字打字机效果 */
  typeText(text, interval) {
    const el = this.root.querySelector('#story-text');
    const next = this.root.querySelector('#story-next');
    next.style.opacity = 0;
    this.typing = true;
    el.textContent = '';
    let i = 0;
    clearInterval(this.typer);
    this.typer = setInterval(() => {
      el.textContent = text.slice(0, ++i);
      if (i >= text.length) {
        clearInterval(this.typer);
        this.typing = false;
        next.style.opacity = 1;
      }
    }, interval || 28);
    this._fullText = text;
  },

  advance() {
    if (this.choosing) return;   // 选择支挂起时禁点按推进
    if (this.typing) {
      // 第一次点：立即显示全文
      clearInterval(this.typer);
      this.root.querySelector('#story-text').textContent = this._fullText;
      this.typing = false;
      this.root.querySelector('#story-next').style.opacity = 1;
      return;
    }
    this.idx++;
    if (this.idx >= this.beats.length) { this.finish(); return; }
    this.render();
  },

  finish() {
    clearInterval(this.typer);
    if (window.Sound && !(window.BattleUI && BattleUI.root)) Sound.bgm('home');
    // ⚠️ 只删"本次"的屏：淡出回调若引用 this.root，连播下一段 ADV 时会把新屏误删（导演器连播踩坑）
    const r = this.root;
    this.root = null;
    if (r) r.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300 }).onfinish = () => r.remove();
    const cb = this.onDone;
    this.onDone = null;
    if (cb) setTimeout(cb, 280);
  },
};

// ============================================================
//  漫画演出引擎（条漫式竖向滚动）
//  - 复用 story.js 的风格化立绘与场景背景
//  - 关键剧情以「分镜面板 + 对话气泡 + 旁白框 + 拟声词」呈现
//  - 走「图片优先、占位兜底」管线：面板/角色可后续替换真实漫画美术
// ============================================================

const Comic = {
  root: null,

  /** 打开一话漫画 */
  open(epId) {
    const ep = COMIC[epId];
    if (!ep) return;
    this.build(ep);
  },

  /** Director 的 comic 层入口：直接喂 ep 对象，读完（✕ 或底部按钮）回调 */
  openEp(ep, onDone) {
    this.onDone = onDone || null;
    this.build(ep);
  },

  /** 角色立绘（复用 Story 的占位立绘；指挥官用专属灰袍剪影） */
  charHTML(token) {
    if (!token) return '';
    if (token === 'cmd') {
      return `<div class="port-art" style="--c:#8a8f9c;">
        <div class="port-silhouette"></div>
        <div class="port-icon">🧭</div></div>`;
    }
    // 'IMG:路径' → 直接贴图（场景小人帧/一次性分镜素材）
    if (token.startsWith('IMG:')) {
      return `<img class="comic-img-px" src="${token.slice(4)}?v=${window.ASSET_VER || ''}" alt="">`;
    }
    return window.Story ? Story.portraitHTML(token) : '';
  },

  panelHTML(p) {
    const chars = (p.chars || []).map(c => {
      const x = c.x != null ? c.x : 50;
      const w = c.w || 46;
      const tf = `translateX(-50%)${c.flip ? ' scaleX(-1)' : ''}`;
      const dim = c.dim ? 'filter:brightness(.5) saturate(.7);' : '';
      return `<div class="comic-char" style="left:${x}%;width:${w}%;transform:${tf};${dim}">${this.charHTML(c.who)}</div>`;
    }).join('');

    const narr = p.narr ? `<div class="comic-narr">${p.narr}</div>` : '';
    const bubbles = (p.bubbles || []).map(b => {
      const name = b.speaker ? `<span class="cb-name">${b.speaker}</span>` : '';
      return `<div class="comic-bubble ${b.type || 'speech'} ${b.side || 'left'}">${name}<span class="cb-text">${b.text}</span></div>`;
    }).join('');
    const sfx = p.sfx ? `<div class="comic-sfx ${p.sfxPos || 'br'}">${p.sfx}</div>` : '';
    const h = p.h || (p.tall ? 360 : 240);

    const bgImg = p.bgImg ? `background-image:url('${p.bgImg}?v=${window.ASSET_VER || ''}');background-size:cover;background-position:center;image-rendering:pixelated;` : '';
    return `<div class="comic-panel bg-${p.bg || 'void'}" style="min-height:${h}px;${bgImg}">
      <div class="comic-art">${chars}${sfx}</div>
      <div class="comic-overlay">${narr}<div class="comic-bubbles">${bubbles}</div></div>
    </div>`;
  },

  build(ep) {
    const old = document.getElementById('comic-screen');
    if (old) old.remove();
    const panels = ep.panels.map(p => this.panelHTML(p)).join('');
    this.root = UI.el(`
      <div id="comic-screen">
        <div class="comic-top">
          <span class="comic-title">📖 ${ep.title}</span>
          <button class="ghost-btn" id="comic-close">✕</button>
        </div>
        <div class="comic-scroll">
          <div class="comic-cover bg-${ep.cover || 'void'}">
            <div class="comic-cover-title">${ep.title}</div>
            <div class="comic-cover-sub">${ep.sub || ''}</div>
          </div>
          ${panels}
          <div class="comic-end">— 完 —<br><span>${ep.end || ''}</span>
            ${this.onDone ? '<br><button class="btn" id="comic-continue" style="margin-top:12px;">继续 ▶</button>' : ''}
          </div>
        </div>
      </div>`);
    document.body.appendChild(this.root);
    const cont = this.root.querySelector('#comic-continue');
    if (cont) cont.onclick = () => this.close();
    if (window.Sound) { Sound.bgm('story'); Sound.sfx('open'); }
    this.root.querySelector('#comic-close').onclick = () => this.close();
    // 进场：面板逐个淡入
    const sc = this.root.querySelector('.comic-scroll');
    sc.scrollTop = 0;
    this.root.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 260 });
  },

  close() {
    if (!this.root) return;
    if (window.Sound) Sound.bgm('home');
    const r = this.root;
    r.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 220 }).onfinish = () => { r.remove(); };
    this.root = null;
    const cb = this.onDone; this.onDone = null;
    if (cb) setTimeout(cb, 240);
  },
};

//  - 瓦片程序化绘制（占位美术），结构优先，真实瓦片集可后续替换
// ============================================================

const World = {
  root: null, canvas: null, ctx: null, raf: 0,
  chapter: null, grid: null, w: 0, h: 0, theme: null,
  cam: { x: 0, y: 0 }, vw: 0, vh: 0, dpr: 1,
  player: { x: 0, y: 0, dir: 'down', face: 'south', step: 0, color: '#b06bff' },
  input: { up: false, down: false, left: false, right: false },
  nodes: [], cur: null, busyTrigger: false, active: false,
  sprite: null, _spriteT: 0,    // PixelLab 主角序列帧（地图）

  // 顶视角占位渲染（纯色地块 + emoji 道具，无外接美术）
  TILE: 16, SCALE: 3,            // 屏上 48px / 格
  COL: { grass: '#4f7a3a', grass2: '#578544', path: '#8a6a3a', water: '#2f6aa0' },
  EMO: { tree: '🌲', rock: '🪨', bush: '🌿', mush: '🍄', mon: ['👹', '👺', '💀'] },

  // 节点在地图中的预设槽位（从下往上推进，制造「前进」感）
  SLOTS: [
    { x: 7.5, y: 11.5 }, { x: 5.5, y: 9.5 }, { x: 9.5, y: 8.5 },
    { x: 5.5, y: 6.5 }, { x: 10.5, y: 5.5 }, { x: 7.5, y: 3.5 },
  ],
  START: { x: 7.5, y: 13.2 },

  // ---------- 章节数据：关卡 = 节点 ----------
  CHAPTERS: [
    {
      id: 'ch1', name: '第一章 · 艾尔玛森林', theme: 'forest',
      desc: '初出茅庐的佣兵团，从森林边缘启程。',
      steps: [
        { type: 'story', story: 'stage1', label: '查看森林入口' },
        { type: 'npc', label: '与老猎人交谈', icon: I('npc_hunter'),
          text: '老猎人：「森林里的哥布林最近不太安分。年轻人，先帮我清掉它们，深处的狼群就交给你了。」' },
        { type: 'battle', stage: 1, label: '击退哥布林群' },
        { type: 'story', story: 'stage2', label: '深入森林' },
        { type: 'battle', stage: 2, label: '讨伐暗影狼群' },
      ],
    },
    {
      id: 'ch2', name: '第二章 · 矿洞与山脊', theme: 'cave',
      desc: '循着魔物的踪迹，深入废弃矿洞与诅咒山脊。',
      steps: [
        { type: 'story', story: 'stage3', label: '进入废弃矿洞' },
        { type: 'battle', stage: 3, label: '击败食人魔' },
        { type: 'story', story: 'stage4', label: '登上诅咒山脊' },
        { type: 'battle', stage: 4, label: '讨伐巨魔王' },
      ],
    },
    {
      id: 'ch3', name: '第三章 · 魔王城', theme: 'castle',
      desc: '一切罪恶的源头，魔王巴尔的王座。',
      steps: [
        { type: 'story', story: 'stage5', label: '闯入魔王城' },
        { type: 'battle', stage: 5, label: '决战魔王巴尔' },
      ],
    },
    {
      id: 'ch4', name: '第四章 · 永夜降临', theme: 'castle',
      desc: '魔王虽除，永夜未散。真正的黑暗仍在等待。',
      steps: [
        { type: 'story', story: 'stage6', label: '踏入破碎边境' },
        { type: 'battle', stage: 6, label: '扫荡亡魂' },
        { type: 'story', story: 'stage7', label: '深入永夜回廊' },
        { type: 'battle', stage: 7, label: '终结暗影女皇' },
      ],
    },
  ],

  getChapter(id) { return this.CHAPTERS.find(c => c.id === id); },
  progress(id) { return Game.state.chapterProgress[id] || 0; },
  isChapterUnlocked(idx) {
    if (idx === 0) return true;
    const prev = this.CHAPTERS[idx - 1];
    return this.progress(prev.id) >= prev.steps.length;
  },
  isChapterDone(c) { return this.progress(c.id) >= c.steps.length; },

  // ---------- 打开章节 ----------
  openChapter(id) {
    const ch = this.getChapter(id);
    if (!ch) return;
    if (Game.state.team.length === 0) { UI.toast('请先在「佣兵」页编入出战队伍'); Main.switchScreen('roster'); return; }
    this.chapter = ch; this.theme = ch.theme; this.w = 15; this.h = 15;
    this.loadFieldSprite();
    this.buildDOM();
    this.buildMap(ch);
    this.buildParty();
    this.active = true; this.busyTrigger = false;
    this.start();
    this.announceObjective(false);
  },

  buildDOM() {
    const old = document.getElementById('world-screen');
    if (old) old.remove();
    this.root = UI.el(`
      <div id="world-screen">
        <div class="world-top">
          <span id="world-title">🗺️ ${this.chapter.name}</span>
          <button class="ghost-btn" id="world-exit" title="离开">✕</button>
        </div>
        <div class="world-obj" id="world-obj"></div>
        <canvas id="world-canvas"></canvas>
        <div class="world-ctrl">
          <div class="joystick" id="world-joy"><div class="joy-knob" id="joy-knob"></div></div>
          <button class="act-btn" id="world-act" disabled>互动</button>
        </div>
      </div>`);
    document.body.appendChild(this.root);
    this.canvas = this.root.querySelector('#world-canvas');
    this.ctx = this.canvas.getContext('2d');
    this.resize();
    this.root.querySelector('#world-exit').onclick = () => this.close();
    this.root.querySelector('#world-act').onclick = () => this.tryTrigger(true);
    // —— 虚拟摇杆（轮盘）：输出连续向量，实现自然 8 方向移动 ——
    const joy = this.root.querySelector('#world-joy'), knob = this.root.querySelector('#joy-knob');
    this.joy = { active: false, x: 0, y: 0 };
    const radius = () => joy.clientWidth / 2;
    const setKnob = (kx, ky) => { knob.style.transform = `translate(${kx}px,${ky}px)`; };
    const move = (e) => {
      if (!this.joy.active) return; e.preventDefault();
      const t = (e.touches && e.touches[0]) || e;
      const r = joy.getBoundingClientRect();
      let dx = t.clientX - (r.left + r.width / 2), dy = t.clientY - (r.top + r.height / 2);
      const rad = radius(), len = Math.hypot(dx, dy);
      if (len > rad) { dx = dx / len * rad; dy = dy / len * rad; }
      setKnob(dx, dy);
      this.joy.x = dx / rad; this.joy.y = dy / rad;   // [-1,1]
    };
    const start = (e) => { this.joy.active = true; move(e); };
    const end = () => { this.joy.active = false; this.joy.x = this.joy.y = 0; setKnob(0, 0); };
    joy.addEventListener('touchstart', start, { passive: false });
    joy.addEventListener('touchmove', move, { passive: false });
    joy.addEventListener('touchend', end); joy.addEventListener('touchcancel', end);
    joy.addEventListener('mousedown', start);
    window.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
    this._keyHandler = (e) => {
      const m = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right' };
      const dir = m[e.key];
      if (!dir) { if ((e.key === ' ' || e.key === 'Enter') && e.type === 'keydown') this.tryTrigger(true); return; }
      this.input[dir] = (e.type === 'keydown'); e.preventDefault();
    };
    window.addEventListener('keydown', this._keyHandler);
    window.addEventListener('keyup', this._keyHandler);
  },

  resize() {
    const rect = this.canvas.getBoundingClientRect();
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.vw = rect.width; this.vh = rect.height;
    this.canvas.width = Math.floor(this.vw * this.dpr);
    this.canvas.height = Math.floor(this.vh * this.dpr);
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
  },

  buildMap(ch) {
    // 网格：边界树 + 草地 + 稀疏装饰障碍
    const grid = [];
    for (let y = 0; y < this.h; y++) {
      const row = [];
      for (let x = 0; x < this.w; x++) {
        row.push((x === 0 || y === 0 || x === this.w - 1 || y === this.h - 1) ? 'tree' : 'grass');
      }
      grid.push(row);
    }
    const deco = [[2,2],[12,2],[3,11],[12,11],[2,7],[12,8],[6,12],[9,2]];
    deco.forEach(([x, y], i) => { grid[y][x] = (i % 3 === 0) ? 'rock' : 'tree'; });
    // 池塘
    [[11,3],[12,3],[11,4]].forEach(([x, y]) => grid[y][x] = 'water');
    this.grid = grid;

    // 花装饰
    this.flowers = [];
    for (let i = 0; i < 40; i++) {
      const x = (i * 7) % this.w, y = (i * 11) % this.h;
      if (grid[y][x] === 'grass' && i % 4 === 0) this.flowers.push([x + 0.5, y + 0.5, i % 3]);
    }

    // 节点 = 步骤
    const prog = this.progress(ch.id);
    this.nodes = ch.steps.map((st, i) => {
      const slot = this.SLOTS[i] || this.SLOTS[this.SLOTS.length - 1];
      const fallback = st.type === 'battle' ? '⚔️' : st.type === 'story' ? '💬' : st.type === 'npc' ? '🗣️' : '❔';
      const icon = st.icon || fallback;   // 对话框用（可为 <img> HTML）
      // 画布节点标记只能用纯字形：HTML 图标(<img…>)在画布上会被 fillText 当文字画出来 → 用 fallback emoji
      const glyph = (typeof icon === 'string' && icon.trim()[0] === '<') ? fallback : icon;
      // 确保节点格可走
      const gx = Math.floor(slot.x), gy = Math.floor(slot.y);
      if (this.isSolid(grid[gy][gx])) grid[gy][gx] = 'grass';
      return { ...st, idx: i, x: slot.x, y: slot.y, icon, glyph, done: i < prog };
    });
    this.cur = this.nodes[prog] || null;

    // 剧情叙事：一条从森林边缘（起点）蜿蜒通往深处的「路」（呼应剧情「守的不是地方——是路」）
    const route = [this.START, ...this.nodes.map(n => ({ x: n.x, y: n.y }))];
    for (let i = 0; i < route.length - 1; i++) this.markPath(grid, route[i], route[i + 1]);

    // 主角
    this.player.x = this.START.x; this.player.y = this.START.y; this.player.dir = 'up';
    // 在战斗节点附近散布几只小怪（叙事点缀：森林里的哥布林/魔物）
    this.mons = [];
    this.nodes.filter(n => n.type === 'battle').forEach(n => {
      const idx = (this.vrand(n.x | 0, n.y | 0) * 3) | 0;
      this.mons.push({ x: n.x + 0.85, y: n.y + 0.5, idx, ph: this.vrand(n.x, n.y) * 6.28 });
    });
    this.buildScatter();
    this.loadArt();
  },

  // 把两点之间的草地格标记为「路」（dirt），构成叙事化的森林小径（约 2 格宽）
  markPath(grid, a, b) {
    const steps = Math.ceil(Math.hypot(b.x - a.x, b.y - a.y) * 4);
    for (let s = 0; s <= steps; s++) {
      const t = s / steps, cx = a.x + (b.x - a.x) * t, cy = a.y + (b.y - a.y) * t;
      for (const [ox, oy] of [[0, 0], [0.5, 0]]) {
        const gx = Math.floor(cx + ox), gy = Math.floor(cy + oy);
        if (gx > 0 && gy > 0 && gx < this.w - 1 && gy < this.h - 1 && grid[gy][gx] === 'grass') grid[gy][gx] = 'path';
      }
    }
  },

  // 在空地上确定性散布装饰（灌木/蘑菇/小树），让场景丰富不单一；纯装饰不阻挡
  buildScatter() {
    this.scatter = [];
    const free = (x, y) => this.grid[y] && this.grid[y][x] === 'grass'
      && !this.nodes.some(n => Math.abs(n.x - x) < 1.5 && Math.abs(n.y - y) < 1.5)
      && Math.abs(this.START.x - x) > 1.5;
    for (let y = 2; y < this.h - 2; y++) {
      for (let x = 2; x < this.w - 2; x++) {
        if (!free(x, y)) continue;
        const r = this.vrand(x * 3 + 1, y * 5 + 2);
        let kind = null;
        if (r > 0.92) kind = 'tree';
        else if (r > 0.78) kind = 'bush';
        else if (r > 0.66) kind = 'mush';
        if (kind) this.scatter.push({ x: x + 0.5, y: y + 0.5, kind, gx: x, gy: y });
      }
    }
  },

  loadArt() { /* 占位渲染，无需加载外部美术 */ },

  // 确定性伪随机（按格选变体，保证每次渲染一致）
  vrand(x, y) { let h = ((x | 0) * 73856093) ^ ((y | 0) * 19349663); h = (h ^ (h >>> 13)) >>> 0; return h / 4294967295; },

  // emoji 立绘式贴地绘制（底部中心对齐格底）
  emoji(ch, sx, sy, size) {
    const ctx = this.ctx, TS = this.TILE * this.SCALE;
    ctx.font = size + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(ch, sx + TS / 2, sy + TS * 0.92);
  },

  isSolid(t) { return t === 'tree' || t === 'rock' || t === 'water'; },

  // ---------- 坐标变换（顶视角正交）----------
  worldToScreen(wx, wy) { const t = this.TILE * this.SCALE; return { x: wx * t, y: wy * t }; },

  // ---------- 主循环 ----------
  start() {
    cancelAnimationFrame(this.raf);
    let last = performance.now();
    const loop = (ts) => {
      if (!this.active) return;
      const dt = Math.min(40, ts - last); last = ts;
      this.update(dt); this.render();
      this.raf = requestAnimationFrame(loop);
    };
    this.raf = requestAnimationFrame(loop);
  },
  stop() { this.active = false; cancelAnimationFrame(this.raf); },
  resume() { if (this.root) { this.active = true; this.busyTrigger = false; this.start(); } },

  update(dt) {
    const p = this.player; this._dustDt = dt;
    this._spriteT += dt;
    let dx = 0, dy = 0;
    // 摇杆优先（连续向量 → 自然 8 方向 + 模拟力度）；否则键盘
    if (this.joy && this.joy.active && Math.hypot(this.joy.x, this.joy.y) > 0.18) {
      dx = this.joy.x; dy = this.joy.y;
    } else {
      if (this.input.left) dx -= 1;
      if (this.input.right) dx += 1;
      if (this.input.up) dy -= 1;
      if (this.input.down) dy += 1;
    }
    const mag = Math.hypot(dx, dy);
    if (mag > 0.01) {
      const sp = 0.075 * (dt / 16.67) * Math.min(1, mag);   // 力度影响速度（摇杆轻推=慢走）
      const nx = p.x + (dx / mag) * sp, ny = p.y + (dy / mag) * sp;
      if (!this.blockedWorld(nx, p.y)) p.x = nx;
      if (!this.blockedWorld(p.x, ny)) p.y = ny;
      p.dir = Math.abs(dx) >= Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'); // 4 向(兼容)
      p.face = this.dir8(dx, dy);   // 8 向朝向（贴图用）
      p.step += dt;
    } else p.step = 0;

    this.updateParty(dt);   // 队员沿队长足迹跟随

    // 镜头（顶视角，限制在地图范围内）
    const TS = this.TILE * this.SCALE;
    this.cam.x = this.clamp(p.x * TS - this.vw / 2, 0, Math.max(0, this.w * TS - this.vw));
    this.cam.y = this.clamp(p.y * TS - this.vh / 2, 0, Math.max(0, this.h * TS - this.vh));

    // 到达当前目标 → 自动触发
    if (this.cur && !this.busyTrigger) {
      const d = Math.hypot(this.cur.x - p.x, this.cur.y - p.y);
      const act = this.root.querySelector('#world-act');
      const replayable = this.nodes.filter(n => n.done && n.type === 'battle');
      // 当前目标范围内
      if (d < 0.7) { this.tryTrigger(false); }
      // 互动按钮：当前目标 或 可重打的已完成战斗
      let near = (d < 1.0) ? this.cur : null;
      if (!near) {
        for (const n of replayable) { if (Math.hypot(n.x - p.x, n.y - p.y) < 1.0) { near = n; break; } }
      }
      this._near = near;
      if (act) { act.disabled = !near; act.textContent = near && near.type === 'battle' ? '战斗' : '互动'; }
    }
  },

  clamp(v, lo, hi) { if (lo > hi) return (lo + hi) / 2; return Math.max(lo, Math.min(hi, v)); },

  blockedWorld(wx, wy) {
    const r = 0.28;
    const pts = [[wx - r, wy - r], [wx + r, wy - r], [wx - r, wy + r], [wx + r, wy + r]];
    return pts.some(([x, y]) => {
      const tx = Math.floor(x), ty = Math.floor(y);
      if (tx < 0 || ty < 0 || tx >= this.w || ty >= this.h) return true;
      return this.isSolid(this.grid[ty][tx]);
    });
  },

  // ---------- 触发 ----------
  tryTrigger(manual) {
    if (this.busyTrigger) return;
    const n = manual ? (this._near || this.cur) : this.cur;
    if (!n) return;
    // 已完成的可重打战斗
    if (n.done && n.type === 'battle') {
      if (!manual) return;
      this.busyTrigger = true; this.stop();
      const stage = window.GameData.STAGES.find(s => s.id === n.stage);
      BattleUI.start(stage, () => this.resume());
      return;
    }
    if (n !== this.cur) return;
    this.busyTrigger = true; this.stop();
    if (n.type === 'story') {
      Story.play(n.story, () => this.completeStep());
    } else if (n.type === 'npc') {
      this.npcDialog(n, () => this.completeStep());
    } else if (n.type === 'battle') {
      const stage = window.GameData.STAGES.find(s => s.id === n.stage);
      BattleUI.start(stage, () => {
        if (Battle.result === 'win') this.completeStep();
        else this.resume(); // 失败/撤退：留在当前目标重试
      });
    }
  },

  completeStep() {
    const id = this.chapter.id;
    const prog = this.progress(id);
    if (this.cur && this.cur.idx === prog) {
      Game.state.chapterProgress[id] = prog + 1;
      // 里程碑奖励（首次完成该步骤）：作为「累计 100 抽」的主线发放部分
      const gem = this.cur.type === 'battle' ? 600 : this.cur.type === 'story' ? 300 : 200;
      Game.state.gem += gem;
      Game.save();
      this.cur.done = true;
      UI.updateResources();
      UI.toast(`🎯 里程碑奖励：💎${gem}`);
    }
    const next = this.nodes[this.progress(id)];
    this.cur = next || null;
    if (next) { this.resume(); this.announceObjective(true); }
    else { this.chapterCompleteReward(); this.chapterComplete(); }
  },

  /** 章节通关额外奖励 */
  chapterCompleteReward() {
    Game.state.gem += 600;
    Game.save();
    UI.updateResources();
  },

  announceObjective(isNew) {
    const obj = this.root && this.root.querySelector('#world-obj');
    if (!obj) return;
    if (this.cur) {
      obj.innerHTML = `<span class="obj-tag">目标</span> ${this.cur.label}`;
      if (isNew) { obj.classList.remove('flash'); void obj.offsetWidth; obj.classList.add('flash'); }
    } else obj.textContent = '';
  },

  chapterComplete() {
    this.stop();
    const m = UI.openModal(`
      <div class="result-modal">
        <div class="result-title win" style="font-size:24px;">章节完成！</div>
        <p class="muted">${this.chapter.name}</p>
        <p style="margin-top:8px;">恭喜通关本章节，新的征程已经解锁。</p>
      </div>
      <div class="close-row" style="justify-content:center;"><button class="btn" id="cc-ok">返回</button></div>`,
      { noBackdropClose: true });
    m.querySelector('#cc-ok').onclick = () => { UI.closeModal(m); this.close(); };
  },

  npcDialog(n, onDone) {
    const m = UI.openModal(`
      <h2>${n.icon} ${n.label.replace('与', '').replace('交谈', '')}</h2>
      <p style="line-height:1.7;margin:10px 0;">${n.text}</p>
      <div class="close-row"><button class="btn" id="npc-ok">好的</button></div>`, { noBackdropClose: true });
    m.querySelector('#npc-ok').onclick = () => { UI.closeModal(m); if (onDone) onDone(); };
  },

  // ---------- 渲染（顶视角 · 占位）----------
  render() {
    const ctx = this.ctx;
    ctx.fillStyle = this.COL.grass; ctx.fillRect(0, 0, this.vw, this.vh);

    const TS = this.TILE * this.SCALE;
    const x0 = Math.max(0, ((this.cam.x / TS) | 0) - 1), x1 = Math.min(this.w - 1, (((this.cam.x + this.vw) / TS) | 0) + 1);
    const y0 = Math.max(0, ((this.cam.y / TS) | 0) - 1), y1 = Math.min(this.h - 1, (((this.cam.y + this.vh) / TS) | 0) + 2);

    // 1) 地面层（纯色地块：草/路/水）
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const sx = Math.round(x * TS - this.cam.x), sy = Math.round(y * TS - this.cam.y);
        const t = this.grid[y][x];
        ctx.fillStyle = t === 'water' ? this.COL.water : t === 'path' ? this.COL.path
          : ((x + y) & 1 ? this.COL.grass2 : this.COL.grass);
        ctx.fillRect(sx, sy, TS + 1, TS + 1);
      }
    }

    // 2) 物体层（树/灌木/节点/小怪/主角）按 y 排序，后画的盖前面
    const objs = [];
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
      const t = this.grid[y][x];
      if (t === 'tree' || t === 'rock') objs.push({ sy: y + 0.9, kind: 'deco', tt: t, gx: x, gy: y });
    }
    (this.scatter || []).forEach(s => objs.push({ sy: s.y, kind: 'scatter', s }));
    this.nodes.forEach(n => objs.push({ sy: n.y, kind: 'node', node: n }));
    (this.mons || []).forEach(m => objs.push({ sy: m.y, kind: 'mon', m }));
    (this.party || [this.player]).forEach(m => objs.push({ sy: m.y, kind: 'player', m }));
    objs.sort((a, b) => a.sy - b.sy);
    for (const o of objs) {
      if (o.kind === 'deco') this.drawDeco(o.gx, o.gy, o.tt);
      else if (o.kind === 'scatter') this.drawScatter(o.s);
      else if (o.kind === 'node') this.drawNodeTD(o.node);
      else if (o.kind === 'mon') this.drawMon(o.m);
      else this.drawPlayer(o.m);
    }

    // 纵深氛围：越往森林深处（屏上方）越阴冷
    const g = ctx.createLinearGradient(0, 0, 0, this.vh);
    g.addColorStop(0, 'rgba(12,18,32,0.30)'); g.addColorStop(0.55, 'rgba(12,18,32,0.04)'); g.addColorStop(1, 'rgba(40,30,18,0.0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, this.vw, this.vh);

    this.drawDust();
    this.drawGuideArrow();
  },

  // 树/石（emoji 占位）
  drawDeco(x, y, tt) {
    const TS = this.TILE * this.SCALE;
    const sx = x * TS - this.cam.x, sy = y * TS - this.cam.y;
    this.emoji(tt === 'tree' ? this.EMO.tree : this.EMO.rock, sx, sy, tt === 'tree' ? 40 : 32);
  },

  // 散布装饰（小树/灌木/蘑菇，emoji 占位）
  drawScatter(s) {
    const TS = this.TILE * this.SCALE;
    const sx = s.gx * TS - this.cam.x, sy = s.gy * TS - this.cam.y;
    const ch = s.kind === 'tree' ? this.EMO.tree : s.kind === 'bush' ? this.EMO.bush : this.EMO.mush;
    this.emoji(ch, sx, sy, s.kind === 'tree' ? 34 : 22);
  },

  // 小怪（emoji + 轻微浮动）
  drawMon(m) {
    const TS = this.TILE * this.SCALE;
    const sx = m.x * TS - this.cam.x, sy = m.y * TS - this.cam.y;
    const bob = Math.sin(performance.now() / 500 + m.ph) * 3;
    this.emoji(this.EMO.mon[m.idx % this.EMO.mon.length], sx, sy - bob, 28);
  },

  // 节点标记（顶视角）
  drawNodeTD(n) {
    const ctx = this.ctx, TS = this.TILE * this.SCALE;
    const sx = n.x * TS - this.cam.x, sy = n.y * TS - this.cam.y;
    ctx.save();
    if (n.done && n.type !== 'battle') ctx.globalAlpha = 0.45;
    if (n === this.cur) {
      const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 280);
      ctx.beginPath(); ctx.arc(sx, sy, 20 + pulse * 5, 0, 7);
      ctx.fillStyle = 'rgba(255,220,120,' + (0.13 + pulse * 0.16) + ')'; ctx.fill();
    }
    ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(sx, sy + 13, 16, 7, 0, 0, 7); ctx.fill();
    ctx.font = '26px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(n.done ? (n.type === 'battle' ? n.glyph : '✓') : n.glyph, sx, sy);
    if (n === this.cur) {
      const bob = Math.sin(performance.now() / 200) * 3;
      ctx.font = '18px serif'; ctx.fillStyle = '#ffd35a'; ctx.fillText('▼', sx, sy - 28 + bob);
    }
    ctx.restore();
  },

  // 褐尘粒子（屏幕空间，循环飘落）
  drawDust() {
    const ctx = this.ctx;
    if (!this.dust) {
      this.dust = [];
      for (let i = 0; i < 46; i++) this.dust.push({ x: Math.random() * this.vw, y: Math.random() * this.vh, s: 0.6 + Math.random() * 1.6, v: 6 + Math.random() * 14, d: Math.random() * 6.28 });
    }
    const dt = this._dustDt || 16;
    ctx.save();
    for (const p of this.dust) {
      p.y += p.v * dt / 1000; p.x += Math.sin((performance.now() / 900) + p.d) * 0.25;
      if (p.y > this.vh + 4) { p.y = -4; p.x = Math.random() * this.vw; }
      ctx.globalAlpha = 0.28 + (p.s / 2.2) * 0.4;
      ctx.fillStyle = '#9c7a4e'; ctx.fillRect(p.x, p.y, p.s, p.s);
    }
    ctx.restore();
  },

  // 移动向量 → 8 向贴图名（屏幕坐标 y 向下）
  dir8(vx, vy) {
    const names = ['east', 'south-east', 'south', 'south-west', 'west', 'north-west', 'north', 'north-east'];
    const i = Math.round(Math.atan2(vy, vx) / (Math.PI / 4));
    return names[((i % 8) + 8) % 8];
  },

  // 单位 → sprite 资源 key：当前出战服装若有整套 field sprite 就用它，否则回落 charId。
  _spriteKey(o) {
    const reg = (window.BattleUI && window.BattleUI.FIELD_SPRITE) || {};
    return (o && o.activeCostume && reg[o.activeCostume]) ? o.activeCostume : (o && o.charId);
  },
  // 载入 PixelLab 序列帧（地图用）——出战队每个有 field sprite 的（角色×出战服装）都载入
  loadFieldSprite() {
    const reg = (window.BattleUI && window.BattleUI.FIELD_SPRITE) || { lecliss: 'art/05_pixellab/lecliss_field' };
    const team = (window.Game && Game.state && Game.state.team) || [];
    const ids = [];
    team.forEach(uid => { const o = Game.getOwned && Game.getOwned(uid); const k = this._spriteKey(o); if (o && reg[k] && !ids.includes(k)) ids.push(k); });
    if (!ids.length) ids.push(reg.lecliss ? 'lecliss' : Object.keys(reg)[0]);
    this._leaderCharId = ids[0];
    this.sprites = this.sprites || {};
    const V = window.ASSET_VER || '1';
    ids.forEach(charId => {
      if (this.sprites[charId]) return;
      const BASE = reg[charId]; const sp = this.sprites[charId] = { ready: false, man: null, imgs: {} };
      fetch(BASE + '/manifest.json?v=' + V).then(r => r.json()).then(man => {
        sp.man = man;
        const mk = src => { const im = new Image(); im.src = src; return im; };
        for (const anim in man.anims) {
          sp.imgs[anim] = {};
          for (const d of man.dirs) {
            const n = man.anims[anim].frames[d] || 0, arr = [];
            for (let i = 0; i < n; i++) arr.push(mk(`${BASE}/${anim}/${d}/${String(i).padStart(2, '0')}.png?v=${V}`));
            sp.imgs[anim][d] = arr;
          }
        }
        sp.ready = true;
      }).catch(() => { this.sprites[charId] = null; });
    });
  },

  // 组建队伍：队长(team[0])可操作，其余成员沿队长足迹跟随
  buildParty() {
    const team = (window.Game && Game.state && Game.state.team) || [];
    const members = [];
    team.forEach(uid => { const o = Game.getOwned && Game.getOwned(uid); if (o) members.push({ charId: o.charId, key: this._spriteKey(o) }); });
    if (!members.length) members.push({ charId: this._leaderCharId || 'lecliss', key: this._leaderCharId || 'lecliss' });
    this.player.charId = members[0].charId;            // 队长 = 复用现有 player（移动/镜头/触发都基于它）
    this.player.spriteKey = members[0].key;            // 出战服装决定队长地图立绘
    this.party = [this.player];
    for (let i = 1; i < members.length; i++)
      this.party.push({ charId: members[i].charId, spriteKey: members[i].key, x: this.player.x, y: this.player.y, face: 'south', dir: 'down', step: 0, color: '#b06bff' });
    this.trail = [{ x: this.player.x, y: this.player.y }];
  },

  // 跟随更新：队长走过的位置做面包屑，后续成员各落后若干面包屑
  updateParty(dt) {
    if (!this.party || this.party.length < 2) return;
    const p = this.player, head = this.trail[0];
    if (!head || Math.hypot(p.x - head.x, p.y - head.y) >= 0.16) {
      this.trail.unshift({ x: p.x, y: p.y });
      const maxLen = 8 * this.party.length + 8;
      if (this.trail.length > maxLen) this.trail.length = maxLen;
    }
    const PER = 6;   // 每名成员间隔的面包屑数（≈0.96 格）
    for (let i = 1; i < this.party.length; i++) {
      const f = this.party[i], idx = Math.min(this.trail.length - 1, i * PER);
      const tp = this.trail[idx]; if (!tp) continue;
      const ahead = this.trail[Math.max(0, idx - 1)];   // 朝队长方向的前一个面包屑
      f.x = tp.x; f.y = tp.y;
      const fdx = ahead.x - tp.x, fdy = ahead.y - tp.y;
      if (Math.hypot(fdx, fdy) > 0.001) { f.face = this.dir8(fdx, fdy); f.dir = Math.abs(fdx) >= Math.abs(fdy) ? (fdx > 0 ? 'right' : 'left') : (fdy > 0 ? 'down' : 'up'); }
      f.step = p.step > 0 ? f.step + dt : 0;
    }
  },

  drawPlayer(p) {
    p = p || this.player;
    const ctx = this.ctx;
    const TS = this.TILE * this.SCALE;
    const cx = p.x * TS - this.cam.x, cy = p.y * TS - this.cam.y;
    const moving = p.step > 0;
    // 阴影
    ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(cx, cy + TS * 0.34, TS * 0.26, TS * 0.11, 0, 0, 7); ctx.fill();

    // —— PixelLab 序列帧 ——（按出战服装 key 取图，回落 charId）
    const sp = (this.sprites && this.sprites[p.spriteKey || p.charId]) || null;
    if (sp && sp.ready) {
      const dir = p.face || 'south';
      const anim = moving ? 'run' : 'idle';
      const arr = (sp.imgs[anim] && sp.imgs[anim][dir] && sp.imgs[anim][dir].length) ? sp.imgs[anim][dir] : sp.imgs.idle.south;
      const fps = (sp.man.fps && sp.man.fps[anim]) || 8;
      const im = arr[Math.floor(this._spriteT / 1000 * fps) % arr.length];
      const bb = sp.man.bbox;
      const targetH = TS * 1.55, scale = targetH / bb.h;     // 身体比例不变（仍以 bbox 高为准）
      const bob = moving ? Math.abs(Math.sin(p.step / 95)) * 3 : 0;
      if (im && im.width) {
        ctx.imageSmoothingEnabled = false;
        // 画**整幅**而非只裁 bbox：脚(bbox 底)对齐地线，头顶以上(抬头/光环)不再被裁。
        const groundY = cy + TS * 0.30 - bob, feetSrcY = bb.y + bb.h;
        ctx.drawImage(im, 0, 0, im.width, im.height,
          cx - (im.width * scale) / 2, groundY - feetSrcY * scale, im.width * scale, im.height * scale);
        ctx.imageSmoothingEnabled = true;
      }
      return;
    }

    // —— 占位主角（序列帧未就绪时）——
    const bob = moving ? Math.abs(Math.sin(p.step / 95)) * 4 : (Math.sin(performance.now() / 620) * 0.5 + 0.5) * 2;
    const bx = cx, by = cy + TS * 0.18 - bob;
    ctx.fillStyle = p.color || '#b06bff';
    this.rr(bx - 9, by - 18, 18, 20, 6); ctx.fill();
    ctx.fillStyle = '#ffe0c0'; ctx.beginPath(); ctx.arc(bx, by - 22, 8, 0, 7); ctx.fill();
    ctx.fillStyle = '#3a2a2a';
    const off = { up: [0, -3], down: [0, 2], left: [-3, 0], right: [3, 0] }[p.dir] || [0, 2];
    ctx.beginPath(); ctx.arc(bx + off[0], by - 22 + off[1], 1.8, 0, 7); ctx.fill();
  },

  rr(x, y, w, h, r) {
    const ctx = this.ctx; ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  },

  drawGuideArrow() {
    if (!this.cur) return;
    const s = this.worldToScreen(this.cur.x, this.cur.y);
    const sx = s.x - this.cam.x, sy = s.y - this.cam.y;
    if (sx >= 20 && sx <= this.vw - 20 && sy >= 20 && sy <= this.vh - 20) return; // 在屏内不画
    const cx = this.vw / 2, cy = this.vh / 2;
    const ang = Math.atan2(sy - cy, sx - cx);
    const ex = cx + Math.cos(ang) * (Math.min(this.vw, this.vh) / 2 - 28);
    const ey = cy + Math.sin(ang) * (Math.min(this.vw, this.vh) / 2 - 28);
    const ctx = this.ctx; ctx.save(); ctx.translate(ex, ey); ctx.rotate(ang);
    ctx.fillStyle = '#ffd35a'; ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-8, -8); ctx.lineTo(-8, 8); ctx.closePath(); ctx.fill();
    ctx.restore();
  },

  palette() {
    return ({
      forest: { bg: '#16241a', grass: '#2e5a34', grass2: '#356b3c', water: '#2a6aa0' },
      cave:   { bg: '#130f0c', grass: '#3a2f28', grass2: '#46382f', water: '#3a6a8a' },
      castle: { bg: '#160a12', grass: '#3a2436', grass2: '#46304a', water: '#5a3a6a' },
    })[this.theme] || { bg: '#181818', grass: '#3a3a3a', grass2: '#444', water: '#2a6aa0' };
  },

  close() {
    this.stop();
    if (this._keyHandler) { window.removeEventListener('keydown', this._keyHandler); window.removeEventListener('keyup', this._keyHandler); }
    if (this.root) { this.root.remove(); this.root = null; }
    Main.refreshCurrent();
  },
};

window.World = World;


// ============================================================
//  Director —— 剧情演出导演器（圣经 v2 §5 / 说明书剧情演出章）
//  执行剧本 DSL：一段剧情 = op 序列，跨五个演出层自由混排：
//    adv(对白) / scene(场景演出) / battle(战斗+插话) / comic(条漫) / (cg 走 adv 的 beat)
//  剧本数据在 js/story2.js 的 window.SCRIPTS。
// ============================================================

const Director = {
  running: false,

  seen(id) { return Story.seen(id); },

  async play(id, onDone) {
    const script = (window.SCRIPTS || {})[id];
    if (!script || !script.length) { if (onDone) onDone(); return; }
    this.running = true;
    for (const op of script) {
      if (!this.running) break;
      await this.exec(op);
    }
    this.running = false;
    Story.markSeen(id);
    if (onDone) onDone();
  },

  stop() { this.running = false; },

  exec(op) {
    return new Promise(res => {
      switch (op.op) {
        case 'adv':    Story.playBeats(op.beats, res); break;
        case 'scene':  SceneStage.run(op, res); break;
        case 'comic':  Comic.openEp(op.ep, res); break;
        case 'battle': this.runBattle(op, res); break;
        case 'wait':   setTimeout(res, op.ms || 500); break;
        default: console.warn('Director: 未知 op', op.op); res();
      }
    });
  },

  /** 战斗（输了自动重开，直到打赢才推进剧情） */
  runBattle(op, done) {
    const go = () => {
      BattleUI.start(op.stage, () => {
        if (Battle.result === 'win') done();
        else { UI.toast('再试一次。灯还没灭。'); setTimeout(go, 600); }
      });
    };
    go();
  },

  /** 剧情 flag（choice 写入；跨 op / 跨章可查） */
  setFlag(k, v) {
    Game.state.storyFlags = Game.state.storyFlags || {};
    Game.state.storyFlags[k] = v === undefined ? true : v;
    Game.save();
  },
  flag(k) { return (Game.state.storyFlags || {})[k]; },
};

// ============================================================
//  SceneStage —— 场景演出层：地图小人走位/转向/对话泡/低语/镜头
//  actor 用 field sprite（与战斗/大世界同一套资源）。
//  cfg = { bg, night, actors:{id:{sprite,x,y,dir}}, steps:[...] }
//  step: {t:'move',who,to:[x,y],dur} {t:'face',who,dir} {t:'wait',ms}
//        {t:'say',who,text} {t:'whisper',who} {t:'narr',text}
//        {t:'camera',scale,x,y,dur} {t:'hide',who} {t:'show',who}
// ============================================================
const SceneStage = {
  root: null, actors: {}, _raf: 0, camera: { scale: 1, x: 50, y: 50 },

  async run(cfg, onDone) {
    this.build(cfg);
    await this.loadSprites(cfg);
    this.placeActors(cfg);
    this._raf = requestAnimationFrame(t => this.tick(t));
    for (const step of cfg.steps || []) await this.step(step);
    this.destroy();
    if (onDone) setTimeout(onDone, 250);
  },

  build(cfg) {
    const old = document.getElementById('scene-stage'); if (old) old.remove();
    this.camera = { scale: 1, x: 50, y: 50 };
    const V = window.ASSET_VER || '';
    this.root = UI.el(`
      <div id="scene-stage">
        <div class="sc-world" id="sc-world">
          <div class="story-bg bg-${cfg.bg || 'forest'}"></div>
          ${cfg.bgImg ? `<img class="sc-bgimg" src="${cfg.bgImg}?v=${V}" decoding="async">` : ''}
          ${cfg.night ? '<div class="sc-night"></div>' : ''}
          <div class="bfx-particles" id="sc-fx"></div>
          <div id="sc-actors"></div>
        </div>
        <div class="sc-narr" id="sc-narr" style="display:none;"></div>
        <div class="sc-tap" id="sc-tap" style="display:none;"></div>
      </div>`);
    document.body.appendChild(this.root);
    if (window.Story && Story.spawnParticles) {
      const fx = this.root.querySelector('#sc-fx');
      // 复用剧情层的氛围粒子样式（雪/叶/尘按 bg 选型在 story.css 已有）
      try { Story.spawnParticles.call({ root: this.root }, cfg.bg); } catch (e) {}
    }
    if (window.Sound) Sound.bgm('story');
  },

  loadSprites(cfg) {
    const reg = (window.BattleUI && BattleUI.FIELD_SPRITE) || {};
    this.sprites = {};
    const keys = [...new Set(Object.values(cfg.actors || {}).map(a => a.sprite))];
    const V = window.ASSET_VER || '1';
    return Promise.all(keys.map(key => new Promise(resolve => {
      const BASE = reg[key];
      if (!BASE) { console.warn('SceneStage: 无 sprite', key); resolve(); return; }
      const sp = this.sprites[key] = { ready: false, man: null, imgs: {} };
      fetch(BASE + '/manifest.json?v=' + V).then(r => r.json()).then(man => {
        sp.man = man;
        let pend = 0, done = 0; const fin = () => { if (++done >= pend) { sp.ready = true; resolve(); } };
        for (const anim in man.anims) {
          sp.imgs[anim] = {};
          for (const d in man.anims[anim].frames) {
            const n = man.anims[anim].frames[d];
            sp.imgs[anim][d] = [];
            for (let i = 0; i < n; i++) {
              pend++;
              const im = new Image();
              im.onload = im.onerror = fin;
              im.src = `${BASE}/${anim}/${d}/${String(i).padStart(2, '0')}.png?v=${V}`;
              sp.imgs[anim][d].push(im);
            }
          }
        }
        if (!pend) { sp.ready = true; resolve(); }
      }).catch(() => resolve());
    })));
  },

  placeActors(cfg) {
    this.actors = {};
    const box = this.root.querySelector('#sc-actors');
    for (const id in cfg.actors || {}) {
      const a = cfg.actors[id];
      // glow=提灯光晕（掌灯人核心视觉）；所有 actor 带地面椭圆影
      const el = UI.el(`<div class="sc-actor" data-actor="${id}">
        ${a.glow ? '<div class="sc-glow"></div>' : ''}
        <div class="sc-shadow"></div>
        <div class="sc-bubble" style="display:none;"></div><img decoding="async"></div>`);
      box.appendChild(el);
      this.actors[id] = { ...a, id, el, anim: 'idle', frame: 0, moving: null };
      this.position(this.actors[id]);
    }
  },

  position(act) {
    act.el.style.left = act.x + '%';
    act.el.style.top = act.y + '%';
  },

  dirOf(dx, dy) {
    const a = Math.atan2(dy, dx) * 180 / Math.PI; // 0=东
    const dirs = ['east', 'south-east', 'south', 'south-west', 'west', 'north-west', 'north', 'north-east'];
    return dirs[Math.round(((a + 360) % 360) / 45) % 8];
  },

  tick(now) {
    for (const id in this.actors) {
      const act = this.actors[id];
      const sp = this.sprites[act.sprite];
      if (!sp || !sp.ready) continue;
      // 移动插值
      if (act.moving) {
        const m = act.moving, p = Math.min(1, (now - m.t0) / m.dur);
        act.x = m.x0 + (m.x1 - m.x0) * p;
        act.y = m.y0 + (m.y1 - m.y0) * p;
        this.position(act);
        if (p >= 1) { act.moving = null; act.anim = 'idle'; if (m.res) m.res(); }
      }
      // 帧动画：anim 缺该向时回退 idle，idle 缺时用首个可用向（静帧兜底由 gnorm 保证每向至少 1 帧）
      const anims = sp.man.anims;
      let anim = act.anim;
      if (!anims[anim] || !anims[anim].frames[act.dir]) anim = 'idle';
      const frames = (sp.imgs[anim] && sp.imgs[anim][act.dir]) || [];
      if (frames.length) {
        const fps = (sp.man.fps && sp.man.fps[anim]) || 8;
        const f = Math.floor(now / 1000 * fps) % frames.length;
        const img = act.el.querySelector('img');
        if (img.dataset.f !== anim + act.dir + f) { img.src = frames[f].src; img.dataset.f = anim + act.dir + f; }
      }
    }
    // 镜头
    const w = this.root && this.root.querySelector('#sc-world');
    if (w) w.style.transform = `scale(${this.camera.scale}) translate(${50 - this.camera.x}%, ${50 - this.camera.y}%)`;
    if (this.root) this._raf = requestAnimationFrame(t => this.tick(t));
  },

  step(s) {
    return new Promise(res => {
      const act = s.who ? this.actors[s.who] : null;
      switch (s.t) {
        case 'wait': setTimeout(res, s.ms || 600); break;
        case 'face': if (act) act.dir = s.dir; setTimeout(res, 120); break;
        case 'hide': if (act) act.el.style.display = 'none'; res(); break;
        case 'show': if (act) act.el.style.display = ''; res(); break;
        case 'move': {
          if (!act) { res(); return; }
          const [x1, y1] = s.to;
          act.dir = s.dirLock || this.dirOf(x1 - act.x, y1 - act.y);
          act.anim = 'run';
          act.moving = { x0: act.x, y0: act.y, x1, y1, t0: performance.now(), dur: s.dur || 1600, res };
          break;
        }
        case 'say': {
          if (!act) { res(); return; }
          this.bubble(act, s.text, false, res);
          break;
        }
        case 'whisper': {
          // 低语：气泡只出「…………」，逐字 1/3 速，无名牌（圣经 W2）
          if (!act) { res(); return; }
          this.bubble(act, '…………', true, res);
          break;
        }
        case 'narr': {
          const bar = this.root.querySelector('#sc-narr');
          bar.style.display = '';
          bar.textContent = s.text;
          this.tapOnce(() => { bar.style.display = 'none'; res(); });
          break;
        }
        case 'camera': {
          const c0 = { ...this.camera }, c1 = { scale: s.scale || 1, x: s.x != null ? s.x : 50, y: s.y != null ? s.y : 50 };
          const t0 = performance.now(), dur = s.dur || 800;
          const step = (now) => {
            const p = Math.min(1, (now - t0) / dur);
            this.camera.scale = c0.scale + (c1.scale - c0.scale) * p;
            this.camera.x = c0.x + (c1.x - c0.x) * p;
            this.camera.y = c0.y + (c1.y - c0.y) * p;
            if (p < 1) requestAnimationFrame(step); else res();
          };
          requestAnimationFrame(step);
          break;
        }
        default: res();
      }
    });
  },

  /** 头顶对话泡；slow=低语（逐字 1/3 速 + 40Hz 低频音） */
  bubble(act, text, slow, done) {
    const b = act.el.querySelector('.sc-bubble');
    b.style.display = '';
    b.classList.toggle('whisper', !!slow);
    b.textContent = '';
    if (slow && window.Sound && Sound.sfx) { try { Sound.sfx('whisper'); } catch (e) {} }
    let i = 0;
    const iv = setInterval(() => {
      b.textContent = text.slice(0, ++i);
      if (i >= text.length) {
        clearInterval(iv);
        this.tapOnce(() => { b.style.display = 'none'; done(); });
      }
    }, slow ? 200 : 40);
  },

  tapOnce(cb) {
    const tap = this.root.querySelector('#sc-tap');
    tap.style.display = '';
    const h = () => { tap.style.display = 'none'; tap.removeEventListener('click', h); cb(); };
    tap.addEventListener('click', h);
  },

  destroy() {
    cancelAnimationFrame(this._raf); this._raf = 0;
    if (this.root) {
      const r = this.root; this.root = null;
      r.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 280 }).onfinish = () => r.remove();
    }
  },
};

  // ---------- 战斗序列帧小人（PixelLab）----------
  FIELD_SPRITE: {                                    // charId → 资源目录
    lecliss:  'art/05_pixellab/lecliss_field',
    justia:   'art/05_pixellab/justia_field',
    seir:     'art/05_pixellab/seir_field',
    refithea: 'art/05_pixellab/refithea_field',

    olstein:  'art/05_pixellab/olstein_field',

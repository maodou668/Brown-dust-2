<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>棕色尘埃 2 · Brown Dust 2</title>
  <!-- PWA / 添加到主屏幕（iOS 全屏关键） -->
  <link rel="manifest" href="manifest.webmanifest?v=220">
  <meta name="theme-color" content="#1a1422">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="棕色尘埃2">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=220">
  <link rel="icon" type="image/png" href="icons/icon-192.png?v=220">
  <style>
/* ============================================================
   棕色尘埃 2 风格 UI — 暗色奇幻风格
   ============================================================ */

/* 全局像素字体 (Zpix 最像素, 已按游戏用字子集化为 ~68KB woff2) */
@font-face {
  font-family: 'Zpix';
  src: url('assets/fonts/zpix-subset.woff2') format('woff2');
  font-weight: normal; font-style: normal; font-display: swap;
}

:root {
  --bg: #14101a;
  --bg2: #1d1726;
  --panel: #261d33;
  --panel-2: #2f2440;
  --gold: #f0c674;
  --gem: #6cc6ff;
  --accent: #b06bff;
  --accent-2: #ff6b9d;
  --text: #ece6f5;
  --text-dim: #9d92ad;
  --danger: #ff5a6a;
  --hp: #4ad66d;
  --sp: #6cc6ff;
  --r5: #ff9b3d;
  --r4: #b06bff;
  --r3: #6c9fff;
  --shadow: 0 6px 24px rgba(0,0,0,.45);
  /* 横版舞台宽度：占满视口宽，但限制为横向比例（高 × 2.15），桌面端居中不至过宽 */
  --frame: min(100vw, calc(100dvh * 2.15));
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
/* 表单元素 (button/input/select/textarea) 默认不继承字体 → 显式继承, 保证 Zpix 全局生效 */
button, input, select, textarea, optgroup { font-family: inherit; }

html, body { height: 100%; }

body {
  font-family: 'Zpix', -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
  background: radial-gradient(circle at 50% -10%, #2a2038 0%, var(--bg) 60%);
  color: var(--text);
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
}

#app {
  width: var(--frame);
  max-width: 100vw;
  height: 100vh;       /* 兜底：不支持 dvh 的旧浏览器 */
  height: 100dvh;      /* 动态视口高度：扣除移动端 Chrome 的工具栏，保证底栏可见 */
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  position: relative;
  box-shadow: 0 0 60px rgba(0,0,0,.6);
}

/* ---------- 顶部栏 ---------- */
#topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px;
  background: linear-gradient(180deg, var(--bg2), transparent);
  border-bottom: 1px solid rgba(255,255,255,.05);
  z-index: 5;
}
.logo { display: flex; align-items: center; gap: 8px; }
.logo-mark {
  width: 32px; height: 32px; border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  display: grid; place-items: center;
  font-weight: 800; font-size: 14px; color: #fff;
  box-shadow: 0 2px 10px rgba(176,107,255,.5);
}
.logo-text { font-weight: 700; font-size: 17px; letter-spacing: .5px; }
.logo-text small { color: var(--accent); font-size: 13px; margin-left: 2px; }

.resources { display: flex; align-items: center; gap: 10px; }
.res {
  display: flex; align-items: center; gap: 4px;
  background: var(--panel); padding: 5px 10px; border-radius: 20px;
  font-size: 13px; font-weight: 600;
  border: 1px solid rgba(255,255,255,.06);
}
.res-icon { font-size: 14px; }
#res-gold { color: var(--gold); }
#res-gem { color: var(--gem); }
.ghost-btn {
  background: var(--panel); border: 1px solid rgba(255,255,255,.06);
  color: var(--text-dim); width: 30px; height: 30px; border-radius: 8px;
  font-size: 15px; cursor: pointer;
}
.ghost-btn:active { transform: scale(.92); }

/* ---------- 主区域 ---------- */
#screen {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 14px; position: relative;
  -webkit-overflow-scrolling: touch;
}
#screen::-webkit-scrollbar { width: 0; }

/* ---------- 底部导航 ---------- */
#navbar {
  display: flex; background: var(--bg2);
  border-top: 1px solid rgba(255,255,255,.06);
}
.nav-btn {
  flex: 1; background: none; border: none; color: var(--text-dim);
  padding: 9px 0 11px; font-size: 11px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  transition: color .2s;
}
.nav-btn span { font-size: 20px; }
.nav-btn.active { color: var(--accent); }
.nav-btn.active span { filter: drop-shadow(0 0 6px var(--accent)); }
.nav-btn:active { transform: scale(.94); }

/* ---------- 通用组件 ---------- */
.section-title {
  font-size: 15px; font-weight: 700; margin: 4px 0 12px;
  display: flex; align-items: center; gap: 8px;
}
.section-title::before {
  content: ''; width: 4px; height: 16px; border-radius: 2px;
  background: linear-gradient(var(--accent), var(--accent-2));
}
.muted { color: var(--text-dim); font-size: 12px; }

.btn {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff; border: none; border-radius: 10px;
  padding: 11px 18px; font-size: 14px; font-weight: 700;
  cursor: pointer; box-shadow: 0 4px 14px rgba(176,107,255,.35);
  transition: transform .1s;
}
.btn:active { transform: scale(.96); }
.btn:disabled { opacity: .4; box-shadow: none; cursor: not-allowed; }
.btn.secondary {
  background: var(--panel-2); box-shadow: none;
  border: 1px solid rgba(255,255,255,.1);
}
.btn.gold { background: linear-gradient(135deg, #f0c674, #e0964a); box-shadow: 0 4px 14px rgba(240,198,116,.3); color:#241a08;}

/* ---------- 主页 ---------- */
.hero-banner {
  border-radius: 16px; padding: 22px 18px;
  background:
    linear-gradient(135deg, rgba(176,107,255,.25), rgba(255,107,157,.15)),
    var(--panel);
  border: 1px solid rgba(255,255,255,.08);
  margin-bottom: 16px; position: relative; overflow: hidden;
}
.hero-banner::after {
  content: '⚔️'; position: absolute; right: -10px; bottom: -16px;
  font-size: 92px; opacity: .12; transform: rotate(-12deg);
}
.hero-banner h1 { font-size: 21px; margin-bottom: 6px; }
.hero-banner p { color: var(--text-dim); font-size: 13px; line-height: 1.6; max-width: 80%; }

.quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.quick-card {
  background: var(--panel); border-radius: 14px; padding: 16px;
  border: 1px solid rgba(255,255,255,.06); cursor: pointer;
  transition: transform .12s, border-color .2s;
}
.quick-card:active { transform: scale(.97); }
.quick-card:hover { border-color: var(--accent); }
.quick-card .qc-icon { font-size: 30px; margin-bottom: 8px; }
.quick-card .qc-title { font-weight: 700; font-size: 15px; }
.quick-card .qc-sub { color: var(--text-dim); font-size: 11px; margin-top: 3px; }

.team-preview { margin-top: 16px; }
.team-slots { display: flex; gap: 8px; margin-top: 10px; }
.team-slot {
  flex: 1; aspect-ratio: 3/4; border-radius: 12px;
  background: var(--panel); border: 1px dashed rgba(255,255,255,.15);
  display: grid; place-items: center; overflow: hidden; position: relative;
}
.team-slot.filled { border-style: solid; }
.team-slot.add { cursor: pointer; }
.team-slot.add .plus { font-size: 26px; color: var(--text-dim); }

/* 专属装备红点提示 */
.red-dot {
  position: absolute; top: 3px; right: 3px;
  width: 9px; height: 9px; border-radius: 50%;
  background: #ff3b3b; border: 1px solid #fff;
  box-shadow: 0 0 5px rgba(255,59,59,.8); z-index: 3;
}

/* 队伍编辑：当前出战位 */
.te-current { display: flex; align-items: center; gap: 12px; padding: 10px;
  background: var(--panel); border-radius: 12px; border: 1px solid rgba(255,255,255,.08); }
.te-current.empty { justify-content: center; padding: 18px; font-size: 13px; }
.te-current-info { flex: 1; font-size: 13px; }
.te-current-info b { color: var(--accent); }
.btn.sm { padding: 6px 12px; font-size: 12px; margin-top: 8px; }

/* 招募页签切换 */
.gacha-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
.gacha-tab {
  flex: 1; padding: 10px; border-radius: 12px; font-weight: 700; font-size: 14px;
  background: var(--panel); border: 1px solid rgba(255,255,255,.1); color: var(--text-dim);
}
.gacha-tab.active {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff; border-color: transparent;
}

/* ---------- 角色卡 ---------- */
.char-portrait {
  width: 100%; height: 100%; position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  padding-bottom: 6px;
}
.char-portrait .avatar {
  position: absolute; inset: 0;
  display: grid; place-items: center; font-size: 34px;
}
.char-portrait .pname {
  position: relative; font-size: 10px; font-weight: 700;
  background: rgba(0,0,0,.5); padding: 1px 6px; border-radius: 6px;
}
.rarity-badge {
  position: absolute; top: 4px; left: 4px; font-size: 9px;
  padding: 1px 5px; border-radius: 5px; font-weight: 800; z-index: 2;
}
.r5 { background: linear-gradient(135deg,#ff9b3d,#ffd35a); color:#3a2400; }
.r4 { background: linear-gradient(135deg,#b06bff,#d89bff); color:#fff; }
.r3 { background: linear-gradient(135deg,#6c9fff,#9bc6ff); color:#fff; }
.border-r5 { border-color: var(--r5) !important; }
.border-r4 { border-color: var(--r4) !important; }
.border-r3 { border-color: var(--r3) !important; }

/* ---------- 佣兵列表 ---------- */
.roster-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
}
.roster-card {
  background: var(--panel); border-radius: 12px; overflow: hidden;
  border: 2px solid rgba(255,255,255,.06); cursor: pointer;
  position: relative; transition: transform .1s;
}
.roster-card:active { transform: scale(.96); }
.roster-card .rc-art {
  aspect-ratio: 1/1; display: grid; place-items: center; font-size: 38px;
  position: relative;
}
.roster-card .rc-info { padding: 6px 8px; }
.roster-card .rc-name { font-size: 12px; font-weight: 700; }
.roster-card .rc-lv { font-size: 10px; color: var(--text-dim); }
.roster-card .in-team-tag {
  position: absolute; top: 4px; right: 4px; z-index: 2;
  background: var(--accent); color: #fff; font-size: 9px;
  padding: 1px 5px; border-radius: 5px; font-weight: 700;
}
.cls-chip {
  position: absolute; bottom: 4px; right: 4px; font-size: 14px;
  background: rgba(0,0,0,.45); border-radius: 6px; padding: 1px 4px;
}

/* ---------- 关卡 ---------- */
.stage-card {
  background: var(--panel); border-radius: 14px; padding: 14px;
  border: 1px solid rgba(255,255,255,.06); margin-bottom: 12px;
  display: flex; align-items: center; gap: 12px;
}
.stage-card.locked { opacity: .5; }
.stage-card.boss { border-color: rgba(255,90,106,.4); background: linear-gradient(135deg, rgba(255,90,106,.12), var(--panel)); }
.stage-num {
  width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
  background: var(--panel-2); display: grid; place-items: center;
  font-size: 18px; font-weight: 800;
}
.stage-card.boss .stage-num { background: linear-gradient(135deg,#ff5a6a,#b02a3a); }
.stage-info { flex: 1; min-width: 0; }
.stage-info h3 { font-size: 14px; margin-bottom: 2px; }
.stage-info p { font-size: 11px; color: var(--text-dim); line-height: 1.4;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stage-meta { display: flex; gap: 8px; margin-top: 5px; font-size: 10px; }
.stage-meta span { color: var(--gold); }
.clear-mark { color: var(--hp); font-size: 16px; }

/* ---------- 抽卡 ---------- */
.gacha-banner {
  border-radius: 18px; padding: 26px 18px; text-align: center;
  background:
    radial-gradient(circle at 50% 30%, rgba(255,155,61,.3), transparent 60%),
    linear-gradient(160deg, #3a2454, #241730);
  border: 1px solid rgba(255,155,61,.3); margin-bottom: 18px; position: relative;
  overflow: hidden;
}
.gacha-banner h2 { font-size: 22px; margin-bottom: 6px;
  background: linear-gradient(90deg,#ffd35a,#ff9b3d); -webkit-background-clip: text; background-clip: text; color: transparent; }
.gacha-banner .sub { color: var(--text-dim); font-size: 12px; margin-bottom: 4px; }
.gacha-rates { font-size: 11px; color: var(--text-dim); margin: 14px 0; }
.gacha-rates b { color: var(--r5); }
.pity-bar { font-size: 11px; color: var(--text-dim); margin-top: 8px; }
.gacha-actions { display: flex; gap: 10px; justify-content: center; margin-top: 6px; }

/* ---------- 弹窗 ---------- */
#modal-root { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
.modal-overlay {
  position: absolute; inset: 0; background: rgba(0,0,0,.7);
  display: grid; place-items: center; pointer-events: auto;
  animation: fadeIn .2s;
}
@keyframes fadeIn { from { opacity: 0; } }
.modal {
  width: 88%; max-width: 400px; max-height: 84vh; overflow-y: auto;
  background: var(--bg2); border-radius: 18px; padding: 20px;
  border: 1px solid rgba(255,255,255,.1); box-shadow: var(--shadow);
  animation: popIn .25s cubic-bezier(.2,1.4,.5,1);
}
@keyframes popIn { from { transform: scale(.85); opacity: 0; } }
.modal h2 { font-size: 18px; margin-bottom: 6px; }
.modal .close-row { display: flex; justify-content: flex-end; margin-top: 16px; gap: 8px; }

/* 角色详情 */
.detail-head { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
.detail-art {
  width: 84px; height: 84px; border-radius: 14px; flex-shrink: 0;
  display: grid; place-items: center; font-size: 44px;
  border: 2px solid;
}
.detail-title h2 { font-size: 19px; }
.detail-title .subt { color: var(--accent-2); font-size: 12px; font-weight: 600; }
.detail-title .meta { color: var(--text-dim); font-size: 12px; margin-top: 4px; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0; }
.stat-item { background: var(--panel); border-radius: 8px; padding: 8px 10px; font-size: 12px;
  display: flex; justify-content: space-between; }
.stat-item .sv { font-weight: 700; }
.skill-item { background: var(--panel); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
.skill-item .sk-head { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; }
.skill-item .sk-sp { margin-left: auto; font-size: 10px; color: var(--sp); background: rgba(108,198,255,.15); padding: 1px 6px; border-radius: 5px; }
.skill-item .sk-desc { font-size: 11px; color: var(--text-dim); margin-top: 4px; line-height: 1.5; }

/* ---------- 战斗界面 ---------- */
#battle-screen {
  position: fixed; inset: 0; max-width: var(--frame); margin: 0 auto;
  background: linear-gradient(180deg, #1a1326 0%, #0e0a14 100%);
  z-index: 48; display: flex; flex-direction: column;
}
.battle-top {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 14px; font-size: 13px; font-weight: 700;
  background: rgba(0,0,0,.3);
}
.battle-field {
  flex: 1; display: flex; flex-direction: column; justify-content: space-between;
  padding: 10px; gap: 8px; overflow: hidden;
}
.enemy-zone, .ally-zone { display: flex; flex-direction: column; gap: 8px; }
.row-label { font-size: 10px; color: var(--text-dim); text-align: center; }
.unit-row { display: flex; gap: 8px; justify-content: center; min-height: 86px; }

.unit {
  width: 76px; border-radius: 10px; padding: 5px;
  background: var(--panel); border: 2px solid rgba(255,255,255,.08);
  position: relative; cursor: pointer; transition: transform .12s, box-shadow .2s;
}
.unit.dead { opacity: .3; filter: grayscale(1); pointer-events: none; }
.unit.active-turn { border-color: var(--gold); box-shadow: 0 0 16px rgba(240,198,116,.5); transform: translateY(-4px); }
.unit.targetable { border-color: var(--danger); box-shadow: 0 0 14px rgba(255,90,106,.5); cursor: crosshair; }
.unit.targetable.ally-target { border-color: var(--hp); box-shadow: 0 0 14px rgba(74,214,109,.5); }
.unit .u-art { height: 38px; display: grid; place-items: center; font-size: 26px; }
.unit .u-name { font-size: 9px; text-align: center; font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.unit .u-elem { position: absolute; top: 2px; right: 3px; font-size: 11px; }
.unit .u-imprint { position: absolute; top: 2px; right: 20px; font-size: 11px;
  filter: drop-shadow(0 0 3px #ff2ec4); animation: imprintPulse 1.1s ease-in-out infinite; }
@keyframes imprintPulse { 0%,100% { opacity: .55; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.12); } }
.unit .u-boss { position: absolute; top: 2px; left: 3px; font-size: 9px; color: var(--danger); font-weight: 800; }
.bar { height: 5px; border-radius: 3px; background: rgba(0,0,0,.4); margin-top: 3px; overflow: hidden; }
.bar .fill { height: 100%; transition: width .3s; }
.bar .fill.hp { background: linear-gradient(90deg,#4ad66d,#7aff9b); }
.bar .fill.sp { background: linear-gradient(90deg,#6cc6ff,#9bdcff); }
.u-hp-text { font-size: 8px; color: var(--text-dim); text-align: center; margin-top: 1px; }
.shield-tag { position: absolute; bottom: 22px; left: 3px; font-size: 9px; color: #9bdcff; }

/* 战斗底部操作 */
.battle-ctrl {
  background: rgba(0,0,0,.4); padding: 10px 12px 14px;
  border-top: 1px solid rgba(255,255,255,.06);
  min-height: 120px;
}
.turn-hint { font-size: 12px; color: var(--text-dim); text-align: center; margin-bottom: 8px; min-height: 16px; }
.turn-hint b { color: var(--gold); }
.skill-bar { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.skill-btn {
  background: var(--panel-2); border: 1px solid rgba(255,255,255,.1);
  border-radius: 10px; padding: 8px 10px; min-width: 84px; cursor: pointer;
  text-align: center; transition: transform .1s;
}
.skill-btn:active { transform: scale(.95); }
.skill-btn.selected { border-color: var(--gold); background: rgba(240,198,116,.15); }
.skill-btn:disabled { opacity: .4; cursor: not-allowed; }
.skill-btn .sb-name { font-size: 12px; font-weight: 700; }
.skill-btn .sb-sp { font-size: 9px; color: var(--sp); margin-top: 2px; }
.skill-btn .sb-sp.ready { color: var(--gold); }

.battle-log {
  position: absolute; top: 48px; left: 10px; right: 10px;
  font-size: 11px; color: var(--text-dim); text-align: center;
  pointer-events: none; min-height: 16px; text-shadow: 0 1px 3px #000;
}

/* 伤害飘字 */
.float-text {
  position: absolute; font-weight: 800; font-size: 16px;
  pointer-events: none; z-index: 60; text-shadow: 0 2px 4px #000;
  animation: floatUp 1s ease-out forwards;
}
.float-text.dmg { color: #ff6b6b; }
.float-text.crit { color: #ffd35a; font-size: 21px; }
.float-text.heal { color: #7aff9b; }
@keyframes floatUp {
  0% { transform: translateY(0) scale(.6); opacity: 0; }
  20% { transform: translateY(-8px) scale(1.1); opacity: 1; }
  100% { transform: translateY(-46px) scale(1); opacity: 0; }
}

/* 抽卡结果动画 */
.pull-result { text-align: center; }
.pull-art {
  width: 120px; height: 120px; margin: 0 auto 14px; border-radius: 20px;
  display: grid; place-items: center; font-size: 64px; border: 3px solid;
  animation: revealCard .5s cubic-bezier(.2,1.4,.4,1);
}
@keyframes revealCard {
  from { transform: rotateY(90deg) scale(.5); opacity: 0; }
}
.pull-stars { font-size: 20px; margin: 6px 0; }
.pull-name { font-size: 20px; font-weight: 800; }
.pull-title { color: var(--accent-2); font-size: 13px; }
.pull-dup { color: var(--gold); font-size: 12px; margin-top: 6px; }

/* 结算 */
.result-modal { text-align: center; }
.result-title { font-size: 30px; font-weight: 900; margin-bottom: 8px; }
.result-title.win { color: var(--hp); text-shadow: 0 0 20px rgba(74,214,109,.5); }
.result-title.lose { color: var(--danger); }
.reward-row { display: flex; justify-content: center; gap: 16px; margin: 14px 0; }
.reward-row .rw { background: var(--panel); padding: 8px 14px; border-radius: 10px; font-weight: 700; }

.empty-hint {
  text-align: center; color: var(--text-dim); padding: 40px 20px; font-size: 13px;
}

.toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,.85); color: #fff; padding: 10px 18px;
  border-radius: 20px; font-size: 13px; z-index: 100;
  animation: toastIn .3s, toastOut .3s 1.7s forwards;
  pointer-events: none; max-width: 80%; text-align: center;
}
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } }
@keyframes toastOut { to { opacity: 0; } }

@media (max-width: 380px) {
  .unit { width: 66px; }
  .roster-grid { gap: 8px; }
}

/* ============================================================
   叙事演出 / 视觉小说界面（阶段一）
   ============================================================ */
#story-screen {
  position: fixed; inset: 0; max-width: var(--frame); margin: 0 auto;
  z-index: 70; overflow: hidden; background: #000;
  animation: fadeIn .3s;
}
.story-bg {
  position: absolute; inset: 0; transition: background .4s;
  background: #14101a;
}
/* 场景背景：分层渐变营造景深 */
.bg-void   { background: radial-gradient(circle at 50% 40%, #2a2038, #0a0810); }
.bg-forest { background:
  radial-gradient(circle at 70% 18%, rgba(255,240,180,.18), transparent 45%),
  linear-gradient(180deg, #2e4a32 0%, #1d3322 55%, #16241a 100%); }
.bg-forest_deep { background:
  radial-gradient(circle at 30% 15%, rgba(120,180,255,.10), transparent 45%),
  linear-gradient(180deg, #1a2e28 0%, #122019 60%, #0c1611 100%); }
.bg-cave { background:
  radial-gradient(circle at 50% 80%, rgba(255,120,60,.16), transparent 55%),
  linear-gradient(180deg, #2b2420 0%, #1c1714 60%, #100c0a 100%); }
.bg-ridge { background:
  radial-gradient(circle at 50% 25%, rgba(180,200,255,.16), transparent 50%),
  linear-gradient(180deg, #34405a 0%, #232c40 55%, #161b28 100%); }
.bg-castle { background:
  radial-gradient(circle at 50% 30%, rgba(255,60,90,.20), transparent 55%),
  linear-gradient(180deg, #3a1a2e 0%, #251020 60%, #140a12 100%); }
.bg-town { background:
  radial-gradient(circle at 60% 20%, rgba(255,210,140,.22), transparent 50%),
  linear-gradient(180deg, #4a3a2a 0%, #33271c 55%, #1e1610 100%); }
/* 场景地平线点缀 */
.story-bg::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 38%;
  background: linear-gradient(180deg, transparent, rgba(0,0,0,.55));
}

/* 立绘位 */
.story-portrait {
  position: absolute; bottom: 150px; width: 56%; max-width: 270px;
  height: 64%; display: flex; align-items: flex-end; justify-content: center;
  pointer-events: none; transition: filter .3s, opacity .3s;
}
.story-portrait.left  { left: -4%; }
.story-portrait.right { right: -4%; }
.story-portrait.empty { opacity: 0; }
.story-portrait.dim   { filter: brightness(.55) saturate(.7); }
.port-img { max-height: 100%; object-fit: contain; }

/* 风格化占位立绘：渐变人形剪影 + 大图标 */
.port-art { position: relative; width: 100%; height: 100%; display: flex; align-items: flex-end; justify-content: center; }
.port-silhouette {
  position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 70%; height: 92%;
  background:
    radial-gradient(circle at 50% 22%, var(--c), transparent 62%),
    linear-gradient(180deg, color-mix(in srgb, var(--c) 70%, #000), color-mix(in srgb, var(--c) 30%, #000));
  border-radius: 50% 50% 42% 42% / 30% 30% 70% 70%;
  box-shadow: 0 0 50px -8px var(--c);
  opacity: .92;
  clip-path: polygon(50% 0%, 72% 8%, 80% 26%, 74% 48%, 88% 70%, 80% 100%, 20% 100%, 12% 70%, 26% 48%, 20% 26%, 28% 8%);
}
.port-icon {
  position: absolute; top: 16%; left: 50%; transform: translateX(-50%);
  font-size: 58px; filter: drop-shadow(0 4px 10px rgba(0,0,0,.5));
}
.port-elem {
  position: absolute; top: 9%; left: 50%; transform: translateX(-50%) translateX(40px);
  font-size: 24px;
}

/* 跳过按钮 */
.story-skip {
  position: absolute; top: 14px; right: 14px; z-index: 3;
  background: rgba(0,0,0,.5); color: #fff; border: 1px solid rgba(255,255,255,.2);
  border-radius: 18px; padding: 7px 14px; font-size: 12px; cursor: pointer;
}
.story-skip:active { transform: scale(.94); }

/* 对话框 */
.story-dialogue {
  position: absolute; left: 12px; right: 12px; bottom: 16px; z-index: 2;
  background: linear-gradient(180deg, rgba(20,16,26,.92), rgba(12,9,16,.96));
  border: 1px solid rgba(176,107,255,.35); border-radius: 16px;
  padding: 16px 18px 18px; min-height: 116px;
  box-shadow: 0 8px 30px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05);
}
.story-dialogue.narration {
  text-align: center; background: rgba(8,6,12,.82);
  border-color: rgba(255,255,255,.12); display: flex; align-items: center; justify-content: center;
}
.story-name {
  font-size: 16px; font-weight: 800; margin-bottom: 8px;
  display: inline-block; padding: 2px 12px;
  background: rgba(0,0,0,.35); border-radius: 8px;
  border-left: 3px solid currentColor;
}
.story-text { font-size: 15px; line-height: 1.75; color: var(--text); min-height: 52px; }
.story-dialogue.narration .story-text { font-style: italic; color: #cfc6df; }
.story-next {
  position: absolute; right: 16px; bottom: 12px; color: var(--accent);
  font-size: 14px; animation: bobNext 1s infinite; transition: opacity .2s;
}
@keyframes bobNext { 0%,100% { transform: translateY(0); } 50% { transform: translateY(4px); } }

/* 战斗场景背景（让战斗也有「场景」） */
.battle-field { position: relative; }
.battle-field::before {
  content: ''; position: absolute; inset: 0; z-index: -1; opacity: .5;
  background: radial-gradient(circle at 50% 20%, rgba(176,107,255,.10), transparent 60%);
}

/* 剧情重看入口（角色档案/设置里复用） */
.story-replay-list { display: flex; flex-direction: column; gap: 8px; }
.story-replay-item {
  background: var(--panel); border: 1px solid rgba(255,255,255,.06);
  border-radius: 10px; padding: 12px 14px; display: flex; align-items: center;
  justify-content: space-between; cursor: pointer; font-size: 13px;
}
.story-replay-item.locked { opacity: .45; cursor: default; }
.story-replay-item:not(.locked):active { transform: scale(.98); }

/* 角色背景故事 / 台词 */
.char-lore {
  font-size: 13px; line-height: 1.8; color: #cfc6df;
  background: rgba(0,0,0,.2); border-left: 3px solid var(--accent);
  padding: 10px 12px; border-radius: 0 8px 8px 0; margin-bottom: 4px;
}
.quote-list { display: flex; flex-direction: column; gap: 6px; }
.quote-item {
  font-size: 13px; color: var(--accent-2); font-style: italic;
  background: var(--panel); padding: 8px 12px; border-radius: 8px;
}
/* 剧情回顾分组标题 */
.replay-group-title { font-size: 12px; color: var(--text-dim); margin: 12px 0 6px; font-weight: 700; }

/* ============================================================
   装备系统（阶段三）
   ============================================================ */
.gear-slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 4px; }
.gear-slot {
  position: relative; aspect-ratio: 1/1; border-radius: 10px;
  background: var(--panel); border: 2px solid rgba(255,255,255,.08);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; transition: transform .1s; padding: 2px;
}
.gear-slot:active { transform: scale(.95); }
.gear-slot.empty { border-style: dashed; }
.gear-slot .gs-icon { font-size: 24px; }
.gear-slot.empty .gs-icon { font-size: 22px; color: var(--text-dim); }
.gear-slot .gs-name { font-size: 9px; margin-top: 2px; text-align: center;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

/* 专属武器标识：与通用 UR 装备区分 */
.ex-tag {
  position: absolute; top: 3px; right: 3px; z-index: 3;
  font-size: 8px; font-weight: 800; padding: 1px 4px; border-radius: 4px;
  color: #241a08; background: linear-gradient(135deg, #ffd35a, #ff9b3d);
  box-shadow: 0 1px 3px rgba(255,155,61,.5);
}
.ex-tag.inline {
  position: static; display: inline-block; margin-left: 6px;
  vertical-align: middle; font-size: 9px;
}
.gear-slot.is-ex, .gear-pick-item.is-ex {
  border-color: #ff9b3d;
  box-shadow: 0 0 8px rgba(255,155,61,.35) inset;
}

.gear-pick-list { display: flex; flex-direction: column; gap: 8px; max-height: 52vh; overflow-y: auto; }
.gear-pick-item {
  display: flex; align-items: center; gap: 10px;
  background: var(--panel); border: 2px solid rgba(255,255,255,.08);
  border-radius: 10px; padding: 8px 12px; cursor: pointer;
}
.gear-pick-item:active { transform: scale(.98); }
.gear-pick-item.locked { opacity: .45; cursor: default; }
.gear-pick-item .gp-icon { font-size: 24px; }
.gear-pick-item .gp-info { flex: 1; min-width: 0; }
.gear-pick-item .gp-name { font-size: 13px; font-weight: 700; }
.gear-pick-item .gp-stats { font-size: 11px; }
.gear-pick-item .gp-tag {
  font-size: 10px; background: var(--accent); color: #fff;
  padding: 2px 8px; border-radius: 6px; font-weight: 700;
}

.forge-card {
  background: var(--panel); border: 1px solid rgba(255,255,255,.08);
  border-radius: 12px; padding: 14px; margin-bottom: 12px;
}
.forge-card .forge-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
.forge-card .muted { margin-bottom: 10px; }
.forge-card .btn { width: 100%; }

/* ============================================================
   战斗演出 & 场景氛围（视觉强化）
   ============================================================ */
.battle-field { overflow: hidden; }
.enemy-zone, .ally-zone { position: relative; z-index: 1; }

/* 氛围粒子层 */
.bfx-particles { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.bfx {
  position: absolute; border-radius: 50%; opacity: 0; pointer-events: none;
  animation-iteration-count: infinite; animation-timing-function: linear;
}
.bfx.leaf  { top: -30px; background: radial-gradient(circle at 35% 30%, #a7e07a, #4a8b3a);
  border-radius: 45% 55% 50% 60%; animation-name: bfxFall; }
.bfx.snow  { top: -30px; background: radial-gradient(circle at 35% 30%, #ffffff, #cfe6ff);
  box-shadow: 0 0 4px rgba(255,255,255,.6); animation-name: bfxFall; }
.bfx.ember { bottom: -30px; background: radial-gradient(circle at 40% 35%, #ffe08a, #ff6b3a);
  box-shadow: 0 0 7px #ff8a3a; animation-name: bfxRise; }
.bfx.mote  { bottom: -30px; background: radial-gradient(circle at 40% 35%, #e0c6ff, #8a5ad6);
  box-shadow: 0 0 6px rgba(176,107,255,.5); animation-name: bfxRise; }
@keyframes bfxFall {
  0% { transform: translateY(0) translateX(0) rotate(0); opacity: 0; }
  12% { opacity: .85; } 88% { opacity: .65; }
  100% { transform: translateY(620px) translateX(34px) rotate(220deg); opacity: 0; }
}
@keyframes bfxRise {
  0% { transform: translateY(0) translateX(0); opacity: 0; }
  15% { opacity: .9; } 85% { opacity: .55; }
  100% { transform: translateY(-620px) translateX(-26px); opacity: 0; }
}

/* 技能名横幅 */
/* 启动加载页 */
#boot-loader { transition: opacity .55s ease; }
#boot-loader.done { opacity: 0; pointer-events: none; }
#boot-loader .bl-inner { display: flex; flex-direction: column; align-items: center; gap: 10px; width: min(78vw, 420px);
  background: radial-gradient(120% 90% at 50% 30%, rgba(176,107,255,.18), transparent 70%); padding: 28px 10px; }
#boot-loader .bl-title { font-size: 30px; font-weight: 900; letter-spacing: 2px; color: #fff; text-shadow: 0 2px 20px rgba(176,107,255,.55); }
#boot-loader .bl-sub { font-size: 11px; letter-spacing: 4px; color: #b9a8e0; margin-top: -4px; }
#boot-loader .bl-bar { width: 100%; height: 8px; border-radius: 6px; margin-top: 16px; overflow: hidden;
  background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.12); }
#boot-loader .bl-fill { width: 0%; height: 100%; border-radius: 6px; transition: width .25s ease;
  background: linear-gradient(90deg, #b06bff, #ff6b9d); box-shadow: 0 0 12px rgba(176,107,255,.7); }
#boot-loader .bl-pct { font-size: 13px; font-weight: 700; color: #e8d8ff; }
#boot-loader .bl-tip { font-size: 11px; color: #8a80a0; margin-top: 2px; animation: blPulse 1.4s ease-in-out infinite; }
@keyframes blPulse { 0%,100% { opacity: .5; } 50% { opacity: 1; } }

#battle-fx { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
.skill-banner {
  position: absolute; top: 44%; left: 50%; z-index: 3; pointer-events: none;
  transform: translate(-50%, -50%); opacity: 0;
  font-size: 24px; font-weight: 900; color: #fff; white-space: nowrap; letter-spacing: 3px;
  text-shadow: 0 2px 10px #000, 0 0 22px var(--accent);
}
.skill-banner.show { animation: skillBanner .95s ease-out; }
@keyframes skillBanner {
  0% { opacity: 0; transform: translate(-50%,-50%) scale(.5); }
  22% { opacity: 1; transform: translate(-50%,-50%) scale(1.15); }
  72% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%,-50%) scale(1); }
}

/* 命中闪光环 */
.impact-ring {
  position: absolute; top: 28%; left: 50%; width: 46px; height: 46px;
  margin: -23px 0 0 -23px; border: 3px solid #ff8a5a; border-radius: 50%;
  pointer-events: none; z-index: 4; animation: impactRing .45s ease-out forwards;
}
.impact-ring.heal { border-color: #7aff9b; }
@keyframes impactRing {
  from { transform: scale(.3); opacity: .9; }
  to { transform: scale(1.5); opacity: 0; }
}
.unit.lunging { z-index: 5; }

/* 剧情场景粒子层（复用 .bfx-particles / .bfx） */
#story-screen .bfx-particles { z-index: 1; }

/* 突破等级徽章 */
.plus-badge {
  display: inline-block; font-size: 11px; font-weight: 800;
  background: linear-gradient(135deg, #ff9b3d, #ff6b9d); color: #fff;
  padding: 1px 7px; border-radius: 6px; vertical-align: middle;
  box-shadow: 0 1px 6px rgba(255,107,157,.4);
}
.plus-badge.corner {
  position: absolute; top: 4px; right: 4px; z-index: 2;
  font-size: 9px; padding: 1px 5px;
}

/* 击退/撞击飘字 */
.knock-text {
  position: absolute; font-weight: 800; font-size: 13px; color: #ffd35a;
  pointer-events: none; z-index: 60; text-shadow: 0 2px 4px #000; white-space: nowrap;
  animation: knockFloat .8s ease-out forwards;
}
@keyframes knockFloat {
  0% { transform: translateX(0) scale(.6); opacity: 0; }
  25% { transform: translateX(10px) scale(1.1); opacity: 1; }
  100% { transform: translateX(28px) scale(1); opacity: 0; }
}

/* ============================================================
   俯视角探索地图
   ============================================================ */
#world-screen {
  position: fixed; inset: 0; max-width: var(--frame); margin: 0 auto; z-index: 45;
  background: #0e0a14; display: flex; flex-direction: column; overflow: hidden;
}
.world-top {
  display: flex; justify-content: space-between; align-items: center;
  padding: 9px 14px; font-size: 14px; font-weight: 700;
  background: rgba(0,0,0,.4); z-index: 2;
}
#world-canvas { flex: 1; width: 100%; display: block; touch-action: none; background: #1d3322; }
.world-hint {
  position: absolute; left: 0; right: 0; bottom: 132px; text-align: center;
  font-size: 13px; color: #ffe07a; text-shadow: 0 2px 6px #000; pointer-events: none;
  min-height: 18px; font-weight: 700;
}
.world-ctrl {
  display: flex; justify-content: space-between; align-items: flex-end;
  padding: 12px 22px 22px; background: linear-gradient(180deg, transparent, rgba(0,0,0,.5));
}
/* 虚拟摇杆（轮盘）：连续向量 → 自然 8 方向 */
.joystick {
  position: relative; width: 124px; height: 124px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,.10), rgba(255,255,255,.04));
  border: 1px solid rgba(255,255,255,.18); touch-action: none; user-select: none;
  display: grid; place-items: center; box-shadow: inset 0 0 18px rgba(0,0,0,.35);
}
.joy-knob {
  width: 54px; height: 54px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #c89bff, #8a5bd6);
  border: 1px solid rgba(255,255,255,.35); box-shadow: 0 2px 8px rgba(0,0,0,.4);
  transition: transform .04s linear; pointer-events: none;
}
.act-btn {
  width: 76px; height: 76px; border-radius: 50%; align-self: center;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff; font-size: 15px; font-weight: 800; border: none; cursor: pointer;
  box-shadow: 0 4px 16px rgba(176,107,255,.5);
}
.act-btn:active { transform: scale(.94); }
.act-btn:disabled { opacity: .35; box-shadow: none; }

/* 探索入口卡 */
.explore-card {
  display: flex; align-items: center; gap: 12px; cursor: pointer;
  background: linear-gradient(135deg, rgba(74,139,58,.25), var(--panel));
  border: 1px solid rgba(120,200,120,.3); border-radius: 14px;
  padding: 14px; margin-bottom: 14px; transition: transform .1s;
}
.explore-card:active { transform: scale(.98); }
.explore-art {
  width: 52px; height: 52px; border-radius: 12px; flex-shrink: 0;
  display: grid; place-items: center; font-size: 28px;
  background: radial-gradient(circle at 50% 35%, #3a7a44, #1d3322);
}
.explore-info { flex: 1; min-width: 0; }
.explore-info h3 { font-size: 14px; margin-bottom: 2px; }
.explore-info p { font-size: 11px; line-height: 1.4; }
.explore-go { color: var(--accent); font-size: 13px; font-weight: 700; }

/* 章节卡（引导式冒险） */
.chapter-card {
  display: flex; align-items: center; gap: 12px; cursor: pointer;
  background: var(--panel); border: 1px solid rgba(255,255,255,.07);
  border-radius: 14px; padding: 14px; margin-bottom: 12px; transition: transform .1s, border-color .2s;
}
.chapter-card:not(.locked):active { transform: scale(.98); }
.chapter-card:not(.locked):hover { border-color: var(--accent); }
.chapter-card.locked { opacity: .5; }
.chapter-card.done { border-color: rgba(74,214,109,.3); }
.chapter-art {
  width: 54px; height: 54px; border-radius: 13px; flex-shrink: 0;
  display: grid; place-items: center; font-size: 28px;
  background: radial-gradient(circle at 50% 35%, rgba(176,107,255,.3), var(--panel-2));
}
.chapter-info { flex: 1; min-width: 0; }
.chapter-info h3 { font-size: 14px; margin-bottom: 3px; }
.chapter-info p { font-size: 11px; color: var(--text-dim); line-height: 1.4;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chapter-prog { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.cp-bar { flex: 1; height: 5px; border-radius: 3px; background: rgba(0,0,0,.4); overflow: hidden; }
.cp-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .3s; }
.chapter-prog span { font-size: 10px; color: var(--text-dim); }
.chapter-go { color: var(--accent); font-size: 13px; font-weight: 700; white-space: nowrap; }

/* 试炼之塔 */
.trial-progress { font-size: 11px; margin: -4px 0 10px; }
.trial-card {
  display: flex; align-items: center; gap: 12px; cursor: pointer;
  background: linear-gradient(160deg, rgba(58,42,26,.5), var(--panel));
  border: 1px solid rgba(255,155,61,.18);
  border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; transition: transform .1s, border-color .2s;
}
.trial-card:not(.locked):active { transform: scale(.98); }
.trial-card:not(.locked):hover { border-color: #ff9b3d; }
.trial-card.locked { opacity: .5; cursor: default; }
.trial-card.done { border-color: rgba(74,214,109,.3); }
.trial-floor {
  width: 50px; height: 50px; border-radius: 12px; flex-shrink: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 22px;
  background: radial-gradient(circle at 50% 35%, rgba(255,155,61,.3), var(--panel-2));
}
.trial-floor span { font-size: 10px; font-weight: 800; color: #ffb84a; margin-top: 1px; }
.trial-info { flex: 1; min-width: 0; }
.trial-info h3 { font-size: 14px; margin-bottom: 3px; }
.trial-info p { font-size: 11px; color: var(--text-dim); line-height: 1.4;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trial-meta { display: flex; align-items: center; gap: 8px; margin-top: 5px; flex-wrap: wrap; }
.trial-meta span { font-size: 10px; }
.trial-boss { color: #ff7a6a; font-weight: 700; }
.trial-reward { color: var(--gold); font-weight: 700; }
/* 存档管理文本框 */
.save-box { width: 100%; box-sizing: border-box; height: 72px; resize: none;
  background: var(--bg); color: var(--text-dim); border: 1px solid rgba(255,255,255,.12);
  border-radius: 10px; padding: 8px 10px; font-size: 11px; font-family: monospace; word-break: break-all; }

/* 佣兵筛选/排序条 */
.roster-bar { display: flex; flex-direction: column; gap: 7px; margin-bottom: 10px; }
.rf-elems { display: flex; gap: 5px; flex-wrap: wrap; }
.rf-chip { background: var(--panel); border: 1px solid rgba(255,255,255,.1); color: var(--text);
  border-radius: 9px; padding: 5px 9px; font-size: 13px; cursor: pointer; min-width: 34px; }
.rf-chip.on { background: linear-gradient(135deg,var(--accent),var(--accent-2)); border-color: transparent; color:#fff; }
.rf-ctrl { display: flex; gap: 7px; }
.rf-toggle, .rf-sort { flex: 1; background: var(--panel); border: 1px solid rgba(255,255,255,.1);
  color: var(--text-dim); border-radius: 9px; padding: 7px; font-size: 12px; font-weight: 700; cursor: pointer; }
.rf-toggle.on { background: linear-gradient(135deg,var(--accent),var(--accent-2)); border-color: transparent; color:#fff; }

/* 装备深化：强化等级 / 副词条 / 套装 */
.gp-lv { display: inline-block; margin-left: 5px; font-size: 10px; font-weight: 800; color: #241a08;
  background: linear-gradient(135deg,#ffd35a,#ff9b3d); padding: 0 5px; border-radius: 5px; vertical-align: middle; }
.gp-subs { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 3px; }
.gp-subs span { font-size: 10px; color: #7ad6ff; }
.gp-right { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex-shrink: 0; }
.gp-enh { background: linear-gradient(135deg,#ffb84a,#ff7a3a); color: #241a08; border: none;
  border-radius: 8px; padding: 5px 9px; font-size: 11px; font-weight: 800; cursor: pointer; white-space: nowrap; }
.gp-enh:active { transform: scale(.95); }
.gear-pick-item .gp-info { cursor: pointer; }
.set-tag { display: inline-block; font-size: 10px; font-weight: 800; color: #241a08;
  background: linear-gradient(135deg,#ffd35a,#ff9b3d); padding: 1px 7px; border-radius: 6px; vertical-align: middle; }

.skill-item.boosted { border-color: rgba(255,155,61,.4); }
.sk-boost { display: inline-block; margin: 2px 0 4px; font-size: 10px; font-weight: 800;
  color: #241a08; background: linear-gradient(135deg,#ffd35a,#ff9b3d); padding: 1px 7px; border-radius: 6px; }

.trial-go { color: #ff9b3d; font-size: 13px; font-weight: 700; white-space: nowrap; text-align: center; }
.trial-sweep {
  background: linear-gradient(135deg, #ffb84a, #ff7a3a); color: #241a08;
  border: none; border-radius: 9px; padding: 6px 12px; font-size: 12px; font-weight: 800;
  cursor: pointer;
}
.trial-sweep:active { transform: scale(.95); }

/* 探索：当前目标条 */
.world-obj {
  position: absolute; top: 44px; left: 0; right: 0; text-align: center; z-index: 2;
  font-size: 13px; color: #fff; pointer-events: none; min-height: 20px;
  text-shadow: 0 2px 6px #000;
}
.world-obj .obj-tag {
  background: var(--accent); color: #fff; font-size: 10px; font-weight: 800;
  padding: 1px 7px; border-radius: 6px; margin-right: 6px;
}
.world-obj.flash { animation: objFlash .8s ease-out; }
@keyframes objFlash { 0% { transform: scale(.7); opacity: 0; } 40% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }

/* 战斗场景 45° 斜视地面 */
.battle-floor {
  position: absolute; left: -20%; right: -20%; bottom: 4%; height: 62%;
  z-index: -1; pointer-events: none;
  background:
    linear-gradient(180deg, transparent, rgba(0,0,0,.35)),
    repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 2px, transparent 2px 46px),
    repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 2px, transparent 2px 40px);
  transform: perspective(420px) rotateX(58deg);
  transform-origin: center bottom;
  border-radius: 40% 40% 0 0 / 18% 18% 0 0;
  opacity: .5;
}

/* 服装切换 */
.costume-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
.costume-chip {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  background: var(--panel); border: 2px solid rgba(255,255,255,.08);
  border-radius: 10px; padding: 8px 10px; min-width: 62px; cursor: pointer;
  transition: transform .1s;
}
.costume-chip:active { transform: scale(.95); }
.costume-chip.active { border-color: var(--gold); background: rgba(240,198,116,.12); }
.costume-chip .cos-icon { font-size: 18px; }
.costume-chip .cos-name { font-size: 10px; font-weight: 700; }

/* 普攻按钮 / 冷却标签 */
.skill-btn.basic { border-color: rgba(255,255,255,.18); background: var(--panel); }
.sb-sp.cooldown { color: #ff8a6a; }

/* ============================================================
   福利：签到 / 任务 / 保底 / 商店
   ============================================================ */
.welfare-cur { display: flex; gap: 10px; margin-bottom: 14px; }
.wc-item { flex: 1; background: var(--panel); border: 1px solid rgba(255,255,255,.06);
  border-radius: 12px; padding: 10px 12px; font-size: 12px; text-align: center; }
.wc-item b { color: var(--gold); font-size: 15px; }

.checkin-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
.checkin-cell { background: var(--panel); border: 1px solid rgba(255,255,255,.06);
  border-radius: 10px; padding: 8px 4px; text-align: center; position: relative; }
.checkin-cell.today { border-color: var(--gold); box-shadow: 0 0 10px rgba(240,198,116,.3); }
.checkin-cell.claimed { opacity: .5; }
.ci-day { font-size: 10px; color: var(--text-dim); }
.ci-reward { font-size: 12px; font-weight: 700; margin-top: 3px; }
.ci-tick { position: absolute; top: 2px; right: 4px; color: var(--hp); font-size: 12px; }

.quest-item { display: flex; align-items: center; gap: 10px; background: var(--panel);
  border: 1px solid rgba(255,255,255,.06); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
.quest-info { flex: 1; min-width: 0; }
.quest-name { font-size: 12px; font-weight: 700; }
.quest-bar { height: 5px; border-radius: 3px; background: rgba(0,0,0,.4); margin-top: 5px; overflow: hidden; }
.quest-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
.quest-reward { font-size: 12px; color: var(--gold); font-weight: 700; }
.quest-claim { padding: 7px 12px; font-size: 12px; }

.pity-card { display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: linear-gradient(135deg, rgba(176,107,255,.18), var(--panel));
  border: 1px solid rgba(176,107,255,.25); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
.pity-name { font-weight: 700; font-size: 13px; margin-bottom: 2px; }
.pity-card .btn { padding: 9px 16px; font-size: 13px; flex-shrink: 0; }

.shop-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.shop-item { background: var(--panel); border: 2px solid rgba(255,255,255,.06); border-radius: 12px;
  padding: 10px 8px; text-align: center; position: relative; }
.shop-item.sold { opacity: .5; }
.shop-icon { font-size: 26px; margin: 4px 0; }
.shop-name { font-size: 11px; font-weight: 700; margin-bottom: 8px; }
.shop-buy { width: 100%; padding: 7px 0; font-size: 12px; }

/* 状态效果 / 狂暴 / 持续伤害飘字 */
.u-status { position: absolute; top: 2px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 1px; z-index: 3; }
.st-badge { font-size: 10px; filter: drop-shadow(0 1px 2px #000); }
.unit.enraged { box-shadow: 0 0 14px rgba(255,90,60,.6); border-color: #ff5a3c; }
.float-text.dot { color: #c08bff; font-size: 14px; }
.float-text.reaction { color: #ff7ae6; font-size: 22px; text-shadow: 0 0 8px #ff2ec4, 0 2px 4px #000; }

/* 自动战斗按钮 */
.auto-btn {
  background: var(--panel); border: 1px solid rgba(255,255,255,.15); color: var(--text-dim);
  border-radius: 8px; padding: 4px 10px; font-size: 12px; font-weight: 700; cursor: pointer;
}
.auto-btn.on { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border-color: transparent; }
.auto-btn:active { transform: scale(.94); }

/* ============================================================
   战斗：斜俯视角立体舞台
   ============================================================ */
.battle-stage { position: absolute; inset: 0; z-index: 1; }

/* 斜俯视角地面（敌/我两块透视平面） */
.stage-ground {
  position: absolute; left: -8%; right: -8%; height: 30%; z-index: 0; pointer-events: none;
  background:
    linear-gradient(180deg, rgba(255,255,255,.05), transparent),
    repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 2px, transparent 2px 64px),
    repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 2px, transparent 2px 52px);
  opacity: .5;
}
.stage-ground.enemy {
  top: 22%; transform: perspective(560px) rotateX(62deg); transform-origin: center bottom;
  background-color: rgba(120,80,120,.10);
  -webkit-mask-image: linear-gradient(180deg, transparent, #000 40%, #000);
          mask-image: linear-gradient(180deg, transparent, #000 40%, #000);
}
.stage-ground.ally {
  bottom: 4%; transform: perspective(560px) rotateX(62deg); transform-origin: center top;
  background-color: rgba(120,140,200,.10);
  -webkit-mask-image: linear-gradient(0deg, transparent, #000 45%, #000);
          mask-image: linear-gradient(0deg, transparent, #000 45%, #000);
}

/* 舞台上的单位：绝对定位，近大远小 */
.battle-stage .unit {
  position: absolute; width: 72px; padding: 4px; margin: 0;
  transform: translate(-50%, -100%) scale(var(--uscale, 1));
  transform-origin: bottom center; touch-action: none;
  transition: top .35s ease, left .35s ease;
}
.battle-stage .unit.active-turn {
  border-color: var(--gold); box-shadow: 0 0 16px rgba(240,198,116,.6); transform: translate(-50%, -100%) scale(var(--uscale, 1));
}
.battle-stage .unit.dragging { opacity: .85; z-index: 999 !important; transition: none; cursor: grabbing; }
.battle-stage .unit.targetable { box-shadow: 0 0 14px rgba(255,90,106,.6); }
.battle-stage .unit.targetable.ally-target { box-shadow: 0 0 14px rgba(74,214,109,.6); }
.u-shadow {
  position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
  width: 56px; height: 14px; border-radius: 50%;
  background: radial-gradient(ellipse, rgba(0,0,0,.45), transparent 70%); z-index: -1;
}
.ally-unit { cursor: grab; }

/* ============ 角色立绘 / 精灵图（PixelLab 资产） ============ */
.char-img {
  width: 100%; height: 100%; object-fit: contain; object-position: top center;
  image-rendering: auto; display: block;
}
.char-emoji { line-height: 1; }
.port-img { image-rendering: pixelated; }
/* ---------- 阵容羁绊面板 ---------- */
.te-synergy { margin: 6px 0 4px; display: flex; flex-direction: column; gap: 4px; }
.syn-title { font-size: 12px; font-weight: 800; color: var(--gold); }
.syn-item { font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 7px;
  background: rgba(176,107,255,.14); border: 1px solid rgba(176,107,255,.3); color: #e8d8ff; }
.syn-item.syn-balance { background: rgba(90,209,120,.14); border-color: rgba(90,209,120,.35); color: #d6ffe0; }
.syn-item.syn-rainbow { background: rgba(255,177,92,.14); border-color: rgba(255,177,92,.35); color: #ffe7c0; }
.syn-empty { font-size: 11px; color: var(--muted, #9a90b0); padding: 4px 2px; }
.rx-title { margin-top: 4px; color: #ff7ae6; }
.rx-row { display: flex; flex-wrap: wrap; gap: 4px; }
.rx-chip { font-size: 11px; font-weight: 700; padding: 3px 7px; border-radius: 7px;
  background: rgba(255,122,230,.12); border: 1px solid rgba(255,122,230,.32); color: #ffd8f5; }

.unit .u-art { overflow: visible; position: relative; }
.unit canvas.u-sprite {
  position: absolute; left: 50%; bottom: -4px; transform: translateX(-50%);
  width: 56px; height: 62px; pointer-events: none; image-rendering: pixelated;
  filter: drop-shadow(0 2px 2px rgba(0,0,0,.45));
}
.unit .u-img {
  height: 54px; width: auto; max-width: 84px; object-fit: contain; object-position: bottom;
  image-rendering: pixelated; filter: drop-shadow(0 2px 4px rgba(0,0,0,.55));
}

/* ============ 成就殿堂 ============ */
.ach-entry {
  display: flex; align-items: center; gap: 12px; width: 100%;
  background: linear-gradient(135deg, rgba(255,211,90,.16), var(--panel));
  border: 1px solid rgba(255,211,90,.3); border-radius: 14px; padding: 13px 14px;
  margin-bottom: 16px; cursor: pointer; transition: transform .1s; text-align: left;
}
.ach-entry:active { transform: scale(.98); }
.ach-entry-icon { font-size: 26px; }
.ach-entry-text { flex: 1; display: flex; flex-direction: column; font-size: 14px; }
.ach-entry-text .muted { font-size: 11px; font-weight: 400; margin-top: 2px; }
.ach-entry-badge { font-size: 11px; font-weight: 800; color: #241a08;
  background: linear-gradient(135deg,#ffd35a,#ff9b3d); padding: 3px 9px; border-radius: 10px; }
.ach-entry-go { color: var(--text-dim); font-size: 18px; }

.ach-list { display: flex; flex-direction: column; gap: 8px; max-height: 60vh; overflow-y: auto; }
.ach-item {
  display: flex; align-items: center; gap: 11px;
  background: var(--panel); border: 1px solid rgba(255,255,255,.07);
  border-radius: 12px; padding: 10px 12px;
}
.ach-item.done { border-color: rgba(255,211,90,.45); background: linear-gradient(135deg, rgba(255,211,90,.1), var(--panel)); }
.ach-item.claimed { opacity: .55; }
.ach-icon { font-size: 24px; width: 30px; text-align: center; }
.ach-mid { flex: 1; min-width: 0; }
.ach-name { font-size: 13px; font-weight: 700; }
.ach-name .muted { font-size: 10px; }
.ach-bar { height: 5px; border-radius: 3px; background: rgba(0,0,0,.4); overflow: hidden; margin: 5px 0 2px; }
.ach-fill { height: 100%; background: linear-gradient(90deg,#ffd35a,#ff9b3d); }
.ach-prog { font-size: 10px; }
.ach-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
.ach-rw { font-size: 12px; font-weight: 700; color: var(--gold); }

/* ============ 漫画演出（条漫式竖向滚动） ============ */
#comic-screen {
  position: fixed; inset: 0; max-width: var(--frame); margin: 0 auto; z-index: 49;
  background: #0a0810; display: flex; flex-direction: column;
}
.comic-top {
  display: flex; justify-content: space-between; align-items: center;
  padding: 11px 14px; font-weight: 700; font-size: 14px;
  background: rgba(0,0,0,.5); border-bottom: 1px solid rgba(255,255,255,.08);
  flex-shrink: 0; z-index: 2;
}
.comic-title { background: linear-gradient(90deg,#ffd35a,#ff9b3d); -webkit-background-clip: text; background-clip: text; color: transparent; }
.comic-scroll { flex: 1; overflow-y: auto; padding: 12px 12px 40px; -webkit-overflow-scrolling: touch; }

/* 封面 */
.comic-cover {
  position: relative; height: 200px; border-radius: 14px; margin-bottom: 14px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  border: 1px solid rgba(255,255,255,.12); overflow: hidden; text-align: center;
}
.comic-cover::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,.6)); }
.comic-cover-title { position: relative; z-index: 1; font-size: 26px; font-weight: 800; letter-spacing: 2px;
  text-shadow: 0 2px 12px rgba(0,0,0,.7); }
.comic-cover-sub { position: relative; z-index: 1; font-size: 12px; color: rgba(255,255,255,.7); margin-top: 6px; }

/* 单个分镜面板 */
.comic-panel {
  position: relative; border-radius: 10px; margin-bottom: 12px; overflow: hidden;
  border: 2px solid rgba(255,255,255,.85);
  box-shadow: 0 4px 14px rgba(0,0,0,.45);
}
.comic-art { position: absolute; inset: 0; }
.comic-char { position: absolute; bottom: -4%; height: 96%; }
.comic-char .port-art { height: 100%; }
.comic-char .port-icon { font-size: 44px; top: 14%; }
.comic-char .port-silhouette { height: 90%; }

/* 叠加层：旁白 + 气泡 */
.comic-overlay { position: absolute; inset: 0; padding: 10px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.comic-narr {
  align-self: flex-start; max-width: 78%;
  background: rgba(8,6,12,.82); color: #f3ead8; font-size: 12.5px; line-height: 1.5;
  padding: 7px 11px; border-radius: 3px; border-left: 3px solid #ff9b3d;
}
.comic-bubbles { display: flex; flex-direction: column; gap: 7px; }

/* 对话气泡 */
.comic-bubble {
  position: relative; max-width: 74%; font-size: 13px; line-height: 1.45;
  background: #fff; color: #14101a; padding: 8px 12px; border-radius: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,.3);
}
.comic-bubble.left  { align-self: flex-start; border-bottom-left-radius: 3px; }
.comic-bubble.right { align-self: flex-end; border-bottom-right-radius: 3px; }
.comic-bubble .cb-name { display: block; font-size: 10px; font-weight: 800; color: #b06bff; margin-bottom: 2px; }
/* 气泡尖角 */
.comic-bubble.left::after, .comic-bubble.right::after {
  content: ''; position: absolute; bottom: -7px; width: 0; height: 0;
  border: 8px solid transparent; border-top-color: #fff; border-bottom: 0;
}
.comic-bubble.left::after  { left: 16px; }
.comic-bubble.right::after { right: 16px; }
/* 呐喊：爆炸框 */
.comic-bubble.shout {
  background: #fff; font-weight: 800; color: #1a1018;
  border-radius: 6px; clip-path: polygon(0% 12%,8% 0%,20% 9%,33% 0%,46% 9%,60% 0%,73% 9%,87% 0%,100% 12%,94% 30%,100% 50%,94% 70%,100% 88%,87% 100%,73% 91%,60% 100%,46% 91%,33% 100%,20% 91%,8% 100%,0% 88%,6% 70%,0% 50%,6% 30%);
  padding: 12px 16px;
}
.comic-bubble.shout::after { display: none; }
/* 心声：虚线云 */
.comic-bubble.thought { background: rgba(255,255,255,.92); font-style: italic; border: 2px dashed rgba(0,0,0,.2); }
.comic-bubble.thought::after { border-top-color: rgba(255,255,255,.92); }

/* 拟声词 */
.comic-sfx {
  position: absolute; z-index: 1; font-size: 30px; font-weight: 900; letter-spacing: 1px;
  color: #fff; -webkit-text-stroke: 1.5px #1a1018; text-stroke: 1.5px #1a1018;
  transform: rotate(-8deg); opacity: .92; pointer-events: none;
  text-shadow: 2px 2px 0 rgba(255,155,61,.5);
}
.comic-sfx.tr { top: 8px; right: 12px; }
.comic-sfx.br { bottom: 10px; right: 12px; }
.comic-sfx.bl { bottom: 10px; left: 12px; transform: rotate(8deg); }

.comic-end { text-align: center; color: var(--text-dim); font-size: 14px; font-weight: 700; padding: 20px 0 8px; }
.comic-end span { font-size: 11px; font-weight: 400; }

/* 剧情回顾里的漫画入口卡 */
.comic-entry { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.comic-entry-card {
  flex: 1; background: linear-gradient(160deg, rgba(58,42,26,.55), var(--panel));
  border: 1px solid rgba(255,155,61,.25); border-radius: 12px; padding: 12px;
  cursor: pointer; transition: transform .1s;
}
.comic-entry-card:active { transform: scale(.97); }
.comic-entry-card .ce-title { font-weight: 700; font-size: 13px; }
.comic-entry-card .ce-sub { font-size: 10px; color: var(--text-dim); margin-top: 3px; }

/* ============================================================
   横版（landscape）—— 整体改为横屏游玩
   ============================================================ */
/* 竖屏时提示旋转设备；横屏时隐藏 */
#rotate-tip {
  display: none;
  position: fixed; inset: 0; z-index: 9999;
  background: radial-gradient(circle at 50% 40%, #2a2038, var(--bg) 70%);
  color: var(--text);
  flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  text-align: center; padding: 30px;
}
#rotate-tip .rt-icon { font-size: 64px; animation: rtspin 2.4s ease-in-out infinite; }
#rotate-tip .rt-title { font-size: 19px; font-weight: 800; letter-spacing: .5px; }
#rotate-tip .rt-sub { font-size: 13px; color: var(--text-dim); line-height: 1.7; max-width: 280px; }
@keyframes rtspin {
  0%, 40% { transform: rotate(0deg); }
  60%, 100% { transform: rotate(-90deg); }
}
@media (orientation: portrait) {
  #rotate-tip { display: flex; }
  #app { visibility: hidden; }   /* 竖屏不渲染主界面，避免误操作 */
}
@media (orientation: landscape) {
  #rotate-tip { display: none; }
}

/* ============================================================
   单一主界面（大厅）—— 满屏背景 + 底部横向功能按钮
   ============================================================ */
#screen.lobby-mode { padding: 0; overflow: hidden; }

.lobby { position: absolute; inset: 0; }
/* 满屏背景层：当前为占位渐变，未来可替换为动态背景图/视频 */
.lobby-bg {
  position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
  background:
    radial-gradient(120% 80% at 50% -10%, rgba(176,107,255,.30), transparent 60%),
    radial-gradient(100% 70% at 80% 110%, rgba(255,107,157,.22), transparent 60%),
    linear-gradient(160deg, #241b33 0%, var(--bg) 55%, #0e0b14 100%);
}
.lobby-bg::after {   /* 缓慢流动的光晕，模拟「动态」氛围（占位） */
  content: ''; position: absolute; inset: -20%;
  background: radial-gradient(40% 40% at 30% 40%, rgba(108,198,255,.12), transparent 70%);
  animation: lobbyGlow 14s ease-in-out infinite alternate;
}
@keyframes lobbyGlow { from { transform: translate(-6%, -4%) scale(1); } to { transform: translate(8%, 6%) scale(1.15); } }
.lobby-bg-grid {
  position: absolute; inset: 0; opacity: .06;
  background-image: linear-gradient(rgba(255,255,255,.6) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255,255,255,.6) 1px, transparent 1px);
  background-size: 44px 44px;

.gf-pick:active { transform: scale(.92); }
/* 服装详情：专属招式块 */

.cd-skill-desc { font-size: 12px; color: var(--text-dim); line-height: 1.5; }
.gf-pick img.char-img { width: 100%; height: 100%; object-fit: cover; }

.gf-pull { display: flex; gap: 8px; align-items: stretch; margin-top: auto; }
.gf-pull .btn.sm { margin-top: 0; flex: 0 0 auto; }

.gf-guar-badge { position: absolute; top: -8px; right: 6px; background: var(--danger); color: #fff; font-size: 9px; padding: 1px 6px; border-radius: 8px; }

@media (max-width: 640px) {

}

/* ============================================================
   主页 hub v2 —— 按 BD2 分区：左集群 / 右活动横幅栈 / 音乐挂件 / 底部功能行+出战+缩略
   ============================================================ */
.lobby-art-ph { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 56px; color: var(--text-dim); opacity: .35; pointer-events: none; }
.lobby-art-ph .muted { font-size: 12px; }
/* 动态背景视频（BD2 式大厅主背景）：铺满、裁切填充，叠暗角让前景按钮清晰 */
.lobby-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; pointer-events: none; background: #0e0b14; }
.lobby-video-scrim { position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background:
    linear-gradient(180deg, rgba(10,8,16,.45) 0%, rgba(10,8,16,.10) 28%, rgba(10,8,16,.20) 62%, rgba(10,8,16,.72) 100%),
    radial-gradient(120% 80% at 50% 0%, transparent 55%, rgba(10,8,16,.45) 100%); }

/* 左上集群 */
.lobby-left { position: absolute; top: 10px; left: 10px; z-index: 2; display: grid; grid-template-columns: repeat(2, 46px); gap: 6px; }
.ll-tile { width: 46px; height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; background: rgba(38,29,51,.78); border: 1px solid rgba(255,255,255,.08); border-radius: 12px; cursor: pointer; color: var(--text); backdrop-filter: blur(4px); }
.ll-tile:active { transform: scale(.93); }
.ll-ico { font-size: 19px; line-height: 1; } .ll-lab { font-size: 9px; }

/* 右侧活动横幅栈 */
.lobby-right { position: absolute; top: 10px; right: 10px; bottom: 92px; z-index: 2; display: flex; flex-direction: column; gap: 8px; width: 150px; overflow-y: auto; }
.lobby-right::-webkit-scrollbar { width: 0; }
.lr-banner { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; text-align: left; padding: 9px 10px; border-radius: 12px; cursor: pointer; color: #fff; border: 1px solid rgba(255,255,255,.12); overflow: hidden; position: relative; }
.lr-banner:active { transform: scale(.97); }
/* 暗炭底 + 该功能色仅做内辉光点缀(与铁框统一, 去高饱和违和) */
.lr-banner.bn-arena   { background: linear-gradient(110deg, #241a3a, #16101f) !important; box-shadow: inset 0 0 22px -6px rgba(176,107,255,.6); }
.lr-banner.bn-dungeon { background: linear-gradient(110deg, #16263f, #101620) !important; box-shadow: inset 0 0 22px -6px rgba(74,144,255,.55); }
.lr-banner.bn-dispatch{ background: linear-gradient(110deg, #163020, #101a14) !important; box-shadow: inset 0 0 22px -6px rgba(58,168,106,.55); }
.lr-banner.bn-event   { background: linear-gradient(110deg, #3a1f12, #1f120c) !important; box-shadow: inset 0 0 22px -6px rgba(255,139,74,.6); }
.lr-banner.bn-arena   .lr-name { color: #d9b6ff; }
.lr-banner.bn-dungeon .lr-name { color: #aacdff; }
.lr-banner.bn-dispatch .lr-name { color: #a6e8bf; }
.lr-banner.bn-event   .lr-name { color: #ffc59a; }
.lr-ico { font-size: 22px; }
.lr-text { display: flex; flex-direction: column; min-width: 0; }
.lr-name { font-size: 13px; font-weight: 800; }
.lr-tag { font-size: 10px; opacity: .9; }

/* 左下音乐挂件 */
.lobby-music { position: absolute; left: 10px; bottom: 92px; z-index: 2; display: flex; align-items: center; gap: 8px; background: rgba(20,14,28,.78); border: 1px solid rgba(255,255,255,.1); border-radius: 20px; padding: 6px 12px; backdrop-filter: blur(4px); }
.lm-ico { font-size: 14px; } .lm-track { font-size: 11px; color: var(--text); }
.lm-toggle { font-size: 13px; cursor: pointer; color: var(--accent); }

/* 底部功能行 + 出战 + 缩略 */
.lobby-bottombar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; align-items: flex-end; gap: 8px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(0deg, rgba(8,6,12,.92), transparent); }
.lb-funcs { flex: 1; min-width: 0; display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.lb-funcs::-webkit-scrollbar { height: 0; }
.lb-cta { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 1px; background: linear-gradient(135deg, var(--accent-2), #c0392b); border: none; border-radius: 14px; padding: 10px 22px; color: #fff; cursor: pointer; box-shadow: 0 4px 16px rgba(255,107,157,.4); }
.lb-cta:active { transform: scale(.97); }
.lb-cta .cta-go { font-size: 18px; font-weight: 800; letter-spacing: 3px; }
.lb-cta .cta-sub { font-size: 10px; opacity: .9; }
.lb-thumb { flex: 0 0 auto; width: 54px; height: 54px; border-radius: 12px; border: 2px solid var(--accent); background: var(--panel-2); cursor: pointer; display: grid; place-items: center; overflow: hidden; }
.lt-art { font-size: 26px; } .lt-art img.char-img { width: 100%; height: 100%; object-fit: cover; }

/* 折叠屏 / 宽屏放大 */
@media (min-width: 820px) {
  .lobby-left { grid-template-columns: repeat(2, 52px); gap: 7px; }
  .ll-tile { width: 52px; height: 52px; } .ll-ico { font-size: 22px; } .ll-lab { font-size: 10px; }
  .lobby-right { width: 184px; } .lr-name { font-size: 14px; } .lr-ico { font-size: 24px; }
  .lb-cta { padding: 12px 32px; } .lb-cta .cta-go { font-size: 21px; }
  .lb-thumb { width: 62px; height: 62px; }
  .lobby-btn { min-width: 66px; } .lobby-btn .lb-icon { font-size: 24px; }
  .lobby-art-ph { font-size: 88px; }
}
@media (max-width: 520px) {
  .lobby-right { width: 120px; } .lr-name { font-size: 11px; } .lr-ico { font-size: 18px; }
  .lobby-music { display: none; }
}

/* ============================================================
   佣兵（伙伴）页 v2 —— 顶部筛选 + 左侧选中预览/阵形 + 右侧角色网格
   ============================================================ */
.roster2 { display: flex; flex-direction: column; height: 100%; gap: 8px; }
.r2-filterbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.rf-group { display: flex; gap: 3px; background: var(--panel); border-radius: 10px; padding: 3px; }
.rf-chip { width: 30px; height: 28px; border: none; background: transparent; color: var(--text); font-size: 14px; border-radius: 7px; cursor: pointer; }
.rf-chip.on { background: var(--accent); color: #fff; }
.rf-toggle, .rf-sort { background: var(--panel); border: 1px solid rgba(255,255,255,.08); color: var(--text-dim); border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
.rf-toggle.on { background: var(--accent); color: #fff; border-color: transparent; }

.r2-body { flex: 1; display: flex; gap: 10px; min-height: 0; }
/* 左：大立绘（视觉主体）+ 操作 + 立绘下方阵形 */
.r2-left { flex: 0 0 36%; min-width: 180px; max-width: 360px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.r2-splash { flex: 1; position: relative; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; min-height: 200px; border-width: 2px; }
.r2-splash.empty { align-items: center; justify-content: center; background: var(--panel); }
.r2-live { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top center; z-index: 0; background: #1a1422; }
.r2-live-scrim { position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background: linear-gradient(0deg, rgba(8,6,12,.85) 0%, rgba(8,6,12,.15) 30%, transparent 55%); }
.r2-splash-avatar { position: absolute; inset: 0 0 30px 0; display: grid; place-items: center; font-size: clamp(90px, 22vmin, 220px); }
.r2-splash-avatar img.char-img { width: 100%; height: 100%; object-fit: contain; object-position: center bottom; }
.r2-splash-el { position: absolute; top: 8px; left: 10px; font-size: 12px; background: rgba(0,0,0,.45); padding: 2px 9px; border-radius: 10px; z-index: 2; }
.r2-splash-star { position: absolute; top: 8px; right: 10px; color: var(--r5); font-size: 14px; letter-spacing: 1px; z-index: 2; text-shadow: 0 1px 3px #000; }
.r2-splash-info { position: relative; z-index: 2; padding: 26px 14px 12px; background: linear-gradient(0deg, rgba(8,6,12,.92), transparent); }
.r2-splash-name { font-size: 20px; font-weight: 800; }
.r2-splash-meta { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
.r2-splash-grow { font-size: 11px; color: var(--gold); margin-top: 3px; }
.r2-splash-actions { display: flex; gap: 6px; } .r2-splash-actions .btn.sm { margin-top: 0; flex: 1; }
.r2-formation { flex: 0 0 auto; background: var(--panel); border: 1px solid rgba(255,255,255,.06); border-radius: 12px; padding: 10px; }
.r2-form-head { font-size: 11px; margin-bottom: 6px; }
.r2-form-slots { display: flex; gap: 5px; }
.r2-form-slot { flex: 1; aspect-ratio: 1/1; border-radius: 8px; background: var(--panel-2); border: 1.5px solid rgba(255,255,255,.08); display: grid; place-items: center; cursor: pointer; overflow: hidden; }
.r2-form-slot.empty { color: var(--text-dim); }
.r2-fs-art { width: 100%; height: 100%; display: grid; place-items: center; font-size: 20px; } .r2-fs-art img.char-img { width: 100%; height: 100%; object-fit: cover; }
.r2-fs-plus { font-size: 16px; }

/* 右侧网格 */
.r2-grid { flex: 1; min-width: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; align-content: start; }
.r2-card { position: relative; background: var(--panel); border-radius: 10px; padding: 4px; cursor: pointer; border-width: 2px; height: fit-content; }
.r2-card.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
.r2-card-art { position: relative; aspect-ratio: 1/1; border-radius: 8px; display: grid; place-items: center; font-size: 30px; overflow: hidden; }
.r2-card-art img.char-img { width: 100%; height: 100%; object-fit: cover; }
.r2-el { position: absolute; top: 2px; left: 3px; font-size: 11px; }
.r2-star { position: absolute; bottom: 1px; left: 0; right: 0; text-align: center; color: var(--r5); font-size: 8px; letter-spacing: -1px; text-shadow: 0 1px 2px #000; }
.r2-card-name { font-size: 11px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; margin-top: 2px; }
.r2-card-lv { font-size: 10px; color: var(--text-dim); text-align: center; }
.r2-team-tag { position: absolute; top: 3px; right: 3px; z-index: 2; background: var(--accent); color: #fff; font-size: 8px; padding: 1px 4px; border-radius: 6px; }

@media (min-width: 820px) {
  .r2-left { flex: 0 0 32%; max-width: 420px; }
  .r2-splash-name { font-size: 24px; }
  .r2-grid { grid-template-columns: repeat(auto-fill, minmax(98px, 1fr)); }
}

/* 装备 / 材料 详情弹窗 */
.bag-cell.clickable { cursor: pointer; }
.bag-cell.clickable:active { transform: scale(.94); }
.gd-head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.gd-art { width: 64px; height: 64px; border-radius: 12px; border-width: 2px; display: grid; place-items: center; background: var(--panel-2); }
.gd-ico { font-size: 34px; }
.gd-name { font-size: 17px; font-weight: 800; }
.gd-meta { font-size: 12px; color: var(--text-dim); margin-top: 3px; }
.gd-section { font-size: 12px; color: var(--text-dim); font-weight: 700; margin: 10px 0 5px; }
.gd-stats { display: flex; flex-direction: column; gap: 4px; }
.gd-stat { display: flex; justify-content: space-between; background: var(--panel); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
.gd-stat.sub { background: var(--panel-2); font-size: 12px; }
.gd-stat b { color: var(--hp); }

/* ===== 剧情板块（故事板） ===== */
.story-board { display: flex; gap: 12px; height: 100%; padding: 12px; box-sizing: border-box; }
.sb-side { flex: 0 0 132px; display: flex; flex-direction: column; gap: 8px; }
.sb-cat {
  background: var(--panel); border: 1px solid rgba(255,255,255,.06);
  color: var(--text-dim); border-radius: 10px; padding: 14px 10px;
  font-size: 14px; font-weight: 700; cursor: pointer; text-align: left;
  transition: background .15s, color .15s, border-color .15s;
}
.sb-cat:active { transform: scale(.97); }
.sb-cat.on {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff; border-color: transparent;
  box-shadow: 0 4px 14px rgba(176,107,255,.35);
}
.sb-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.sb-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 4px 6px 10px; font-size: 15px; font-weight: 800;
  border-bottom: 1px solid rgba(255,255,255,.07); margin-bottom: 8px;
}
.ep-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
.ep-card {
  display: flex; align-items: center; gap: 12px;
  background: var(--panel); border: 1px solid rgba(255,255,255,.06);
  border-radius: 12px; padding: 10px 12px;
}
.ep-thumb-wrap { position: relative; flex: 0 0 auto; }
.ep-thumb {
  width: 64px; height: 64px; border-radius: 10px; display: grid; place-items: center;
  font-size: 32px; background: linear-gradient(135deg, var(--panel-2), #1d1628);
  border: 1px solid rgba(255,255,255,.08); overflow: hidden;
}
.ep-thumb .char-img { width: 100%; height: 100%; object-fit: cover; }
.ep-new {
  position: absolute; top: -5px; left: -5px;
  background: var(--accent-2); color: #fff; font-size: 9px; font-weight: 800;
  padding: 2px 5px; border-radius: 6px; letter-spacing: .5px;
}
.ep-main { flex: 1; min-width: 0; }
.ep-title { font-size: 15px; font-weight: 800; margin-bottom: 3px; }
.ep-src { font-size: 12px; color: #6db5ff; margin-bottom: 5px; }
.ep-tags { display: flex; flex-wrap: wrap; gap: 5px; }
.ep-tag { font-size: 11px; color: var(--text-dim); background: var(--panel-2); padding: 1px 7px; border-radius: 10px; }
.ep-right { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.ep-reward { font-size: 12px; color: var(--gold); font-weight: 700; }
.ep-play { white-space: nowrap; }
@media (min-width: 820px) {
  .ep-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-content: start; }
}

/* ===== 珍藏集（Collection） ===== */
.collection { display: flex; gap: 14px; height: 100%; padding: 12px; box-sizing: border-box; }
.col-left { flex: 0 0 38%; max-width: 420px; min-width: 0; }
.col-splash {
  position: relative; height: 100%; border-radius: 14px; overflow: hidden;
  border: 2px solid rgba(255,255,255,.1); display: flex; align-items: flex-end; justify-content: center;
}
.col-splash.empty { display: grid; place-items: center; background: var(--panel); }
.col-splash-avatar {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-52%);
  font-size: clamp(80px, 22vh, 200px); filter: drop-shadow(0 10px 24px rgba(0,0,0,.5));
}
.col-splash-avatar .char-img { width: clamp(150px, 40vh, 360px); height: auto; }
.col-splash-info {
  position: relative; z-index: 2; width: 100%; padding: 14px 16px;
  background: linear-gradient(0deg, rgba(0,0,0,.72), transparent);
}
.col-splash-name { font-size: clamp(18px, 3vh, 26px); font-weight: 900; }
.col-splash-meta { font-size: 12px; color: #d8cfe6; margin-top: 3px; }

.col-right { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.col-head {
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center;
  padding: 6px 4px 12px; border-bottom: 1px solid rgba(255,255,255,.08); margin-bottom: 12px;
}
.col-head-title { font-size: 16px; font-weight: 900; display: flex; align-items: center; gap: 6px; }
.col-q { font-size: 12px; color: var(--text-dim); cursor: help; }
.col-head-bonus { display: flex; flex-wrap: wrap; gap: 6px; }
.col-bn {
  font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 20px;
  background: var(--panel-2); color: var(--gold); border: 1px solid rgba(240,198,116,.25);
}
.col-bn.alt { color: #7fd0ff; border-color: rgba(127,208,255,.25); }
.col-bn.max { color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); border: none; }

.col-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 10px; align-content: start; overflow-y: auto; padding-right: 4px;
}
.col-cat {
  position: relative; background: var(--panel); border: 1px solid rgba(255,255,255,.07);
  border-radius: 12px; padding: 14px 12px 16px; text-align: center; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  transition: transform .12s, border-color .15s;
}
.col-cat:active { transform: scale(.96); }
.col-cat.done { border-color: var(--gold); box-shadow: 0 0 0 1px rgba(240,198,116,.25) inset; }
.col-cat-ico { font-size: 32px; }
.col-cat-name { font-size: 14px; font-weight: 700; }
.col-cat-pct { font-size: 13px; color: var(--text-dim); }
.col-cat-pct b { color: var(--gold); }
.col-cat-bar { width: 78%; height: 5px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }

/* 门类藏品弹窗 */
.modal.wide { max-width: 560px; width: 92vw; }
.col-item-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
  gap: 8px; max-height: 52vh; overflow-y: auto; margin: 10px 0;
}
.col-item {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  background: var(--panel); border: 1px solid rgba(255,255,255,.06);
  border-radius: 10px; padding: 10px 6px;
}
.col-item.owned { cursor: default; }
.col-item.owned[data-ci] { cursor: pointer; }
.col-item.locked { opacity: .5; }
.ci-ico { font-size: 26px; }
.ci-name { font-size: 12px; text-align: center; line-height: 1.2; }

@media (max-width: 720px) {
  .col-left { flex: 0 0 32%; }
  .col-cat-ico { font-size: 26px; }
}

/* ===== 任务板（每日 / 每周） ===== */
.task-board { display: flex; gap: 14px; height: 100%; padding: 12px; box-sizing: border-box; }
.tk-side { flex: 0 0 140px; display: flex; flex-direction: column; gap: 8px; }
.tk-side-title { font-size: 16px; font-weight: 900; padding: 4px 6px 8px; }
.tk-tab {
  position: relative; text-align: left; background: var(--panel);
  border: 1px solid rgba(255,255,255,.06); color: var(--text-dim);
  border-radius: 10px; padding: 14px 12px; font-size: 14px; font-weight: 700; cursor: pointer;
  transition: background .15s, color .15s;
}
.tk-tab.on { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border-color: transparent; }
.tk-dot { position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: #ff5274; box-shadow: 0 0 6px #ff5274; }

.tk-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
/* 区间奖励轨道 */
.tk-milerow { display: flex; align-items: center; gap: 12px; padding: 6px 8px 26px; }

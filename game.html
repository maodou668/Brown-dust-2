    if (Game.state.team.length === 0) { UI.toast('请先在「佣兵」页编入出战队伍'); Main.switchScreen('roster'); return; }
    this.chapter = ch; this.theme = ch.theme; this.w = 15; this.h = 15;
    this.buildDOM();
    this.buildMap(ch);
    this.active = true; this.busyTrigger = false;
    this.start();
    this.announceObjective(false);
  },

  buildDOM() {
    const old = document.getElementById('world-screen');
    if (old) old.remove();
    this.root = UI.el(`
      <div id="world-screen">
        <div class="world-top">
          <span id="world-title">🗺️ ${this.chapter.name}</span>
          <button class="ghost-btn" id="world-exit" title="离开">✕</button>
        </div>
        <div class="world-obj" id="world-obj"></div>
        <canvas id="world-canvas"></canvas>
        <div class="world-ctrl">
          <div class="dpad">
            <button class="dbtn up"    data-dir="up">▲</button>
            <button class="dbtn left"  data-dir="left">◀</button>
            <button class="dbtn right" data-dir="right">▶</button>
            <button class="dbtn down"  data-dir="down">▼</button>
          </div>
          <button class="act-btn" id="world-act" disabled>互动</button>
        </div>
      </div>`);
    document.body.appendChild(this.root);
    this.canvas = this.root.querySelector('#world-canvas');
    this.ctx = this.canvas.getContext('2d');
    this.resize();
    this.root.querySelector('#world-exit').onclick = () => this.close();
    this.root.querySelector('#world-act').onclick = () => this.tryTrigger(true);
    this.root.querySelectorAll('.dbtn').forEach(b => {
      const dir = b.dataset.dir;
      const on = (e) => { e.preventDefault(); this.input[dir] = true; };
      const off = (e) => { e.preventDefault(); this.input[dir] = false; };
      b.addEventListener('touchstart', on, { passive: false });
      b.addEventListener('touchend', off); b.addEventListener('touchcancel', off);
      b.addEventListener('mousedown', on); b.addEventListener('mouseup', off); b.addEventListener('mouseleave', off);
    });
    this._keyHandler = (e) => {
      const m = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right' };
      const dir = m[e.key];
      if (!dir) { if ((e.key === ' ' || e.key === 'Enter') && e.type === 'keydown') this.tryTrigger(true); return; }
      this.input[dir] = (e.type === 'keydown'); e.preventDefault();
    };
    window.addEventListener('keydown', this._keyHandler);
    window.addEventListener('keyup', this._keyHandler);
  },

  resize() {
    const rect = this.canvas.getBoundingClientRect();
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.vw = rect.width; this.vh = rect.height;
    this.canvas.width = Math.floor(this.vw * this.dpr);
    this.canvas.height = Math.floor(this.vh * this.dpr);
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
  },

  buildMap(ch) {
    // 网格：边界树 + 草地 + 稀疏装饰障碍
    const grid = [];
    for (let y = 0; y < this.h; y++) {
      const row = [];
      for (let x = 0; x < this.w; x++) {
        row.push((x === 0 || y === 0 || x === this.w - 1 || y === this.h - 1) ? 'tree' : 'grass');
      }
      grid.push(row);
    }
    const deco = [[2,2],[12,2],[3,11],[12,11],[2,7],[12,8],[6,12],[9,2]];
    deco.forEach(([x, y], i) => { grid[y][x] = (i % 3 === 0) ? 'rock' : 'tree'; });
    // 池塘
    [[11,3],[12,3],[11,4]].forEach(([x, y]) => grid[y][x] = 'water');
    this.grid = grid;

    // 花装饰
    this.flowers = [];
    for (let i = 0; i < 40; i++) {
      const x = (i * 7) % this.w, y = (i * 11) % this.h;
      if (grid[y][x] === 'grass' && i % 4 === 0) this.flowers.push([x + 0.5, y + 0.5, i % 3]);
    }

    // 节点 = 步骤
    const prog = this.progress(ch.id);
    this.nodes = ch.steps.map((st, i) => {
      const slot = this.SLOTS[i] || this.SLOTS[this.SLOTS.length - 1];
      const icon = st.icon || (st.type === 'battle' ? '⚔️' : st.type === 'story' ? '💬' : '❔');
      // 确保节点格可走
      const gx = Math.floor(slot.x), gy = Math.floor(slot.y);
      if (this.isSolid(grid[gy][gx])) grid[gy][gx] = 'grass';
      return { ...st, idx: i, x: slot.x, y: slot.y, icon, done: i < prog };
    });
    this.cur = this.nodes[prog] || null;

    // 主角
    this.player.x = this.START.x; this.player.y = this.START.y; this.player.dir = 'up';
    const lead = Game.state.team[0] && Game.getOwned(Game.state.team[0]);
    this.player.color = lead ? window.GameData.CHARACTERS[lead.charId].color : '#b06bff';
  },

  isSolid(t) { return t === 'tree' || t === 'rock' || t === 'water'; },

  // ---------- 坐标变换 ----------
  worldToIso(wx, wy) { return { x: (wx - wy) * this.HW, y: (wx + wy) * this.HH }; },

  // ---------- 主循环 ----------
  start() {
    cancelAnimationFrame(this.raf);
    let last = performance.now();
    const loop = (ts) => {
      if (!this.active) return;
      const dt = Math.min(40, ts - last); last = ts;
      this.update(dt); this.render();
      this.raf = requestAnimationFrame(loop);
    };
    this.raf = requestAnimationFrame(loop);
  },
  stop() { this.active = false; cancelAnimationFrame(this.raf); },
  resume() { if (this.root) { this.active = true; this.busyTrigger = false; this.start(); } },

  update(dt) {
    const p = this.player;
    let dx = 0, dy = 0;
    if (this.input.up) { dx -= 1; dy -= 1; }
    if (this.input.down) { dx += 1; dy += 1; }
    if (this.input.left) { dx -= 1; dy += 1; }
    if (this.input.right) { dx += 1; dy -= 1; }
    if (dx || dy) {
      const len = Math.hypot(dx, dy) || 1;
      const sp = 0.062 * (dt / 16.67);
      const nx = p.x + (dx / len) * sp, ny = p.y + (dy / len) * sp;
      if (!this.blockedWorld(nx, p.y)) p.x = nx;
      if (!this.blockedWorld(p.x, ny)) p.y = ny;
      p.dir = Math.abs(dx) >= Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
      p.step += dt;
    } else p.step = 0;

    // 镜头
    const iso = this.worldToIso(p.x, p.y);
    const minX = -this.h * this.HW, maxX = this.w * this.HW, maxY = (this.w + this.h) * this.HH;
    this.cam.x = this.clamp(iso.x - this.vw / 2, minX - 40, maxX + 40 - this.vw);
    this.cam.y = this.clamp(iso.y - this.vh / 2, -40, maxY + 60 - this.vh);

    // 到达当前目标 → 自动触发
    if (this.cur && !this.busyTrigger) {
      const d = Math.hypot(this.cur.x - p.x, this.cur.y - p.y);
      const act = this.root.querySelector('#world-act');
      const replayable = this.nodes.filter(n => n.done && n.type === 'battle');
      // 当前目标范围内
      if (d < 0.7) { this.tryTrigger(false); }
      // 互动按钮：当前目标 或 可重打的已完成战斗
      let near = (d < 1.0) ? this.cur : null;
      if (!near) {
        for (const n of replayable) { if (Math.hypot(n.x - p.x, n.y - p.y) < 1.0) { near = n; break; } }
      }
      this._near = near;
      if (act) { act.disabled = !near; act.textContent = near && near.type === 'battle' ? '战斗' : '互动'; }
    }
  },

  clamp(v, lo, hi) { if (lo > hi) return (lo + hi) / 2; return Math.max(lo, Math.min(hi, v)); },

  blockedWorld(wx, wy) {
    const r = 0.28;
    const pts = [[wx - r, wy - r], [wx + r, wy - r], [wx - r, wy + r], [wx + r, wy + r]];
    return pts.some(([x, y]) => {
      const tx = Math.floor(x), ty = Math.floor(y);
      if (tx < 0 || ty < 0 || tx >= this.w || ty >= this.h) return true;
      return this.isSolid(this.grid[ty][tx]);
    });
  },

  // ---------- 触发 ----------
  tryTrigger(manual) {
    if (this.busyTrigger) return;
    const n = manual ? (this._near || this.cur) : this.cur;
    if (!n) return;
    // 已完成的可重打战斗
    if (n.done && n.type === 'battle') {
      if (!manual) return;
      this.busyTrigger = true; this.stop();
      const stage = window.GameData.STAGES.find(s => s.id === n.stage);
      BattleUI.start(stage, () => this.resume());
      return;
    }
    if (n !== this.cur) return;
    this.busyTrigger = true; this.stop();
    if (n.type === 'story') {
      Story.play(n.story, () => this.completeStep());
    } else if (n.type === 'npc') {
      this.npcDialog(n, () => this.completeStep());
    } else if (n.type === 'battle') {
      const stage = window.GameData.STAGES.find(s => s.id === n.stage);
      BattleUI.start(stage, () => {
        if (Battle.result === 'win') this.completeStep();
        else this.resume(); // 失败/撤退：留在当前目标重试
      });
    }
  },

  completeStep() {
    const id = this.chapter.id;
    const prog = this.progress(id);
    if (this.cur && this.cur.idx === prog) {
      Game.state.chapterProgress[id] = prog + 1;
      // 里程碑奖励（首次完成该步骤）：作为「累计 100 抽」的主线发放部分
      const gem = this.cur.type === 'battle' ? 600 : this.cur.type === 'story' ? 300 : 200;
      Game.state.gem += gem;
      Game.save();
      this.cur.done = true;
      UI.updateResources();
      UI.toast(`🎯 里程碑奖励：💎${gem}`);
    }
    const next = this.nodes[this.progress(id)];
    this.cur = next || null;
    if (next) { this.resume(); this.announceObjective(true); }
    else { this.chapterCompleteReward(); this.chapterComplete(); }
  },

  /** 章节通关额外奖励 */
  chapterCompleteReward() {
    Game.state.gem += 600;
    Game.save();
    UI.updateResources();
  },

  announceObjective(isNew) {
    const obj = this.root && this.root.querySelector('#world-obj');
    if (!obj) return;
    if (this.cur) {
      obj.innerHTML = `<span class="obj-tag">目标</span> ${this.cur.label}`;
      if (isNew) { obj.classList.remove('flash'); void obj.offsetWidth; obj.classList.add('flash'); }
    } else obj.textContent = '';
  },

  chapterComplete() {
    this.stop();
    const m = UI.openModal(`
      <div class="result-modal">
        <div class="result-title win" style="font-size:24px;">章节完成！</div>
        <p class="muted">${this.chapter.name}</p>
        <p style="margin-top:8px;">恭喜通关本章节，新的征程已经解锁。</p>
      </div>
      <div class="close-row" style="justify-content:center;"><button class="btn" id="cc-ok">返回</button></div>`,
      { noBackdropClose: true });
    m.querySelector('#cc-ok').onclick = () => { UI.closeModal(m); this.close(); };
  },

  npcDialog(n, onDone) {
    const m = UI.openModal(`
      <h2>${n.icon} ${n.label.replace('与', '').replace('交谈', '')}</h2>
      <p style="line-height:1.7;margin:10px 0;">${n.text}</p>
      <div class="close-row"><button class="btn" id="npc-ok">好的</button></div>`, { noBackdropClose: true });
    m.querySelector('#npc-ok').onclick = () => { UI.closeModal(m); if (onDone) onDone(); };
  },

  // ---------- 渲染（等距） ----------
  render() {
    const ctx = this.ctx, pal = this.palette();
    ctx.fillStyle = pal.bg; ctx.fillRect(0, 0, this.vw, this.vh);
    // 地面菱形
    for (let y = 0; y < this.h; y++) {
      for (let x = 0; x < this.w; x++) {
        const t = this.grid[y][x];
        const iso = this.worldToIso(x + 0.5, y + 0.5);
        const sx = iso.x - this.cam.x, sy = iso.y - this.cam.y;
        if (sx < -this.HW * 2 || sx > this.vw + this.HW * 2 || sy < -this.HH * 4 || sy > this.vh + this.HH * 4) continue;
        const ground = (t === 'water') ? pal.water : ((x + y) % 2 === 0 ? pal.grass : pal.grass2);
        this.diamond(sx, sy, ground);
        if (t === 'water') { ctx.strokeStyle = 'rgba(255,255,255,.2)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(sx - 8, sy); ctx.lineTo(sx + 8, sy); ctx.stroke(); }
      }
    }
    // 花
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    this.flowers.forEach(([wx, wy, c]) => {
      const iso = this.worldToIso(wx, wy); const sx = iso.x - this.cam.x, sy = iso.y - this.cam.y;
      ctx.fillStyle = ['#ff8ad0', '#ffe07a', '#9bdcff'][c]; ctx.fillRect(sx - 2, sy - 2, 4, 4);
    });

    // 立面物体（树/石/节点/主角）按深度排序
    const objs = [];
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
      const t = this.grid[y][x];
      if (t === 'tree' || t === 'rock') objs.push({ d: x + y, wx: x + 0.5, wy: y + 0.5, kind: t });
    }
    this.nodes.forEach(n => objs.push({ d: n.x + n.y, wx: n.x, wy: n.y, kind: 'node', node: n }));
    objs.push({ d: this.player.x + this.player.y, wx: this.player.x, wy: this.player.y, kind: 'player' });
    objs.sort((a, b) => a.d - b.d);
    objs.forEach(o => {
      const iso = this.worldToIso(o.wx, o.wy);
      const sx = iso.x - this.cam.x, sy = iso.y - this.cam.y;
      if (sx < -60 || sx > this.vw + 60 || sy < -80 || sy > this.vh + 80) return;
      if (o.kind === 'tree') this.bill(sx, sy, '🌲', 30);
      else if (o.kind === 'rock') this.bill(sx, sy, '🪨', 24);
      else if (o.kind === 'node') this.drawNode(sx, sy, o.node);
      else this.drawPlayer(sx, sy);
    });

    // 离屏目标的边缘指引箭头
    this.drawGuideArrow();
  },

  diamond(cx, cy, color) {
    const ctx = this.ctx, hw = this.HW, hh = this.HH;
    ctx.beginPath();
    ctx.moveTo(cx, cy - hh); ctx.lineTo(cx + hw, cy); ctx.lineTo(cx, cy + hh); ctx.lineTo(cx - hw, cy); ctx.closePath();
    ctx.fillStyle = color; ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.10)'; ctx.lineWidth = 1; ctx.stroke();
  },

  bill(sx, sy, emoji, size) {
    const ctx = this.ctx;
    ctx.font = size + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText(emoji, sx, sy + this.HH);
  },

  drawNode(sx, sy, n) {
    const ctx = this.ctx;
    const locked = false;
    ctx.save();
    if (n.done && n.type !== 'battle') ctx.globalAlpha = 0.4;
    // 当前目标光环
    if (n === this.cur) {
      const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 280);
      ctx.beginPath(); ctx.arc(sx, sy, 18 + pulse * 4, 0, 7);
      ctx.fillStyle = 'rgba(255,220,120,' + (0.15 + pulse * 0.18) + ')'; ctx.fill();
    }
    ctx.font = '22px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText(n.done ? (n.type === 'battle' ? n.icon : '✓') : n.icon, sx, sy + 6);
    if (n === this.cur) {
      // 跳动箭头
      const bob = Math.sin(performance.now() / 200) * 3;
      ctx.font = '16px serif'; ctx.fillStyle = '#ffd35a';
      ctx.fillText('▼', sx, sy - 22 + bob);
    }
    ctx.restore();
  },

  drawPlayer(sx, sy) {
    const ctx = this.ctx, p = this.player;
    const bob = Math.abs(Math.sin(p.step / 90)) * 3;
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(sx, sy + 4, 10, 5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = p.color; this.rr(sx - 8, sy - 18 - bob, 16, 18, 5); ctx.fill();
    ctx.fillStyle = '#ffe0c0'; ctx.beginPath(); ctx.arc(sx, sy - 22 - bob, 7, 0, 7); ctx.fill();
    ctx.fillStyle = '#3a2a2a';
    const off = { up: [0, -3], down: [0, 1], left: [-3, -1], right: [3, -1] }[p.dir] || [0, 1];
    ctx.fillRect(sx + off[0] - 1, sy - 23 - bob + off[1], 2, 2);
  },

  rr(x, y, w, h, r) {
    const ctx = this.ctx; ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  },

  drawGuideArrow() {
    if (!this.cur) return;
    const iso = this.worldToIso(this.cur.x, this.cur.y);
    const sx = iso.x - this.cam.x, sy = iso.y - this.cam.y;
    if (sx >= 20 && sx <= this.vw - 20 && sy >= 20 && sy <= this.vh - 20) return; // 在屏内不画
    const cx = this.vw / 2, cy = this.vh / 2;
    const ang = Math.atan2(sy - cy, sx - cx);
    const ex = cx + Math.cos(ang) * (Math.min(this.vw, this.vh) / 2 - 28);
    const ey = cy + Math.sin(ang) * (Math.min(this.vw, this.vh) / 2 - 28);
    const ctx = this.ctx; ctx.save(); ctx.translate(ex, ey); ctx.rotate(ang);
    ctx.fillStyle = '#ffd35a'; ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-8, -8); ctx.lineTo(-8, 8); ctx.closePath(); ctx.fill();
    ctx.restore();
  },

  palette() {
    return ({
      forest: { bg: '#16241a', grass: '#2e5a34', grass2: '#356b3c', water: '#2a6aa0' },
      cave:   { bg: '#130f0c', grass: '#3a2f28', grass2: '#46382f', water: '#3a6a8a' },
      castle: { bg: '#160a12', grass: '#3a2436', grass2: '#46304a', water: '#5a3a6a' },
    })[this.theme] || { bg: '#181818', grass: '#3a3a3a', grass2: '#444', water: '#2a6aa0' };
  },

  close() {
    this.stop();
    if (this._keyHandler) { window.removeEventListener('keydown', this._keyHandler); window.removeEventListener('keyup', this._keyHandler); }
    if (this.root) { this.root.remove(); this.root = null; }
    Main.refreshCurrent();
  },
};

window.World = World;


// ============================================================
//  战斗界面渲染 + 交互  &  应用主入口
// ============================================================

const BattleUI = {
  stage: null,
  root: null,
  selectedSkill: null,   // 当前选中的技能 id
  busy: false,           // 动画/AI 执行中，锁定输入
  auto: false,           // 自动战斗

  start(stage, onExit) {
    this.stage = stage;
    this.onExitCb = onExit || null;
    this.selectedSkill = null;
    this.busy = false;
    Battle.setup(Game.state.team, stage);
    Battle.onEvent = (e) => this.handleEvent(e);
    this.buildScreen();
    this.refresh();
    this.beginTurn();
  },

  buildScreen() {
    const old = document.getElementById('battle-screen');
    if (old) old.remove();
    const scene = this.sceneForStage(this.stage.id);
    this.root = UI.el(`
      <div id="battle-screen">
        <div class="battle-top">
          <span>${this.stage.name}</span>
          <span id="battle-round">第 1 回合</span>
          <div style="display:flex;gap:6px;">
            <button class="auto-btn ${this.auto ? 'on' : ''}" id="battle-auto" title="自动战斗">自动</button>
            <button class="ghost-btn" id="battle-flee" title="撤退">🏳️</button>
          </div>
        </div>
        <div class="battle-field bg-${scene}">
          <div class="bfx-particles" id="bfx"></div>
          <div class="stage-ground enemy"></div>
          <div class="stage-ground ally"></div>
          <div class="battle-stage" id="battle-stage"></div>
          <div class="skill-banner" id="skill-banner"></div>
        </div>
        <div class="battle-ctrl">
          <div class="turn-hint" id="turn-hint"></div>
          <div class="skill-bar" id="skill-bar"></div>
        </div>
        <div class="battle-log" id="battle-log"></div>
      </div>
    `);
    document.body.appendChild(this.root);
    this.root.querySelector('#battle-flee').onclick = () => this.flee();
    this.root.querySelector('#battle-auto').onclick = () => this.toggleAuto();
    this.spawnParticles(scene);
  },

  toggleAuto() {
    this.auto = !this.auto;
    const b = this.root && this.root.querySelector('#battle-auto');
    if (b) b.classList.toggle('on', this.auto);
    // 若当前正等待我方操作，立即接管
    if (this.auto && !this.busy && Battle.isPlayerTurn && Battle.isPlayerTurn()) {
      this.autoAct();
    }
  },

  /** 关卡 -> 场景类型 */
  sceneForStage(id) {
    return ({ 1: 'forest', 2: 'forest_deep', 3: 'cave', 4: 'ridge', 5: 'castle', 6: 'forest_deep', 7: 'castle' })[id] || 'void';
  },

  /** 场景氛围粒子 */
  spawnParticles(scene) {
    const type = ({ forest: 'leaf', forest_deep: 'leaf', cave: 'ember', castle: 'ember', ridge: 'snow' })[scene] || 'mote';
    const box = this.root && this.root.querySelector('#bfx');
    if (!box) return;
    const n = 14;
    let html = '';
    for (let i = 0; i < n; i++) {
      const left = Math.random() * 100;
      const dur = 6 + Math.random() * 7;
      const delay = -Math.random() * dur;
      const size = 6 + Math.random() * 8;
      html += `<span class="bfx ${type}" style="left:${left}%;width:${size}px;height:${size}px;animation-duration:${dur}s;animation-delay:${delay}s;"></span>`;
    }
    box.innerHTML = html;
  },

  flee() {
    const m = UI.openModal(`
      <h2>撤退？</h2>
      <p class="muted" style="margin:8px 0;">撤退将不会获得任何奖励，确定要离开战斗吗？</p>
      <div class="close-row">
        <button class="btn secondary" id="flee-no">继续战斗</button>
        <button class="btn" id="flee-yes" style="background:linear-gradient(135deg,#ff5a6a,#b02a3a);">撤退</button>
      </div>`);
    m.querySelector('#flee-no').onclick = () => UI.closeModal(m);
    m.querySelector('#flee-yes').onclick = () => {
      UI.closeModal(m);
      this.exit();
    };
  },

  exit() {
    if (this.root) this.root.remove();
    this.root = null;
    const cb = this.onExitCb;
    this.onExitCb = null;
    if (cb) cb();
    else Main.refreshCurrent();
  },

  // ---------- 渲染单位（斜俯视角舞台，近大远小） ----------
  // 各排在舞台中的纵向位置/缩放/横向间距（百分比）
  ROWCFG: {
    enemy_back:  { y: 17, s: 0.72, sp: 16 },
    enemy_front: { y: 35, s: 0.84, sp: 20 },
    ally_front:  { y: 58, s: 0.94, sp: 23 },
    ally_back:   { y: 80, s: 1.06, sp: 27 },
  },

  unitHtml(c, side, pos, idx, count) {
    const isAlly = c.side === 'ally';
    const charDef = isAlly ? window.GameData.CHARACTERS[c.charId] : window.GameData.ENEMIES[c.charId];
    const icon = isAlly ? window.GameData.CLASSES[charDef.cls].icon : '👹';
    const hpPct = Math.max(0, (c.hp / c.maxHp) * 100);
    const spPct = (c.sp / c.maxSp) * 100;
    const stIcon = { poison: '☠️', burn: '🔥', stun: '💫', silence: '🔇' };
    const statusHtml = (c.statuses || []).filter(s => s.turns > 0)
      .map(s => `<span class="st-badge" title="${s.type}">${stIcon[s.type] || ''}</span>`).join('');
    const cfg = this.ROWCFG[side + '_' + pos];
    const x = 50 + (idx - (count - 1) / 2) * cfg.sp;
    const z = Math.round(cfg.y * 10);
    const style = `left:${x}%; top:${cfg.y}%; --uscale:${cfg.s}; z-index:${z};`;
    return `
      <div class="unit ${c.alive ? '' : 'dead'} ${c.enraged ? 'enraged' : ''} ${isAlly ? 'ally-unit' : ''}" data-uid="${c.uid}"
           style="${style}background:linear-gradient(180deg, ${c.color}44, var(--panel));">
        <div class="u-shadow"></div>
        ${c.isBoss ? '<span class="u-boss">BOSS</span>' : ''}
        <span class="u-elem">${window.GameData.ELEMENTS[c.element].icon}</span>
        ${statusHtml ? `<div class="u-status">${statusHtml}</div>` : ''}
        <div class="u-art">${icon}</div>
        <div class="u-name">${c.name}</div>
        ${c.shield > 0 ? `<span class="shield-tag">🛡${c.shield}</span>` : ''}
        <div class="bar"><div class="fill hp" style="width:${hpPct}%"></div></div>
        <div class="u-hp-text">${c.hp}/${c.maxHp}</div>
        ${isAlly ? `<div class="bar"><div class="fill sp" style="width:${spPct}%"></div></div>` : ''}
      </div>`;
  },

  refresh() {
    if (!this.root) return;
    const stage = this.root.querySelector('#battle-stage');
    if (!stage) return;
    let html = '';
    [['enemy', 'back'], ['enemy', 'front'], ['ally', 'front'], ['ally', 'back']].forEach(([side, pos]) => {
      const list = Battle.combatants.filter(c => c.side === side && c.pos === pos);
      list.forEach((c, i) => { html += this.unitHtml(c, side, pos, i, list.length); });
    });
    stage.innerHTML = html;
    this.root.querySelector('#battle-round').textContent = `第 ${Battle.round} 回合`;

    const cur = Battle.current();
    if (cur) {
      const ce = stage.querySelector(`.unit[data-uid="${cur.uid}"]`);
      if (ce) ce.classList.add('active-turn');
    }
    this.attachDrag();
  },

  /** 仅更新单个单位的血量/SP/状态（不重建，保留动画） */
  updateUnitDom(c) {
    if (!c || !this.root) return;
    const el = this.root.querySelector(`.unit[data-uid="${c.uid}"]`);
    if (!el) return;
    const hpFill = el.querySelector('.fill.hp'); if (hpFill) hpFill.style.width = Math.max(0, c.hp / c.maxHp * 100) + '%';
    const hpText = el.querySelector('.u-hp-text'); if (hpText) hpText.textContent = `${c.hp}/${c.maxHp}`;
    const spFill = el.querySelector('.fill.sp'); if (spFill) spFill.style.width = (c.sp / c.maxSp * 100) + '%';
    el.classList.toggle('dead', !c.alive);
    el.classList.toggle('enraged', !!c.enraged);
    // 护盾
    let sh = el.querySelector('.shield-tag');
    if (c.shield > 0) { if (!sh) { sh = UI.el('<span class="shield-tag"></span>'); el.appendChild(sh); } sh.textContent = '🛡' + c.shield; }
    else if (sh) sh.remove();
    // 状态图标
    const stIcon = { poison: '☠️', burn: '🔥', stun: '💫', silence: '🔇' };
    const active = (c.statuses || []).filter(s => s.turns > 0);
    let su = el.querySelector('.u-status');
    if (active.length) {
      if (!su) { su = UI.el('<div class="u-status"></div>'); el.insertBefore(su, el.querySelector('.u-art')); }
      su.innerHTML = active.map(s => `<span class="st-badge">${stIcon[s.type] || ''}</span>`).join('');
    } else if (su) su.remove();
  },

  /** 拖动调整我方站位（前后排/左右） */
  attachDrag() {
    const stage = this.root && this.root.querySelector('#battle-stage');
    if (!stage) return;
    stage.querySelectorAll('.unit.ally-unit').forEach(el => {
      el.addEventListener('pointerdown', (e) => this.onDragStart(e, el));
    });
  },

  onDragStart(e, el) {
    // 仅在空闲（非动画、未选技能、非自动）时允许拖动
    if (this.busy || this.selectedSkill || this.auto) return;
    const uid = el.dataset.uid;
    const c = Battle.combatants.find(x => x.uid === uid);
    if (!c || !c.alive) return;
    e.preventDefault();
    const startX = e.clientX, startY = e.clientY;
    let dragging = false;
    const move = (ev) => {
      const dx = ev.clientX - startX, dy = ev.clientY - startY;
      if (!dragging && Math.hypot(dx, dy) > 8) { dragging = true; el.classList.add('dragging'); this.setHint('拖动到目标位置交换站位'); }
      if (dragging) { el.style.transform = `translate(calc(-50% + ${dx}px), calc(-100% + ${dy}px)) scale(var(--uscale))`; }
    };
    const up = (ev) => {
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      el.classList.remove('dragging');
      if (!dragging) return;
      // 找放置目标：最近的我方单位
      const targetUid = this.dropTargetUid(ev.clientX, ev.clientY, uid);
      if (targetUid) this.swapFormation(uid, targetUid);
      else this.refresh();
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
  },

  dropTargetUid(px, py, selfUid) {
    let best = null, bestD = 70;
    this.root.querySelectorAll('.unit.ally-unit').forEach(el => {
      if (el.dataset.uid === selfUid) return;
      const r = el.getBoundingClientRect();
      const d = Math.hypot(px - (r.left + r.width / 2), py - (r.top + r.height / 2));
      if (d < bestD) { bestD = d; best = el.dataset.uid; }
    });
    return best;
  },

  /** 交换两名我方单位的站位（前后排互换） */
  swapFormation(uidA, uidB) {
    const a = Battle.combatants.find(c => c.uid === uidA);
    const b = Battle.combatants.find(c => c.uid === uidB);
    if (!a || !b) { this.refresh(); return; }
    const ap = a.pos; a.pos = b.pos; b.pos = ap;
    this.setHint('站位已调整');
    this.refresh();
  },

  // ---------- 回合流程 ----------
  beginTurn() {
    if (Battle.finished) return;
    const cur = Battle.current();
    if (!cur || !cur.alive) { this.nextTurn(); return; }
    this.refresh();

    // 眩晕：跳过本回合
    if (Battle.isStunned(cur)) {
      Battle.consumeStun(cur);
      this.clearSkillBar();
      this.setHint(`💫 <b>${cur.name}</b> 被眩晕，跳过回合`);
      this.knockFloat(cur, '💫 眩晕');
      this.busy = true;
      setTimeout(() => { this.busy = false; if (!Battle.finished) this.nextTurn(); }, 750);
      return;
    }

    if (cur.side === 'ally') {
      this.renderSkillBar(cur);
      this.setHint(`轮到 <b>${cur.name}</b> 行动，请选择技能`);
      if (this.auto) { this.busy = true; setTimeout(() => { this.busy = false; this.autoAct(); }, 450); }
    } else {
      this.clearSkillBar();
      this.setHint(`<b>${cur.name}</b> 正在行动...`);
      this.busy = true;
      this._lunged = false;
      setTimeout(() => {
        Battle.enemyAct();
        this.busy = false;
        if (!Battle.finished) this.nextTurn();
      }, 850);
    }
  },

  nextTurn() {
    if (Battle.finished) return;
    Battle.advance();
    this.beginTurn();
  },

  setHint(html) {
    const h = this.root && this.root.querySelector('#turn-hint');
    if (h) h.innerHTML = html;
  },

  clearSkillBar() {
    const bar = this.root && this.root.querySelector('#skill-bar');
    if (bar) bar.innerHTML = '';
  },

  renderSkillBar(c) {
    const bar = this.root.querySelector('#skill-bar');
    bar.innerHTML = c.skills.map(sid => {
      const sk = window.GameData.SKILLS[sid];
      const usable = Battle.canUseSkill(c, sid);
      const cd = c.cooldowns[sid] || 0;
      let label;
      if (sk.basic) label = `<div class="sb-sp ready">回 SP +3</div>`;
      else if (cd > 0) label = `<div class="sb-sp cooldown">冷却 ${cd}</div>`;
      else label = `<div class="sb-sp ${usable ? 'ready' : ''}">SP ${sk.sp}${usable ? ' ✓' : ' (' + c.sp + ')'}</div>`;
      return `<button class="skill-btn ${sk.basic ? 'basic' : ''}" data-skill="${sid}" ${usable ? '' : 'disabled'}>
        <div class="sb-name">${sk.icon} ${sk.name}</div>
        ${label}
      </button>`;
    }).join('');
    bar.querySelectorAll('.skill-btn').forEach(b =>
      b.addEventListener('click', () => this.selectSkill(c, b.dataset.skill)));
  },

  selectSkill(c, skillId) {
    if (this.busy) return;
    this.selectedSkill = skillId;
    // 高亮选中技能
    this.root.querySelectorAll('.skill-btn').forEach(b =>
      b.classList.toggle('selected', b.dataset.skill === skillId));

    const sk = window.GameData.SKILLS[skillId];
    const targets = Battle.validTargets(c, skillId);

    // 自身/全体技能无需选目标，直接执行
    if (sk.target === 'self' || sk.target === 'enemyAll' || sk.target === 'allyAll') {
      this.setHint(`确认对${sk.target === 'self' ? '自身' : (sk.target === 'allyAll' ? '全体友方' : '全体敌人')}使用「${sk.name}」`);
      this.execute(c, skillId, c);
      return;
    }

    // 需要选目标
    const isAllyTarget = sk.target.startsWith('ally');
    const tags = [];
    if (sk.target === 'enemyRow') tags.push('命中整排');
    if (sk.pierce) tags.push('穿透·可选后排');
    else if (sk.target === 'enemySingle') tags.push('前排保护');
    if (sk.knockback) tags.push('击退');
    this.setHint(`选择「${sk.name}」的目标 ${tags.length ? '(' + tags.join('·') + ')' : ''}`);
    this.clearTargets();
    targets.forEach(t => {
      const elx = this.root.querySelector(`.unit[data-uid="${t.uid}"]`);
      if (elx) {
        elx.classList.add('targetable');
        if (isAllyTarget) elx.classList.add('ally-target');
        elx.onclick = () => this.execute(c, skillId, t);
      }
    });
  },

  clearTargets() {
    this.root.querySelectorAll('.unit').forEach(u => {
      u.classList.remove('targetable', 'ally-target');
      u.onclick = null;
    });
  },

  /** 自动战斗：智能选招 + 选目标，按最大收益 */
  autoAct() {
    if (!this.root || this.busy || Battle.finished) return;
    const c = Battle.current();
    if (!c || c.side !== 'ally' || !c.alive) return;
    const pick = this.autoPickAction(c);
    if (pick) this.execute(c, pick.skillId, pick.target);
  },

  autoPickAction(c) {
    const SK = window.GameData.SKILLS;
    const enemies = Battle.aliveEnemies();
    const allies = Battle.aliveAllies();
    const usable = c.skills.filter(id => Battle.canUseSkill(c, id));
    let best = null, bestVal = -1;
    usable.forEach(id => {
      const sk = SK[id];
      let val = 0, target = c;
      if (sk.effect === 'damage') {
        const atk = c.effAtk() * sk.power;
        if (sk.target === 'enemyAll') { val = atk * enemies.length * 0.9; target = enemies[0]; }
        else if (sk.target === 'enemyRow') {
          // 选人数最多的一排
          const front = enemies.filter(e => e.pos === 'front'), back = enemies.filter(e => e.pos === 'back');
          const row = front.length >= back.length ? front : back;
          val = atk * Math.max(1, row.length) * 0.95; target = row[0] || enemies[0];
        } else {
          const pool = sk.pierce ? enemies : Battle.frontline(enemies);
          // 优先能击杀 / 血量最低
          target = pool.reduce((lo, t) => (t.hp < lo.hp ? t : lo), pool[0]);
          val = atk;
          if (target && atk * 0.5 >= target.hp) val += 500; // 可击杀加权
        }
        if (sk.inflict) val += 120; // 附带控制/中毒加权
        if (sk.basic) val *= 0.4;   // 普攻收益打折（留着回 SP）
      } else if (sk.effect === 'heal') {
        const pool = sk.target === 'allyAll' ? allies : allies;
        const missing = pool.reduce((a, t) => a + (t.maxHp - t.hp), 0);
        const heal = c.effAtk() * sk.power * (sk.target === 'allyAll' ? pool.filter(t => t.hp < t.maxHp).length || 1 : 1);
        val = Math.min(missing, heal) * 1.1;
        if (sk.target !== 'allyAll') { target = allies.reduce((lo, t) => ((t.maxHp - t.hp) > (lo.maxHp - lo.hp) ? t : lo), allies[0]); }
        else target = c;
        if (missing <= 0) val = 0; // 满血不治疗
      } else if (sk.effect === 'shield') {
        val = c.effAtk() * sk.power * allies.length * 0.5; target = c;
      } else if (sk.effect === 'buffAtk') {
        val = c.effAtk() * 1.2; target = c;
      } else if (sk.effect === 'buffDef') {
        val = 60; target = c;
      }
      if (val > bestVal) { bestVal = val; best = { skillId: id, target }; }
    });
    // 兜底：普攻最低血敌人
    if (!best) {
      const pool = Battle.frontline(enemies);
      best = { skillId: 'basic_attack', target: pool.reduce((lo, t) => (t.hp < lo.hp ? t : lo), pool[0]) };
    }
    return best;
  },

  execute(c, skillId, target) {
    if (this.busy) return;
    this.busy = true;
    this.clearTargets();
    this.clearSkillBar();
    this.selectedSkill = null;

    this._lunged = false;
    Battle.executeSkill(c, skillId, target);

    // 等动画后刷新并进入下一回合
    setTimeout(() => {
      this.refresh();
      this.busy = false;
      if (!Battle.finished) this.nextTurn();
    }, 700);
  },

  // ---------- 事件（演出、伤害飘字、结算） ----------
  handleEvent(e) {
    if (!this.root) return;
    if (e.type === 'log') {
      const logEl = this.root.querySelector('#battle-log');
      if (logEl) logEl.textContent = e.msg;
      // 技能横幅：从日志中提取「技能名」
      const mt = e.msg.match(/使用「(.+?)」/);
      if (mt) this.showSkillBanner(mt[1]);
    } else if (e.type === 'damage') {
      if (e.dot) {
        this.floatText(e.target, e.amount, 'dot', false);
      } else {
        if (e.attacker && !this._lunged) { this.lunge(e.attacker); this._lunged = true; }
        this.impactFlash(e.target, false);
        if (e.crit) this.screenShake();
        this.floatText(e.target, e.amount, 'damage', e.crit);
      }
      this.updateUnitDom(e.target);
    } else if (e.type === 'heal') {
      this.impactFlash(e.target, true);
      this.floatText(e.target, e.amount, 'heal', false);
      this.updateUnitDom(e.target);
    } else if (e.type === 'knockback') {
      this.knockFloat(e.target, e.kind === 'collide' ? '💥 撞击!' : '↩ 击退!');
    } else if (e.type === 'status') {
      const nm = { poison: '☠️中毒', burn: '🔥灼烧', stun: '💫眩晕', silence: '🔇沉默' }[e.status] || '';
      this.knockFloat(e.target, nm);
      this.updateUnitDom(e.target);
    } else if (e.type === 'enrage') {
      this.showSkillBanner('狂暴!');
      this.screenShake();
      this.updateUnitDom(e.target);
    } else if (e.type === 'end') {
      setTimeout(() => this.showResult(e.result), 700);
    }
  },

  /** 攻击者向目标方向突进 */
  lunge(attacker) {
    const el = this.root.querySelector(`.unit[data-uid="${attacker.uid}"]`);
    if (!el) return;
    const dy = attacker.side === 'ally' ? -18 : 18;
    el.animate(
      [{ transform: 'translateY(0)' }, { transform: `translateY(${dy}px) scale(1.08)`, offset: 0.4 }, { transform: 'translateY(0)' }],
      { duration: 360, easing: 'ease-out', composite: 'add' }
    );
    el.classList.add('lunging');
    setTimeout(() => el.classList.remove('lunging'), 360);
  },

  /** 击退/撞击提示飘字 */
  knockFloat(target, text) {
    const el = this.root.querySelector(`.unit[data-uid="${target.uid}"]`);
    if (!el) return;
    const rect = el.getBoundingClientRect();
    const ft = UI.el(`<div class="knock-text">${text}</div>`);
    ft.style.left = (rect.left + rect.width / 2 - 24) + 'px';
    ft.style.top = (rect.top - 6) + 'px';
    document.body.appendChild(ft);
    setTimeout(() => ft.remove(), 800);
  },

  /** 命中闪光 */
  impactFlash(target, isHeal) {
    const el = this.root.querySelector(`.unit[data-uid="${target.uid}"]`);
    if (!el) return;
    const fx = UI.el(`<span class="impact-ring ${isHeal ? 'heal' : ''}"></span>`);
    el.appendChild(fx);
    setTimeout(() => fx.remove(), 500);
  },

  /** 暴击/重击震屏 */
  screenShake() {
    const field = this.root.querySelector('.battle-field');
    if (!field) return;
    field.animate(
      [{ transform: 'translate(0,0)' }, { transform: 'translate(-5px,3px)' }, { transform: 'translate(5px,-2px)' }, { transform: 'translate(-3px,2px)' }, { transform: 'translate(0,0)' }],
      { duration: 260 }
    );
  },

  /** 技能名横幅 */
  showSkillBanner(name) {
    const b = this.root && this.root.querySelector('#skill-banner');
    if (!b) return;
    b.textContent = name;
    b.classList.remove('show');
    void b.offsetWidth; // 强制重绘以重启动画
    b.classList.add('show');
  },

  floatText(target, amount, kind, crit) {
    const unitEl = this.root.querySelector(`.unit[data-uid="${target.uid}"]`);
    if (!unitEl) return;
    const rect = unitEl.getBoundingClientRect();
    const cls = kind === 'heal' ? 'heal' : kind === 'dot' ? 'dot' : (crit ? 'crit' : 'dmg');
    const ft = UI.el(`<div class="float-text ${cls}">${kind === 'heal' ? '+' : '-'}${amount}${crit ? '!' : ''}</div>`);
    ft.style.left = (rect.left + rect.width / 2 - 14) + 'px';
    ft.style.top = (rect.top + 10) + 'px';
    document.body.appendChild(ft);
    setTimeout(() => ft.remove(), 1000);
    // 受击抖动（叠加到基础定位变换上）
    unitEl.animate(
      [{ transform: 'translateX(0)' }, { transform: 'translateX(-4px)' }, { transform: 'translateX(4px)' }, { transform: 'translateX(0)' }],
      { duration: 200, composite: 'add' }
    );
  },

  showResult(result) {
    if (result === 'win') {
      const firstClear = !Game.state.cleared.includes(this.stage.id);
      const before = { gold: Game.state.gold, gem: Game.state.gem };
      const res = Game.rewardStage(this.stage, firstClear) || {};
      const goldGain = Game.state.gold - before.gold;
      const gemGain = Game.state.gem - before.gem;
      let dropHtml = '';
      if (res.drop) {
        const tpl = Game.getGearTpl(res.drop);
        const rl = window.GameData.GEAR.RLABEL[tpl.rarity];
        dropHtml = `<p style="margin-top:8px;"><span class="rw ${UI.rarityClass(tpl.rarity)}" style="display:inline-block;">🎁 装备掉落：[${rl}] ${tpl.icon}${tpl.name}</span></p>`;
      }
      const m = UI.openModal(`
        <div class="result-modal">
          <div class="result-title win">胜利！</div>
          <p class="muted">${this.stage.name} ${firstClear ? '· 首次通关' : ''}</p>
          <div class="reward-row">
            <div class="rw" style="color:var(--gold);">🪙 +${goldGain}</div>
            <div class="rw" style="color:var(--gem);">💎 +${gemGain}</div>
          </div>
          <p class="muted">队伍获得 ${this.stage.reward.exp} 经验</p>
          ${dropHtml}
        </div>
        <div class="close-row" style="justify-content:center;">
          <button class="btn" id="res-ok">领取奖励</button>
        </div>
      `, { noBackdropClose: true });
      m.querySelector('#res-ok').onclick = () => {
        UI.closeModal(m);
        UI.updateResources();
        // 章节结局：由关卡数据的 endStory 驱动（如魔王城→终章，永夜回廊→第二部结局）
        const endStory = this.stage.endStory;
        if (endStory && window.STORY && window.STORY[endStory] && !Story.seen(endStory)) {
          this.exit();
          Story.play(endStory);
        } else {
          this.exit();
        }
      };
    } else {
      const m = UI.openModal(`
        <div class="result-modal">
          <div class="result-title lose">败北…</div>
          <p class="muted">队伍全员倒下了。提升佣兵等级或调整阵容后再来挑战吧！</p>
        </div>
        <div class="close-row" style="justify-content:center;">
          <button class="btn secondary" id="res-ok">返回</button>
        </div>
      `, { noBackdropClose: true });
      m.querySelector('#res-ok').onclick = () => { UI.closeModal(m); this.exit(); };
    }
  },
};

// ============================================================
//  Main — 应用入口与页面路由
// ============================================================
const Main = {
  current: 'home',

  init() {
    Game.init();
    UI.init();
    UI.updateResources();

    // 首次游戏自动编队
    if (Game.state.team.length === 0 && Game.state.roster.length > 0) {
      Game.state.roster.forEach(o => {
        if (Game.state.team.length < 5) Game.state.team.push(o.uid);
      });
      Game.save();
    }

    // 导航
    document.querySelectorAll('.nav-btn').forEach(btn =>
      btn.addEventListener('click', () => this.switchScreen(btn.dataset.screen)));

    // 重置存档
    document.getElementById('btn-reset').addEventListener('click', () => {
      const m = UI.openModal(`
        <h2>重置存档</h2>
        <p class="muted" style="margin:8px 0;">将清空所有进度、佣兵与资源，恢复到新游戏状态。确定吗？</p>
        <div class="close-row">
          <button class="btn secondary" id="rs-no">取消</button>
          <button class="btn" id="rs-yes" style="background:linear-gradient(135deg,#ff5a6a,#b02a3a);">确认重置</button>
        </div>`);
      m.querySelector('#rs-no').onclick = () => UI.closeModal(m);
      m.querySelector('#rs-yes').onclick = () => {
        Game.reset();
        UI.closeModal(m);
        UI.updateResources();
        this.switchScreen('home');
        UI.toast('存档已重置');
      };
    });

    this.switchScreen('home');

    // 首次进入播放序章
    if (!Story.seen('prologue')) {
      Story.play('prologue');
    }
  },

  switchScreen(name) {
    this.current = name;
    document.querySelectorAll('.nav-btn').forEach(b =>
      b.classList.toggle('active', b.dataset.screen === name));
    this.refreshCurrent();
  },

  refreshCurrent() {
    UI.updateResources();
    switch (this.current) {
      case 'home': UI.renderHome(); break;
      case 'stages': UI.renderStages(); break;
      case 'roster': UI.renderRoster(); break;
      case 'gacha': UI.renderGacha(); break;
      case 'welfare': UI.renderWelfare(); break;
    }
  },
};

window.BattleUI = BattleUI;
window.Main = Main;

document.addEventListener('DOMContentLoaded', () => Main.init());

</script>
</body>
</html>

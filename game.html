// ============================================================
//  游戏状态管理 / 存档 / 角色养成
// ============================================================

const SAVE_KEY = 'bd2_save_v1';

const Game = {
  state: null,

  /** 初始化：读取存档或创建新存档 */
  init() {
    const saved = localStorage.getItem(SAVE_KEY);
    if (saved) {
      try {
        this.state = JSON.parse(saved);
      } catch (e) {
        console.warn('存档损坏，重置', e);
        this.state = this.newGame();
      }
    } else {
      this.state = this.newGame();
    }
    // 存档版本迁移：补齐新增字段，保证老存档不报错
    if (!this.state.seenStory) this.state.seenStory = [];
    if (!this.state.inventory) this.state.inventory = [];
    if (!this.state._gearSeq) this.state._gearSeq = 1;
    // 装备深化迁移：旧装备补强化等级与副词条
    this.state.inventory.forEach(g => {
      if (g.lvl == null) g.lvl = 0;
      if (!g.subs) { const tpl = this.getGearTpl(g.tpl); g.subs = tpl ? this.rollSubs(tpl.rarity) : []; }
    });
    if (!this.state.worldFlags) this.state.worldFlags = {};
    if (!this.state.chapterProgress) this.state.chapterProgress = {};
    if (this.state.spark == null) this.state.spark = 0;
    if (this.state.powder == null) this.state.powder = 0;
    if (this.state.firstTen == null) this.state.firstTen = false;
    if (this.state.trialMax == null) this.state.trialMax = 0;
    if (!this.state.stats) this.state.stats = { pulls: 0, wins: 0 };
    if (!this.state.achClaimed) this.state.achClaimed = {};
    if (!this.state.daily) this.state.daily = { lastClaim: null, streak: 0 };
    if (!this.state.quests) this.state.quests = { date: null, progress: { win: 0, pull: 0, levelup: 0 }, claimed: {} };
    if (!this.state.shop) this.state.shop = { date: null, slots: [], bought: {} };
    if (this.state.stamina == null) { this.state.stamina = 120; this.state.staminaTs = Date.now(); }
    if (!this.state.dispatch) this.state.dispatch = { slots: [null, null, null] };
    if (this.state.awakenStone == null) this.state.awakenStone = 0;
    if (!this.state.event) this.state.event = { date: null, runs: {}, coin: 0, stock: {} };
    this.state.roster.forEach(o => { if (o.aff == null) o.aff = 0; if (o.awaken == null) o.awaken = 0; });
    this.state.roster.forEach(o => {
      if (!o.equip) o.equip = { weapon: null, armor: null, accessory: null, ex: null };
      if (o.plus == null) o.plus = 0;
      // 服装：补齐 + 把老的 'base' 规范化为 'base_<charId>'
      if (!o.costumes || !o.costumes.length) o.costumes = ['base_' + o.charId];
      o.costumes = o.costumes.map(c => (c === 'base' ? 'base_' + o.charId : c));
      if (!o.activeCostume || o.activeCostume === 'base') o.activeCostume = 'base_' + o.charId;
    });
    // 升星迁移：把同名角色的重复实例合并为突破等级
    this._mergeDuplicates();
    // 修复历史存档的 uid 冲突，并据此重建出战队伍（修复「佣兵有角色但出战不显示」）
    this._repairIds();
    // 初始化当日任务/商店
    this.ensureDaily();
    return this.state;
  },

  /** 合并 roster 中同 charId 的重复实例：保留最高等级，每个多余实例 +1 突破 */
  _mergeDuplicates() {
    const orig = this.state.roster;
    const cidByUid = {};
    orig.forEach(o => { cidByUid[o.uid] = o.charId; });
    const merged = {};
    orig.forEach(o => {
      const ex = merged[o.charId];
      if (!ex) {
        merged[o.charId] = o;
      } else {
        ex.level = Math.max(ex.level, o.level);
        ex.plus = Math.min(5, (ex.plus || 0) + 1);
      }
    });
    this.state.roster = Object.values(merged);
    // 重映射队伍 uid（被合并掉的实例 → 幸存实例）
    this.state.team = [...new Set((this.state.team || []).map(uid => {
      const cid = cidByUid[uid];
      const s = this.state.roster.find(o => o.charId === cid);
      return s ? s.uid : null;
    }).filter(Boolean))];
  },

  /**
   * 修复 uid 冲突：历史存档中（尤其重置存档后）可能出现两个角色共用同一 uid，
   * 导致其中一个被当成「已出战」而在编队界面消失。这里：
   *  1) 先按 charId 记录队伍意图；2) 给所有重复/缺失 uid 的实例重新分配唯一 uid；
   *  3) 再按 charId 重建出战队伍（去重、限 5 人），保证 roster 与 team 始终一致。
   */
  _repairIds() {
    const roster = this.state.roster || [];
    // 1) 队伍意图：按当前 uid 解析出 charId（去重、保序）
    const teamCids = [];
    (this.state.team || []).forEach(uid => {
      const o = roster.find(x => x.uid === uid);
      if (o && !teamCids.includes(o.charId)) teamCids.push(o.charId);
    });
    // 2) 唯一化 uid
    const used = new Set();
    let seq = this.state._uidSeq || 1;
    const nextUid = () => { let u; do { u = 'u' + (seq++); } while (used.has(u) || roster.some(o => o.uid === u)); return u; };
    roster.forEach(o => {
      if (!o.uid || used.has(o.uid)) o.uid = nextUid();
      used.add(o.uid);
    });
    this.state._uidSeq = seq;
    // 3) 按 charId 重建队伍（roster 已按 charId 去重，charId→uid 唯一）
    this.state.team = teamCids
      .map(cid => { const o = roster.find(x => x.charId === cid); return o ? o.uid : null; })
      .filter(Boolean)
      .slice(0, 5);
  },

  /** 新游戏的初始状态 */
  newGame() {
    return {
      gold: 1000,
      gem: 2000,
      // 已拥有角色：{ uid, charId, level, exp, star }
      roster: [
        this.makeOwned('teried', 1),
        this.makeOwned('mina', 1),
      ],
      // 出战队伍（uid 列表，最多 4 人）
      team: [],
      // 已通关关卡 id
      cleared: [],
      // 已观看的剧情 id
      seenStory: [],
      // 装备背包（gear 实例：{ iid, tpl }）
      inventory: [],
      // 探索地图的一次性标记（宝箱等）
      worldFlags: {},
      // 章节推进进度：{ chapterId: 已完成步数 }
      chapterProgress: {},
      // 抽卡保底计数（距上次 5★）
      pity: 0,
      firstTen: false, // 首次十连保底（必出 5★）是否已用
      trialMax: 0,     // 试炼之塔已通关的最高层数（用于解锁下一层）
      stats: { pulls: 0, wins: 0 }, // 终身统计（成就用）
      achClaimed: {},  // 已领取的成就 id
      // 保底货币
      spark: 0,    // 闪耀之星：每抽 +1，200 兑换自选服装
      powder: 0,   // 希望之粉：每抽 +10，商店兑换必出 5★
      // 运营系统
      daily: { lastClaim: null, streak: 0 },
      quests: { date: null, progress: { win: 0, pull: 0, levelup: 0 }, claimed: {} },
      shop: { date: null, slots: [], bought: {} },
      stamina: 120, staminaTs: Date.now(),     // 体力（资源副本消耗，随时间回复）
      awakenStone: 0,                          // 觉醒石（角色觉醒消耗）
      dispatch: { slots: [null, null, null] }, // 远征派遣槽（离线挂机）
      event: { date: null, runs: {}, coin: 0, stock: {} },  // 限时活动（活动本+活动商店）
      _uidSeq: 1,
      _gearSeq: 1,
    };
  },

  /** 生成全局唯一的 uid（扫描现有 roster，杜绝冲突） */
  freshUid() {
    const roster = (this.state && this.state.roster) || [];
    let seq = (this.state && this.state._uidSeq) || 1;
    let uid;
    do { uid = 'u' + (seq++); } while (roster.some(o => o.uid === uid));
    if (this.state) this.state._uidSeq = seq;
    return uid;
  },

  /** 生成一个已拥有角色实例 */
  makeOwned(charId, level = 1) {
    const uid = this.freshUid();
    return {
      uid, charId, level, exp: 0,
      star: window.GameData.CHARACTERS[charId].rarity,
      plus: 0, // 突破等级 0~5
      costumes: ['base_' + charId],      // 拥有的服装 id 列表
      activeCostume: 'base_' + charId,   // 当前装扮（决定属性/外观）
      equip: { weapon: null, armor: null, accessory: null, ex: null },
    };
  },

  save() {
    localStorage.setItem(SAVE_KEY, JSON.stringify(this.state));
  },

  reset() {
    localStorage.removeItem(SAVE_KEY);
    this.state = this.newGame();
    // 默认把初始两名角色编入队伍
    this.state.team = this.state.roster.map(o => o.uid);
    this.save();
  },

  /** 导出存档为可分享的字符串（清缓存/换设备的兜底） */
  exportSave() {
    try {
      const json = JSON.stringify(this.state);
      // 用 encodeURIComponent 兼容中文，再 base64
      return 'BD2' + btoa(unescape(encodeURIComponent(json)));
    } catch (e) { return null; }
  },

  /** 导入存档字符串；成功则替换当前存档并跑迁移 */
  importSave(code) {
    if (!code || typeof code !== 'string') return { ok: false, msg: '存档码为空' };
    code = code.trim();
    if (code.startsWith('BD2')) code = code.slice(3);
    let data;
    try {
      data = JSON.parse(decodeURIComponent(escape(atob(code))));
    } catch (e) { return { ok: false, msg: '存档码无效或已损坏' }; }
    if (!data || !Array.isArray(data.roster)) return { ok: false, msg: '不是有效的存档' };
    this.state = data;
    this.save();   // 先落盘，避免 init() 从 localStorage 读回旧档
    this.init();   // 跑迁移（补字段、修 uid、装备词条等）
    this.save();
    return { ok: true };
  },

  // ---------- 角色数值计算 ----------

  // ---------- 服装（BD2 模型：服装=收集单位，自带属性+招式）----------

  /** 规范化服装 id（兼容老存档 'base'） */
  normCostumeId(charId, id) {
    if (!id || id === 'base') return 'base_' + charId;
    return id;
  },

  /** 取某服装定义 */
  costumeDef(charId, costumeId) {
    const id = this.normCostumeId(charId, costumeId);
    return window.GameData.COSTUMES[id] || window.GameData.COSTUMES['base_' + charId];
  },

  /** 当前装扮定义（决定属性/外观） */
  activeCostumeDef(owned) {
    return this.costumeDef(owned.charId, owned.activeCostume);
  },
  activeElement(owned) { return this.activeCostumeDef(owned).element; },
  activeColor(owned) { return this.activeCostumeDef(owned).color; },

  /** 拥有的服装 id 列表（规范化、去重） */
  ownedCostumeIds(owned) {
    const out = [];
    (owned.costumes || []).forEach(cid => {
      const id = this.normCostumeId(owned.charId, cid);
      if (!out.includes(id)) out.push(id);
    });
    if (!out.length) out.push('base_' + owned.charId);
    return out;
  },

  /** 战斗技能池：普通攻击 + 各拥有服装的专属招式（去重） */
  battleSkills(owned) {
    const skills = ['basic_attack'];
    this.ownedCostumeIds(owned).forEach(cid => {
      const c = window.GameData.COSTUMES[cid];
      if (c && c.signature && !skills.includes(c.signature)) skills.push(c.signature);
    });
    return skills;
  },

  switchCostume(uid, costumeId) {
    const o = this.getOwned(uid);
    if (!o) return { ok: false };
    const id = this.normCostumeId(o.charId, costumeId);
    if (!this.ownedCostumeIds(o).includes(id)) return { ok: false, msg: '尚未拥有该服装' };
    o.activeCostume = id;
    this.save();
    return { ok: true };
  },

  /** 突破属性倍率：每级 +8% */
  plusMult(owned) {
    return 1 + (owned.plus || 0) * 0.08;
  },

  /** 好感等级（0~10，每 100 好感 1 级）+ 觉醒倍率 */
  affLevel(owned) { return Math.min(10, Math.floor((owned.aff || 0) / 100)); },
  affMult(owned) { return 1 + this.affLevel(owned) * 0.01; },     // 好感：+1%/级 攻击与生命
  awakenMult(owned) { return 1 + (owned.awaken || 0) * 0.06; },   // 觉醒：+6%/级 全属性

  /** 根据「当前服装属性」+ 等级 + 突破 + 觉醒 + 好感 + 装备计算最终属性 */
  computeStats(owned) {
    const cos = this.activeCostumeDef(owned);
    const lv = owned.level - 1;
    const pm = this.plusMult(owned);
    const am = this.affMult(owned), wm = this.awakenMult(owned);
    const g = this.gearBonus(owned);
    return {
      maxHp: Math.round((cos.stats.hp + cos.grow.hp * lv) * pm * am * wm) + g.hp,
      atk:   Math.round((cos.stats.atk + cos.grow.atk * lv) * pm * am * wm) + g.atk,
      def:   Math.round((cos.stats.def + cos.grow.def * lv) * pm * wm) + g.def,
      spd:   cos.stats.spd + g.spd,
      crit:  cos.stats.crit + g.crit,
    };
  },

  // 好感（赠礼提升）
  GIFT_COST: 200, GIFT_AFF: 25, AFF_MAX: 1000,
  giveGift(uid) {
    const o = this.getOwned(uid); if (!o) return { ok: false };
    if ((o.aff || 0) >= this.AFF_MAX) return { ok: false, msg: '好感已满' };
    if (this.state.gold < this.GIFT_COST) return { ok: false, msg: '金币不足' };
    this.state.gold -= this.GIFT_COST;
    o.aff = Math.min(this.AFF_MAX, (o.aff || 0) + this.GIFT_AFF);
    this.save();
    return { ok: true, aff: o.aff, lv: this.affLevel(o) };
  },
  // 觉醒（消耗觉醒石 + 金币，提升星级与全属性）
  awakenCost(lv) { return { stone: 2 + lv * 2, gold: 2000 + lv * 2000 }; },
  awakenChar(uid) {
    const o = this.getOwned(uid); if (!o) return { ok: false };
    const lv = o.awaken || 0;
    if (lv >= 5) return { ok: false, msg: '已达最高觉醒' };
    const c = this.awakenCost(lv);
    if ((this.state.awakenStone || 0) < c.stone) return { ok: false, msg: '觉醒石不足' };
    if (this.state.gold < c.gold) return { ok: false, msg: '金币不足' };
    this.state.awakenStone -= c.stone; this.state.gold -= c.gold;
    o.awaken = lv + 1;
    this.save();
    return { ok: true, awaken: o.awaken };
  },

  // ---------- 装备 ----------

  getGearTpl(tplId) {
    const G = window.GameData.GEAR;
    return (G.common[tplId] || G.ex[tplId]) || null;
  },

  getGearInst(iid) {
    return this.state.inventory.find(g => g.iid === iid) || null;
  },

  /** 汇总某角色已装备的属性加成 */
  // ---------- 装备深化：强化 / 副词条 / 套装 ----------
  GEAR_MAX_LVL: 15,
  enhanceMult(lvl) { return 1 + (lvl || 0) * 0.05; }, // 主属性每级 +5%（满 +15 = +75%）
  enhanceCost(inst) {
    const tpl = this.getGearTpl(inst.tpl);
    const r = tpl ? tpl.rarity : 3;
    return Math.round((80 + (inst.lvl || 0) * 70) * (r === 5 ? 2 : r === 4 ? 1.5 : 1));
  },
  SUB_POOL: ['atk', 'def', 'hp', 'crit', 'spd'],
  SUB_BASE: { atk: 8, def: 5, hp: 60, crit: 0.02, spd: 3 },
  /** 按稀有度掷副词条：R=1 / SR=2 / UR=3 条 */
  rollSubs(rarity) {
    const n = rarity === 5 ? 3 : rarity === 4 ? 2 : 1;
    const w = rarity === 5 ? 2.4 : rarity === 4 ? 1.6 : 1;
    const pool = this.SUB_POOL.slice();
    const subs = [];
    for (let i = 0; i < n && pool.length; i++) {
      const k = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
      let v = this.SUB_BASE[k] * w * (0.7 + Math.random() * 0.6);
      v = (k === 'crit') ? Math.round(v * 1000) / 1000 : Math.round(v);
      subs.push({ k, v });
    }
    return subs;
  },
  /** 套装：三件通用装备同稀有度时的额外加成 */
  setBonusOf(owned) {
    const b = { hp: 0, atk: 0, def: 0, spd: 0, crit: 0, name: '' };
    if (!owned.equip) return b;
    const rs = ['weapon', 'armor', 'accessory'].map(slot => {
      const iid = owned.equip[slot]; if (!iid) return null;
      const inst = this.getGearInst(iid); if (!inst) return null;
      const tpl = this.getGearTpl(inst.tpl); return tpl ? tpl.rarity : null;
    });
    if (rs.every(r => r === 5)) { b.crit += 0.08; b.atk += 40; b.spd += 6; b.name = '传说三件套'; }
    else if (rs.every(r => r === 4)) { b.crit += 0.04; b.atk += 20; b.name = '稀有三件套'; }
    else if (rs.every(r => r === 3)) { b.hp += 120; b.name = '坚甲三件套'; }
    return b;
  },
  enhanceGear(iid) {
    const inst = this.getGearInst(iid);
    if (!inst) return { ok: false };
    if ((inst.lvl || 0) >= this.GEAR_MAX_LVL) return { ok: false, msg: '已达最高强化' };
    const cost = this.enhanceCost(inst);
    if (this.state.gold < cost) return { ok: false, msg: '金币不足' };
    this.state.gold -= cost;
    inst.lvl = (inst.lvl || 0) + 1;
    this.save();
    return { ok: true, lvl: inst.lvl, cost };
  },

  gearBonus(owned) {
    const b = { hp: 0, atk: 0, def: 0, spd: 0, crit: 0 };
    if (!owned.equip) return b;
    ['weapon', 'armor', 'accessory', 'ex'].forEach(slot => {
      const iid = owned.equip[slot];
      if (!iid) return;
      const inst = this.getGearInst(iid);
      if (!inst) return;
      const tpl = this.getGearTpl(inst.tpl);
      if (!tpl) return;
      const em = this.enhanceMult(inst.lvl);           // 强化：放大主属性
      Object.keys(tpl.stats).forEach(k => { b[k] = (b[k] || 0) + tpl.stats[k] * em; });
      (inst.subs || []).forEach(s => { b[s.k] = (b[s.k] || 0) + s.v; }); // 副词条
    });
    // 套装加成
    const sb = this.setBonusOf(owned);
    ['hp', 'atk', 'def', 'spd', 'crit'].forEach(k => { b[k] += sb[k]; });
    ['hp', 'atk', 'def', 'spd'].forEach(k => { b[k] = Math.round(b[k]); });
    return b;
  },

  /** 新增一件装备到背包，返回 iid */
  addGear(tplId) {
    const iid = 'g' + (this.state._gearSeq++);
    const tpl = this.getGearTpl(tplId);
    const subs = tpl ? this.rollSubs(tpl.rarity) : [];
    this.state.inventory.push({ iid, tpl: tplId, lvl: 0, subs });
    return iid;
  },

  /** 给角色装备某件 gear（同件只能被一名角色装备） */
  equipGear(uid, iid) {
    const o = this.getOwned(uid);
    const inst = this.getGearInst(iid);
    if (!o || !inst) return { ok: false, msg: '装备不存在' };
    const tpl = this.getGearTpl(inst.tpl);
    if (!tpl) return { ok: false, msg: '装备无效' };
    if (tpl.type === 'ex' && tpl.owner !== o.charId) {
      return { ok: false, msg: '专属武器无法装备给该角色' };
    }
    const slot = tpl.type; // weapon/armor/accessory/ex
    // 从其他角色身上卸下同一件
    this.state.roster.forEach(x => {
      if (!x.equip) return;
      ['weapon', 'armor', 'accessory', 'ex'].forEach(s => { if (x.equip[s] === iid) x.equip[s] = null; });
    });
    o.equip[slot] = iid;
    this.save();
    return { ok: true };
  },

  unequipGear(uid, slot) {
    const o = this.getOwned(uid);
    if (o && o.equip) { o.equip[slot] = null; this.save(); }
  },

  /** 装备评分（用于一键装备挑最优） */
  gearScore(tpl) {
    const s = tpl.stats || {};
    return (s.atk || 0) + (s.def || 0) * 1.2 + (s.hp || 0) / 8 + (s.crit || 0) * 800;
  },

  /** 该角色是否拥有「背包里未装备的」专属武器 */
  hasUnequippedEx(charId) {
    const exId = 'ex_' + charId;
    return this.state.inventory.some(g => g.tpl === exId && !this.gearEquippedBy(g.iid));
  },

  /** 某槽位背包中评分最高的未装备件，返回 iid */
  bestUnequippedGear(type, charId) {
    let best = null, bestScore = -1;
    this.state.inventory.forEach(g => {
      const tpl = this.getGearTpl(g.tpl);
      if (!tpl) return;
      if (type === 'ex') { if (tpl.type !== 'ex' || tpl.owner !== charId) return; }
      else if (tpl.type !== type) return;
      if (this.gearEquippedBy(g.iid)) return;
      const sc = this.gearScore(tpl);
      if (sc > bestScore) { bestScore = sc; best = g.iid; }
    });
    return best;
  },

  /** 一键装备：为空槽位填入最优件，并自动识别专属武器 */
  autoEquip(uid) {
    const o = this.getOwned(uid);
    if (!o) return { ok: false };
    let count = 0;
    ['weapon', 'armor', 'accessory', 'ex'].forEach(slot => {
      if (o.equip[slot]) return; // 已装备的不覆盖
      const iid = this.bestUnequippedGear(slot, o.charId);
      if (iid) { const r = this.equipGear(uid, iid); if (r.ok) count++; }
    });
    this.save();
    return { ok: true, count };
  },

  /** 找出该 iid 当前被哪名角色装备（返回 owned 或 null） */
  gearEquippedBy(iid) {
    return this.state.roster.find(o => o.equip &&
      ['weapon', 'armor', 'accessory', 'ex'].some(s => o.equip[s] === iid)) || null;
  },

  /** 锻造通用装备：花金币，随机部位+稀有度 */
  craftGear() {
    const C = window.GameData.GEAR.CRAFT;
    if (this.state.gold < C.goldCost) return { ok: false, msg: '金币不足' };
    this.state.gold -= C.goldCost;
    const type = C.types[Math.floor(Math.random() * C.types.length)];
    const r = Math.random();
    let rarity = 3;
    if (r < C.rarityWeight[5]) rarity = 5;
    else if (r < C.rarityWeight[5] + C.rarityWeight[4]) rarity = 4;
    const prefix = { weapon: 'wpn', armor: 'arm', accessory: 'acc' }[type];
    const suffix = { 3: 'r', 4: 'sr', 5: 'ur' }[rarity];
    const tplId = `${prefix}_${suffix}`;
    const iid = this.addGear(tplId);
    this.save();
    return { ok: true, tplId, iid };
  },

  /** 专属武器招募（只从抽奖产出，按稀有度概率） */
  gachaEx() {
    const G = window.GameData.GEAR.exGacha;
    if (this.state.gem < G.cost) return { ok: false, msg: '宝石不足' };
    this.state.gem -= G.cost;
    this.state.stats.pulls++;
    const r = Math.random();
    let rarity = 3;
    if (r < G.rates[5]) rarity = 5;
    else if (r < G.rates[5] + G.rates[4]) rarity = 4;
    const pool = window.GameData.GEAR.exPool[rarity];
    const tplId = pool[Math.floor(Math.random() * pool.length)];
    const result = { ok: true, tplId, rarity, dup: false };
    if (this.state.inventory.some(g => g.tpl === tplId)) {
      // 重复专属武器 → 返还宝石
      const refund = rarity === 5 ? 60 : rarity === 4 ? 30 : 15;
      this.state.gem += refund; result.dup = true; result.refund = refund;
    } else {
      this.addGear(tplId);
    }
    this.save();
    return result;
  },

  /** 升级所需经验 */
  expToNext(level) {
    return Math.round(50 + level * level * 12);
  },

  /** 给某角色加经验，自动升级。返回升了几级 */
  addExp(owned, amount) {
    let levelsGained = 0;
    owned.exp += amount;
    while (owned.level < 60 && owned.exp >= this.expToNext(owned.level)) {
      owned.exp -= this.expToNext(owned.level);
      owned.level++;
      levelsGained++;
    }
    return levelsGained;
  },

  /** 花金币升级一次 */
  levelUpWithGold(uid) {
    const owned = this.getOwned(uid);
    if (!owned || owned.level >= 60) return { ok: false, msg: '已达最大等级' };
    const cost = 50 + owned.level * 30;
    if (this.state.gold < cost) return { ok: false, msg: '金币不足' };
    this.state.gold -= cost;
    owned.level++;
    owned.exp = 0;
    this.incQuest('levelup', 1);
    this.save();
    return { ok: true, cost, level: owned.level };
  },

  levelUpCost(level) {
    return 50 + level * 30;
  },

  // ---------- 队伍管理 ----------

  getOwned(uid) {
    return this.state.roster.find(o => o.uid === uid);
  },

  inTeam(uid) {
    return this.state.team.includes(uid);
  },

  toggleTeam(uid) {
    const idx = this.state.team.indexOf(uid);
    if (idx >= 0) {
      this.state.team.splice(idx, 1);
    } else {
      if (this.state.team.length >= 5) return { ok: false, msg: "队伍已满（最多 5 人）" };
      this.state.team.push(uid);
    }
    this.save();
    return { ok: true };
  },

  // 将某角色放入指定出战位（用于主页队伍框按位置编辑 / 替换）
  setTeamSlot(slotIdx, uid) {
    if (this.state.team.includes(uid)) return { ok: false, msg: "该角色已在队伍中" };
    if (slotIdx < this.state.team.length) {
      this.state.team[slotIdx] = uid; // 替换该位置原有角色
    } else if (this.state.team.length < 5) {
      this.state.team.push(uid);      // 空位上阵
    } else {
      return { ok: false, msg: "队伍已满（最多 5 人）" };
    }
    this.save();
    return { ok: true };
  },

  // 清空指定出战位
  clearTeamSlot(slotIdx) {
    if (slotIdx < this.state.team.length) {
      this.state.team.splice(slotIdx, 1);
      this.save();
    }
    return { ok: true };
  },

  // ---------- 抽卡 ----------

  rollRarity() {
    const r = Math.random();
    // 软保底：90 抽必出 5★
    if (this.state.pity >= 89) return 5;
    const { rates } = window.GameData.GACHA;
    if (r < rates[5]) return 5;
    if (r < rates[5] + rates[4]) return 4;
    return 3;
  },

  /** 把一套服装发给玩家（处理新角色/新服装/重复突破） */
  grantCostume(costumeId) {
    const cdef = window.GameData.COSTUMES[costumeId];
    const charId = cdef.charId;
    const result = { ok: true, costumeId, charId, rarity: cdef.rarity, isNew: false, newCostume: false, plusUp: false, plus: 0, refund: 0 };
    let owned = this.state.roster.find(o => o.charId === charId);
    if (!owned) {
      owned = this.makeOwned(charId, 1);
      owned.costumes = [costumeId];
      owned.activeCostume = costumeId;
      this.state.roster.push(owned);
      result.isNew = true; result.newCostume = true;
    } else if (!this.ownedCostumeIds(owned).includes(costumeId)) {
      owned.costumes.push(costumeId);
      result.newCostume = true;
    } else {
      if ((owned.plus || 0) < 5) {
        owned.plus = (owned.plus || 0) + 1;
        result.plusUp = true; result.plus = owned.plus;
      } else {
        const refund = cdef.rarity === 5 ? 50 : (cdef.rarity === 4 ? 25 : 10);
        this.state.gem += refund; result.refund = refund; result.plus = 5;
      }
    }
    return result;
  },

  /** 抽一次「服装」（force 可强制稀有度，用于首抽十连保底） */
  gachaPull(force) {
    if (this.state.gem < window.GameData.GACHA.cost) {
      return { ok: false, msg: '宝石不足' };
    }
    this.state.gem -= window.GameData.GACHA.cost;
    const rarity = force || this.rollRarity();
    if (rarity === 5) this.state.pity = 0;
    else this.state.pity++;
    // 保底货币 + 任务
    this.state.spark += 1;
    this.state.powder += 10;
    this.state.stats.pulls++;
    this.incQuest('pull', 1);

    const pool = window.GameData.COSTUME_POOL[rarity];
    const costumeId = pool[Math.floor(Math.random() * pool.length)];
    const result = this.grantCostume(costumeId);
    result.rarity = rarity;
    this.save();
    return result;
  },

  // ---------- 运营系统：签到 / 任务 / 商店 / 保底兑换 ----------

  CHECKIN: [
    { gold: 300 }, { gem: 60 }, { powder: 60 }, { gold: 600 },
    { gem: 120 }, { gear: 'arm_sr' }, { gem: 240, powder: 120 },
  ],
  QUESTS: [
    { id: 'q_win', name: '进行 3 场战斗', key: 'win', target: 3, reward: { gem: 100 } },
    { id: 'q_pull', name: '进行 1 次招募', key: 'pull', target: 1, reward: { gold: 300 } },
    { id: 'q_lvl', name: '升级佣兵 2 次', key: 'levelup', target: 2, reward: { gem: 60 } },
  ],
  SPARK_COST: 200,
  POWDER_COST: 200,

  today() {
    const d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  },

  /** 跨日重置任务与商店 */
  ensureDaily() {
    const t = this.today();
    if (this.state.quests.date !== t) {
      this.state.quests = { date: t, progress: { win: 0, pull: 0, levelup: 0 }, claimed: {} };
    }
    if (this.state.shop.date !== t || !this.state.shop.slots || !this.state.shop.slots.length) {
      this.state.shop = { date: t, slots: this.rollShop(), bought: {} };
    }
  },

  incQuest(key, n) {
    this.ensureDaily();
    this.state.quests.progress[key] = (this.state.quests.progress[key] || 0) + n;
    this.save();
  },

  applyReward(r) {
    if (r.gold) this.state.gold += r.gold;
    if (r.gem) this.state.gem += r.gem;
    if (r.powder) this.state.powder += r.powder;
    if (r.spark) this.state.spark += r.spark;
    if (r.gear) this.addGear(r.gear);
    if (r.stone) this.state.awakenStone = (this.state.awakenStone || 0) + r.stone;
  },

  canCheckIn() { return this.state.daily.lastClaim !== this.today(); },

  checkIn() {
    if (!this.canCheckIn()) return { ok: false, msg: '今日已签到' };
    const idx = (this.state.daily.streak || 0) % 7;
    const reward = this.CHECKIN[idx];
    this.applyReward(reward);
    this.state.daily.lastClaim = this.today();
    this.state.daily.streak = (this.state.daily.streak || 0) + 1;
    this.save();
    return { ok: true, reward, day: idx + 1 };
  },

  claimQuest(id) {
    this.ensureDaily();
    const q = this.QUESTS.find(x => x.id === id);
    if (!q) return { ok: false };
    if (this.state.quests.claimed[id]) return { ok: false, msg: '已领取' };
    if ((this.state.quests.progress[q.key] || 0) < q.target) return { ok: false, msg: '未完成' };
    this.applyReward(q.reward);
    this.state.quests.claimed[id] = true;
    this.save();
    return { ok: true, reward: q.reward };
  },

  /** 闪耀之星兑换自选服装 */
  sparkExchange(costumeId) {
    if ((this.state.spark || 0) < this.SPARK_COST) return { ok: false, msg: '闪耀之星不足' };
    if (!window.GameData.COSTUMES[costumeId]) return { ok: false, msg: '无效服装' };
    this.state.spark -= this.SPARK_COST;
    const result = this.grantCostume(costumeId);
    this.save();
    return { ok: true, result };
  },

  /** 希望之粉兑换必出 5★ 服装 */
  powderBox() {
    if ((this.state.powder || 0) < this.POWDER_COST) return { ok: false, msg: '希望之粉不足' };
    this.state.powder -= this.POWDER_COST;
    const pool = window.GameData.COSTUME_POOL[5];
    const id = pool[Math.floor(Math.random() * pool.length)];
    const result = this.grantCostume(id);
    this.save();
    return { ok: true, result };
  },

  rollShop() {
    const tpls = ['wpn_sr', 'arm_sr', 'acc_sr', 'wpn_ur', 'arm_ur', 'acc_ur'];
    const slots = [];
    for (let i = 0; i < 3; i++) {
      const t = tpls[Math.floor(Math.random() * tpls.length)];
      const tpl = this.getGearTpl(t);
      slots.push({ tpl: t, price: tpl.rarity === 5 ? 1500 : 600 });
    }
    return slots;
  },

  buyShopItem(idx) {
    this.ensureDaily();
    if (this.state.shop.bought[idx]) return { ok: false, msg: '已售出' };
    const slot = this.state.shop.slots[idx];
    if (!slot) return { ok: false };
    if (this.state.gold < slot.price) return { ok: false, msg: '金币不足' };
    this.state.gold -= slot.price;
    this.addGear(slot.tpl);
    this.state.shop.bought[idx] = true;
    this.save();
    return { ok: true, tpl: slot.tpl };
  },

  // ---------- 关卡结算 ----------

  /** 战斗胜利结算奖励 */
  rewardStage(stage, firstClear) {
    const r = stage.reward;
    this.state.gold += r.gold;
    this.state.gem += firstClear ? r.gem : Math.round(r.gem * 0.3);
    this.incQuest('win', 1);
    this.state.stats.wins++;
    // 经验分配给出战队伍
    this.state.team.forEach(uid => {
      const o = this.getOwned(uid);
      if (o) this.addExp(o, r.exp);
    });
    if (firstClear && !this.state.cleared.includes(stage.id)) {
      this.state.cleared.push(stage.id);
    }
    // 装备掉落：40% 概率掉一件通用装备，越后期关卡稀有度越高
    let drop = null;
    if (Math.random() < 0.40) {
      const C = window.GameData.GEAR.CRAFT;
      const type = C.types[Math.floor(Math.random() * C.types.length)];
      // 关卡 id 越大，高稀有度概率越高
      const bonus = Math.min(0.30, stage.id * 0.04);
      const rr = Math.random();
      let rarity = 3;
      if (rr < C.rarityWeight[5] + bonus) rarity = 5;
      else if (rr < C.rarityWeight[5] + C.rarityWeight[4] + bonus) rarity = 4;
      const prefix = { weapon: 'wpn', armor: 'arm', accessory: 'acc' }[type];
      const suffix = { 3: 'r', 4: 'sr', 5: 'ur' }[rarity];
      drop = `${prefix}_${suffix}`;
      this.addGear(drop);
    }
    this.save();
    return { drop };
  },

  /** 一键扫荡：已通关的试炼层，免战斗直接结算（复刷奖励，与再战同档：宝石按 30%） */
  sweepTrial(idx) {
    const t = window.GameData.TRIALS[idx];
    if (!t) return { ok: false, msg: '关卡不存在' };
    if (idx >= (this.state.trialMax || 0)) return { ok: false, msg: '通关该层后才能扫荡' };
    const r = t.reward;
    const gold = r.gold;
    const gem = Math.round(r.gem * 0.3);
    this.state.gold += gold;
    this.state.gem += gem;
    this.state.team.forEach(uid => { const o = this.getOwned(uid); if (o) this.addExp(o, r.exp); });
    // 装备掉落（与 rewardStage 同概率/同加权）
    let drop = null;
    if (Math.random() < 0.40) {
      const C = window.GameData.GEAR.CRAFT;
      const type = C.types[Math.floor(Math.random() * C.types.length)];
      const bonus = Math.min(0.30, t.id * 0.04);
      const rr = Math.random();
      let rarity = 3;
      if (rr < C.rarityWeight[5] + bonus) rarity = 5;
      else if (rr < C.rarityWeight[5] + C.rarityWeight[4] + bonus) rarity = 4;
      drop = { weapon: 'wpn', armor: 'arm', accessory: 'acc' }[type] + '_' + { 3: 'r', 4: 'sr', 5: 'ur' }[rarity];
      this.addGear(drop);
    }
    this.save();
    return { ok: true, gold, gem, exp: r.exp, drop };
  },

  // ============================================================
  //  体力（行动力）—— 随时间回复，资源副本消耗
  // ============================================================
  STAMINA_MAX: 120,
  STAMINA_PER_MS: 5 * 60 * 1000,   // 每 5 分钟回 1 点

  syncStamina() {
    const now = Date.now();
    if (this.state.stamina == null) { this.state.stamina = this.STAMINA_MAX; this.state.staminaTs = now; }
    if (this.state.stamina >= this.STAMINA_MAX) { this.state.staminaTs = now; return; }
    const gained = Math.floor((now - this.state.staminaTs) / this.STAMINA_PER_MS);
    if (gained > 0) {
      this.state.stamina = Math.min(this.STAMINA_MAX, this.state.stamina + gained);
      this.state.staminaTs = this.state.stamina >= this.STAMINA_MAX ? now : this.state.staminaTs + gained * this.STAMINA_PER_MS;
    }
  },
  staminaEtaMs() { // 距下一点回复的毫秒
    this.syncStamina();
    if (this.state.stamina >= this.STAMINA_MAX) return 0;
    return this.STAMINA_PER_MS - (Date.now() - this.state.staminaTs);
  },
  spendStamina(n) {
    this.syncStamina();
    if (this.state.stamina < n) return false;
    if (this.state.stamina >= this.STAMINA_MAX) this.state.staminaTs = Date.now();
    this.state.stamina -= n;
    return true;
  },
  buyStamina() { // 宝石买体力
    if (this.state.gem < 50) return { ok: false, msg: '宝石不足（需 50）' };
    this.state.gem -= 50; this.state.stamina += 60; this.save();
    return { ok: true };
  },

  // 通用装备掉落（scale 越大越易出高稀有）
  rollGear(scale) {
    const C = window.GameData.GEAR.CRAFT;
    const type = C.types[Math.floor(Math.random() * C.types.length)];
    const bonus = Math.min(0.30, (scale || 0) * 0.04);
    const rr = Math.random();
    let rarity = 3;
    if (rr < C.rarityWeight[5] + bonus) rarity = 5;
    else if (rr < C.rarityWeight[5] + C.rarityWeight[4] + bonus) rarity = 4;
    const id = { weapon: 'wpn', armor: 'arm', accessory: 'acc' }[type] + '_' + { 3: 'r', 4: 'sr', 5: 'ur' }[rarity];
    this.addGear(id);
    return id;
  },

  // ============================================================
  //  资源副本（farm）—— 体力换金币/经验/装备，可多倍连刷
  // ============================================================
  FARM: [
    { id: 'gold',  icon: '🪙', name: '金币矿洞', desc: '稳定产出大量金币',     stam: 10, unlock: 1, reward: { gold: 1500 } },
    { id: 'exp',   icon: '📘', name: '修炼之地', desc: '出战队伍获得经验',     stam: 10, unlock: 2, reward: { exp: 800 } },
    { id: 'gear',  icon: '⚒️', name: '装备秘境', desc: '掉落装备 + 金币',      stam: 12, unlock: 4, reward: { gold: 500, gearScale: 6 } },
    { id: 'mixed', icon: '💎', name: '试炼回廊', desc: '综合产出（金/经/装）', stam: 15, unlock: 6, reward: { gold: 800, exp: 500, gearScale: 8 } },
  ],
  farmUnlocked(d) { return this.state.cleared.length >= d.unlock; },
  runFarm(id, times) {
    const d = this.FARM.find(x => x.id === id);
    if (!d) return { ok: false, msg: '副本不存在' };
    if (!this.farmUnlocked(d)) return { ok: false, msg: `通关 ${d.unlock} 关后解锁` };
    times = Math.max(1, times | 0);
    this.syncStamina();
    const cost = d.stam * times;
    if (this.state.stamina < cost) return { ok: false, msg: '体力不足' };
    this.spendStamina(cost);
    const tot = { gold: 0, exp: 0, gears: [] };
    for (let i = 0; i < times; i++) {
      const r = d.reward;
      if (r.gold) { this.state.gold += r.gold; tot.gold += r.gold; }
      if (r.exp) { this.state.team.forEach(uid => { const o = this.getOwned(uid); if (o) this.addExp(o, r.exp); }); tot.exp += r.exp; }
      if (r.gearScale && Math.random() < 0.6) tot.gears.push(this.rollGear(r.gearScale));
    }
    this.incQuest('win', times);
    this.save();
    return { ok: true, tot, cost };
  },

  // ============================================================
  //  远征派遣（dispatch）—— 离线挂机，按真实时间结算
  // ============================================================
  DISPATCH_TIERS: [
    { id: 't1', name: '近郊巡逻', hours: 0.5, icon: '🥾', reward: { gold: 600, exp: 200 } },
    { id: 't2', name: '商路护卫', hours: 2,   icon: '🛡️', reward: { gold: 2000, exp: 700 } },
    { id: 't3', name: '远方探索', hours: 4,   icon: '🧭', reward: { gold: 4200, exp: 1500, gem: 30 } },
    { id: 't4', name: '秘境远征', hours: 8,   icon: '🗺️', reward: { gold: 9000, exp: 3200, gem: 80, stone: 3, gearScale: 6 } },
  ],
  DISPATCH_SLOTS: 3,
  dispatchSlotUnlocked(i) { return i === 0 || this.state.cleared.length >= i * 2; }, // 第2/3槽位需通关进度
  // 派遣加成：参与人数 + 稀有度总和 → 奖励倍率
  dispatchMult(charUids) {
    let sum = 0;
    (charUids || []).forEach(uid => { const o = this.getOwned(uid); if (o) sum += window.GameData.CHARACTERS[o.charId].rarity; });
    return 1 + sum * 0.06; // 每点稀有度 +6%
  },
  startDispatch(slotIdx, tierId, charUids) {
    if (!this.dispatchSlotUnlocked(slotIdx)) return { ok: false, msg: '该派遣位未解锁' };
    if (this.state.dispatch.slots[slotIdx]) return { ok: false, msg: '该位正在派遣中' };
    const tier = this.DISPATCH_TIERS.find(t => t.id === tierId);
    if (!tier) return { ok: false, msg: '任务不存在' };
    charUids = (charUids || []).filter(Boolean);
    if (!charUids.length) return { ok: false, msg: '至少派遣 1 名佣兵' };
    // 不可与其它派遣位重复占用同一角色
    const busy = new Set();
    this.state.dispatch.slots.forEach(s => s && s.charUids.forEach(u => busy.add(u)));
    if (charUids.some(u => busy.has(u))) return { ok: false, msg: '有佣兵正在其它派遣中' };
    this.state.dispatch.slots[slotIdx] = { tierId, charUids, mult: this.dispatchMult(charUids), endTs: Date.now() + tier.hours * 3600 * 1000 };
    this.save();
    return { ok: true };
  },
  dispatchDone(slotIdx) {
    const s = this.state.dispatch.slots[slotIdx];
    return s && Date.now() >= s.endTs;
  },
  dispatchHomeTag() {
    const ready = this.state.dispatch.slots.filter((_, i) => this.dispatchDone(i)).length;
    return ready ? '✓' + ready : '';
  },
  claimDispatch(slotIdx) {
    const s = this.state.dispatch.slots[slotIdx];
    if (!s) return { ok: false, msg: '该位无派遣' };
    if (Date.now() < s.endTs) return { ok: false, msg: '尚未完成' };
    const tier = this.DISPATCH_TIERS.find(t => t.id === s.tierId);
    const r = tier.reward, m = s.mult || 1;
    const got = { gold: 0, exp: 0, gem: 0, gears: [] };
    if (r.gold) { const g = Math.round(r.gold * m); this.state.gold += g; got.gold = g; }
    if (r.gem) { const g = Math.round(r.gem * m); this.state.gem += g; got.gem = g; }
    if (r.exp) { const e = Math.round(r.exp * m); s.charUids.forEach(uid => { const o = this.getOwned(uid); if (o) this.addExp(o, e); }); got.exp = e; }
    if (r.stone) { const st = Math.round(r.stone * m); this.state.awakenStone += st; got.stone = st; }
    if (r.gearScale && Math.random() < 0.7) got.gears.push(this.rollGear(r.gearScale));
    this.state.dispatch.slots[slotIdx] = null;
    this.save();
    return { ok: true, got, tier };
  },
  cancelDispatch(slotIdx) {
    if (this.state.dispatch.slots[slotIdx]) { this.state.dispatch.slots[slotIdx] = null; this.save(); return { ok: true }; }
    return { ok: false };
  },

  // ============================================================

  ARENA_MAX_ATTEMPTS: 5,

    { min: 2000, name: '钻石', icon: '💎' }, { min: 2500, name: '大师', icon: '👑' },
  ],
  arenaRank(pts) {
    let r = this.ARENA_RANKS[0];
    for (const x of this.ARENA_RANKS) if (pts >= x.min) r = x;

  // 合成一个「临时角色实例」给 AI / 战力估算用（不写入存档）
  aiOwned(charId, level, plus) {
    return {
      uid: 'ai', charId, level: level || 1, exp: 0,
      star: window.GameData.CHARACTERS[charId].rarity, plus: plus || 0,
      costumes: ['base_' + charId], activeCostume: 'base_' + charId,
      equip: { weapon: null, armor: null, accessory: null, ex: null },

  },
  teamPowerOf(list) { // list: [{char,level,plus}] 或 owned 数组
    let p = 0;
    list.forEach(e => {
      const ao = e.charId ? e : this.aiOwned(e.char, e.level, e.plus || 0);
      const st = this.computeStats(ao);
      p += st.maxHp * 0.25 + st.atk * 1.5 + st.def;

  playerPower() {

  // 账号等级（由进度估算：通关 + 角色数 + 角色等级 + 竞技积分）
  accountLevel() {
    const s = this.state;
    const lvSum = s.roster.reduce((a, o) => a + (o.level || 1), 0);
    return Math.max(1, Math.floor(s.cleared.length * 2 + s.roster.length + lvSum / 25 + ((s.arena && s.arena.points || 1000) - 1000) / 200));
  },

  // ---------- 邮箱（系统邮件 + 一键领取） ----------
  ensureMail() {

      this.state.mail = [

        { id: 'starter_stam', title: '体力补给', body: '冒险离不开体力，先送你一些觉醒石与希望之粉。', reward: { stone: 5, powder: 50 }, claimed: false, ts: Date.now() },

  mailUnclaimed() { this.ensureMail(); return this.state.mail.filter(m => !m.claimed && m.reward && Object.keys(m.reward).length).length; },
  claimMail(id) {
    this.ensureMail();

  claimAllMail() {

    this.state.mail.forEach(m => {

      for (const k in m.reward) if (got[k] != null) got[k] += m.reward[k];

  arenaTeamLevel() {

    const ids = Object.keys(window.GameData.CHARACTERS);

  grantReward(r) {
    if (!r) return;
    if (r.gold) this.state.gold += r.gold;
    if (r.gem) this.state.gem += r.gem;
    if (r.powder) this.state.powder += r.powder;
    if (r.spark) this.state.spark += r.spark;
    if (r.gear) this.addGear(r.gear);
    if (r.stone) this.state.awakenStone = (this.state.awakenStone || 0) + r.stone;

    if (!a) return { ok: false };
    if (this.state.achClaimed[id]) return { ok: false, msg: '已领取' };
    if (this.achValue(a) < a.target) return { ok: false, msg: '未达成' };

    this.state.achClaimed[id] = true;
    this.save();
    return { ok: true, reward: a.reward };
  },

// ============================================================
//  回合制战斗引擎
//  - 基于速度的行动顺序
//  - 技能 SP 充能、元素克制、暴击、护盾、增益/减益
//  - 玩家手动操作 + 敌方 AI
// ============================================================

class Combatant {
  constructor(opts) {
    this.uid = opts.uid;            // 唯一标识
    this.name = opts.name;
    this.side = opts.side;          // 'ally' | 'enemy'
    this.charId = opts.charId;      // 引用图鉴 id（角色或敌人）
    this.cls = opts.cls;
    this.element = opts.element;
    this.color = opts.color;
    this.level = opts.level;
    this.pos = opts.pos;            // 'front' | 'back'
    this.isBoss = !!opts.isBoss;

    this.maxHp = opts.maxHp;
    this.hp = opts.maxHp;
    this.atk = opts.atk;
    this.def = opts.def;
    this.spd = opts.spd;
    this.crit = opts.crit;

    this.skills = opts.skills.slice(); // 技能 id 列表（含普攻）
    this.sigSkillId = opts.sigSkillId || null; // 当前服装的专属招式（受突破强化）
    this.sigPlus = opts.sigPlus || 0;          // 当前服装突破等级 0~5
    this.sp = 3;                       // 起始 SP（可开局放低费技能）
    this.maxSp = 6;
    this.cooldowns = {};               // skillId -> 剩余冷却回合

    this.shield = 0;                   // 当前护盾值
    this.buffs = [];                   // {stat:'atk'|'def', mult, turns}
    this.statuses = [];                // {type:'poison'|'burn'|'stun'|'silence', turns, dmg}
    this.enraged = false;              // BOSS 狂暴标记
    this.taunting = 0;                 // 嘲讽剩余回合
    // BOSS 弱点破防机制
    this.weak = opts.weak || null;     // 弱点元素（被克制属性命中可积累破防）
    this.breakMax = opts.isBoss ? 100 : 0;
    this.breakCur = 0;
    this.broken = false;               // 当前是否处于破防（受额外伤害）
    this.alive = true;
  }

  // 含增益后的有效攻击
  effAtk() {
    let m = 1;
    this.buffs.forEach(b => { if (b.stat === 'atk') m += b.mult; });
    return Math.round(this.atk * m);
  }

  // 含增益/减益后的有效防御
  effDef() {
    let m = 1;
    this.buffs.forEach(b => {
      if (b.stat === 'def') m += b.mult;       // 正为加防
    });
    return Math.max(0, Math.round(this.def * m));
  }

  tickBuffs() {
    this.buffs.forEach(b => b.turns--);
    this.buffs = this.buffs.filter(b => b.turns > 0);
    if (this.taunting > 0) this.taunting--;
    // 冷却递减
    Object.keys(this.cooldowns).forEach(k => {
      if (this.cooldowns[k] > 0) this.cooldowns[k]--;
    });
  }
}

const Battle = {
  combatants: [],
  log: [],
  turnOrder: [],
  turnIdx: 0,
  round: 1,
  onEvent: null,   // UI 回调
  finished: false,
  result: null,    // 'win' | 'lose'

  /** 从存档队伍 + 关卡数据构建战斗 */
  setup(teamUids, stage) {
    this.combatants = [];
    this.log = [];
    this.round = 1;
    this.turnIdx = 0;
    this.finished = false;
    this.result = null;

    const D = window.GameData;

    // 我方
    teamUids.forEach((uid, i) => {
      const owned = Game.getOwned(uid);
      if (!owned) return;
      const def = D.CHARACTERS[owned.charId];
      const cos = Game.activeCostumeDef(owned); // 当前装扮：属性/元素/配色
      const st = Game.computeStats(owned);
      // 三段站位：坦克/战士在前，弓手居中，法师/治疗在后
      const pos = (def.cls === 'warrior' || def.cls === 'defender') ? 'front'
                : (def.cls === 'archer' || def.cls === 'rogue') ? 'mid' : 'back';
      this.combatants.push(new Combatant({
        uid: 'A' + i, name: def.name, side: 'ally', charId: owned.charId,
        cls: def.cls, element: cos.element, color: cos.color, level: owned.level,
        pos, maxHp: st.maxHp, atk: st.atk, def: st.def, spd: st.spd, crit: st.crit,
        skills: Game.battleSkills(owned), // 普攻 + 各服装招式
        sigSkillId: cos.signature,        // 当前服装专属招式（受突破强化）
        sigPlus: owned.plus || 0,         // 突破等级
      }));
    });

    // 敌方
    stage.enemies.forEach((e, i) => {
      // 竞技场 / 角色型敌人：用角色数据构建（与我方同一套属性体系）
      if (e.char) {
        const ao = Game.aiOwned(e.char, e.level || 1, e.plus || 0);
        const cdef = D.CHARACTERS[e.char];
        const cos = Game.activeCostumeDef(ao);
        const st = Game.computeStats(ao);
        const pos = e.pos || ((cdef.cls === 'warrior' || cdef.cls === 'defender') ? 'front'
          : (cdef.cls === 'archer' || cdef.cls === 'rogue') ? 'mid' : 'back');
        this.combatants.push(new Combatant({
          uid: 'E' + i, name: cdef.name, side: 'enemy', charId: e.char,
          cls: cdef.cls, element: cos.element, color: cos.color, level: ao.level, pos,
          maxHp: st.maxHp, atk: st.atk, def: st.def, spd: st.spd, crit: st.crit,
          skills: Game.battleSkills(ao), sigSkillId: cos.signature, sigPlus: ao.plus,
        }));
        return;
      }
      const def = D.ENEMIES[e.id];
      const lv = e.level - 1;
      const grow = { hp: def.base.hp * 0.10, atk: def.base.atk * 0.08, def: def.base.def * 0.08 };
      this.combatants.push(new Combatant({
        uid: 'E' + i, name: def.name, side: 'enemy', charId: e.id,
        cls: 'enemy', element: def.element, color: def.color, level: e.level,
        pos: e.pos,
        maxHp: Math.round(def.base.hp + grow.hp * lv),
        atk: Math.round(def.base.atk + grow.atk * lv),
        def: Math.round(def.base.def + grow.def * lv),
        spd: def.base.spd, crit: def.base.crit,
        skills: def.skills, isBoss: def.isBoss,
        weak: def.isBoss ? (def.weak || this.counterElement(def.element)) : null,
      }));
    });

    this.buildTurnOrder();
    this.pushLog(`⚔️ 战斗开始！ ${stage.name}`);
  },

  buildTurnOrder() {
    // 按速度从高到低排序（同速随机）
    this.turnOrder = this.combatants
      .filter(c => c.alive)
      .sort((a, b) => (b.spd - a.spd) || (Math.random() - 0.5));
    this.turnIdx = 0;
  },

  allies() { return this.combatants.filter(c => c.side === 'ally'); },
  enemies() { return this.combatants.filter(c => c.side === 'enemy'); },
  aliveAllies() { return this.allies().filter(c => c.alive); },
  aliveEnemies() { return this.enemies().filter(c => c.alive); },

  current() {
    return this.turnOrder[this.turnIdx];
  },

  pushLog(msg) {
    this.log.push(msg);
    if (this.onEvent) this.onEvent({ type: 'log', msg });
  },

  // ---------- 战斗主流程 ----------

  /** 推进到下一个存活单位的回合；若一轮结束则进入新回合 */
  advance() {
    do {
      this.turnIdx++;
      if (this.turnIdx >= this.turnOrder.length) {
        // 新回合
        this.round++;
        this.tickRound();
        this.buildTurnOrder();
        this.pushLog(`—— 第 ${this.round} 回合 ——`);
      }
    } while (this.current() && !this.current().alive);
    return this.current();
  },

  /** 当前是否轮到我方操作 */
  isPlayerTurn() {
    const c = this.current();
    return c && c.alive && c.side === 'ally' && !this.finished;
  },

  /** 技能冷却回合数（未显式定义则按 SP 估算） */
  skillCD(sk) {
    if (sk.cd != null) return sk.cd;
    const sp = sk.sp || 0;
    return sp >= 4 ? 3 : sp >= 2 ? 2 : 1;
  },

  /** 突破对「当前服装专属招式」的强化：威力倍率（每级 +6%） */
  sigPowerMult(c, skillId) {
    return (c.sigSkillId && c.sigSkillId === skillId && c.sigPlus) ? (1 + c.sigPlus * 0.06) : 1;
  },
  /** 突破对「当前服装专属招式」的 SP 减免：每 2 级 -1 SP（最低 0） */
  skillSp(c, skillId) {
    const sk = window.GameData.SKILLS[skillId];
    let sp = sk.sp || 0;
    if (c.sigSkillId && c.sigSkillId === skillId && c.sigPlus) sp = Math.max(0, sp - Math.floor(c.sigPlus / 2));
    return sp;
  },

  /** 技能当前是否可用（SP 足够、不在冷却、未被沉默）；普攻恒可用 */
  canUseSkill(combatant, skillId) {
    const sk = window.GameData.SKILLS[skillId];
    if (sk.basic) return true;
    if (this.isSilenced(combatant)) return false;
    if ((combatant.cooldowns[skillId] || 0) > 0) return false;
    return combatant.sp >= this.skillSp(combatant, skillId);
  },

  // ---------- 状态效果 ----------
  hasStatus(c, type) { return c.statuses.some(s => s.type === type && s.turns > 0); },
  isStunned(c) { return this.hasStatus(c, 'stun'); },
  isSilenced(c) { return this.hasStatus(c, 'silence'); },
  consumeStun(c) {
    const s = c.statuses.find(x => x.type === 'stun' && x.turns > 0);
    if (s) { s.turns--; c.statuses = c.statuses.filter(x => x.turns > 0); }
  },

  /** 施加状态（同类刷新为较长持续） */
  applyStatus(target, inflict, attacker) {
    const st = { type: inflict.type, turns: inflict.turns };
    if (inflict.type === 'poison' || inflict.type === 'burn') {
      st.dmg = Math.max(1, Math.round(attacker.effAtk() * (inflict.power || 0.4)));
    }
    const ex = target.statuses.find(s => s.type === inflict.type);
    if (ex) { ex.turns = Math.max(ex.turns, st.turns); if (st.dmg) ex.dmg = st.dmg; }
    else target.statuses.push(st);
    const nm = { poison: '中毒', burn: '灼烧', stun: '眩晕', silence: '沉默' }[inflict.type] || inflict.type;
    this.pushLog(`☣ ${target.name} 陷入${nm}！`);
    if (this.onEvent) this.onEvent({ type: 'status', target, status: inflict.type });
  },

  /** 每回合：持续伤害结算 + 各类持续时间递减 */
  tickRound() {
    this.combatants.forEach(c => {
      if (!c.alive) return;
      // 持续伤害（中毒/灼烧）
      c.statuses.filter(s => (s.type === 'poison' || s.type === 'burn') && s.turns > 0).forEach(s => {
        if (!c.alive) return;
        let dmg = s.dmg || 1;
        if (c.shield > 0) { const a = Math.min(c.shield, dmg); c.shield -= a; dmg -= a; }
        c.hp -= dmg;
        const icon = s.type === 'poison' ? '☠' : '🔥';
        this.pushLog(`${icon} ${c.name} 受到 ${dmg} 点${s.type === 'poison' ? '中毒' : '灼烧'}伤害`);
        if (this.onEvent) this.onEvent({ type: 'damage', target: c, amount: dmg, crit: false, elem: false, dot: true });
        if (c.hp <= 0) { c.hp = 0; c.alive = false; this.pushLog(`💀 ${c.name} 被击倒！`); }
      });
      // 持续时间递减（眩晕在行动时单独消耗）
      c.buffs.forEach(b => b.turns--); c.buffs = c.buffs.filter(b => b.turns > 0);
      c.statuses.forEach(s => { if (s.type !== 'stun') s.turns--; });
      c.statuses = c.statuses.filter(s => s.turns > 0);
      if (c.taunting > 0) c.taunting--;
      Object.keys(c.cooldowns).forEach(k => { if (c.cooldowns[k] > 0) c.cooldowns[k]--; });
    });
  },

  // 三段站位（由前到后）：前排 → 中排 → 后排
  TIER_ORDER: ['front', 'mid', 'back'],
  tierIdx(pos) { const i = this.TIER_ORDER.indexOf(pos); return i < 0 ? 0 : i; },

  /** 前排保护：只能攻击「当前最靠前、仍有存活单位」的那一段站位（穿透技能除外） */
  frontline(units) {
    const alive = units.filter(u => u.alive);
    if (!alive.length) return [];
    const minT = Math.min(...alive.map(u => this.tierIdx(u.pos)));
    return alive.filter(u => this.tierIdx(u.pos) === minT);
  },

  /** 解析技能合法目标列表 */
  validTargets(combatant, skillId) {
    const sk = window.GameData.SKILLS[skillId];
    const enemySide = combatant.side === 'ally' ? this.aliveEnemies() : this.aliveAllies();
    const allySide = combatant.side === 'ally' ? this.aliveAllies() : this.aliveEnemies();
    switch (sk.target) {
      case 'enemySingle': return sk.pierce ? enemySide : this.frontline(enemySide);
      case 'enemyRow':    return enemySide; // 选一个代表，命中其整排
      case 'enemyAll':    return enemySide;
      case 'allySingle':  return allySide;
      case 'allyAll':     return allySide;
      case 'self':        return [combatant];
    }
    return [];
  },

  /** 嘲讽：若敌方有嘲讽单位，单体攻击只能选它 */
  applyTaunt(attacker, targets) {
    if (attacker.side !== 'enemy') {
      // 我方攻击敌人，敌人无嘲讽机制（简化）
      return targets;
    }
    return targets;
  },

  /** 实际收集技能命中的目标 */
  resolveHitTargets(combatant, skillId, picked) {
    const sk = window.GameData.SKILLS[skillId];
    switch (sk.target) {
      case 'enemySingle':
      case 'allySingle':
        return [picked];
      case 'self':
        return [combatant];
      case 'enemyAll':
        return combatant.side === 'ally' ? this.aliveEnemies() : this.aliveAllies();
      case 'allyAll':
        return combatant.side === 'ally' ? this.aliveAllies() : this.aliveEnemies();
      case 'enemyRow': {
        const side = combatant.side === 'ally' ? this.aliveEnemies() : this.aliveAllies();
        return side.filter(c => c.pos === picked.pos);
      }
    }
    return [];
  },

  /** 克制某元素的元素（即「弱点」）：返回 X 使 ELEMENTS[X].strong === elem */
  counterElement(elem) {
    const E = window.GameData.ELEMENTS;
    for (const k in E) if (E[k].strong === elem) return k;
    return null;
  },

  /** 元素克制倍率（命中 BOSS 弱点更高，并积累破防） */
  elementMult(attacker, defender) {
    if (defender.weak && attacker.element === defender.weak) return 1.5; // 弱点
    const E = window.GameData.ELEMENTS[attacker.element];
    if (E && E.strong === defender.element) return 1.3;
    return 1.0;
  },

  /** 计算并施加一次伤害 */
  dealDamage(attacker, defender, power) {
    const elem = this.elementMult(attacker, defender);
    const isWeak = defender.weak && attacker.element === defender.weak;
    const isCrit = Math.random() < attacker.crit;
    const critMult = isCrit ? 1.6 : 1.0;
    const brokenMult = defender.broken ? 1.4 : 1.0;   // 破防中受到额外伤害
    const raw = attacker.effAtk() * power * elem * critMult * brokenMult;
    // 防御减伤公式
    const reduced = raw * (100 / (100 + defender.effDef()));
    let dmg = Math.max(1, Math.round(reduced));

    // 护盾吸收
    if (defender.shield > 0) {
      const absorb = Math.min(defender.shield, dmg);
      defender.shield -= absorb;
      dmg -= absorb;
    }
    defender.hp -= dmg;

    // BOSS 破防积累：弱点元素命中显著、其它命中少量；满槽→破防眩晕一回合
    if (defender.breakMax > 0 && !defender.broken && attacker.side === 'ally' && defender.alive) {
      defender.breakCur += isWeak ? 34 : 8;
      if (defender.breakCur >= defender.breakMax) {
        defender.breakCur = 0; defender.broken = true;
        defender.statuses.push({ type: 'stun', turns: 1 });
        this.pushLog(`💢 ${defender.name} 被【破防】！眩晕且受到额外伤害！`);
        if (this.onEvent) this.onEvent({ type: 'break', target: defender });
      }
    }

    let tag = '';
    if (isWeak) tag += ' 💢弱点';
    else if (elem > 1) tag += ' 🔥克制';
    if (isCrit) tag += ' ✨暴击';

    if (defender.hp <= 0) {
      defender.hp = 0;
      defender.alive = false;
      this.pushLog(`💀 ${defender.name} 被击倒！`);
    } else if (defender.isBoss && !defender.enraged && defender.hp <= defender.maxHp * 0.5) {
      // BOSS 狂暴：血量过半，攻击大幅提升
      defender.enraged = true;
      defender.buffs.push({ stat: 'atk', mult: 0.5, turns: 999 });
      this.pushLog(`🔥 ${defender.name} 进入【狂暴】，攻击大幅提升！`);
      if (this.onEvent) this.onEvent({ type: 'enrage', target: defender });
    }
    if (this.onEvent) this.onEvent({ type: 'damage', target: defender, attacker, amount: dmg, crit: isCrit, elem: elem > 1 });
    return { dmg, isCrit, elem: elem > 1, tag };
  },

  /** 执行一个技能 */
  executeSkill(combatant, skillId, picked) {
    const sk = window.GameData.SKILLS[skillId];
    // 扣 SP（突破对专属招式有减免）
    combatant.sp -= this.skillSp(combatant, skillId);
    const sigMul = this.sigPowerMult(combatant, skillId); // 突破对专属招式的威力强化

    const targets = this.resolveHitTargets(combatant, skillId, picked);

    if (sk.effect === 'damage') {
      let summary = [];
      targets.forEach(t => {
        if (!t.alive) return;
        const r = this.dealDamage(combatant, t, sk.power * sigMul);
        summary.push(`${t.name} -${r.dmg}${r.tag}`);
        // 击退位移
        if (sk.knockback && t.alive) this.applyKnockback(combatant, t, r.dmg);
      });
      this.pushLog(`${combatant.name} 使用「${sk.name}」：${summary.join('，')}`);
      // 附带减益（如水矛降防）
      if (sk.extra && sk.extra.type === 'debuffDef') {
        targets.forEach(t => {
          if (t.alive) t.buffs.push({ stat: 'def', mult: -sk.extra.power, turns: sk.extra.duration });
        });
      }
      // 附带状态（中毒/灼烧/眩晕/沉默）
      if (sk.inflict) {
        targets.forEach(t => { if (t.alive) this.applyStatus(t, sk.inflict, combatant); });
      }
    } else if (sk.effect === 'heal') {
      const amt = Math.round(combatant.effAtk() * sk.power * sigMul);
      let summary = [];
      targets.forEach(t => {
        if (!t.alive) return;
        const before = t.hp;
        t.hp = Math.min(t.maxHp, t.hp + amt);
        summary.push(`${t.name} +${t.hp - before}`);
        if (this.onEvent) this.onEvent({ type: 'heal', target: t, attacker: combatant, amount: t.hp - before });
      });
      this.pushLog(`${combatant.name} 使用「${sk.name}」：${summary.join('，')}`);
    } else if (sk.effect === 'buffAtk' || sk.effect === 'buffDef') {
      const stat = sk.effect === 'buffAtk' ? 'atk' : 'def';
      targets.forEach(t => {
        if (t.alive) t.buffs.push({ stat, mult: sk.power, turns: sk.duration });
      });
      this.pushLog(`${combatant.name} 使用「${sk.name}」，提升${stat === 'atk' ? '攻击' : '防御'}！`);
    } else if (sk.effect === 'shield') {
      const amt = Math.round(combatant.effAtk() * sk.power * sigMul);
      targets.forEach(t => { if (t.alive) t.shield += amt; });
      this.pushLog(`${combatant.name} 使用「${sk.name}」，为全队附加 ${amt} 点护盾！`);
      if (sk.extra && sk.extra.type === 'taunt') combatant.taunting = 2;
    }

    // SP 与冷却：普攻回复 SP；招式进入冷却
    if (sk.basic) {
      combatant.sp = Math.min(combatant.maxSp, combatant.sp + 3);
    } else {
      combatant.cooldowns[skillId] = this.skillCD(sk);
    }

    this.checkEnd();
  },

  /** 击退：沿站位向后推一段（前→中→后）；已在最后排则撞墙受额外伤害 */
  applyKnockback(attacker, target, baseDmg) {
    const order = this.TIER_ORDER;
    const i = order.indexOf(target.pos);
    if (i >= 0 && i < order.length - 1) {
      const tierName = { mid: '中排', back: '后排' }[order[i + 1]] || '后排';
      target.pos = order[i + 1];
      this.pushLog(`↩ ${target.name} 被击退到${tierName}！`);
      if (this.onEvent) this.onEvent({ type: 'knockback', target, kind: 'push' });
    } else {
      // 撞墙：额外碰撞伤害
      let dmg = Math.max(1, Math.round(baseDmg * 0.35));
      if (target.shield > 0) {
        const a = Math.min(target.shield, dmg);
        target.shield -= a; dmg -= a;
      }
      target.hp -= dmg;
      this.pushLog(`💥 ${target.name} 撞击受到 ${dmg} 额外伤害！`);
      if (this.onEvent) this.onEvent({ type: 'knockback', target, kind: 'collide' });
      if (dmg > 0 && this.onEvent) this.onEvent({ type: 'damage', target, attacker, amount: dmg, crit: false, elem: false });
      if (target.hp <= 0) {
        target.hp = 0; target.alive = false;
        this.pushLog(`💀 ${target.name} 被击倒！`);
      }
    }
  },

  checkEnd() {
    if (this.aliveEnemies().length === 0) {
      this.finished = true;
      this.result = 'win';
      this.pushLog('🎉 战斗胜利！');
      if (this.onEvent) this.onEvent({ type: 'end', result: 'win' });
    } else if (this.aliveAllies().length === 0) {
      this.finished = true;
      this.result = 'lose';
      this.pushLog('☠️ 全队覆灭……');
      if (this.onEvent) this.onEvent({ type: 'end', result: 'lose' });
    }
  },

  // ---------- 敌方 AI ----------

  enemyAct() {
    const c = this.current();
    if (!c || c.side !== 'enemy' || !c.alive) return;

    // 可用技能：SP 足够 且 不在冷却；否则用普通攻击
    const usable = c.skills
      .map(id => ({ id, sk: window.GameData.SKILLS[id] }))
      .filter(s => this.canUseSkill(c, s.id));
    usable.sort((a, b) => (b.sk.power * (1 + (b.sk.sp || 0))) - (a.sk.power * (1 + (a.sk.sp || 0))));
    const basic = { id: 'basic_attack', sk: window.GameData.SKILLS.basic_attack };
    const choice = usable[0] || basic;

    // 选目标：攻击类 → 优先打血量最低的我方；治疗 → 自己
    let picked;
    if (choice.sk.effect === 'damage') {
      // 嘲讽优先；否则受前排保护约束（穿透技能可越过前排）
      const taunters = this.aliveAllies().filter(a => a.taunting > 0);
      const pool = taunters.length
        ? taunters
        : (choice.sk.pierce ? this.aliveAllies() : this.frontline(this.aliveAllies()));
      picked = pool.reduce((lo, t) => (t.hp < lo.hp ? t : lo), pool[0]);
    } else {
      picked = c;
    }
    this.executeSkill(c, choice.id, picked);
  },
};

window.Battle = Battle;
window.Combatant = Combatant;

          </button>
        </div>

  /** 队伍编辑器：从出战框直接编辑 */
  showTeamEditor(slotIdx) {
    const TEAM_MAX = 5;
    let sel = Math.max(0, Math.min(TEAM_MAX - 1, slotIdx || 0));
    const render = (m) => {
      const currentUid = Game.state.team[sel];
      const current = currentUid ? Game.getOwned(currentUid) : null;
      // 顶部：5 个出战槽位，点击切换正在编辑的位置
      const slotsBar = Array.from({ length: TEAM_MAX }, (_, i) => {
        const uid = Game.state.team[i];
        const o = uid ? Game.getOwned(uid) : null;
        const c = o ? window.GameData.CHARACTERS[o.charId] : null;
        const art = o
          ? `<div class="ts-art" style="background:radial-gradient(circle at 50% 35%, ${Game.activeColor(o)}55, transparent);">${this.charAvatar(o.charId)}</div>`
          : `<div class="ts-art empty">+</div>`;
        return `<div class="te-slot ${i === sel ? 'sel' : ''} ${o ? 'border-' + this.rarityClass(c.rarity) : 'empty'}" data-slot="${i}">
          ${art}
          <div class="ts-no">${o ? c.name : '第' + (i + 1) + '位'}</div>
        </div>`;
      }).join('');

      // 候选只展示「未出战」的角色，避免与已上阵角色混淆
      const avail = Game.state.roster.filter(o => Game.state.team.indexOf(o.uid) < 0)
        .sort((a, b) => {
          const ca = window.GameData.CHARACTERS[a.charId], cb = window.GameData.CHARACTERS[b.charId];
          return cb.rarity - ca.rarity || b.level - a.level;
        });

      let curHtml;
      if (current) {
        const cc = window.GameData.CHARACTERS[current.charId];
        curHtml = `<div class="te-current">
          <div class="roster-card border-${this.rarityClass(cc.rarity)}" style="width:84px;">
            <div class="rc-art" style="background:radial-gradient(circle at 50% 35%, ${Game.activeColor(current)}44, transparent);">
              <span class="rarity-badge ${this.rarityClass(cc.rarity)}">${cc.rarity}★</span>
              ${current.plus ? `<span class="plus-badge corner">+${current.plus}</span>` : ''}
              ${this.charAvatar(current.charId)}
            </div>
            <div class="rc-info"><div class="rc-name">${cc.name}</div><div class="rc-lv">Lv.${current.level}</div></div>
          </div>
          <div class="te-current-info">
            <div>第 ${sel + 1} 位出战：<b>${cc.name}</b></div>
            <button class="btn secondary sm" id="te-remove">移出该位置</button>
          </div>
        </div>`;
      } else {
        curHtml = `<div class="te-current empty muted">第 ${sel + 1} 位为空，从下方选择一名角色上阵 ›</div>`;
      }

      const grid = avail.length ? avail.map(o => {
        const c = window.GameData.CHARACTERS[o.charId];
        return `<div class="roster-card border-${this.rarityClass(c.rarity)}" data-uid="${o.uid}">
          <div class="rc-art" style="background:radial-gradient(circle at 50% 35%, ${Game.activeColor(o)}44, transparent);">
            <span class="rarity-badge ${this.rarityClass(c.rarity)}">${c.rarity}★</span>
            ${o.plus ? `<span class="plus-badge corner">+${o.plus}</span>` : ''}
            ${this.charAvatar(o.charId)}
          </div>
          <div class="rc-info"><div class="rc-name">${c.name}</div><div class="rc-lv">Lv.${o.level}</div></div>
        </div>`;
      }).join('') : '<div class="muted" style="padding:12px;grid-column:1/-1;">没有可上阵的角色了</div>';

      m.querySelector('.te-slots').innerHTML = slotsBar;
      m.querySelector('.te-current-wrap').innerHTML = curHtml;
      m.querySelector('.te-body').innerHTML = grid;
      m.querySelector('.te-count').textContent = `${Game.state.team.length}/${TEAM_MAX}`;

      m.querySelectorAll('.te-slot').forEach(el => el.onclick = () => { sel = +el.dataset.slot; render(m); });
      const rm = m.querySelector('#te-remove');
      if (rm) rm.onclick = () => { Game.clearTeamSlot(sel); render(m); };
      m.querySelectorAll('[data-uid]').forEach(el => el.onclick = () => {
        const r = Game.setTeamSlot(sel, el.dataset.uid);
        if (!r.ok) { this.toast(r.msg); return; }
        render(m);
      });
    };
    const m = this.openModal(`
      <h2>编队 <span class="te-count" style="font-size:13px;color:var(--accent);"></span></h2>
      <div class="te-slots"></div>
      <div class="te-current-wrap"></div>
      <p class="muted" style="margin:10px 0 8px;">先点上方选择位置，再点下方角色上阵 / 替换（最多 ${TEAM_MAX} 人）。</p>
      <div class="te-body roster-grid"></div>
      <div class="close-row"><button class="btn" id="te-done">完成</button></div>
    `);
    render(m);
    m.querySelector('#te-done').onclick = () => { this.closeModal(m); this.renderHome(); };
  },

  // ============================================================
  //  关卡 / 冒险
  // ============================================================
  renderStages() {
    const chapters = World.CHAPTERS.map((ch, idx) => {
      const unlocked = World.isChapterUnlocked(idx);
      const prog = World.progress(ch.id);
      const done = World.isChapterDone(ch);
      const total = ch.steps.length;
      const themeIcon = { forest: '🌲', cave: '⛏️', castle: '🏰' }[ch.theme] || '🗺️';
      return `
        <div class="chapter-card ${unlocked ? '' : 'locked'} ${done ? 'done' : ''}" data-ch="${unlocked ? ch.id : ''}">
          <div class="chapter-art">${unlocked ? themeIcon : '🔒'}</div>
          <div class="chapter-info">
            <h3>${ch.name} ${done ? '<span class="clear-mark">✓</span>' : ''}</h3>
            <p>${unlocked ? ch.desc : '通关上一章后解锁'}</p>
            ${unlocked ? `<div class="chapter-prog"><div class="cp-bar"><div class="cp-fill" style="width:${Math.round(prog / total * 100)}%"></div></div><span>${prog}/${total} 目标</span></div>` : ''}
          </div>
          <div class="chapter-go">${unlocked ? (done ? '重玩 ›' : prog > 0 ? '继续 ›' : '进入 ›') : ''}</div>
        </div>`;
    }).join('');
    this.screenEl.innerHTML = `
      <div class="section-title">章节冒险 <span class="muted" style="font-weight:400;font-size:11px;">· 在场景中走动，到达目标触发剧情与战斗</span></div>
      ${chapters}
      <p class="muted" style="text-align:center;margin-top:10px;">用方向键移动，跟随 ▼ 指引到达目标</p>
      ${this.trialSectionHtml()}`;
    this.screenEl.querySelectorAll('.chapter-card[data-ch]').forEach(card => {
      const id = card.dataset.ch;
      if (!id) return;
      card.addEventListener('click', () => World.openChapter(id));
    });
    this.screenEl.querySelectorAll('.trial-card[data-trial]').forEach(card => {
      card.addEventListener('click', () => this.showTrialConfirm(parseInt(card.dataset.trial, 10)));
    });
    this.screenEl.querySelectorAll('.trial-sweep').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const r = Game.sweepTrial(parseInt(btn.dataset.sweep, 10));
        if (!r.ok) { this.toast(r.msg || '无法扫荡'); return; }
        if (window.Sound) Sound.sfx('levelup');
        let msg = `扫荡完成：🪙${r.gold} 💎${r.gem}`;
        if (r.drop) { const tpl = Game.getGearTpl(r.drop); if (tpl) msg += ` · 🎁${tpl.name}`; }
        this.toast(msg);
        this.updateResources();
      });
    });
  },

  /** 试炼之塔区块 HTML */
  trialSectionHtml() {
    const trials = window.GameData.TRIALS || [];
    const max = Game.state.trialMax || 0;
    const cards = trials.map((t, i) => {
      const unlocked = i <= max;          // 第 1 层默认开放；逐层解锁
      const cleared = i < max;            // 已通关的层
      const enemyNames = t.enemies.map(e => window.GameData.ENEMIES[e.id].name);
      const bossName = t.isBoss ? enemyNames[0] : null;
      return `<div class="trial-card ${unlocked ? '' : 'locked'} ${cleared ? 'done' : ''}" ${unlocked ? `data-trial="${i}"` : ''}>
        <div class="trial-floor">${t.isBoss ? '👑' : '🗼'}<span>${t.tier}F</span></div>
        <div class="trial-info">
          <h3>${unlocked ? t.name : `试炼之塔 · 第 ${t.tier} 层`} ${cleared ? '<span class="clear-mark">✓</span>' : ''}</h3>
          <p>${unlocked ? t.desc : '通关上一层后开启'}</p>
          ${unlocked ? `<div class="trial-meta"><span class="muted">推荐 Lv.${t.recommend}</span>${bossName ? `<span class="trial-boss">BOSS ${bossName}</span>` : ''}<span class="trial-reward">🪙${t.reward.gold} 💎${t.reward.gem}</span></div>` : ''}
        </div>
        <div class="trial-go">${!unlocked ? '🔒' : cleared ? `<button class="trial-sweep" data-sweep="${i}">扫荡</button><div class="muted" style="font-size:10px;margin-top:4px;">再战 ›</div>` : '挑战 ›'}</div>
      </div>`;
    }).join('');
    return `
      <div class="section-title" style="margin-top:20px;">🗼 试炼之塔 <span class="muted" style="font-weight:400;font-size:11px;">· 逐层强化的循环挑战，越高层奖励越丰厚</span></div>
      <div class="trial-progress muted">当前进度：${max} / ${trials.length} 层</div>
      ${cards}`;
  },

  showTrialConfirm(idx) {
    const trial = window.GameData.TRIALS[idx];
    if (!trial) return;
    if (Game.state.team.length === 0) {
      this.toast('请先在「主页」编入出战队伍');
      Main.switchScreen('home');
      return;
    }
    const teamHtml = Game.state.team.map(uid => {
      const o = Game.getOwned(uid);
      const c = window.GameData.CHARACTERS[o.charId];
      return `<div class="team-slot filled border-${this.rarityClass(c.rarity)}" style="max-width:64px;">
        <div class="char-portrait"><div class="avatar" style="font-size:26px;">${this.charAvatar(o.charId)}</div>
        <span class="pname">Lv.${o.level}</span></div></div>`;
    }).join('');
    const enemyHtml = trial.enemies.map(e => {
      const def = window.GameData.ENEMIES[e.id];

      <h2>${trial.name}</h2>

      <div class="muted" style="margin-bottom:6px;">敌方阵容 · 推荐 Lv.${trial.recommend}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;">${enemyHtml}</div>
      <div class="muted" style="margin-bottom:6px;">我方出战（${Game.state.team.length}/5）</div>
      <div class="team-slots">${teamHtml}</div>
      <div class="close-row">
        <button class="btn secondary" id="tc-cancel">取消</button>
        <button class="btn" id="tc-fight">登塔 ⚔️</button>
      </div>
    `);
    m.querySelector('#tc-cancel').onclick = () => this.closeModal(m);
    m.querySelector('#tc-fight').onclick = () => {
      this.closeModal(m);

        if (Battle.result === 'win' && idx + 1 > (Game.state.trialMax || 0)) {
          Game.state.trialMax = idx + 1;
          Game.save();
        }
        this.renderStages();
      });
    };

  // ============================================================
  //  佣兵列表
  // ============================================================
  renderRoster() {
    const s = Game.state;
    const E = window.GameData.ELEMENTS;
    this.rosterFilter = this.rosterFilter || { element: null, team: false };
    this.rosterSort = this.rosterSort || 'rarity';
    const f = this.rosterFilter;

    // 筛选
    let list = s.roster.filter(o => {
      const c = window.GameData.CHARACTERS[o.charId];
      if (f.element && c.element !== f.element) return false;
      if (f.team && !Game.inTeam(o.uid)) return false;
      return true;
    });
    // 排序
    const sortFns = {
      rarity: (a, b) => { const ca = window.GameData.CHARACTERS[a.charId], cb = window.GameData.CHARACTERS[b.charId]; return cb.rarity - ca.rarity || b.level - a.level; },
      level: (a, b) => b.level - a.level || (b.plus || 0) - (a.plus || 0),
      element: (a, b) => { const order = ['fire', 'water', 'wind', 'earth', 'light', 'dark']; return order.indexOf(window.GameData.CHARACTERS[a.charId].element) - order.indexOf(window.GameData.CHARACTERS[b.charId].element); },
    };
    list = list.slice().sort(sortFns[this.rosterSort] || sortFns.rarity);

    const cards = list.map(o => {
      const c = window.GameData.CHARACTERS[o.charId];
      const inTeam = Game.inTeam(o.uid);
      return `
        <div class="roster-card border-${this.rarityClass(c.rarity)}" data-uid="${o.uid}">
          ${inTeam ? '<span class="in-team-tag">出战</span>' : ''}
          <div class="rc-art" style="background:radial-gradient(circle at 50% 35%, ${c.color}44, transparent);">
            <span class="rarity-badge ${this.rarityClass(c.rarity)}">${c.rarity}★</span>
            ${o.plus ? `<span class="plus-badge corner">+${o.plus}</span>` : ''}
            ${this.charAvatar(o.charId)}
            <span class="cls-chip">${E[c.element].icon}</span>
          </div>
          <div class="rc-info">
            <div class="rc-name">${c.name}</div>
            <div class="rc-lv">Lv.${o.level} · ${window.GameData.CLASSES[c.cls].name}</div>
          </div>
        </div>`;
    }).join('') || '<p class="muted" style="grid-column:1/-1;padding:16px;text-align:center;">没有符合筛选的佣兵</p>';

    const elemChip = (key, icon) => `<button class="rf-chip ${f.element === key ? 'on' : ''}" data-elem="${key || ''}">${icon}</button>`;
    const sortLabel = { rarity: '稀有度', level: '等级', element: '元素' }[this.rosterSort];

    this.screenEl.innerHTML = `
      <div class="section-title">佣兵团（${s.roster.length}）</div>
      <div class="roster-bar">
        <div class="rf-elems">
          ${elemChip(null, '全部')}

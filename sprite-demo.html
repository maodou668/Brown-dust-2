<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Q版小人 · 代码动效演示 · 棕色尘埃2</title>
  <style>
    :root { --accent:#b06bff; --accent2:#ff6b9d; }
    * { box-sizing:border-box; }
    html,body { margin:0; height:100%; background:radial-gradient(circle at 50% 0%, #2a2038, #14101c 60%); color:#e8e2f0;
      font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif; -webkit-user-select:none; user-select:none; overflow:hidden; }
    .wrap { height:100dvh; display:flex; flex-direction:column; }
    header { padding:8px 14px; font-weight:800; font-size:14px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,.07); flex:0 0 auto; }
    header small { color:#9d92ad; font-weight:400; font-size:11px; }
    .stage { flex:1 1 auto; min-height:0; position:relative; }
    canvas { display:block; position:absolute; inset:0; }
    .controls { flex:0 0 auto; padding:9px 10px calc(9px + env(safe-area-inset-bottom)); border-top:1px solid rgba(255,255,255,.07); background:rgba(20,16,28,.55); }
    .row { display:flex; gap:7px; justify-content:center; flex-wrap:wrap; }
    .row + .row { margin-top:7px; }
    .label { font-size:11px; color:#9d92ad; align-self:center; margin-right:2px; }
    button { background:#261d33; color:#e8e2f0; border:1px solid rgba(255,255,255,.12); border-radius:9px; padding:9px 15px; font-size:14px; font-weight:700; cursor:pointer; }
    button.sm { padding:6px 11px; font-size:12px; }
    button.on { background:linear-gradient(135deg,var(--accent),var(--accent2)); border-color:transparent; color:#fff; }
    button:active { transform:scale(.95); }
    .hint { text-align:center; color:#9d92ad; font-size:11px; margin-top:7px; line-height:1.5; }
  </style>
</head>
<body>
  <div class="wrap">
    <header><span>🎮 Q版小人 · 代码动效</span><small>单张定妆图 + 代码驱动 · 零 AI / 零配额</small></header>
    <div class="stage"><canvas id="cv"></canvas></div>
    <div class="controls">
      <div class="row" id="animbar"></div>
      <div class="row" id="optbar"></div>
      <div class="hint">这一张 Q 版图,全靠代码做出待机/走/跑/攻击/技能/受击。地图战斗用小尺寸,效果足够,且完全可靠。</div>
    </div>
  </div>
  <script src="js/sprite-actor.js?v=1"></script>
  <script>
  (async function () {
    const img = new Image(); img.src = 'art/03_sprite/lecliss_chibi.webp?v=2';
    await new Promise(r => { img.onload = r; img.onerror = r; });
    const actor = new SpriteActor(img);

    const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    function resize() { const s = cv.parentElement; cv.width = s.clientWidth * dpr; cv.height = s.clientHeight * dpr; cv.style.width = s.clientWidth + 'px'; cv.style.height = s.clientHeight + 'px'; }
    resize(); window.addEventListener('resize', resize);

    const anims = [['idle','待机'],['walk','行走'],['run','奔跑'],['attack','攻击'],['skill','技能'],['hit','受击'],['victory','胜利']];
    const animbar = document.getElementById('animbar'); animbar.innerHTML='<span class="label">动作</span>';
    let cur='idle';
    anims.forEach(([id,label])=>{ const b=document.createElement('button'); b.textContent=label; b.className=(id===cur?'on':'');
      b.onclick=()=>{ cur=id; actor.play(id); [...animbar.querySelectorAll('button')].forEach(c=>c.classList.remove('on')); b.classList.add('on'); }; animbar.appendChild(b); });
    // 朝向 + 尺寸
    const optbar=document.getElementById('optbar');
    const flipBtn=document.createElement('button'); flipBtn.className='sm'; flipBtn.textContent='镜像朝左';
    flipBtn.onclick=()=>{ actor.faceFlip=!actor.faceFlip; flipBtn.classList.toggle('on',actor.faceFlip); }; optbar.appendChild(flipBtn);
    let big=false; const sizeBtn=document.createElement('button'); sizeBtn.className='sm'; sizeBtn.textContent='放大看';
    sizeBtn.onclick=()=>{ big=!big; sizeBtn.classList.toggle('on',big); }; optbar.appendChild(sizeBtn);

    let last=performance.now();
    function loop(now){ const dt=Math.min(0.05,(now-last)/1000); last=now;
      actor.update(dt);
      if(actor.done && !SpriteActor.ANIMS[cur].loop){ cur='idle'; actor.play('idle'); [...animbar.querySelectorAll('button')].forEach((c,i)=>c.classList.toggle('on',anims[i][0]==='idle')); }
      ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height);
      ctx.setTransform(dpr,0,0,dpr,0,0);
      const W=cv.width/dpr,H=cv.height/dpr;
      const th=Math.min(big?H*0.7:H*0.34, (big?520:300));
      const fx=W/2, fy=H*0.86;
      // 地面线
      ctx.strokeStyle='rgba(255,255,255,.06)'; ctx.beginPath(); ctx.moveTo(0,fy); ctx.lineTo(W,fy); ctx.stroke();
      actor.drawShadow(ctx,fx,fy,th); actor.draw(ctx,fx,fy,th);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>

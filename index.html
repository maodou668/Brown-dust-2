<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>棕色尘埃 2 · Brown Dust 2</title>
  <link rel="stylesheet" href="css/style.css?v=48">
</head>
<body>
  <div id="app">
    <!-- 顶部资源栏 -->
    <header id="topbar">
      <div class="logo">
        <span class="logo-mark">BD</span>
        <span class="logo-text">棕色尘埃<small>2</small></span>
      </div>
      <div class="resources">
        <div class="res" title="金币"><span class="res-icon">🪙</span><span id="res-gold">0</span></div>
        <div class="res" title="宝石"><span class="res-icon">💎</span><span id="res-gem">0</span></div>
        <div class="res" title="觉醒石"><span class="res-icon">🔮</span><span id="res-stone">0</span></div>
        <button id="btn-mute" class="ghost-btn" title="音效开关">🔊</button>
        <button id="btn-reset" class="ghost-btn" title="重置存档">↺</button>
      </div>
    </header>

    <!-- 返回主界面（非主页时显示） -->
    <button id="btn-back" class="back-btn" style="display:none;">‹ 返回</button>

    <!-- 主内容区（单一主界面 + 功能面板覆盖） -->
    <main id="screen"></main>
  </div>

  <!-- 弹窗容器 -->
  <div id="modal-root"></div>

  <!-- 竖屏旋转提示（横版游戏） -->
  <div id="rotate-tip">
    <div class="rt-icon">📱</div>
    <div class="rt-title">请横屏游玩</div>
    <div class="rt-sub">本游戏为横版设计，请旋转设备至横屏以获得最佳体验。</div>
  </div>

  <script>window.ASSET_VER = '48';</script>
  <script src="js/audio.js?v=48"></script>
  <script src="js/data.js?v=48"></script>
  <script src="js/lore.js?v=48"></script>
  <script src="js/gear.js?v=48"></script>
  <script src="js/costumes.js?v=48"></script>
  <script src="js/game.js?v=48"></script>
  <script src="js/battle.js?v=48"></script>
  <script src="js/ui.js?v=48"></script>
  <script src="js/story.js?v=48"></script>
  <script src="js/comic.js?v=48"></script>
  <script src="js/world.js?v=48"></script>
  <script src="js/main.js?v=48"></script>
</body>
</html>

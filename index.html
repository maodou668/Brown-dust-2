<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>棕色尘埃 2 · Brown Dust 2</title>
  <!-- PWA / 添加到主屏幕（iOS 全屏关键） -->
  <link rel="manifest" href="manifest.webmanifest?v=165">
  <meta name="theme-color" content="#1a1422">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="棕色尘埃2">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=165">
  <link rel="icon" type="image/png" href="icons/icon-192.png?v=165">
  <link rel="stylesheet" href="css/style.css?v=165">
</head>
<body>
  <div id="app">
    <!-- 顶部栏：玩家信息 + 资源 + 系统 -->
    <header id="topbar">
      <button id="topbar-profile" class="profile-chip" title="玩家资料">
        <span class="pc-avatar"><img src="art/01_splash/lecliss_avatar.png?v=165" alt="" onerror="this.outerHTML='🎖️'"></span>
        <span class="pc-info">
          <span class="pc-name" id="pc-name">指挥官</span>
          <span class="pc-sub">Lv.<span id="pc-lv">1</span> · ⚔<span id="pc-pow">0</span></span>
        </span>
      </button>
      <div class="resources">
        <div class="res" title="金币"><span class="res-icon">🪙</span><span id="res-gold">0</span></div>
        <div class="res" title="宝石"><span class="res-icon">💎</span><span id="res-gem">0</span></div>
        <div class="res" title="觉醒石"><span class="res-icon">🔮</span><span id="res-stone">0</span></div>
        <div class="res" title="体力"><span class="res-icon">⚡</span><span id="res-stam">0</span></div>
      </div>
      <div class="topbar-sys">
        <button id="btn-notice" class="ghost-btn" title="公告">📢</button>
        <button id="btn-mail" class="ghost-btn" title="邮件"><span class="dot-wrap">📧<span id="mail-dot" class="red-dot" style="display:none;"></span></span></button>
        <button id="btn-settings" class="ghost-btn" title="设置">⚙️</button>
        <button id="btn-fullscreen" class="ghost-btn" title="全屏">⛶</button>
        <button id="btn-mute" class="ghost-btn" title="音效开关">🔊</button>
        <button id="btn-reset" class="ghost-btn" title="重置存档" style="display:none;">↺</button>
      </div>
    </header>

    <!-- 返回主界面（非主页时显示） -->
    <button id="btn-back" class="back-btn" style="display:none;">‹ 返回</button>

    <!-- 主内容区（单一主界面 + 功能面板覆盖） -->
    <main id="screen"></main>
  </div>

  <!-- 弹窗容器 -->
  <div id="modal-root"></div>

  <!-- 竖屏旋转提示（横版游戏） -->
  <div id="rotate-tip">
    <div class="rt-icon">📱</div>
    <div class="rt-title">请横屏游玩</div>
    <div class="rt-sub">本游戏为横版设计，请旋转设备至横屏以获得最佳体验。</div>
  </div>

  <!-- 启动加载页（立即显示，等美术资源就绪后揭幕，避免蹦图） -->
  <div id="boot-loader" style="position:fixed;inset:0;z-index:99999;background:#0e0b14;display:flex;align-items:center;justify-content:center;">
    <div class="bl-inner">
      <div class="bl-title">棕色尘埃 2</div>
      <div class="bl-sub">B R O W N　D U S T　2</div>
      <div class="bl-bar"><div class="bl-fill" id="bl-fill"></div></div>
      <div class="bl-pct" id="bl-pct">0%</div>
      <div class="bl-tip">美术资源加载中…</div>
    </div>
  </div>

  <script>window.ASSET_VER = '165';</script>
  <script src="js/audio.js?v=165"></script>
  <script src="js/data.js?v=165"></script>
  <script src="js/balance.js?v=165"></script>
  <script src="js/budget.js?v=165"></script>
  <script src="js/lore.js?v=165"></script>
  <script src="js/gear.js?v=165"></script>
  <script src="js/costumes.js?v=165"></script>
  <script src="js/game.js?v=165"></script>
  <script src="js/battle.js?v=165"></script>
  <script src="js/ui.js?v=165"></script>
  <script src="js/story.js?v=165"></script>
  <script src="js/comic.js?v=165"></script>
  <script src="js/world.js?v=165"></script>
  <script src="js/main.js?v=165"></script>
</body>
</html>

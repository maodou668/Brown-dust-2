<!doctype html><html lang="zh"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>技能特效测试台</title>
<style>
  :root{--bg:#12101a;--card:#1d1a28;--edge:#332e44;--txt:#e8e4f0;--mut:#9a90b0;}
  *{box-sizing:border-box;font-family:system-ui,"Microsoft YaHei",sans-serif}
  body{margin:0;background:var(--bg);color:var(--txt)}
  header{position:sticky;top:0;background:#161320ee;backdrop-filter:blur(6px);padding:10px 16px;border-bottom:1px solid var(--edge);z-index:5;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  h1{font-size:16px;margin:0}
  .sub{color:var(--mut);font-size:12px}
  button{background:#2a2440;color:var(--txt);border:1px solid var(--edge);border-radius:7px;padding:6px 12px;cursor:pointer;font-size:13px}
  button:hover{background:#372f52}
  #stage{position:fixed;right:16px;top:70px;width:300px;height:300px;background:radial-gradient(circle at 50% 60%,#241f34,#0d0b14);border:1px solid var(--edge);border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;z-index:4}
  #stage img{image-rendering:pixelated;max-width:88%;max-height:88%}
  #stageLabel{position:absolute;top:8px;left:10px;font-size:12px;color:var(--mut)}
  #grid{padding:14px;padding-right:340px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
  .grp{grid-column:1/-1;margin:10px 0 2px;font-weight:700;color:#c9b8ff;border-bottom:1px solid var(--edge);padding-bottom:4px}
  .card{background:var(--card);border:1px solid var(--edge);border-radius:9px;padding:9px 11px;display:flex;flex-direction:column;gap:5px}
  .card .top{display:flex;justify-content:space-between;align-items:center;gap:6px}
  .skname{font-weight:600}
  .tags{font-size:11px;color:var(--mut)}
  .badge{font-size:10px;padding:1px 6px;border-radius:4px;border:1px solid var(--edge)}
  .b-sup{background:#22402f;color:#8fe9b0}
  .b-proj{background:#2a2a45;color:#9fb0ff}
  .ok{color:#7fe6a0}.bad{color:#ff8a8a}
  .play{align-self:flex-start;padding:4px 12px}
</style></head><body>
<header>
  <h1>技能特效测试台</h1>
  <span class="sub" id="cnt">加载中…</span>
  <button id="all">▶ 依次播放全部</button>
  <button id="recheck">重新检测素材</button>
  <span class="sub">点每个技能的「▶ 播放」在右侧预览框看特效；素材缺失会自动用程序化兜底并标红。</span>
</header>
<div id="stage"><span id="stageLabel">预览</span><img id="stageImg" alt=""></div>
<div id="grid">加载中…</div>
<script>
const V = Date.now(); // 防缓存
const FX = 'art/05_pixellab/fx/';
const stageImg = document.getElementById('stageImg'), stageLabel = document.getElementById('stageLabel');
let anim = null;
const manCache = {};
async function loadMan(name){
  if(name in manCache) return manCache[name];
  try{ const r = await fetch(`${FX}${name}/manifest.json?v=${V}`); if(!r.ok) throw 0;
    const m = await r.json(); return manCache[name] = m; }
  catch(e){ return manCache[name] = null; }
}
function stopAnim(){ if(anim){ clearInterval(anim); anim=null; } }
async function play(item){
  stopAnim();
  stageLabel.textContent = `${item.char}·${item.costume} — ${item.skillName}`;
  const m = await loadMan(item.burst);
  if(!m || !m.frames){ // 程序化兜底：闪一下
    stageImg.removeAttribute('src');
    document.getElementById('stage').animate([{background:'radial-gradient(circle,'+item.tint+'99,#0d0b14)'},{background:'radial-gradient(circle at 50% 60%,#241f34,#0d0b14)'}],{duration:500});
    return false;
  }
  const n = m.frames, fps = m.fps || 12; let i = 0;
  stageImg.style.filter = `drop-shadow(0 0 10px ${item.tint})`;
  const show = ()=>{ stageImg.src = `${FX}${item.burst}/frame_${String(i).padStart(3,'0')}.png?v=${V}`; };
  show();
  anim = setInterval(()=>{ i++; if(i>=n){ i=0; } show(); }, 1000/fps);
  setTimeout(stopAnim, (n/fps)*1000*2 + 200); // 播两轮停
  return true;
}
async function build(){
  const g = await (await fetch('fx_gallery.json?v='+V)).json();
  document.getElementById('cnt').textContent = `共 ${g.length} 个「服装·技能」条目（去重技能 ${new Set(g.map(x=>x.skillId)).size} 个）`;
  const grid = document.getElementById('grid'); grid.innerHTML='';
  const byChar = {}; g.forEach(x=>{ (byChar[x.char]=byChar[x.char]||[]).push(x); });
  for(const ch of Object.keys(byChar)){
    const h = document.createElement('div'); h.className='grp'; h.textContent = ch; grid.appendChild(h);
    byChar[ch].forEach(x=>{
      const c = document.createElement('div'); c.className='card';
      c.innerHTML = `<div class="top"><span class="skname">${x.skillName}</span>
        <span class="fx" data-fx="${x.burst}">…</span></div>
        <div class="tags">${x.costume} · ${x.elemName}属性 · ${x.effect} · 特效:${x.burst||'无'}
        ${x.support?'<span class="badge b-sup">支援</span>':''}${x.projectile?'<span class="badge b-proj">投射</span>':''}</div>`;
      const btn = document.createElement('button'); btn.className='play'; btn.textContent='▶ 播放';
      btn.onclick = ()=>play(x); c.appendChild(btn); grid.appendChild(c);
    });
  }
  recheck();
  window._gal = g;
}
async function recheck(){
  const spans = document.querySelectorAll('.fx');
  for(const s of spans){ const m = await loadMan(s.dataset.fx);
    s.textContent = m? '✓素材OK':'✗缺素材(程序化兜底)'; s.className = 'fx '+(m?'ok':'bad'); }
}
document.getElementById('recheck').onclick = ()=>{ Object.keys(manCache).forEach(k=>delete manCache[k]); recheck(); };
document.getElementById('all').onclick = async ()=>{ for(const x of (window._gal||[])){ await play(x); await new Promise(r=>setTimeout(r,900)); } };
build();
</script></body></html>

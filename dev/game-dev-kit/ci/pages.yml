name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/brown-dust-2-dev-ma6cog"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 数值平衡闸门：任何「带数值」内容越界（技能/服装/装备/敌人）即失败，阻止部署。
  # 这样未来无论谁加角色/道具，破坏平衡的改动都进不了线上。
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 数值平衡校验
        run: node scripts/balance-validate.js
      - name: 战斗回归自测（平衡/单挑）
        run: |
          node scripts/balance-check.js
          node scripts/combat-test.js

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 若仓库尚未开启 Pages，则自动启用（source = GitHub Actions）
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 整个仓库即静态站点，index.html 在根目录
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
